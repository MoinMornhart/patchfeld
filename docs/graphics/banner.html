<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1600px; height: 560px; background: transparent; overflow: hidden; }
  body { font-family: "Segoe UI Variable Display", "Segoe UI Variable", "Segoe UI", system-ui, sans-serif; color: #e6e9ef; }
  .banner {
    position: absolute; inset: 0; border-radius: 28px; overflow: hidden; border: 1px solid #232a38;
    background:
      radial-gradient(900px 520px at 88% 18%, rgba(236, 122, 28, 0.30), transparent 60%),
      radial-gradient(760px 520px at 6% 112%, rgba(45, 98, 198, 0.46), transparent 60%),
      linear-gradient(135deg, #0d1018, #141a28);
  }
  .grid {
    position: absolute; inset: 0;
    background-image: linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);
    background-size: 40px 40px;
    -webkit-mask-image: linear-gradient(90deg, #000 0%, transparent 72%);
  }
  .left { position: absolute; left: 88px; top: 0; bottom: 0; width: 780px; display: flex; flex-direction: column; justify-content: center; gap: 24px; }
  .brand { display: flex; align-items: center; gap: 28px; }
  .mark {
    width: 116px; height: 116px; border-radius: 30px; display: grid; place-items: center;
    background: linear-gradient(135deg, #f39a3c, #d9531e); box-shadow: 0 18px 44px rgba(236, 122, 28, 0.35);
  }
  .mark svg { width: 70px; height: 70px; }
  h1 { font-size: 112px; font-weight: 750; letter-spacing: -3px; line-height: 1; }
  .tag { font-size: 32px; color: #c5cbd8; line-height: 1.35; }
  .pills { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 4px; }
  .pill { display: flex; align-items: center; gap: 10px; padding: 9px 18px; border-radius: 999px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); font-size: 22px; font-weight: 600; }
  .dot { width: 13px; height: 13px; border-radius: 50%; }
  .right { position: absolute; right: 80px; top: 58px; width: 620px; }
  .window { background: #0b0d12; border: 1px solid #2a303c; border-radius: 18px; box-shadow: 0 30px 80px rgba(0,0,0,0.55); overflow: hidden; }
  .bar { display: flex; gap: 8px; align-items: center; padding: 14px 18px; background: #161a22; border-bottom: 1px solid #2a303c; color: #8d95a5; font-size: 17px; }
  .bar i { width: 13px; height: 13px; border-radius: 50%; display: inline-block; }
  .task { padding: 18px 24px 8px; font-size: 19px; line-height: 1.45; }
  .task .sit { color: #8d95a5; border-left: 3px solid #2a303c; padding-left: 12px; margin-bottom: 10px; }
  .task b { color: #fff; }
  .fields { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 6px 24px 16px; }
  .field { font-size: 13px; color: #8d95a5; text-transform: uppercase; letter-spacing: 0.6px; font-weight: 600; }
  .field div { margin-top: 5px; padding: 8px 10px; border: 1px solid #3fb97a; border-radius: 8px; font: 19px "Cascadia Code", Consolas, monospace; color: #e6e9ef; text-transform: none; letter-spacing: 0; background: rgba(63,185,122,0.08); }
  .out { border-top: 1px solid #2a303c; padding: 12px 24px; font-size: 19px; color: #3fb97a; font-weight: 700; }
  .bubble { position: relative; margin: 18px 0 0 90px; background: #1b2233; border: 1px solid #33405c; border-radius: 16px; padding: 16px 22px; font-size: 20px; line-height: 1.5; box-shadow: 0 24px 60px rgba(0,0,0,0.5); }
  .who { color: #f39a3c; font-weight: 700; font-size: 14px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
  .bubble b { color: #fff; }
</style>
</head>
<body>
<div class="banner">
  <div class="grid"></div>
  <div class="left">
    <div class="brand">
      <div class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"><path d="M3 9h5V5h8v4h5v11H3z"/><path d="M8 12v3M10.5 12v3M13 12v3M15.5 12v3" stroke-width="1.4"/></svg></div>
      <h1>Patchfeld</h1>
    </div>
    <p class="tag" id="tag"></p>
    <div class="pills">
      <span class="pill"><span class="dot" style="background:#ec7a1c"></span><span id="p1"></span></span>
      <span class="pill"><span class="dot" style="background:#2e9a4d"></span>AP 1</span>
      <span class="pill"><span class="dot" style="background:#2d62c6"></span>AP 2</span>
      <span class="pill"><span class="dot" style="background:#b0703f"></span><span id="p4"></span></span>
      <span class="pill"><span class="dot" style="background:#c9ccd1"></span>WiSo</span>
    </div>
  </div>
  <div class="right">
    <div class="window">
      <div class="bar"><i style="background:#ef6a60"></i><i style="background:#e0b341"></i><i style="background:#3fb97a"></i><span style="margin-left:10px" id="file"></span></div>
      <div class="task"><div class="sit" id="sit"></div><b id="q"></b></div>
      <div class="fields">
        <div class="field"><span id="f1"></span><div>192.168.20.64</div></div>
        <div class="field"><span id="f2"></span><div>192.168.20.127</div></div>
        <div class="field"><span id="f3"></span><div>62</div></div>
      </div>
      <div class="out" id="out"></div>
    </div>
    <div class="bubble"><div class="who">Mentor</div><span id="review"></span></div>
  </div>
</div>
<script>
  const lang = new URLSearchParams(location.search).get('lang') === 'en' ? 'en' : 'de';
  const text = {
    de: {
      tag: 'Die Ausbildung zum Fachinformatiker für Systemintegration – dein KI-Mentor erklärt, du löst echte IHK-Aufgaben. Vom 1. Lehrjahr bis zur AP 2.',
      p1: '1. Lehrjahr', p4: 'Projekt',
      file: 'IHK-Aufgabe · Netzwerkgrundlagen',
      sit: 'Ein neuer Drucker mit 192.168.20.77/26 ist nicht erreichbar.',
      q: 'Netzadresse, Broadcast und nutzbare Hosts?',
      f1: 'Netz', f2: 'Broadcast', f3: 'Hosts',
      out: '✅ Richtig – geprüft von der App',
      review: '<b>Sauber gerechnet.</b> Und warum sind es 62 und nicht 64 Hosts? Erklär es mir wie im Fachgespräch.',
    },
    en: {
      tag: 'The IT specialist apprenticeship for system integration – your AI mentor explains, you solve real IHK exam tasks. From year 1 to AP 2.',
      p1: 'Year 1', p4: 'Project',
      file: 'IHK task · Network fundamentals',
      sit: 'A new printer with 192.168.20.77/26 cannot be reached.',
      q: 'Network address, broadcast and usable hosts?',
      f1: 'Network', f2: 'Broadcast', f3: 'Hosts',
      out: '✅ Correct – checked by the app',
      review: '<b>Clean calculation.</b> And why 62 hosts, not 64? Explain it as in the expert interview.',
    },
  }[lang];
  for (const [id, value] of Object.entries(text)) {
    const node = document.getElementById(id);
    if (id === 'review') node.innerHTML = value;
    else node.textContent = value;
  }
</script>
</body>
</html>
