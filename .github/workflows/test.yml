name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # Optional packages are the ~220 MB Claude Code binaries – the tests use a fake SDK.
      - run: npm ci --omit=optional
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm test
