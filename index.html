/* ----- BEREICH:ha – Erweiterung ----- */
/* Gesamtverfügbarkeit einer Kette aus seriellen und redundant (parallel) ausgelegten Komponenten */
GEN.haSerialParallel = function(L){
  const dec = (x, d) => fmt(x, d, L).replace(/([.,]\d*?)0+$/, '$1').replace(/[.,]$/, '');
  const pct = x => dec(x * 100, 6);
  const pool = [
    [tx(L,'Internetanschluss','Internet connection'), pick([98.5,99,99.5])],
    ['Firewall', pick([99.5,99.8,99.9])],
    ['Core-Switch', pick([99.5,99.9,99.95])],
    [tx(L,'Webserver','Web server'), pick([98,99,99.5])],
    [tx(L,'Datenbankserver','Database server'), pick([99,99.5,99.8])]
  ];
  const idx = shuffle([0,1,2,3,4]).slice(0,4).sort((a,b) => a-b);
  const red = shuffle([0,1,2,3]).slice(0, rnd(1,2));
  const rows = idx.map((j,i) => { const a = pool[j][1]/100, n = red.includes(i) ? 2 : 1; return {name:pool[j][0], a, n, eff: n===2 ? 1-(1-a)**2 : a}; });
  const A = rows.reduce((p,r) => p*r.eff, 1);
  const v = Math.round(A*100000)/1000, dt = Math.round(8760*(1-A)*10)/10;
  const par = rows.filter(r => r.n===2).map(r => `${r.name}: 1 − (1 − ${dec(r.a,4)})² = ${pct(r.eff)} %`).join('; ');
  return { t:'in',
    s: tx(L, 'Ein Online-Händler betreibt seinen Webshop über die folgende Kette von Komponenten. Die Stufen sind in Reihe geschaltet; eine redundant ausgelegte Stufe besteht aus zwei gleichen Geräten, von denen eines für den Betrieb genügt.',
             'An online retailer runs its web shop over the following chain of components. The stages are connected in series; a redundant stage consists of two identical devices, one of which is sufficient for operation.'),
    tb: {h: tx(L,['Stufe','Geräte','Verfügbarkeit je Gerät','Anordnung'],['Stage','Devices','Availability per device','Arrangement']),
         r: rows.map(r => [r.name, r.n, pct(r.a)+' %', r.n===2 ? tx(L,'parallel (redundant)','parallel (redundant)') : tx(L,'einzeln','single')])},
    q: tx(L, 'Berechnen Sie die Gesamtverfügbarkeit in Prozent (drei Nachkommastellen) und die daraus zu erwartende Ausfallzeit pro Jahr in Stunden (8.760 h, eine Nachkommastelle). Runden Sie erst das Endergebnis.',
             'Calculate the total availability in percent (three decimal places) and the resulting expected downtime per year in hours (8,760 h, one decimal place). Round only the final result.'),
    f: [ {l:tx(L,'Gesamtverfügbarkeit','Total availability'), v, tol:0.0011, u:'%'}, {l:tx(L,'Ausfallzeit pro Jahr','Downtime per year'), v:dt, tol:0.15, u:'h'} ],
    e: tx(L, `Parallel: A = 1 − (1 − A₁)(1 − A₂) → ${par}. Reihe: A = A₁ × A₂ × … → ${rows.map(r => pct(r.eff)+' %').join(' × ')} = ${pct(A)} % ≈ ${fmt(v,3,L)} %. Ausfallzeit: 8.760 h × ${pct(1-A)} % = ${fmt(dt,1,L)} h.`,
             `Parallel: A = 1 − (1 − A₁)(1 − A₂) → ${par}. Series: A = A₁ × A₂ × … → ${rows.map(r => pct(r.eff)+' %').join(' × ')} = ${pct(A)} % ≈ ${fmt(v,3,L)} %. Downtime: 8,760 h × ${pct(1-A)} % = ${fmt(dt,1,L)} h.`),
    n: tx(L, 'Häufiger Fehler: anzunehmen, die Kette sei so verfügbar wie ihre schwächste Stufe, oder die Werte zu mitteln – in Reihe werden Verfügbarkeiten multipliziert, das Ergebnis liegt unter jeder einzelnen Stufe.',
             'Common mistake: assuming the chain is as available as its weakest stage, or averaging the values – in series, availabilities are multiplied and the result is lower than any single stage.')
  };
};

/* Sicherungswoche: Speicherbedarf und Anzahl einzuspielender Sicherungen (inkrementell/differenziell) */
GEN.haBackupVolume = function(L){
  const F = pick([400,600,800,1200,1500,2000]), p = pick([2,3,4,5]), c = F*p/100;
  const inc = Math.random() < 0.5, k = rnd(1,6);
  const DAY = {de:['Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'], en:['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday']}[L];
  const day = DAY[k-1], vol = inc ? F + 6*c : F + 21*c, sets = inc ? 1 + k : 2;
  const range = k===1 ? DAY[0] : tx(L, `${DAY[0]} bis ${day}`, `${DAY[0]} to ${day}`);
  const diffs = [1,2,3,4,5,6].map(i => fmt(i*c,0,L)).join(' + ');
  return { t:'in',
    s: tx(L, `Der Fileserver eines Architekturbüros enthält ${fmt(F,0,L)} GB Daten. Er wird jeden Sonntag voll gesichert, von Montag bis Samstag jeweils ${inc?'inkrementell':'differenziell'}. Täglich ändern sich jeweils andere Daten im Umfang von ${p} % des Bestands. Kompression und Deduplizierung bleiben unberücksichtigt.`,
             `An architecture firm's file server holds ${fmt(F,0,L)} GB of data. It receives a full backup every Sunday and ${inc?'an incremental':'a differential'} backup each day from Monday to Saturday. Each day, different data amounting to ${p} % of the total changes. Ignore compression and deduplication.`),
    q: tx(L, `Wie viel Speicherplatz in GB belegt eine komplette Sicherungswoche (Sonntag bis Samstag)? Wie viele Sicherungen müssen Sie mindestens einspielen, wenn der Server unmittelbar nach der Sicherung vom ${day} ausfällt?`,
             `How much storage in GB does one complete backup week (Sunday to Saturday) occupy? How many backups must you restore at least if the server fails immediately after the ${day} backup?`),
    f: [ {l:tx(L,'Speicherbedarf der Woche','Storage for the week'), v:vol, tol:0, u:'GB'}, {l:tx(L,'Einzuspielende Sicherungen','Backups to restore'), v:sets, tol:0} ],
    e: inc
      ? tx(L, `Tägliche Änderung: ${p} % von ${fmt(F,0,L)} GB = ${fmt(c,0,L)} GB. Inkrementell sichert nur die Änderungen seit der letzten Sicherung: ${fmt(F,0,L)} + 6 × ${fmt(c,0,L)} = ${fmt(vol,0,L)} GB. Wiederherstellung: Vollsicherung + alle Inkremente (${range}) = ${sets} Sicherungen.`,
              `Daily change: ${p} % of ${fmt(F,0,L)} GB = ${fmt(c,0,L)} GB. Incremental backups only save the changes since the last backup: ${fmt(F,0,L)} + 6 × ${fmt(c,0,L)} = ${fmt(vol,0,L)} GB. Restore: full backup + all increments (${range}) = ${sets} backups.`)
      : tx(L, `Tägliche Änderung: ${p} % von ${fmt(F,0,L)} GB = ${fmt(c,0,L)} GB. Differenziell sichert alle Änderungen seit der letzten Vollsicherung, jede Sicherung wächst: ${diffs} = ${fmt(21*c,0,L)} GB; gesamt ${fmt(F,0,L)} + ${fmt(21*c,0,L)} = ${fmt(vol,0,L)} GB. Wiederherstellung: Vollsicherung + differenzielle Sicherung vom ${day} = 2 Sicherungen.`,
              `Daily change: ${p} % of ${fmt(F,0,L)} GB = ${fmt(c,0,L)} GB. Differential backups save all changes since the last full backup, so each one grows: ${diffs} = ${fmt(21*c,0,L)} GB; total ${fmt(F,0,L)} + ${fmt(21*c,0,L)} = ${fmt(vol,0,L)} GB. Restore: full backup + the ${day} differential = 2 backups.`),
    n: inc
      ? tx(L, 'Naheliegend, aber falsch: nur Vollsicherung plus letzte Sicherung einzuspielen – das gilt für differenzielle Sicherungen; bei inkrementellen wird die lückenlose Kette seit der Vollsicherung benötigt.',
              'Tempting but wrong: restoring only the full backup plus the latest backup – that applies to differential backups; incremental backups need the complete chain since the full backup.')
      : tx(L, 'Häufiger Fehler: differenzielle Sicherungen wie inkrementelle mit 6 × tägliche Änderung zu rechnen – jede differenzielle Sicherung enthält alle Änderungen seit der Vollsicherung und wird täglich größer.',
              'Common mistake: calculating differential backups like incremental ones with 6 × the daily change – each differential backup contains all changes since the full backup and grows every day.')
  };
};

Q.push(
{id:'ha-06', a:'ha', gen:'haSerialParallel'},
{id:'ha-07', a:'ha', t:'sc', c:0,
 de:{s:'Um die Bandbreite zwischen einem Etagen-Switch und dem Core-Switch zu verdoppeln, hat ein Kollege ein zweites Patchkabel zwischen den beiden Geräten gesteckt. Die Übertragungsrate bleibt unverändert, in der Switch-Oberfläche steht einer der beiden Ports auf „Blocking“ bzw. „Discarding“.',
     q:'Wie erklären Sie das Verhalten, und was ist die richtige Maßnahme?',
     o:['Spanning Tree blockiert den zweiten Link, um eine Schleife zu verhindern; beide Ports müssen auf beiden Switches zu einer Link-Aggregation (LACP, IEEE 802.1AX) gebündelt werden','Das zweite Kabel ist defekt und muss ersetzt werden, danach werden beide Links automatisch gemeinsam genutzt','Spanning Tree muss auf beiden Switches deaktiviert werden, damit beide Links gleichzeitig Daten übertragen','Auf dem Etagen-Switch muss VRRP eingerichtet werden, damit der Datenverkehr auf beide Links verteilt wird'],
     e:'Zwei parallele Links zwischen zwei Switches bilden eine Layer-2-Schleife; STP/RSTP schaltet deshalb einen Port ab. Eine LACP-Gruppe erscheint für STP als ein logischer Link: Der Verkehr wird auf beide Leitungen verteilt, und fällt eine aus, läuft der Betrieb über die andere weiter.',
     n:'STP abzuschalten beseitigt zwar die Blockierung, erzeugt aber eine echte Schleife – Broadcast-Stürme legen dann das gesamte Netz lahm.'},
 en:{s:'To double the bandwidth between a floor switch and the core switch, a colleague has plugged a second patch cable between the two devices. The throughput remains unchanged, and the switch interface shows one of the two ports as "Blocking" or "Discarding".',
     q:'How do you explain this behaviour, and what is the correct measure?',
     o:['Spanning Tree blocks the second link to prevent a loop; both ports must be bundled into a link aggregation (LACP, IEEE 802.1AX) on both switches','The second cable is defective and must be replaced; after that, both links are used together automatically','Spanning Tree must be disabled on both switches so that both links transmit data at the same time','VRRP must be set up on the floor switch so that traffic is distributed across both links'],
     e:'Two parallel links between two switches form a layer 2 loop, so STP/RSTP disables one port. An LACP group appears to STP as one logical link: traffic is distributed over both lines, and if one fails, operation continues over the other.',
     n:'Disabling STP does remove the blocking, but it creates a real loop – broadcast storms then bring down the entire network.'}},
{id:'ha-08', a:'ha', t:'mc', c:[0,1,2],
 de:{s:'Das Standardgateway eines Standorts ist bisher ein einzelner Layer-3-Switch. Künftig sollen zwei Geräte das Gateway per VRRP redundant bereitstellen. Sie erklären dem Kunden das Konzept.',
     q:'Welche Aussagen zu VRRP sind korrekt? (Mehrere Antworten)',
     o:['Die Clients tragen als Standardgateway eine virtuelle IP-Adresse ein, die keinem der beiden Geräte fest gehört','Ein Gerät ist anhand seiner Priorität Master; fällt es aus, übernimmt das Backup-Gerät die virtuelle IP- und MAC-Adresse','VRRP ist ein offener Standard, HSRP ist das vergleichbare proprietäre Protokoll von Cisco','Jeder Client muss zwei Standardgateways eintragen und bei einem Ausfall selbst umschalten','VRRP verteilt die Pakete automatisch gleichmäßig auf beide Geräte (Load Balancing)','Mit VRRP ist ein zweiter Internetanschluss überflüssig, weil das Gateway bereits redundant ist'],
     e:'VRRP ist ein First-Hop-Redundancy-Protokoll: Für die Clients ändert sich bei einem Ausfall nichts, weil IP- und MAC-Adresse des Gateways gleich bleiben. Aktiv ist dabei immer nur der Master einer VRRP-Gruppe.',
     n:'Die Lastverteilung ist verlockend, weil zwei Geräte vorhanden sind – pro VRRP-Gruppe leitet aber nur der Master weiter. Last lässt sich höchstens über mehrere Gruppen (z. B. je VLAN ein anderer Master) aufteilen.'},
 en:{s:'The default gateway of a site has so far been a single layer 3 switch. In future, two devices are to provide the gateway redundantly via VRRP. You explain the concept to the customer.',
     q:'Which statements about VRRP are correct? (Multiple answers)',
     o:['The clients use a virtual IP address as their default gateway, which does not permanently belong to either device','Based on its priority, one device is master; if it fails, the backup device takes over the virtual IP and MAC address','VRRP is an open standard; HSRP is the comparable proprietary protocol from Cisco','Each client must configure two default gateways and switch over itself in the event of a failure','VRRP automatically distributes packets evenly across both devices (load balancing)','With VRRP a second internet connection is unnecessary because the gateway is already redundant'],
     e:'VRRP is a first-hop redundancy protocol: nothing changes for the clients in the event of a failure because the gateway\'s IP and MAC address stay the same. Only the master of a VRRP group is ever active.',
     n:'Load balancing is tempting because there are two devices – but per VRRP group only the master forwards. Load can at most be split across several groups (e.g. a different master per VLAN).'}},
{id:'ha-09', a:'ha', t:'match',
 de:{s:'Ein mittelständischer Maschinenbauer baut ein Business Continuity Management nach BSI-Standard 200-4 auf. Für das erste Workshop-Handout sollen Sie zentrale Begriffe erläutern.',
     q:'Ordnen Sie jedem Begriff die zutreffende Beschreibung zu.',
     p:[['Business Impact Analyse (BIA)','Ermittelt zeitkritische Geschäftsprozesse und die Schäden eines Ausfalls im Zeitverlauf'],['MTPD / maximal tolerierbare Ausfallzeit (MTA)','Zeitraum, nach dem ein Ausfall nicht mehr hinnehmbar bzw. existenzbedrohend ist'],['RTO (Wiederanlaufzeit)','Zeit, in der ein Prozess oder System mindestens im Notbetrieb wieder verfügbar sein muss'],['RPO','Maximal tolerierbarer Datenverlust, angegeben als Zeitraum'],['Wiederanlaufplan','Schrittfolge zur Wiederherstellung eines Systems einschließlich seiner Abhängigkeiten'],['Notfallhandbuch','Bündelt Alarmierung, Kontakte, Zuständigkeiten und Pläne – auch ausgedruckt verfügbar']],
     e:'Die BIA liefert MTPD, RTO und RPO je Prozess; daraus werden Kontinuitätsstrategien und Pläne abgeleitet. Das RTO muss kleiner sein als die MTPD, sonst wird die Toleranzgrenze überschritten.',
     n:'RTO und RPO werden oft verwechselt: Das RTO misst die Zeit bis zum Wiederanlauf, das RPO den Datenverlust rückwärts ab dem Schadenszeitpunkt.'},
 en:{s:'A medium-sized mechanical engineering company is setting up business continuity management according to BSI standard 200-4. You are to explain key terms for the first workshop handout.',
     q:'Match each term to the right description.',
     p:[['Business impact analysis (BIA)','Identifies time-critical business processes and the damage caused by an outage over time'],['MTPD / maximum tolerable downtime (MTA)','Period after which an outage is no longer acceptable or threatens the company\'s existence'],['RTO (recovery time objective)','Time within which a process or system must be available again, at least in emergency operation'],['RPO','Maximum tolerable data loss, stated as a period of time'],['Recovery plan (Wiederanlaufplan)','Sequence of steps to restore a system including its dependencies'],['Emergency manual (Notfallhandbuch)','Bundles alerting, contacts, responsibilities and plans – also available in printed form']],
     e:'The BIA delivers MTPD, RTO and RPO per process; continuity strategies and plans are derived from them. The RTO must be shorter than the MTPD, otherwise the tolerance limit is exceeded.',
     n:'RTO and RPO are often mixed up: the RTO measures the time until recovery, the RPO the data loss backwards from the time of the incident.'}},
{id:'ha-10', a:'ha', t:'mc', c:[0,1,2],
 de:{s:'Bei einem Ransomware-Angriff auf eine Steuerkanzlei wurden neben dem Fileserver auch alle Sicherungen verschlüsselt. Das Backup-NAS war Mitglied der Windows-Domäne und per SMB-Freigabe mit einem Domänen-Admin-Konto eingebunden. Sie sollen das Backup-Konzept überarbeiten.',
     q:'Welche Maßnahmen schützen die Sicherungen wirksam vor einem solchen Angriff? (Mehrere Antworten)',
     o:['Zusätzliche Kopie auf unveränderlichem Speicher (Immutable/WORM, z. B. Object Lock) mit festgelegter Aufbewahrungsfrist','Regelmäßig ausgelagerte Offline-Kopie, z. B. Bänder, die nach der Sicherung aus der Library entnommen werden','Backup-Server und -Speicher aus der Produktivdomäne herauslösen und mit eigenen Zugangsdaten und MFA absichern','Das Backup-NAS von RAID 5 auf RAID 6 umstellen','Die inkrementellen Sicherungen stündlich statt täglich auf dasselbe NAS schreiben','Zusätzlich Schattenkopien (VSS) auf dem Fileserver aktivieren'],
     e:'Wirksam ist, was ein Angreifer mit erbeuteten Domänenrechten nicht erreichen oder nicht verändern kann: unveränderliche oder physisch getrennte Kopien und eine eigenständige Authentifizierung für die Backup-Infrastruktur (vgl. 3-2-1-1-0-Regel).',
     n:'RAID 6 wirkt verlockend, weil es „mehr Sicherheit“ verspricht – es schützt aber nur vor Plattenausfällen. Verschlüsselte Daten werden genauso redundant gespeichert wie unverschlüsselte.'},
 en:{s:'In a ransomware attack on a tax consultancy, all backups were encrypted along with the file server. The backup NAS was a member of the Windows domain and was mounted via an SMB share using a domain admin account. You are to revise the backup concept.',
     q:'Which measures effectively protect the backups against such an attack? (Multiple answers)',
     o:['Additional copy on immutable storage (immutable/WORM, e.g. Object Lock) with a defined retention period','Regular offline copy stored off-site, e.g. tapes that are removed from the library after the backup','Separate the backup server and storage from the production domain and protect them with their own credentials and MFA','Change the backup NAS from RAID 5 to RAID 6','Write the incremental backups hourly instead of daily to the same NAS','Additionally enable shadow copies (VSS) on the file server'],
     e:'What works is whatever an attacker with stolen domain rights cannot reach or change: immutable or physically separated copies and independent authentication for the backup infrastructure (cf. the 3-2-1-1-0 rule).',
     n:'RAID 6 is tempting because it promises "more security" – but it only protects against disk failures. Encrypted data is stored just as redundantly as unencrypted data.'}},
{id:'ha-11', a:'ha', gen:'haBackupVolume'},
{id:'ha-12', a:'ha', t:'sc', c:0,
 de:{s:'Ein Kunde betreibt seine Webanwendung auf einem Aktiv/Aktiv-Cluster aus zwei Knoten hinter einem Load Balancer. Beide Knoten sind im Tagesgeschäft zu je etwa 70 % ausgelastet. Der IT-Leiter ist zufrieden: „Wir sind hochverfügbar und nutzen beide Server voll aus.“',
     q:'Wie beurteilen Sie die Situation?',
     o:['Die Hochverfügbarkeit besteht nur auf dem Papier: Fällt ein Knoten aus, müsste der andere rund 140 % Last tragen; die Last je Knoten muss unter ca. 50 % bleiben oder ein dritter Knoten ergänzt werden (N+1)','Die Lösung ist optimal, weil bei Aktiv/Aktiv beide Knoten genutzt werden und keine Hardware ungenutzt bereitsteht','Das Hauptrisiko ist ein Split-Brain; mit einem Quorum-Zeugen ist die Lösung ausreichend abgesichert','Es genügt, den Load Balancer redundant auszulegen, da er der einzige Single Point of Failure ist'],
     e:'Bei Aktiv/Aktiv muss jeder verbleibende Knoten die Last des ausgefallenen mittragen können. Bei zwei Knoten ist das nur bei höchstens etwa 50 % Last je Knoten gewährleistet; sonst folgt dem Ausfall eine Überlast und damit womöglich der Totalausfall.',
     n:'Split-Brain ist ein echtes Clusterrisiko, löst aber nicht das Kapazitätsproblem: Auch mit Quorum kann ein einzelner Knoten keine 140 % Last tragen.'},
 en:{s:'A customer runs its web application on an active/active cluster of two nodes behind a load balancer. In daily business both nodes are each about 70 % utilised. The IT manager is satisfied: "We are highly available and make full use of both servers."',
     q:'How do you assess the situation?',
     o:['High availability exists only on paper: if one node fails, the other would have to carry about 140 % load; the load per node must stay below approx. 50 % or a third node must be added (N+1)','The solution is optimal because both nodes are used in active/active and no hardware sits idle','The main risk is split brain; with a quorum witness the solution is sufficiently protected','It is enough to make the load balancer redundant, as it is the only single point of failure'],
     e:'In active/active, each remaining node must be able to take on the load of the failed one. With two nodes this is only guaranteed at a maximum of about 50 % load per node; otherwise the failure is followed by overload and possibly a total outage.',
     n:'Split brain is a real cluster risk but does not solve the capacity problem: even with a quorum, a single node cannot carry 140 % load.'}},
{id:'ha-13', a:'ha', t:'in', f:[{v:4.2, tol:0.05, u:'h'}, {v:477, tol:1, u:'MB/s'}],
 de:{s:'Der Fileserver eines Kunden mit 6 TB Daten soll künftig jede Nacht voll gesichert werden. Das Backup-Ziel erreicht einen effektiven Durchsatz von 400 MB/s. Das Backup-Fenster reicht von 22:00 bis 05:00 Uhr. Es gilt 1 TB = 1.000.000 MB.',
     q:'Wie lange dauert die Vollsicherung in Stunden (eine Nachkommastelle)? Welcher effektive Durchsatz wäre mindestens nötig, wenn der Datenbestand auf 12 TB wächst und das Fenster gleich bleibt? Runden Sie den Durchsatz auf ganze MB/s auf.',
     l:['Dauer der Vollsicherung','Mindestdurchsatz bei 12 TB'],
     e:'6.000.000 MB ÷ 400 MB/s = 15.000 s = 4,17 h ≈ 4,2 h – passt ins Fenster. Fenster: 22:00 bis 05:00 = 7 h × 3.600 = 25.200 s. 12.000.000 MB ÷ 25.200 s = 476,19 MB/s → mindestens 477 MB/s.',
     n:'Naheliegend, aber falsch: bei doppelter Datenmenge einfach den doppelten Durchsatz (800 MB/s) anzusetzen – maßgeblich ist das verfügbare Fenster von 7 Stunden, nicht die bisherige Laufzeit.'},
 en:{s:'A customer\'s file server holding 6 TB of data is to receive a full backup every night in future. The backup target achieves an effective throughput of 400 MB/s. The backup window runs from 22:00 to 05:00. Assume 1 TB = 1,000,000 MB.',
     q:'How long does the full backup take in hours (one decimal place)? What effective throughput would be needed at least if the data grows to 12 TB and the window stays the same? Round the throughput up to whole MB/s.',
     l:['Duration of full backup','Minimum throughput at 12 TB'],
     e:'6,000,000 MB ÷ 400 MB/s = 15,000 s = 4.17 h ≈ 4.2 h – fits into the window. Window: 22:00 to 05:00 = 7 h × 3,600 = 25,200 s. 12,000,000 MB ÷ 25,200 s = 476.19 MB/s → at least 477 MB/s.',
     n:'Tempting but wrong: simply doubling the throughput (800 MB/s) for twice the data – what matters is the available 7-hour window, not the previous run time.'}},
{id:'ha-14', a:'ha', t:'mc', c:[0,1,2],
 de:{s:'Ein Kunde lässt seinen Serverraum mit sechs Racks modernisieren. Nach einem Schwelbrand an einer Steckdosenleiste im Nachbargebäude sollen Klimatisierung und Brandschutz überarbeitet werden.',
     q:'Welche Maßnahmen empfehlen Sie? (Mehrere Antworten)',
     o:['Kalt-/Warmgang-Einhausung, damit sich Zu- und Abluft nicht vermischen','Brandfrüherkennung mit Rauchansaugsystem (RAS), das Brände bereits in der Entstehung meldet','Gaslöschanlage (z. B. Inertgas) oder Sauerstoffreduktionsanlage, die ohne Löschmittelschäden an der Hardware auskommt','Die Klimatisierung dauerhaft auf 16 °C einstellen, weil kältere Zuluft die Ausfallsicherheit deutlich erhöht','Pulverfeuerlöscher als Standard-Handfeuerlöscher im Serverraum bereitstellen','Die relative Luftfeuchtigkeit möglichst unter 10 % halten, um Kondensation sicher auszuschließen'],
     e:'Einhausung steigert die Kühleffizienz, ein RAS erkennt Schwelbrände sehr früh, und Inertgas bzw. Sauerstoffreduktion löscht bzw. verhindert Brände ohne Rückstände. Als Handfeuerlöscher eignen sich CO₂-Löscher; empfohlen sind Zulufttemperaturen von etwa 18–27 °C (ASHRAE) und eine moderate Luftfeuchte.',
     n:'16 °C klingen nach „mehr Sicherheit“, bringen aber kaum Nutzen und kosten viel Energie – moderne Hardware ist für deutlich höhere Zulufttemperaturen ausgelegt. Sehr trockene Luft erhöht zudem das Risiko elektrostatischer Entladungen.'},
 en:{s:'A customer is having its server room with six racks modernised. After a smouldering fire on a power strip in the neighbouring building, climate control and fire protection are to be revised.',
     q:'Which measures do you recommend? (Multiple answers)',
     o:['Cold/hot aisle containment so that supply and exhaust air do not mix','Early fire detection with an aspirating smoke detection system (ASD) that reports fires as they start','Gas extinguishing system (e.g. inert gas) or oxygen reduction system that causes no extinguishing agent damage to the hardware','Permanently set the air conditioning to 16 °C, because colder supply air significantly increases reliability','Provide powder fire extinguishers as the standard portable extinguishers in the server room','Keep the relative humidity below 10 % if possible to rule out condensation reliably'],
     e:'Containment increases cooling efficiency, an ASD detects smouldering fires very early, and inert gas or oxygen reduction extinguishes or prevents fires without residue. CO₂ extinguishers are suitable as portable extinguishers; supply air temperatures of about 18–27 °C (ASHRAE) and moderate humidity are recommended.',
     n:'16 °C sounds like "more safety" but brings little benefit and costs a lot of energy – modern hardware is designed for much higher supply air temperatures. Very dry air also increases the risk of electrostatic discharge.'}},
{id:'ha-15', a:'ha', t:'match',
 de:{s:'Sie stellen der Geschäftsleitung eines Handelsunternehmens das neue Datensicherungskonzept vor und erläutern dabei die verwendeten Begriffe.',
     q:'Ordnen Sie jedem Begriff die zutreffende Beschreibung zu.',
     p:[['Vollsicherung','Sichert alle ausgewählten Daten; längste Laufzeit, einfachste Wiederherstellung'],['Inkrementelle Sicherung','Sichert nur die Änderungen seit der letzten Sicherung beliebigen Typs'],['Differenzielle Sicherung','Sichert alle Änderungen seit der letzten Vollsicherung'],['GFS-Prinzip','Generationenprinzip mit täglichen, wöchentlichen und monatlichen Sicherungen (Sohn, Vater, Großvater)'],['Immutable Backup','Sicherung, die während einer festgelegten Frist weder geändert noch gelöscht werden kann'],['3-2-1-Regel','Drei Kopien der Daten auf zwei verschiedenen Medien, davon eine außer Haus']],
     e:'Inkrementell ist schnell und platzsparend, braucht aber zur Wiederherstellung die ganze Kette; differenziell braucht nur Voll- plus letzte Sicherung. GFS regelt die Aufbewahrung, Immutable Backups und die 3-2-1-Regel schützen vor Ransomware und Standortschäden.',
     n:'Inkrementell und differenziell werden am häufigsten vertauscht: Bezugspunkt der inkrementellen Sicherung ist die letzte Sicherung, der differenziellen die letzte Vollsicherung.'},
 en:{s:'You present the new data backup concept to the management of a trading company and explain the terms used.',
     q:'Match each term to the right description.',
     p:[['Full backup','Backs up all selected data; longest run time, simplest restore'],['Incremental backup','Backs up only the changes since the last backup of any type'],['Differential backup','Backs up all changes since the last full backup'],['GFS principle','Generation scheme with daily, weekly and monthly backups (son, father, grandfather)'],['Immutable backup','Backup that cannot be changed or deleted during a defined retention period'],['3-2-1 rule','Three copies of the data on two different media, one of them off-site']],
     e:'Incremental is fast and saves space but needs the whole chain for a restore; differential needs only the full plus the latest backup. GFS governs retention; immutable backups and the 3-2-1 rule protect against ransomware and site damage.',
     n:'Incremental and differential are swapped most often: the reference point of an incremental backup is the last backup, that of a differential backup the last full backup.'}},
{id:'ha-16', a:'ha', t:'order',
 de:{s:'Ein Serverraum wird von einer USV mit Netzwerkkarte versorgt. Angeschlossen sind zwei Virtualisierungshosts mit Anwendungs- und Datenbank-VMs, ein iSCSI-Storage und die Core-Switches. Die Überbrückungszeit beträgt 20 Minuten. Sie konfigurieren den automatischen Shutdown für einen längeren Stromausfall.',
     q:'Bringen Sie die Schritte in die richtige Reihenfolge.',
     o:['Netzausfall: Die USV schaltet auf Batteriebetrieb und meldet das Ereignis über ihre Netzwerkkarte (SNMP/Agent) an die Shutdown-Software','Die Shutdown-Software wartet die eingestellte Verzögerung bzw. Restlaufzeit-Schwelle ab, falls der Strom zurückkehrt','Die Anwendungs-VMs werden heruntergefahren','Die Datenbank-VM wird heruntergefahren','Die Virtualisierungshosts werden heruntergefahren','Das iSCSI-Storage wird heruntergefahren','Die USV schaltet ihre Ausgänge ab, bevor die Batterie tiefentladen ist'],
     e:'Heruntergefahren wird entgegen den Abhängigkeiten: erst die Anwendungen, dann die Datenbank, auf die sie zugreifen, dann die Hosts und zuletzt das Storage, auf dem die VMs liegen. Die Switches bleiben bis zum Schluss an, weil die Shutdown-Befehle über das Netzwerk laufen. Die Schwelle muss so gewählt sein, dass die Restlaufzeit für alle Schritte reicht.',
     n:'Wird das Storage vor den Hosts abgeschaltet, verlieren noch laufende VMs ihre Disks – das kann Dateisysteme und Datenbanken beschädigen.'},
 en:{s:'A server room is supplied by a UPS with a network card. Connected are two virtualisation hosts with application and database VMs, an iSCSI storage system and the core switches. The runtime is 20 minutes. You configure the automatic shutdown for a longer power outage.',
     q:'Put the steps in the correct order.',
     o:['Power failure: the UPS switches to battery operation and reports the event to the shutdown software via its network card (SNMP/agent)','The shutdown software waits for the configured delay or remaining-runtime threshold in case power returns','The application VMs are shut down','The database VM is shut down','The virtualisation hosts are shut down','The iSCSI storage is shut down','The UPS switches off its outputs before the battery is deeply discharged'],
     e:'Shutdown runs against the dependencies: first the applications, then the database they access, then the hosts, and finally the storage on which the VMs reside. The switches stay on until the end because the shutdown commands travel over the network. The threshold must leave enough remaining runtime for all steps.',
     n:'If the storage is switched off before the hosts, VMs that are still running lose their disks – this can damage file systems and databases.'}},
{id:'ha-17', a:'ha', t:'sc', c:0,
 de:{s:'Ein Versicherungsmakler plant ein zweites Rechenzentrum in 250 km Entfernung als georedundanten Standort. Die Geschäftsleitung fordert: „Alle Datenbanken werden synchron gespiegelt, damit wir bei einem Ausfall keinerlei Daten verlieren (RPO = 0).“',
     q:'Wie bewerten Sie diese Anforderung?',
     o:['Die Ziele stehen in Konflikt: Bei synchroner Spiegelung wartet jeder Schreibvorgang auf die Bestätigung des entfernten Standorts; die Signallaufzeit über 250 km bremst schreibintensive Systeme deutlich. Üblich ist asynchrone Replikation mit einem kleinen, vereinbarten RPO > 0','Die Anforderung ist problemlos umsetzbar, weil bei ausreichender Bandbreite die Entfernung keine Rolle spielt','Die Anforderung ist problemlos umsetzbar, weil auch asynchrone Replikation ein RPO von 0 garantiert','Die Entfernung ist zu gering für Georedundanz; erst ab 1.000 km gelten Rechenzentren als georedundant'],
     e:'Licht braucht in Glasfaser rund 5 µs pro km; über 250 km kommen mit Hin- und Rückweg und Netztechnik mehrere Millisekunden je Schreibvorgang hinzu. Synchrone Spiegelung ist daher nur über kurze Distanzen üblich (z. B. Metro-Cluster); über große Entfernungen repliziert man asynchron und legt ein realistisches RPO fest.',
     n:'Bandbreite und Latenz werden oft verwechselt: Eine schnellere Leitung überträgt mehr Daten pro Sekunde, verkürzt aber nicht die Signallaufzeit, auf die jeder synchrone Schreibvorgang warten muss.'},
 en:{s:'An insurance broker is planning a second data centre 250 km away as a georedundant site. Management demands: "All databases are mirrored synchronously so that we lose no data at all in the event of a failure (RPO = 0)."',
     q:'How do you assess this requirement?',
     o:['The goals conflict: with synchronous mirroring every write waits for acknowledgement from the remote site; the signal propagation time over 250 km slows write-intensive systems considerably. Asynchronous replication with a small, agreed RPO > 0 is usual','The requirement is easy to implement because distance does not matter if there is enough bandwidth','The requirement is easy to implement because asynchronous replication also guarantees an RPO of 0','The distance is too short for georedundancy; data centres only count as georedundant from 1,000 km'],
     e:'Light needs about 5 µs per km in fibre; over 250 km, the round trip plus network equipment adds several milliseconds per write. Synchronous mirroring is therefore only usual over short distances (e.g. metro clusters); over long distances data is replicated asynchronously and a realistic RPO is defined.',
     n:'Bandwidth and latency are often confused: a faster line transfers more data per second but does not shorten the propagation time that every synchronous write has to wait for.'}},
{id:'ha-18', a:'ha', t:'sc', c:0,
 de:{s:'Nach einem Hardwaredefekt soll der Datenbankserver einer Arztpraxis aus der Sicherung wiederhergestellt werden. Seit Monaten meldet die Backup-Software jede Nacht „erfolgreich“. Beim Restore stellt sich heraus, dass das Datenbankverzeichnis nach einer Softwareumstellung gar nicht mehr im Sicherungsauftrag enthalten war.',
     q:'Welche Maßnahme hätte den Fehler am zuverlässigsten rechtzeitig aufgedeckt?',
     o:['Regelmäßige, dokumentierte Wiederherstellungstests in einer isolierten Umgebung, bei denen auch geprüft wird, ob die Anwendung mit den zurückgesicherten Daten tatsächlich funktioniert','Die täglichen Statusmeldungen der Backup-Software sorgfältiger lesen und archivieren','Nach jeder Sicherung eine Prüfsummen-Verifikation der Sicherungsdateien durchführen','Die Anzahl der aufbewahrten Sicherungsgenerationen erhöhen'],
     e:'Nur ein Restore-Test beweist, dass die richtigen Daten gesichert und nutzbar sind. Er sollte regelmäßig und nach jeder größeren Änderung stattfinden und dabei auch die Einhaltung des RTO messen.',
     n:'Die Prüfsummen-Verifikation wirkt gründlich, prüft aber nur, ob das Gesicherte unverändert lesbar ist – dass wichtige Daten gar nicht im Auftrag stehen, erkennt sie nicht.'},
 en:{s:'After a hardware defect, the database server of a medical practice is to be restored from backup. For months the backup software has reported "successful" every night. During the restore it turns out that, after a software migration, the database directory was no longer included in the backup job at all.',
     q:'Which measure would have revealed the error in time most reliably?',
     o:['Regular, documented restore tests in an isolated environment, which also check whether the application actually works with the restored data','Read and archive the daily status messages of the backup software more carefully','Run a checksum verification of the backup files after each backup','Increase the number of retained backup generations'],
     e:'Only a restore test proves that the right data is backed up and usable. It should take place regularly and after every major change, also measuring whether the RTO is met.',
     n:'Checksum verification seems thorough but only checks that what was backed up is readable and unchanged – it cannot detect that important data is not in the job at all.'}},
{id:'ha-19', a:'ha', t:'order',
 de:{s:'Ein Maschinenbauunternehmen will erstmals ein Business Continuity Management System (BCMS) nach BSI-Standard 200-4 aufbauen. Sie unterstützen den Business-Continuity-Beauftragten bei der Projektplanung.',
     q:'Bringen Sie die Phasen in die richtige Reihenfolge.',
     o:['Die Geschäftsleitung initiiert das BCMS: Leitlinie verabschieden, Verantwortliche benennen, Geltungsbereich festlegen','Business Impact Analyse: zeitkritische Prozesse mit MTPD, RTO und RPO ermitteln','Risikoanalyse für die zeitkritischen Prozesse und ihre Ressourcen','Soll-Ist-Vergleich durchführen und Kontinuitätsstrategien festlegen (z. B. Ausweichstandort, Redundanz)','Geschäftsfortführungs- und Wiederanlaufpläne erstellen und im Notfallhandbuch bündeln','Tests und Übungen durchführen (z. B. Wiederanlauftest, Stabsübung)','Ergebnisse auswerten und das BCMS kontinuierlich verbessern'],
     e:'Erst die BIA zeigt, welche Prozesse zeitkritisch sind; nur für diese lohnen die detaillierte Risikoanalyse und die Strategieauswahl. Pläne sind erst belastbar, wenn sie geübt wurden – die Erkenntnisse fließen in die Verbesserung zurück (PDCA).',
     n:'Häufig wird direkt mit dem Schreiben von Notfallplänen begonnen – ohne BIA fehlen RTO und Prioritäten, und die Pläne setzen bei den falschen Systemen an.'},
 en:{s:'A mechanical engineering company wants to set up a business continuity management system (BCMS) according to BSI standard 200-4 for the first time. You support the business continuity officer in planning the project.',
     q:'Put the phases in the correct order.',
     o:['Management initiates the BCMS: adopt a policy, appoint those responsible, define the scope','Business impact analysis: identify time-critical processes with MTPD, RTO and RPO','Risk analysis for the time-critical processes and their resources','Carry out a target/actual comparison and define continuity strategies (e.g. alternative site, redundancy)','Create business continuity and recovery plans and bundle them in the emergency manual','Carry out tests and exercises (e.g. recovery test, crisis team exercise)','Evaluate the results and continuously improve the BCMS'],
     e:'Only the BIA shows which processes are time-critical; detailed risk analysis and strategy selection are only worthwhile for those. Plans are only reliable once they have been exercised – the findings feed back into improvement (PDCA).',
     n:'People often start straight away by writing emergency plans – without a BIA, RTOs and priorities are missing and the plans focus on the wrong systems.'}},
{id:'ha-20', a:'ha', t:'open',
 de:{s:'Fachgespräch (AP 2): Ein Logistikunternehmen hat an seinem Standort einen einzelnen Core-Switch, eine Firewall und einen DSL-Anschluss. Nach dem Ausfall des Core-Switches stand der Versand sechs Stunden still. Der Prüfer fragt: „Wie würden Sie das Netz dieses Kunden ausfallsicher gestalten?“',
     q:'Erläutern Sie Ihr Konzept wie im Fachgespräch.',
     m:'• Ausgangspunkt: Single Points of Failure identifizieren (Core-Switch, Firewall, WAN) und Anforderungen aus der BIA ableiten (RTO des Versandprozesses) – Kosten gegen Ausfallschaden abwägen.\n• Core: zwei Core-Switches als Stack bzw. MLAG, Gateway redundant per VRRP.\n• Uplinks: jeder Access-Switch mit zwei Leitungen an beide Core-Switches, gebündelt per LACP; RSTP als Schutz vor Schleifen.\n• Firewall: HA-Cluster (Aktiv/Passiv mit Session-Synchronisation).\n• WAN: Dual-WAN über zwei Provider mit unterschiedlicher Technik und Trassenführung (z. B. Glasfaser + 5G) mit automatischem Failover.\n• Strom: redundante Netzteile an getrennten Stromkreisen bzw. USVs.\n• Betrieb: Monitoring mit Alarmierung, Konfigurationsbackups, dokumentierte und regelmäßig getestete Umschaltung.',
     k:['SPOFs identifiziert, Bezug zu BIA und Kosten','Redundanter Core (Stack/MLAG, VRRP)','Doppelte Uplinks mit LACP, RSTP','Firewall-Cluster','Dual-WAN mit verschiedenen Providern/Medien','Monitoring und Failover-Tests']},
 en:{s:'Expert interview (AP 2): A logistics company has a single core switch, one firewall and one DSL line at its site. After the core switch failed, shipping came to a standstill for six hours. The examiner asks: "How would you make this customer\'s network resilient?"',
     q:'Explain your concept as in the expert interview.',
     m:'• Starting point: identify single points of failure (core switch, firewall, WAN) and derive requirements from the BIA (RTO of the shipping process) – weigh costs against outage damage.\n• Core: two core switches as a stack or MLAG, gateway made redundant via VRRP.\n• Uplinks: each access switch connected with two lines to both core switches, bundled via LACP; RSTP as loop protection.\n• Firewall: HA cluster (active/passive with session synchronisation).\n• WAN: dual WAN via two providers with different technology and cable routes (e.g. fibre + 5G) with automatic failover.\n• Power: redundant power supplies on separate circuits or UPSs.\n• Operations: monitoring with alerting, configuration backups, documented and regularly tested failover.',

/* ===== BEREICH:fg – Präsentation & Fachgespräch (AP 2) ===== */
Q.push(
{id:'fg-01', a:'fg', t:'open',
 de:{s:'Fachgespräch zu Ihrem Projekt „Einführung einer Backup-Lösung“. Prüfer: „Warum haben Sie sich für Lösung A entschieden und nicht für Lösung B?“',
     q:'Wie strukturieren Sie Ihre Antwort?',
     m:'• Anforderungen nennen, die entscheidend waren (z. B. RPO, Budget, vorhandene Infrastruktur).\n• Auf die Nutzwertanalyse bzw. den Kostenvergleich im Projekt verweisen und die ausschlaggebenden Kriterien mit Gewichtung nennen.\n• Konkrete Vorteile von A (z. B. Unveränderlichkeit der Backups, Integration in bestehende Virtualisierung).\n• Nachteile von A ehrlich einräumen und begründen, warum sie akzeptabel sind.\n• Kurz: Was hätte für B gesprochen?',
     k:['Bezug zu den Anforderungen','Nutzwertanalyse / Kosten genannt','Konkrete Kriterien statt „besser“','Nachteile offen benannt','Alternative fair bewertet']},
 en:{s:'Expert interview on your project "Introducing a backup solution". Examiner: "Why did you choose solution A and not solution B?"',
     q:'How do you structure your answer?',
     m:'• Name the requirements that were decisive (e.g. RPO, budget, existing infrastructure).\n• Refer to the weighted scoring model or cost comparison in the project and name the decisive criteria with their weights.\n• Concrete advantages of A (e.g. immutable backups, integration with the existing virtualisation).\n• Honestly admit the disadvantages of A and explain why they are acceptable.\n• Briefly: what would have spoken for B?',
     k:['Link to the requirements','Scoring model / costs mentioned','Concrete criteria instead of "better"','Disadvantages named openly','Alternative assessed fairly']}},
{id:'fg-02', a:'fg', t:'open',
 de:{s:'Prüfer: „Was würden Sie rückblickend an Ihrem Projekt anders machen?“',
     q:'Formulieren Sie eine überzeugende Antwort.',
     m:'• Ein echtes, konkretes Beispiel nennen (z. B. „Ich hätte die Anwender früher in den Test einbezogen“).\n• Die Auswirkung benennen (z. B. zwei Tage Verzug in der Testphase, im Soll-Ist-Vergleich dokumentiert).\n• Die Erkenntnis und was man künftig tut.\n• Nicht: „Nichts, es lief alles perfekt“ – das wirkt unreflektiert.',
     k:['Konkretes Beispiel','Auswirkung benannt (Soll-Ist)','Lernerkenntnis formuliert','Kein „alles perfekt“']},
 en:{s:'Examiner: "Looking back, what would you do differently in your project?"',
     q:'Formulate a convincing answer.',
     m:'• Give a real, concrete example (e.g. "I would have involved users in testing earlier").\n• Name the impact (e.g. two days delay in the test phase, documented in the plan-vs-actual comparison).\n• The lesson and what you will do in future.\n• Not: "Nothing, everything went perfectly" – that seems unreflective.',
     k:['Concrete example','Impact named (plan vs. actual)','Lesson formulated','No "everything was perfect"']}},
{id:'fg-03', a:'fg', t:'open',
 de:{s:'Prüfer: „Wie haben Sie sichergestellt, dass Ihre Lösung funktioniert?“ (Projekt: Einrichtung eines VPN-Zugangs für Außendienstler)',
     q:'Beschreiben Sie Ihr Testvorgehen.',
     m:'• Testfälle aus den Anforderungen abgeleitet (z. B. Verbindung aus Mobilfunknetz, Zugriff auf Fileserver, Sperre nach Deaktivierung des Kontos).\n• Testumgebung bzw. Pilotgruppe mit zwei Außendienstlern.\n• Positiv- und Negativtests (z. B. falsches Zertifikat wird abgelehnt).\n• Ergebnisse im Testprotokoll dokumentiert, Fehler behoben und nachgetestet.\n• Abnahme durch den Auftraggeber.',
     k:['Testfälle aus Anforderungen','Testumgebung / Pilot','Positiv- UND Negativtests','Testprotokoll','Abnahme']},
 en:{s:'Examiner: "How did you make sure your solution works?" (Project: setting up VPN access for field staff)',
     q:'Describe your testing approach.',
     m:'• Test cases derived from the requirements (e.g. connection from mobile network, access to file server, block after the account is disabled).\n• Test environment or pilot group with two field staff.\n• Positive and negative tests (e.g. a wrong certificate is rejected).\n• Results documented in a test protocol, defects fixed and retested.\n• Acceptance by the client.',
     k:['Test cases from requirements','Test environment / pilot','Positive AND negative tests','Test protocol','Acceptance']}},
{id:'fg-04', a:'fg', t:'sc', c:0,
 de:{s:'Für die Projektpräsentation stehen 15 Minuten zur Verfügung. Ihr Entwurf umfasst 26 Folien mit vielen Konfigurationsauszügen.',
     q:'Was ist der beste Umgang damit?',
     o:['Auf etwa 10–12 Kernfolien kürzen, Entscheidungen und Ergebnisse in den Mittelpunkt stellen, Details als Backup-Folien bereithalten','Schneller sprechen, damit alle Folien gezeigt werden können','Alle Folien zeigen und die Prüfer mitlesen lassen','Auf Folien verzichten und nur frei sprechen'],
     e:'Der Prüfungsausschuss bewertet Struktur, Verständlichkeit und Zeitmanagement. Backup-Folien helfen, im Fachgespräch bei Detailfragen gezielt zu antworten.',
     n:'Schneller sprechen wirkt wie eine Lösung, überfordert aber die Zuhörer – und eine Zeitüberschreitung wird abgebrochen und negativ bewertet.'},
 en:{s:'You have 15 minutes for the project presentation. Your draft has 26 slides with many configuration excerpts.',
     q:'What is the best way to deal with this?',
     o:['Cut to about 10–12 core slides, focus on decisions and results, keep details as backup slides','Speak faster so that all slides can be shown','Show all slides and let the examiners read along','Do without slides and only speak freely'],
     e:'The examination board assesses structure, clarity and time management. Backup slides help to answer detailed questions precisely in the interview.',
     n:'Speaking faster seems like a solution but overwhelms the audience – and overrunning the time is cut off and marked down.'}},
{id:'fg-05', a:'fg', t:'mc', c:[0,1,2],
 de:{s:'Sie überarbeiten Ihre Projektdokumentation für die IHK (max. 15 Seiten ohne Anlagen).',

     e:'Der Hauptteil zeigt das eigene Vorgehen und die Entscheidungen. Umfangreiche Konfigurationen, Screenshots und Protokolle gehören in den Anhang – im Text genügen aussagekräftige Auszüge.',
     n:'Konfigurationsdateien belegen zwar die Arbeit, blähen den Hauptteil aber auf und sprengen die Seitenbegrenzung – sie gehören in die Anlagen.'},

);

<script>
/* =====================================================================
   APP – Teil 1: Zustand, Sprache, Leitner, XP, Abzeichen, Update, Backup
   ===================================================================== */
let L = 'de';
const x = (de, en) => L === 'en' ? en : de;
const LS_KEY = 'patchfeld.v1';
const INTERVALS = [1, 3, 7, 16, 35];
const ROUND_SIZE = 10, LIVES = 3;
const EXAMS = {
  AP1: {n:30, min:90,  years:{1:0.5, 2:0.5}, de:'Abschlussprüfung Teil 1', en:'Final exam part 1'},
  AP2: {n:40, min:120, years:{2:0.4, 3:0.6}, de:'Abschlussprüfung Teil 2', en:'Final exam part 2'}
};
const XP_BASE = {sc:10, mc:12, match:15, order:15, in:15, open:10};
const RANKS = [[1,'Azubi','Apprentice'],[3,'Kabelzieher','Cable puller'],[5,'First-Level-Support','First-level support'],[8,'Second-Level-Support','Second-level support'],[12,'Junior-Admin','Junior admin'],[17,'Systemadministrator','System administrator'],[23,'Netzwerk-Engineer','Network engineer'],[30,'Senior-Administrator','Senior administrator'],[38,'IT-Consultant','IT consultant'],[47,'Systemarchitekt','Systems architect']];
const HOST_THEME = document.documentElement.getAttribute('data-theme');

/* ---------- Datum ---------- */
function todayStr(d = new Date()){ const z = n => String(n).padStart(2,'0'); return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`; }
function addDays(s, n){ const d = new Date(s + 'T12:00:00'); d.setDate(d.getDate() + n); return todayStr(d); }
function diffDays(a, b){ return Math.round((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 864e5); }
function fmtDate(s){ if (!s) return ''; const d = new Date(s + 'T12:00:00'); return d.toLocaleDateString(L==='en'?'en-GB':'de-DE', {day:'2-digit', month:'2-digit', year:'numeric'}); }

/* ---------- Zustand ---------- */
const DEFAULT = () => ({
  v:1, created: todayStr(), xp:0, cards:{}, mistakes:{}, days:{}, rounds:[], exams:[], badges:{},
  stats:{bestCombo:0, cleared:0, subnetOk:0, openDone:0, bestStreak:0},
  settings:{lang:null, theme:'auto', goal:20, year:1, examType:'AP1', examDate:'', autoUpdate:true, updateUrl:''},
  lastVersion:null, lastCheck:0, activeExam:null
});
let st = DEFAULT();
function hydrate(data){
  const d = DEFAULT(), s = Object.assign(d, data || {});
  s.settings = Object.assign(DEFAULT().settings, (data && data.settings) || {});
  s.stats = Object.assign(DEFAULT().stats, (data && data.stats) || {});
  return s;
}
function load(){ try { const raw = localStorage.getItem(LS_KEY); st = hydrate(raw ? JSON.parse(raw) : null); } catch(e){ st = DEFAULT(); } }
let saveWarned = false;
function save(){ try { localStorage.setItem(LS_KEY, JSON.stringify(st)); } catch(e){ if (!saveWarned){ saveWarned = true; toast(x('Speichern im Browser nicht möglich – bitte regelmäßig exportieren.','Cannot save in this browser – please export regularly.')); } } }

/* ---------- Hilfen ---------- */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const areaName = a => AREA[a] ? AREA[a][L] : a;
const wireHTML = (a, cls='') => { const ar = AREA[a]; return `<span class="wire wc-${ar.w}${ar.s?' s':''} ${cls}" aria-hidden="true"></span>`; };
const wireLabel = a => { const ar = AREA[a]; return (ar.s ? x('weiß-','white-') : '') + WIRE_NAME[L][ar.w]; };
const QI = Object.fromEntries(Q.map(q => [q.id, q]));
const qType = q => q.gen ? 'in' : q.t;
const TYPE_NAME = () => ({sc:x('Single Choice','Single choice'), mc:x('Mehrfachauswahl','Multiple choice'), in:x('Rechnen/Eingabe','Calculation/input'), match:x('Zuordnung','Matching'), order:x('Reihenfolge','Ordering'), open:x('Offene Frage','Open question')});

/* ---------- Frage instanziieren ---------- */
function inst(q){
  const d = q.gen ? GEN[q.gen](L) : Object.assign({}, q[L] || q.de);
  const t = q.gen ? d.t : q.t;
  const o = {id:q.id, a:q.a, t, s:d.s, q:d.q, code:d.code || q.code || '', tb:d.tb || null, e:d.e || '', n:d.n || ''};
  if (t === 'sc' || t === 'mc'){
    const c = q.gen ? d.c : q.c, cs = Array.isArray(c) ? c : [c];
    o.opts = shuffle(d.o.map((txt, i) => ({x:txt, ok:cs.includes(i)})));
  } else if (t === 'match'){
    const pairs = shuffle(d.p);
    o.left = pairs.map(p => p[0]); o.sol = pairs.map(p => p[1]); o.right = shuffle(o.sol);
  } else if (t === 'order'){
    o.items = d.o.slice(); let idx;
    do { idx = shuffle(d.o.map((_, i) => i)); } while (d.o.length > 1 && idx.every((v, i) => v === i));
    o.disp = idx;
  } else if (t === 'in'){
    o.f = q.gen ? d.f : q.f.map((f, i) => Object.assign({}, f, {l:(d.l || [])[i] || '', u:(d.u && d.u[i]) || f.u || ''}));
  } else if (t === 'open'){ o.m = d.m; o.k = d.k || []; }
  return o;
}

/* ---------- Bewertung ---------- */
const normTxt = s => String(s ?? '').trim().replace(/\s+/g,'').replace(/^\//,'').toLowerCase();
function parseNum(s){
  s = String(s ?? '').trim().replace(/[\s€%]/g,'').replace(/[a-z]+$/i,'');
  if (!s) return NaN;
  if (s.includes(',')) s = s.replace(/\./g,'').replace(',','.');
  else if (/^-?\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g,'');
  return Number(s);
}
function fieldOk(f, val){
  if (typeof f.v === 'number'){ const n = parseNum(val); return !isNaN(n) && Math.abs(n - f.v) <= (f.tol || 0) + 1e-9; }
  const a = normTxt(val), b = normTxt(f.v);
  return a === b || (/^\d+$/.test(a) && a.replace(/^0+(?=\d)/,'') === b);
}
function grade(o, ans){
  switch (o.t){
    case 'sc': return ans != null && o.opts[ans].ok ? 1 : 0;
    case 'mc': { const sel = ans || []; return o.opts.every((op, i) => op.ok === sel.includes(i)) ? 1 : 0; }
    case 'match': return ans && o.left.every((_, i) => ans[i] === o.sol[i]) ? 1 : 0;
    case 'order': return ans && ans.length === o.items.length && ans.every((v, i) => v === i) ? 1 : 0;
    case 'in': return o.f.every((f, i) => fieldOk(f, (ans || [])[i])) ? 1 : 0;
    case 'open': return ans === 2 ? 1 : ans === 1 ? 0.5 : 0;
  }
  return 0;
}
function hasAnswer(o, ans){
  switch (o.t){
    case 'sc': return ans != null;
    case 'mc': return !!(ans && ans.length);
    case 'match': return !!(ans && o.left.every((_, i) => ans[i]));
    case 'order': return !!(ans && ans.length === o.items.length);
    case 'in': return !!(ans && ans.some(v => String(v ?? '').trim()));
    case 'open': return typeof ans === 'string' ? !!ans.trim() : ans != null;
  }
  return false;
}

/* ---------- Level & Ränge ---------- */
const levelOf = xp => Math.max(1, Math.floor((1 + Math.sqrt(1 + xp / 12.5)) / 2));
const xpFor = lv => 50 * (lv - 1) * lv;
function rankOf(lv){ let r = RANKS[0]; for (const k of RANKS) if (lv >= k[0]) r = k; return L==='en' ? r[2] : r[1]; }
function nextRank(lv){ const r = RANKS.find(k => k[0] > lv); return r ? {lv:r[0], name:L==='en'?r[2]:r[1]} : null; }
const comboMult = c => c >= 8 ? 3 : c >= 5 ? 2 : c >= 3 ? 1.5 : 1;
function addXp(n){
  const before = levelOf(st.xp); st.xp += Math.round(n); const after = levelOf(st.xp);
  if (after > before) toast(`${x('Level','Level')} ${after} · ${rankOf(after)}`, 'LEVEL UP');
}

/* ---------- Tage, Serie, Fälligkeit ---------- */
function streak(){
  let d = todayStr(), c = 0;
  if (!(st.days[d] && st.days[d].met)) d = addDays(d, -1);
  while (st.days[d] && st.days[d].met){ c++; d = addDays(d, -1); }
  return c;
}
const todayDay = () => st.days[todayStr()] || {n:0, c:0, ms:0};
function dueIds(filter){
  const t = todayStr();
  return Object.keys(st.cards).filter(id => QI[id] && st.cards[id].b > 0 && st.cards[id].due <= t && (!filter || filter(QI[id])));
}
function areaStats(a){
  const qs = Q.filter(q => q.a === a); let sum = 0, seen = 0, mast = 0, r = 0, w = 0, n = 0, ms = 0;
  const box = [0,0,0,0,0,0];
  for (const q of qs){ const c = st.cards[q.id]; if (c){ sum += c.b; seen++; if (c.b >= 3) mast++; r += c.r; w += c.w; n += c.n; ms += c.ms; box[c.b]++; } else box[0]++; }
  return {total:qs.length, seen, mast, mastery: qs.length ? sum / (qs.length * 5) : 0, rate: (r + w) ? r / (r + w) : null, n, avgMs: n ? ms / n : null, box};
}

/* ---------- Ergebnis verbuchen ---------- */
function record(o, score, ms, mode){
  const t = todayStr(); ms = Math.min(ms || 0, 300000);
  const c = st.cards[o.id] || (st.cards[o.id] = {b:0, due:null, n:0, r:0, w:0, ms:0});
  c.n++; c.ms += ms; c.last = t;
  if (score === 1){ c.b = Math.min(5, c.b + 1); c.due = addDays(t, INTERVALS[c.b - 1]); c.r++; }
  else if (score === 0.5){ c.b = Math.max(1, c.b); c.due = addDays(t, 1); c.r += 0.5; c.w += 0.5; }
  else { c.b = 1; c.due = addDays(t, 1); c.w++; const m = st.mistakes[o.id] || (st.mistakes[o.id] = {n:0}); m.n++; m.last = t; }
  if (score === 1 && mode === 'mistakes' && st.mistakes[o.id]){ delete st.mistakes[o.id]; st.stats.cleared++; }
  const d = st.days[t] || (st.days[t] = {n:0, c:0, ms:0});
  d.n++; d.c += score; d.ms += ms;
  if (!d.met && d.n >= st.settings.goal){ d.met = true; toast(x(`Tagesziel erreicht – Serie: ${streak()} Tag(e)`, `Daily goal reached – streak: ${streak()} day(s)`), x('ZIEL','GOAL')); }
  if (score === 1 && QI[o.id] && /^subnet/.test(QI[o.id].gen || '')) st.stats.subnetOk++;
  if (o.t === 'open') st.stats.openDone++;
  st.stats.bestStreak = Math.max(st.stats.bestStreak, streak());
}

/* ---------- Abzeichen ---------- */
const BADGES = [
  {id:'first',    de:['Erster Link','Erste Runde abgeschlossen'], en:['First link','First round completed'], t:() => st.rounds.length >= 1},
  {id:'perfect',  de:['Fehlerfrei','Runde mit 10 von 10 richtig'], en:['Flawless','Round with 10 out of 10 correct'], t:() => st.rounds.some(r => r.n >= 10 && r.c === r.n)},
  {id:'combo10',  de:['Vollduplex','Kombo von 10 richtigen Antworten in Folge'], en:['Full duplex','Combo of 10 correct answers in a row'], t:() => st.stats.bestCombo >= 10},
  {id:'streak3',  de:['Link up','Serie von 3 Tagen'], en:['Link up','3-day streak'], t:() => st.stats.bestStreak >= 3},
  {id:'streak7',  de:['Dauerbetrieb','Serie von 7 Tagen'], en:['Always on','7-day streak'], t:() => st.stats.bestStreak >= 7},
  {id:'streak30', de:['Five Nines','Serie von 30 Tagen'], en:['Five nines','30-day streak'], t:() => st.stats.bestStreak >= 30},
  {id:'allareas', de:['Voll gepatcht','In jedem Bereich mindestens eine Frage beantwortet'], en:['Fully patched','Answered at least one question in every topic'], t:() => AREAS.every(a => Q.some(q => q.a === a.id && st.cards[q.id]))},
  {id:'box5',     de:['Langzeitspeicher','10 Karten in Fach 5'], en:['Long-term storage','10 cards in box 5'], t:() => Object.values(st.cards).filter(c => c.b === 5).length >= 10},
  {id:'subnet20', de:['Subnetz-Profi','20 Subnetting-Aufgaben richtig gelöst'], en:['Subnet pro','20 subnetting tasks solved correctly'], t:() => st.stats.subnetOk >= 20},
  {id:'cleared10',de:['Aufgeräumt','10 Einträge im Fehlerbuch abgearbeitet'], en:['Cleaned up','10 mistake log entries resolved'], t:() => st.stats.cleared >= 10},
  {id:'open10',   de:['Redegewandt','10 offene Fachgesprächsfragen bearbeitet'], en:['Well spoken','10 open interview questions practised'], t:() => st.stats.openDone >= 10},
  {id:'exam50',   de:['Bestanden','Eine Prüfungssimulation mit mindestens 50 % bestanden'], en:['Passed','Passed an exam simulation with at least 50 %'], t:() => st.exams.some(e => e.pct >= 50)},
  {id:'exam92',   de:['Sehr gut','Eine Prüfungssimulation mit mindestens 92 %'], en:['Excellent','An exam simulation with at least 92 %'], t:() => st.exams.some(e => e.pct >= 92)},
  {id:'lvl12',    de:['Junior-Admin','Level 12 erreicht'], en:['Junior admin','Reached level 12'], t:() => levelOf(st.xp) >= 12},
  {id:'year1',    de:['Lehrjahr 1 gepatcht','Alle Fragen des 1. Lehrjahres mindestens in Fach 3'], en:['Year 1 patched','All year-1 questions in box 3 or higher'], t:() => Q.filter(q => AREA[q.a].y === 1).every(q => st.cards[q.id] && st.cards[q.id].b >= 3)}
];
function checkBadges(){
  for (const b of BADGES){
    if (!st.badges[b.id] && b.t()){ st.badges[b.id] = todayStr(); toast(`${b[L][0]} – ${b[L][1]}`, x('ABZEICHEN','BADGE')); }
  }
}

/* ---------- Theme & Sprache ---------- */
function applyTheme(){
  const t = st.settings.theme, root = document.documentElement;
  if (t === 'light' || t === 'dark') root.setAttribute('data-theme', t);
  else if (HOST_THEME) root.setAttribute('data-theme', HOST_THEME);
  else root.removeAttribute('data-theme');
}
function pickLang(){
  const qp = new URLSearchParams(location.search).get('lang');
  if (qp === 'de' || qp === 'en') st.settings.lang = qp;
  L = st.settings.lang || ((navigator.language || 'de').toLowerCase().startsWith('de') ? 'de' : 'en');
  document.documentElement.lang = L;
}

/* ---------- Update-Prüfung ---------- */
function cmpVer(a, b){ const pa = String(a).split('.').map(Number), pb = String(b).split('.').map(Number); for (let i = 0; i < 3; i++){ if ((pa[i]||0) !== (pb[i]||0)) return (pa[i]||0) - (pb[i]||0); } return 0; }
const isHosted = () => /^https?:$/.test(location.protocol);
function updateSource(){ return st.settings.updateUrl || (isHosted() ? new URL('version.json', location.href).href : ''); }
let pendingUpdate = null;
async function checkUpdate(manual){
  const src = updateSource();
  if (!src){ if (manual) toast(x('Die App läuft als lokale Datei. Trage in den Einstellungen eine Update-Adresse ein.','The app runs as a local file. Enter an update address in the settings.')); return; }
  try {
    const r = await fetch(src + (src.includes('?') ? '&' : '?') + 't=' + Date.now(), {cache:'no-store'});
    const j = await r.json(); st.lastCheck = Date.now(); save();
    if (cmpVer(j.version, APP_VERSION) > 0){ pendingUpdate = {j, src}; showUpdate(); }
    else if (manual) toast(x(`Du nutzt die neueste Version (${APP_VERSION}).`, `You are on the latest version (${APP_VERSION}).`));
  } catch(e){ if (manual) toast(x('Update-Prüfung fehlgeschlagen – keine Verbindung oder Adresse falsch.','Update check failed – no connection or wrong address.')); }
}
function busy(){ return !!(session || st.activeExam); }
function showUpdate(){
  if (!pendingUpdate) return;
  const {j, src} = pendingUpdate, notes = (j.notes && j.notes[L]) || [];
  const sameOrigin = isHosted() && new URL(src, location.href).origin === location.origin;
  const el = document.getElementById('banner');
  el.innerHTML = `<div class="banner-in"><span class="led warn blink"></span><b>${x('Update','Update')} v${esc(j.version)}</b><span class="muted">${esc(notes[0] || '')}</span>
    ${sameOrigin ? `<button class="btn small" id="updNow">${x('Jetzt aktualisieren','Update now')}</button>`
                 : `<a class="btn small" href="${esc(new URL(j.file || 'index.html', src).href)}" target="_blank" rel="noopener">${x('Neue Version öffnen','Open new version')}</a>`}</div>`;
  el.hidden = false;
  const b = document.getElementById('updNow'); if (b) b.onclick = applyUpdate;
  if (sameOrigin && st.settings.autoUpdate && !busy()){ toast(x(`Aktualisiere auf v${j.version} …`, `Updating to v${j.version} …`)); setTimeout(applyUpdate, 1800); }
}
async function applyUpdate(){
  save();
  try { if (navigator.serviceWorker){ const reg = await navigator.serviceWorker.getRegistration(); if (reg) await reg.update(); } } catch(e){}
  const u = new URL(location.href); u.searchParams.set('v', pendingUpdate ? pendingUpdate.j.version : Date.now()); location.replace(u.href);
}
function whatsNew(){
  const prev = st.lastVersion; st.lastVersion = APP_VERSION; save();
  if (!prev || cmpVer(APP_VERSION, prev) <= 0) return;
  const items = CHANGELOG.filter(c => cmpVer(c.v, prev) > 0);
  if (!items.length) return;
  dialog(x(`Aktualisiert auf v${APP_VERSION}`, `Updated to v${APP_VERSION}`), items.map(c => `<h3 class="mono">v${c.v}</h3><ul>${c[L].map(n => `<li>${esc(n)}</li>`).join('')}</ul>`).join(''));
}

/* ---------- Backup ---------- */
function exportJSON(){ return JSON.stringify({app:'patchfeld', version:APP_VERSION, exported:new Date().toISOString(), data:st}, null, 1); }
function download(){
  try {
    const blob = new Blob([exportJSON()], {type:'application/json'}), a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = `patchfeld-backup-${todayStr()}.json`;
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  } catch(e){ toast(x('Download blockiert – nutze „Kopieren“.','Download blocked – use "Copy".')); }
}
function importJSON(text){
  let j; try { j = JSON.parse(text); } catch(e){ toast(x('Das ist kein gültiges JSON.','This is not valid JSON.')); return false; }
  const data = j && j.data ? j.data : j;
  if (!data || typeof data.cards !== 'object' || !data.settings){ toast(x('Die Datei enthält keinen Patchfeld-Spielstand.','The file does not contain Patchfeld progress.')); return false; }
  if (!confirm(x('Aktuellen Fortschritt durch den importierten ersetzen?','Replace current progress with the imported one?'))) return false;
  st = hydrate(data); st.lastVersion = APP_VERSION; save(); applyTheme(); pickLang(); toast(x('Fortschritt importiert.','Progress imported.')); return true;
}

/* ---------- UI-Helfer ---------- */
function toast(msg, tape){
  const el = document.createElement('div'); el.className = 'toast pop';
  el.innerHTML = (tape ? `<span class="tape">${esc(tape)}</span>` : '') + `<span>${esc(msg)}</span>`;
  const box = document.getElementById('toasts'); box.appendChild(el);
  setTimeout(() => el.remove(), 3600);
}
function dialog(title, html){
  const d = document.createElement('dialog');
  d.innerHTML = `<div class="stack"><h2>${esc(title)}</h2><div>${html}</div><div class="row" style="justify-content:flex-end"><button class="btn" id="dlgOk">OK</button></div></div>`;
  document.body.appendChild(d); d.querySelector('#dlgOk').onclick = () => { d.close(); d.remove(); };
  try { d.showModal(); } catch(e){ d.setAttribute('open',''); }
}
</script>

<script>

];

function go(v, c){

  if (v !== 'quiz') session = null;

}
function renderHeader(){
  document.getElementById('ver').textContent = 'v' + APP_VERSION;

function portHTML(a, i){

    <span class="meter"><i style="width:${Math.round(s.mastery * 100)}%"></i></span>
    <span class="nm">${esc(areaName(a.id))}</span></button>`;
}
function patchPanel(y){
  const as = AREAS.filter(a => a.y === y), ex = y === 1 ? 'AP 1' : y === 2 ? 'AP 1 · AP 2' : 'AP 2';
  return `<div class="pp"><div class="pp-label"><span>${x(`${y}. Lehrjahr`, `Year ${y}`)}</span><span>${ex}</span></div>

}
function examTags(a){ return a.ex.map(e => `<span class="tag ${e === 'AP1' ? 'ap1' : e === 'AP2' ? 'ap2' : ''}">${e === 'WiSo' ? 'WiSo' : e.replace('AP', 'AP ')}</span>`).join(' '); }
function boxBar(s){
  const t = s.total || 1, seg = (n, cls) => n ? `<i class="${cls}" style="width:${n / t * 100}%"></i>` : '';
  return `<div class="bar" role="img" aria-label="${x('Karteikasten','Leitner box')}: ${s.box.join('/')}">${seg(s.box[5], 'b5')}${seg(s.box[3] + s.box[4], 'b34')}${seg(s.box[1] + s.box[2], 'b12')}</div>`;
}
const pct = v => v == null ? '–' : Math.round(v * 100) + ' %';

function suggestion(){
  const due = dueIds().length, mist = Object.keys(st.mistakes).filter(id => QI[id]).length;
  const exd = st.settings.examDate ? diffDays(todayStr(), st.settings.examDate) : null, et = st.settings.examType;
  if (due >= 5) return {w:'bl', title:x(`${due} Karten sind fällig`, `${due} cards are due`), text:x('Wiederholen sichert, was du schon kannst – der Karteikasten legt sie genau rechtzeitig vor.','Reviewing locks in what you know – the Leitner box brings cards back just in time.'), btn:x('Wiederholung starten','Start review'), act:'review'};
  if (exd != null && exd >= 0 && exd <= 30 && !st.exams.some(e => e.type === et && diffDays(e.date, todayStr()) <= 7))
    return {w:'or', title:x(`Noch ${exd} Tage bis zur ${et.replace('AP','AP ')}`, `${exd} days left until ${et.replace('AP','AP ')}`), text:x('Mach eine Prüfungssimulation unter Zeitdruck und sieh, wo du stehst.','Take a timed exam simulation and see where you stand.'), btn:x('Simulation starten','Start simulation'), act:'exam', data:`data-type="${et}"`};
  if (mist >= 5) return {w:'br', title:x(`${mist} Fragen im Fehlerbuch`, `${mist} questions in your mistake log`), text:x('Arbeite sie gezielt ab – richtig beantwortete Fragen verschwinden aus der Liste.','Work through them – correctly answered questions leave the list.'), btn:x('Fehlerbuch üben','Practise mistakes'), act:'mistakes'};
  const cand = AREAS.filter(a => a.y <= st.settings.year).map(a => ({a, s:areaStats(a.id)})).sort((p, q) => (p.s.mastery - q.s.mastery) || (q.a.y - p.a.y));
  const c = cand[0];
  if (c && c.s.mastery < 0.6) return {area:c.a.id, w:c.a.w, s:c.a.s, title:areaName(c.a.id), text:c.s.seen ? x(`Dein schwächster Bereich im Lernpfad: ${pct(c.s.mastery)} sicher.`, `Your weakest topic on the path: ${pct(c.s.mastery)} mastered.`) : x('Noch nicht begonnen – starte mit einer Runde.','Not started yet – begin with a round.'), btn:x('Runde starten','Start round'), act:'round', data:`data-area="${c.a.id}"`};
  if (due) return {w:'bl', title:x(`${due} Karten sind fällig`, `${due} cards are due`), text:x('Kurze Wiederholung für heute.','A short review for today.'), btn:x('Wiederholung starten','Start review'), act:'review'};
  return {w:'gr', title:x('Gemischte Runde','Mixed round'), text:x('Alles bis zu deinem Lehrjahr ist gut im Griff – misch die Themen durch oder schau ins nächste Lehrjahr.','Everything up to your year is in good shape – mix topics or look ahead to the next year.'), btn:x('Runde starten','Start round'), act:'round', data:`data-year="${Math.min(3, st.settings.year)}"`};
}
function recommendation(){
  const ex = EXAMS[st.settings.examType], qs = Q.filter(q => ex.years[AREA[q.a].y]);
  const left = qs.reduce((s, q) => s + Math.max(0, 3 - ((st.cards[q.id] || {}).b || 0)), 0);
  const days = Math.max(1, diffDays(todayStr(), st.settings.examDate));
  return {days, perDay: Math.max(5, Math.ceil(left / days) + dueIds(q => ex.years[AREA[q.a].y]).length), mast: qs.filter(q => (st.cards[q.id] || {}).b >= 3).length, total: qs.length};
}
