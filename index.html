<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Patchfeld</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<meta name="app-version" content="0.0.9">
<meta name="theme-color" content="#1b1f24">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* ===== Tokens ===== */
:root{
  --ground:#e4e8eb; --panel:#f6f7f8; --panel-2:#eceff1; --sunk:#dde2e6;
  --ink:#14181c; --ink-2:#4b545d; --ink-3:#737d86; --line:#c7ced4; --line-2:#d8dde1;
  --rail:#1b1f24; --rail-2:#262b31; --rail-ink:#e3e7ea; --rail-ink-2:#9aa4ad;
  --btn:#1b1f24; --btn-ink:#f2f4f5;
  --ok:#1f9d45; --ok-bg:#e3f3e7; --warn:#c9830c; --warn-bg:#faf0dc; --err:#c8322a; --err-bg:#f8e3e1;
  --led-off:#aab2b9; --focus:#e08a00;
  --w-or:#ec7a1c; --w-gr:#2e9a4d; --w-bl:#2d62c6; --w-br:#7a4a28; --w-white:#f3f2ec;
  --port:#0d0f11; --contact:#c9a54a;
  --f-label:"Barlow Condensed","Arial Narrow","Roboto Condensed",sans-serif;
  --f-body:"IBM Plex Sans","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --f-mono:"IBM Plex Mono",Consolas,"SFMono-Regular",Menlo,monospace;
  --r:4px; --shadow:0 1px 0 rgba(255,255,255,.6) inset,0 1px 2px rgba(20,24,28,.08);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0e1114; --panel:#161a1e; --panel-2:#1c2126; --sunk:#0b0d10;
    --ink:#dde3e8; --ink-2:#9ba6b0; --ink-3:#6f7a84; --line:#2c343b; --line-2:#232a30;
    --rail:#07090b; --rail-2:#12161a; --rail-ink:#dde3e8; --rail-ink-2:#7f8a94;
    --btn:#d9dfe4; --btn-ink:#0e1114;
    --ok:#3ccf66; --ok-bg:#12281a; --warn:#f0a92a; --warn-bg:#2b2310; --err:#f0584e; --err-bg:#2e1614;
    --led-off:#39424a; --focus:#f0a92a; --w-white:#d9d8d2; --port:#050607;
    --shadow:0 1px 0 rgba(255,255,255,.03) inset,0 1px 2px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --ground:#0e1114; --panel:#161a1e; --panel-2:#1c2126; --sunk:#0b0d10;
  --ink:#dde3e8; --ink-2:#9ba6b0; --ink-3:#6f7a84; --line:#2c343b; --line-2:#232a30;
  --rail:#07090b; --rail-2:#12161a; --rail-ink:#dde3e8; --rail-ink-2:#7f8a94;
  --btn:#d9dfe4; --btn-ink:#0e1114;
  --ok:#3ccf66; --ok-bg:#12281a; --warn:#f0a92a; --warn-bg:#2b2310; --err:#f0584e; --err-bg:#2e1614;
  --led-off:#39424a; --focus:#f0a92a; --w-white:#d9d8d2; --port:#050607;
  --shadow:0 1px 0 rgba(255,255,255,.03) inset,0 1px 2px rgba(0,0,0,.4);
}

/* ===== Base ===== */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--ground);color:var(--ink);font:15px/1.55 var(--f-body);margin:0;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
h1,h2,h3{font-family:var(--f-label);font-weight:600;line-height:1.1;margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:2rem} h2{font-size:1.45rem} h3{font-size:1.15rem}
p{margin:0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.label{font-family:var(--f-label);font-weight:600;text-transform:uppercase;letter-spacing:.09em;font-size:.78rem;color:var(--ink-3)}
.muted{color:var(--ink-2)}
.small{font-size:.86rem}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* ===== Rack header ===== */
.rack{background:var(--rail);color:var(--rail-ink);position:sticky;top:0;z-index:20;border-bottom:1px solid #000}
.rack-in{max-width:960px;margin:0 auto;padding-inline:16px;display:flex;align-items:center;gap:16px;min-height:52px}
.screw{width:9px;height:9px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#6c747c,#2a2f35 70%);box-shadow:0 0 0 1px #000;flex:none;position:relative}
.screw::after{content:"";position:absolute;left:1px;right:1px;top:4px;height:1px;background:#15181b}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none}
.brand b{font-family:var(--f-label);font-weight:700;letter-spacing:.22em;font-size:1.15rem}
.brand .ver{font-family:var(--f-mono);font-size:.7rem;color:var(--rail-ink-2)}
.stat-leds{display:flex;gap:14px;margin-left:auto;align-items:center}
.sled{display:flex;align-items:center;gap:6px;font-family:var(--f-label);letter-spacing:.08em;text-transform:uppercase;font-size:.78rem;color:var(--rail-ink-2);background:none;border:0;padding:4px 2px}
.sled b{font-family:var(--f-mono);font-weight:500;color:var(--rail-ink);font-size:.85rem;letter-spacing:0}
.led{width:8px;height:8px;border-radius:50%;background:var(--led-off);flex:none;display:inline-block}
.led.ok{background:var(--ok);box-shadow:0 0 6px var(--ok)}
.led.warn{background:var(--warn);box-shadow:0 0 6px var(--warn)}
.led.err{background:var(--err);box-shadow:0 0 6px var(--err)}
.led.blink{animation:blink 1.2s steps(2,start) infinite}
@keyframes blink{to{opacity:.25}}

/* ===== Nav ===== */
.nav{display:flex;gap:2px;background:var(--rail-2);border-bottom:1px solid var(--line)}
.nav-in{max-width:960px;margin:0 auto;padding-inline:16px;display:flex;gap:2px;width:100%}
.nav button{flex:1;background:none;border:0;color:var(--rail-ink-2);font-family:var(--f-label);font-weight:600;text-transform:uppercase;letter-spacing:.1em;font-size:.82rem;padding:10px 6px;border-bottom:2px solid transparent;display:flex;flex-direction:column;align-items:center;gap:2px}
.nav button[aria-current="page"]{color:var(--rail-ink);border-bottom-color:var(--w-or)}
.nav svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.6}
@media (max-width:640px){
  .nav{position:fixed;bottom:0;left:0;right:0;z-index:30;border-top:1px solid #000;border-bottom:0;padding-bottom:env(safe-area-inset-bottom)}
  .nav-in{padding-inline:4px}
  .nav button{font-size:.72rem;border-bottom:0;border-top:2px solid transparent}
  .nav button[aria-current="page"]{border-top-color:var(--w-or)}
  main{padding-bottom:84px!important}
  .stat-leds .sled span.t{display:none}
  .brand .ver{display:none}
}
@media (min-width:641px){.nav svg{display:none}}

main{max-width:960px;margin:0 auto;padding-inline:16px;padding-block:20px 48px;display:flex;flex-direction:column;gap:18px}

/* ===== Surfaces ===== */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:16px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.hr{height:1px;background:var(--line-2);border:0;margin:0}

/* ===== Buttons ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:3px;border:1px solid var(--btn);background:var(--btn);color:var(--btn-ink);padding:10px 16px;font-weight:600;font-size:.95rem;min-height:44px;text-decoration:none}
.btn:hover{filter:brightness(1.15)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{background:var(--panel-2);filter:none}
.btn.small{min-height:34px;padding:6px 12px;font-size:.86rem}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.btn .k{font-family:var(--f-mono);font-size:.72rem;opacity:.7;border:1px solid currentColor;border-radius:2px;padding:0 4px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:3px;overflow:hidden;flex-wrap:wrap}
.seg button{background:var(--panel);border:0;border-right:1px solid var(--line);padding:8px 12px;min-height:38px;font-size:.88rem}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--btn);color:var(--btn-ink)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;border:1px solid var(--line);border-radius:2px;padding:2px 7px;background:var(--panel-2);white-space:nowrap}
.tag{font-family:var(--f-mono);font-size:.7rem;border:1px solid var(--line);padding:1px 5px;border-radius:2px;color:var(--ink-2);white-space:nowrap}
.tag.ap1{border-color:var(--w-bl);color:var(--w-bl)}
.tag.ap2{border-color:var(--w-or);color:var(--w-or)}
input[type=text],input[type=number],input[type=date],input[type=search],input[type=url],select,textarea{background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:9px 10px;min-height:42px;width:100%}
textarea{min-height:110px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--ink-2)}
.field{display:flex;flex-direction:column;gap:5px}

/* ===== Wires (T568B colors) ===== */
.wire{display:inline-block;width:14px;height:14px;border-radius:2px;flex:none;background:var(--wc);box-shadow:0 0 0 1px rgba(0,0,0,.25) inset}
.wire.s{background:repeating-linear-gradient(135deg,var(--wc) 0 3px,var(--w-white) 3px 7px)}
.wc-or{--wc:var(--w-or)} .wc-gr{--wc:var(--w-gr)} .wc-bl{--wc:var(--w-bl)} .wc-br{--wc:var(--w-br)}

/* ===== Patch panel ===== */
.pp{background:linear-gradient(#2a2f35,#1d2126);border-radius:3px;padding:10px 12px;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;border:1px solid #000;color:#dfe4e8}
.pp .ear{display:flex;flex-direction:column;justify-content:space-between;height:100%;gap:22px;padding-block:4px}
.pp-label{font-family:var(--f-label);font-weight:600;letter-spacing:.12em;font-size:.72rem;color:#9aa4ad;text-transform:uppercase;grid-column:1/-1;display:flex;justify-content:space-between;gap:8px;margin-bottom:-4px}
.ports{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.port{background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;gap:4px;color:#dfe4e8;min-width:0}
.port .pl{display:flex;align-items:center;gap:5px;font-family:var(--f-mono);font-size:.68rem;color:#aab3bb}
.port .jack{width:100%;max-width:58px;aspect-ratio:1/.82;background:var(--port);clip-path:polygon(0 22%,28% 22%,28% 0,72% 0,72% 22%,100% 22%,100% 100%,0 100%);position:relative;border-radius:2px}
.port .jack::before{content:"";position:absolute;left:18%;right:18%;top:30%;height:14%;background:repeating-linear-gradient(90deg,var(--contact) 0 2px,transparent 2px 5px);opacity:.85}
.port .plug{position:absolute;left:10%;right:10%;bottom:0;height:62%;background:var(--wc);border-radius:2px 2px 0 0}
.port .plug.s{background:repeating-linear-gradient(135deg,var(--wc) 0 4px,var(--w-white) 4px 9px)}
.port .meter{width:100%;max-width:58px;height:3px;background:#0b0d0f;border-radius:1px;overflow:hidden}
.port .meter i{display:block;height:100%;background:#cfd6dc}
.port .nm{font-size:.7rem;line-height:1.15;text-align:center;color:#c3cbd2;min-height:2.3em;overflow-wrap:anywhere}
.port:hover .jack,.port:focus-visible .jack{outline:1px solid #e0a030}
@media (max-width:520px){.port .nm{display:none}.ports{gap:6px}.pp{padding:8px;gap:8px}}

/* ===== LED bar (daily goal) ===== */
.ledbar{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:3px;height:12px}
.ledbar i{background:var(--sunk);border-radius:1px}
.ledbar i.on{background:var(--ok)}
.ledbar i.over{background:var(--w-bl)}
.big{font-family:var(--f-label);font-weight:600;font-size:2.4rem;line-height:1}
.xpbar{height:6px;background:var(--sunk);border-radius:1px;overflow:hidden}
.xpbar i{display:block;height:100%;background:var(--ink)}

/* ===== Suggestion ===== */
.suggest{border:1px solid var(--ink);background:var(--panel);border-radius:var(--r);padding:16px;display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center}
.suggest .wire{width:10px;height:48px}
@media (max-width:560px){.suggest{grid-template-columns:auto 1fr}.suggest .btn{grid-column:1/-1}}

/* ===== Path list ===== */
.area-row{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line-2)}
.area-row:first-child{border-top:0}
.area-row .bar{height:6px;background:var(--sunk);border-radius:1px;overflow:hidden;display:flex}
.area-row .bar i{display:block;height:100%}
.b5{background:var(--ok)} .b34{background:color-mix(in srgb,var(--ok) 45%,var(--sunk))} .b12{background:var(--warn)}

/* ===== Quiz ===== */
.qhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.qprog{flex:1;min-width:120px;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:3px}
.qprog i{height:5px;background:var(--sunk);border-radius:1px}
.qprog i.ok{background:var(--ok)} .qprog i.err{background:var(--err)} .qprog i.part{background:var(--warn)} .qprog i.cur{background:var(--ink-2)}
.lives{display:flex;gap:5px;align-items:center}
.lives .led{width:11px;height:11px}
.combo{font-family:var(--f-mono);font-size:.85rem;color:var(--ink-2)}
.combo b{color:var(--ink)}
.qcard{padding:18px;display:flex;flex-direction:column;gap:14px}
.sit{border-left:3px solid var(--line);padding:2px 0 2px 12px;color:var(--ink-2);max-width:70ch}
.qtext{font-size:1.08rem;font-weight:600;max-width:70ch}
pre.code{font-family:var(--f-mono);font-size:.85rem;background:var(--sunk);border:1px solid var(--line-2);border-radius:3px;padding:10px 12px;overflow-x:auto;margin:0;white-space:pre}
.qtable{overflow-x:auto}
.qtable table{border-collapse:collapse;font-size:.88rem}
.qtable th,.qtable td{border:1px solid var(--line);padding:4px 10px;text-align:left}
.qtable th{background:var(--panel-2);font-weight:600}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:11px 12px;min-height:46px;width:100%}
.opt:hover{border-color:var(--ink-2)}
.opt .kk{font-family:var(--f-mono);font-size:.78rem;border:1px solid var(--line);border-radius:2px;min-width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;color:var(--ink-2);background:var(--panel-2)}
.opt[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink) inset}
.opt[aria-pressed="true"] .kk{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.opt.right{border-color:var(--ok);background:var(--ok-bg);box-shadow:none}
.opt.wrong{border-color:var(--err);background:var(--err-bg);box-shadow:none}
.opt.missed{border-color:var(--ok);border-style:dashed}
.opt[disabled]{cursor:default}
.opt .ordn{font-family:var(--f-mono);font-weight:600}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line-2)}
.mrow:first-child{border-top:0}
.mrow.right select{border-color:var(--ok);background:var(--ok-bg)}
.mrow.wrong select{border-color:var(--err);background:var(--err-bg)}
.mrow .sol{grid-column:2;font-size:.82rem;color:var(--ok)}
@media (max-width:520px){.mrow{grid-template-columns:1fr}.mrow .sol{grid-column:1}}
.infields{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.inwrap{display:flex;align-items:center;gap:8px}
.inwrap .u{font-family:var(--f-mono);font-size:.85rem;color:var(--ink-2);white-space:nowrap}
.field.right input{border-color:var(--ok);background:var(--ok-bg)}
.field.wrong input{border-color:var(--err);background:var(--err-bg)}
.fb{border-radius:3px;padding:14px;display:flex;flex-direction:column;gap:10px;border:1px solid var(--line)}
.fb.ok{border-color:var(--ok);background:var(--ok-bg)}
.fb.err{border-color:var(--err);background:var(--err-bg)}
.fb.part{border-color:var(--warn);background:var(--warn-bg)}
.fb .verdict{display:flex;align-items:center;gap:8px;font-family:var(--f-label);font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.fb p{max-width:72ch}
.fb .why b{font-weight:600}
.model{white-space:pre-line;background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:12px;max-width:72ch}
.keys{display:flex;flex-direction:column;gap:6px}
.keys label{display:flex;gap:8px;align-items:flex-start}
.qfoot{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;align-items:center}
.qfoot .hint{margin-right:auto;font-size:.8rem;color:var(--ink-3)}
@media (max-width:640px){.qfoot .hint{display:none}}
.pop{animation:pop .35s ease-out}
@keyframes pop{from{transform:scale(.97);opacity:.4}to{transform:none;opacity:1}}

/* ===== Exam ===== */
.timer{font-family:var(--f-mono);font-size:1.1rem;font-weight:600;padding:4px 10px;border:1px solid var(--line);border-radius:3px;background:var(--panel)}
.timer.low{color:var(--err);border-color:var(--err)}
.qnav{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:4px}
.qnav button{height:32px;border:1px solid var(--line);background:var(--panel);font-family:var(--f-mono);font-size:.75rem;border-radius:2px;position:relative}
.qnav button.done{background:var(--sunk);border-color:var(--ink-3)}
.qnav button.flag::after{content:"";position:absolute;top:2px;right:2px;width:6px;height:6px;border-radius:50%;background:var(--warn)}
.qnav button[aria-current="true"]{outline:2px solid var(--ink);outline-offset:-1px}
.qnav button.ok{background:var(--ok-bg);border-color:var(--ok)} .qnav button.err{background:var(--err-bg);border-color:var(--err)}

/* ===== Tables & charts ===== */
.tbl{width:100%;border-collapse:collapse;font-size:.9rem}
.tbl th{font-family:var(--f-label);text-transform:uppercase;letter-spacing:.08em;font-size:.74rem;color:var(--ink-3);font-weight:600;text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
.tbl td{padding:7px 8px;border-bottom:1px solid var(--line-2);vertical-align:middle}
.tbl td.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl .hb{height:8px;background:var(--sunk);border-radius:1px;min-width:60px;overflow:hidden}
.tbl .hb i{display:block;height:100%;background:var(--ink-2);border-radius:0 4px 4px 0}
.scroll-x{overflow-x:auto}
.chart svg{display:block;width:100%;height:auto}
.chart .ax{fill:var(--ink-3);font:11px var(--f-mono)}
.chart .grid{stroke:var(--line-2);stroke-width:1}
.chart .bar{fill:var(--ink-3)}
.chart .bar.last{fill:var(--ink)}
.chart .goal{stroke:var(--w-or);stroke-width:1.5;stroke-dasharray:4 3}
.chart .hit{fill:transparent}
.chart .hit:hover+.bar,.chart g:hover .bar{fill:var(--w-bl)}
.tip{position:fixed;pointer-events:none;background:var(--rail);color:var(--rail-ink);font:12px var(--f-mono);padding:5px 8px;border-radius:3px;z-index:50}
.boxes{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.boxes div{border:1px solid var(--line);border-radius:2px;padding:8px 6px;text-align:center;background:var(--panel-2)}
.boxes b{display:block;font-family:var(--f-mono);font-size:1.2rem}
.boxes span{font-size:.72rem;color:var(--ink-3);font-family:var(--f-label);text-transform:uppercase;letter-spacing:.06em}

/* ===== Badges ===== */
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.badge{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;padding:12px;border:1px solid var(--line);border-radius:3px;background:var(--panel)}
.badge.off{opacity:.6}
.badge .tape{font-family:var(--f-label);font-weight:700;letter-spacing:.1em;text-transform:uppercase;background:var(--rail);color:var(--rail-ink);padding:1px 6px;border-radius:2px;font-size:.8rem;display:inline-block}

/* ===== Glossary / cards ===== */
.gl-item{padding:10px 0;border-top:1px solid var(--line-2);display:grid;grid-template-columns:auto 1fr;gap:4px 12px}
.gl-item dt{font-family:var(--f-mono);font-weight:600}
.gl-item dd{margin:0}
.gl-item .lf{color:var(--ink-2);font-size:.86rem}
.flash{min-height:260px;cursor:pointer}
.flash .back{border-top:1px dashed var(--line);padding-top:12px}

/* ===== Toasts & banner ===== */
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center;width:min(92vw,440px)}
@media (max-width:640px){.toasts{bottom:86px}}
.toast{background:var(--rail);color:var(--rail-ink);border-radius:3px;padding:10px 14px;display:flex;gap:10px;align-items:center;box-shadow:0 4px 18px rgba(0,0,0,.25);font-size:.9rem;width:100%}
.toast .tape{font-family:var(--f-label);letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--w-or)}
.banner{background:var(--warn-bg);border-bottom:1px solid var(--warn);color:var(--ink)}
.banner-in{max-width:960px;margin:0 auto;padding-inline:16px;padding-block:8px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:.9rem}
.empty{padding:22px;text-align:center;color:var(--ink-2);border:1px dashed var(--line);border-radius:3px}
dialog{border:1px solid var(--line);border-radius:4px;background:var(--panel);color:var(--ink);max-width:min(560px,92vw);padding:18px}
dialog::backdrop{background:rgba(10,12,14,.55)}
</style>
</head>

/* Bereiche: y = Lehrjahr, lf = Lernfeld (Rahmenlehrplan 2020), ex = Prüfungsbezug,
   w = Aderfarbe (T568B), s = gestreift (weiß-farbig) */

  {id:'bs',      y:1, lf:'LF 2/3',  ex:['AP1'],       w:'gr', s:0, de:'Betriebssysteme',                en:'Operating systems'},
  {id:'net',     y:1, lf:'LF 3',    ex:['AP1'],       w:'bl', s:0, de:'Netzwerkgrundlagen',             en:'Network fundamentals'},
  {id:'kfm',     y:1, lf:'LF 1/2',  ex:['AP1','WiSo'],w:'br', s:0, de:'Kaufmännische Grundlagen',       en:'Business basics'},
  {id:'ergo',    y:1, lf:'LF 1/6',  ex:['AP1'],       w:'or', s:1, de:'Arbeitsschutz & Support',        en:'Safety & support'},
  {id:'dienste', y:2, lf:'LF 9',    ex:['AP1','AP2'], w:'or', s:0, de:'Netzwerkdienste & Routing',      en:'Network services & routing'},

  {id:'linux',   y:2, lf:'LF 9/10b',ex:['AP1','AP2'], w:'bl', s:0, de:'Linux-Administration',           en:'Linux administration'},
  {id:'speicher',y:2, lf:'LF 8/9',  ex:['AP1','AP2'], w:'br', s:0, de:'Speicher & Virtualisierung',     en:'Storage & virtualisation'},
  {id:'sec',     y:2, lf:'LF 4/11b',ex:['AP1','AP2'], w:'or', s:1, de:'IT-Sicherheit',                  en:'IT security'},
  {id:'ds',      y:2, lf:'LF 4',    ex:['AP1','AP2'], w:'gr', s:1, de:'Datenschutz',                    en:'Data protection'},
  {id:'sql',     y:2, lf:'LF 5/8',  ex:['AP1','AP2'], w:'bl', s:1, de:'Skripting & SQL',                en:'Scripting & SQL'},

const AREA = Object.fromEntries(AREAS.map(a => [a.id, a]));
const WIRE_NAME = {de:{or:'orange',gr:'grün',bl:'blau',br:'braun'}, en:{or:'orange',gr:'green',bl:'blue',br:'brown'}};

/* Fragen-Katalog. Jede Frage: {id, a (Bereich), t (Typ), ... , de:{...}, en:{...}}
   Typen: sc (Single Choice), mc (Mehrfachauswahl), in (Eingabe/Rechnen), match (Zuordnung),
          order (Reihenfolge), open (offene Frage mit Musterlösung).
   Details: siehe docs/FRAGENFORMAT.md */
const Q = [];

/* ---------- Hilfsfunktionen ---------- */
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
function shuffle(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
const r2 = x => Math.round(x * 100) / 100;
function fmt(n, dec, L){ return Number(n).toLocaleString(L==='en'?'en-US':'de-DE',{minimumFractionDigits:dec??0,maximumFractionDigits:dec??0}); }
const eur = (n, L) => L==='en' ? '€' + fmt(n,2,L) : fmt(n,2,L) + ' €';
const ip2s = n => [n>>>24, (n>>>16)&255, (n>>>8)&255, n&255].join('.');
const s2ip = s => s.split('.').reduce((a,o)=> (a*256) + (+o), 0) >>> 0;
const maskOf = p => p===0 ? 0 : (0xFFFFFFFF << (32-p)) >>> 0;
const tx = (L, de, en) => L==='en' ? en : de;

/* ---------- Generatoren (liefern konkrete, zufällige Aufgaben) ---------- */
const GEN = {
  /* Subnetting: Netz-, Broadcastadresse und Hostanzahl zu einer Host-IP */
  subnetHost(L){
    let ip, p, net, bc, m;
    do {
      p = rnd(19, 29);
      const k = pick(['10','172','192']);
      ip = k==='10' ? s2ip(`10.${rnd(0,255)}.${rnd(0,255)}.${rnd(1,254)}`)
         : k==='172' ? s2ip(`172.${rnd(16,31)}.${rnd(0,255)}.${rnd(1,254)}`)
         : s2ip(`192.168.${rnd(0,255)}.${rnd(1,254)}`);
      m = maskOf(p); net = (ip & m) >>> 0; bc = (net | (~m >>> 0)) >>> 0;
    } while (ip === net || ip === bc);
    const h = 32 - p, hosts = 2**h - 2;
    const oi = Math.floor(p / 8), blk = 2 ** (8 - (p % 8));
    const oct = (ip >>> (24 - 8*oi)) & 255, start = oct - (oct % blk);
    const expl = p % 8 === 0 ? '' : tx(L,
      ` Die Blockgröße im ${oi+1}. Oktett ist 256 − ${256-blk} = ${blk}. ${oct} liegt im Block ${start}–${start+blk-1}.`,
      ` The block size in octet ${oi+1} is 256 − ${256-blk} = ${blk}. ${oct} lies in the block ${start}–${start+blk-1}.`);
    return { t:'in',
      s: tx(L, `Ein Kunde meldet, dass ein neu eingerichteter Drucker mit der IP-Adresse ${ip2s(ip)}/${p} nicht erreichbar ist. Sie prüfen die Adressierung.`,
               `A customer reports that a newly configured printer with the IP address ${ip2s(ip)}/${p} cannot be reached. You check the addressing.`),
      q: tx(L, 'Bestimmen Sie Netzadresse, Broadcastadresse und die Anzahl nutzbarer Hostadressen.', 'Determine the network address, the broadcast address and the number of usable host addresses.'),
      f: [ {l:tx(L,'Netzadresse','Network address'), v:ip2s(net)}, {l:tx(L,'Broadcastadresse','Broadcast address'), v:ip2s(bc)}, {l:tx(L,'Nutzbare Hosts','Usable hosts'), v:hosts, tol:0} ],
      e: tx(L, `/${p} entspricht der Maske ${ip2s(m)}.${expl} Netz ${ip2s(net)}, Broadcast ${ip2s(bc)}. Hosts: 2^${h} − 2 = ${fmt(hosts,0,L)}.`,
               `/${p} corresponds to the mask ${ip2s(m)}.${expl} Network ${ip2s(net)}, broadcast ${ip2s(bc)}. Hosts: 2^${h} − 2 = ${fmt(hosts,0,L)}.`),
      n: tx(L, 'Häufigster Fehler: 2^h statt 2^h − 2 rechnen – Netz- und Broadcastadresse sind nicht an Hosts vergebbar.', 'Most common mistake: calculating 2^h instead of 2^h − 2 – the network and broadcast addresses cannot be assigned to hosts.')
    };
  },
  /* Subnetting: Netz in mindestens n gleich große Subnetze teilen */
  subnetSplit(L){
    const base = pick([[s2ip('10.20.0.0'),16],[s2ip('172.16.32.0'),20],[s2ip('192.168.8.0'),22],[s2ip('192.168.20.0'),23],[s2ip('192.168.100.0'),24],[s2ip('10.8.64.0'),18]]);
    const need = pick([2,3,4,5,6,7,8,10,12,16]);
    const bits = Math.ceil(Math.log2(need)), np = base[1] + bits, cnt = 2**bits, size = 2**(32-np);
    const hosts = size - 2, last = (base[0] + (cnt-1)*size) >>> 0;
    return { t:'in',
      s: tx(L, `Das Netz ${ip2s(base[0])}/${base[1]} eines Kunden soll für ${need} Abteilungen in gleich große Subnetze aufgeteilt werden. Es sollen möglichst viele Hosts je Subnetz möglich sein.`,
               `A customer's network ${ip2s(base[0])}/${base[1]} is to be divided into equally sized subnets for ${need} departments, with as many hosts per subnet as possible.`),
      q: tx(L, 'Geben Sie die neue Präfixlänge, die nutzbaren Hosts je Subnetz und die Netzadresse des letzten Subnetzes an.', 'State the new prefix length, the usable hosts per subnet and the network address of the last subnet.'),
      f: [ {l:tx(L,'Neue Präfixlänge','New prefix length'), v:String(np), u:'/'}, {l:tx(L,'Hosts je Subnetz','Hosts per subnet'), v:hosts, tol:0}, {l:tx(L,'Netzadresse letztes Subnetz','Network address of last subnet'), v:ip2s(last)} ],
      e: tx(L, `Für ${need} Subnetze braucht man ${bits} Bit (2^${bits} = ${cnt} ≥ ${need}). /${base[1]} + ${bits} = /${np}. Jedes Subnetz umfasst 2^${32-np} = ${size} Adressen, also ${hosts} Hosts. Letztes Subnetz: Basis + ${cnt-1} × ${size} = ${ip2s(last)}.`,
               `${need} subnets need ${bits} bits (2^${bits} = ${cnt} ≥ ${need}). /${base[1]} + ${bits} = /${np}. Each subnet spans 2^${32-np} = ${size} addresses, i.e. ${hosts} hosts. Last subnet: base + ${cnt-1} × ${size} = ${ip2s(last)}.`),
      n: tx(L, 'Naheliegend, aber falsch: bei einer Anzahl wie 5 oder 6 nur 2 Bit zu leihen – 2 Bit ergeben nur 4 Subnetze.', 'Tempting but wrong: borrowing only 2 bits for 5 or 6 subnets – 2 bits give only 4 subnets.')
    };
  },
  /* Datenübertragung */
  transfer(L){
    const gb = pick([2,4.5,8,12,25,40,60]), bw = pick([16,50,100,250,500,1000]), eff = pick([1,0.8]);
    const sec = Math.round(gb * 8000 / (bw * eff));
    const effTxt = eff===1 ? '' : tx(L,' Durch Protokoll-Overhead stehen nur 80 % der Bandbreite als Nutzdatenrate zur Verfügung.',' Due to protocol overhead only 80 % of the bandwidth is available for payload.');
    return { t:'in',
      s: tx(L, `Ein Außenstandort soll ein Installationsabbild mit ${fmt(gb,1,L).replace(/,0$/,'')} GB über eine ${bw}-Mbit/s-Leitung vom zentralen Server laden.${effTxt} Es gilt 1 GB = 1.000 MB.`,
               `A branch office needs to download an installation image of ${fmt(gb,1,L).replace(/\.0$/,'')} GB from the central server over a ${bw} Mbit/s line.${effTxt} Assume 1 GB = 1,000 MB.`),
      q: tx(L, 'Wie viele Sekunden dauert die Übertragung? Runden Sie auf ganze Sekunden.', 'How many seconds does the transfer take? Round to whole seconds.'),
      f: [ {l:tx(L,'Dauer','Duration'), v:sec, tol:1, u:'s'} ],
      e: tx(L, `${fmt(gb,1,L)} GB × 8.000 = ${fmt(gb*8000,0,L)} Mbit. Nutzrate ${fmt(bw*eff,0,L)} Mbit/s. ${fmt(gb*8000,0,L)} ÷ ${fmt(bw*eff,0,L)} ≈ ${fmt(sec,0,L)} s (≈ ${fmt(sec/60,1,L)} min).`,
               `${fmt(gb,1,L)} GB × 8,000 = ${fmt(gb*8000,0,L)} Mbit. Payload rate ${fmt(bw*eff,0,L)} Mbit/s. ${fmt(gb*8000,0,L)} ÷ ${fmt(bw*eff,0,L)} ≈ ${fmt(sec,0,L)} s (≈ ${fmt(sec/60,1,L)} min).`),
      n: tx(L, 'Typischer Fehler: Byte und Bit verwechseln – ohne den Faktor 8 ist das Ergebnis achtmal zu klein.', 'Typical mistake: mixing up bytes and bits – without the factor 8 the result is eight times too small.')
    };
  },
  /* Bilddatenmenge */
  imageSize(L){
    const [w,h] = pick([[1920,1080],[2560,1440],[3840,2160],[1280,1024],[1600,900]]), d = pick([16,24,32]);
    const mib = r2(w*h*d/8/1048576);
    return { t:'in',
      s: tx(L, `Für ein Dokumentenmanagement sollen Bildschirmfotos unkomprimiert archiviert werden: Auflösung ${w} × ${h} Pixel, Farbtiefe ${d} Bit.`, `For a document management system, screenshots are to be archived uncompressed: resolution ${w} × ${h} pixels, colour depth ${d} bits.`),
      q: tx(L, 'Wie groß ist eine Aufnahme in MiB? Runden Sie auf zwei Nachkommastellen.', 'What is the size of one screenshot in MiB? Round to two decimal places.'),
      f: [ {l:tx(L,'Dateigröße','File size'), v:mib, tol:0.011, u:'MiB'} ],
      e: tx(L, `${w} × ${h} × ${d} Bit ÷ 8 = ${fmt(w*h*d/8,0,L)} Byte. ÷ 1.048.576 (1024²) = ${fmt(mib,2,L)} MiB.`, `${w} × ${h} × ${d} bits ÷ 8 = ${fmt(w*h*d/8,0,L)} bytes. ÷ 1,048,576 (1024²) = ${fmt(mib,2,L)} MiB.`),
      n: tx(L, 'Häufig wird durch 1.000.000 geteilt – das ergibt MB, nicht MiB.', 'People often divide by 1,000,000 – that gives MB, not MiB.')
    };
  },
  /* Linux-Rechte oktal */
  permOctal(L){
    const sets = [7,6,5,4,0], sym = n => (n&4?'r':'-')+(n&2?'w':'-')+(n&1?'x':'-');
    let u, g, o; do { u = pick([7,6,7,6,5]); g = pick(sets); o = pick([5,4,0,0]); } while (g > u || o > g);
    const s = sym(u)+sym(g)+sym(o), file = pick(['backup.sh','config.yml','deploy.sh','report.csv','.env']);
    return { t:'in',
      s: tx(L, `Auf einem Linux-Server zeigt ls -l für die Datei ${file}:\n-${s} 1 admin it 2048 ${file}`, `On a Linux server, ls -l shows for the file ${file}:\n-${s} 1 admin it 2048 ${file}`),
      q: tx(L, 'Welche oktale Rechtemaske müssten Sie mit chmod setzen, um genau diese Rechte zu vergeben?', 'Which octal mode would you pass to chmod to set exactly these permissions?'),
      f: [ {l:tx(L,'Oktalwert','Octal value'), v:`${u}${g}${o}`} ],
      e: tx(L, `r = 4, w = 2, x = 1. Besitzer ${sym(u)} = ${u}, Gruppe ${sym(g)} = ${g}, andere ${sym(o)} = ${o} → chmod ${u}${g}${o} ${file}.`, `r = 4, w = 2, x = 1. Owner ${sym(u)} = ${u}, group ${sym(g)} = ${g}, others ${sym(o)} = ${o} → chmod ${u}${g}${o} ${file}.`),
      n: tx(L, 'Naheliegend, aber falsch: das erste Zeichen (Dateityp „-“ bzw. „d“) mitzuzählen – es gehört nicht zu den Rechten.', 'Tempting but wrong: counting the first character (file type "-" or "d") – it is not part of the permissions.')
    };
  },
  /* Bezugskalkulation */
  bezugspreis(L){
    const n = pick([5,8,10,12,20]), p = pick([189,249,329,449,899]), rb = pick([5,10,12,15,20]), sk = pick([2,3]), bk = pick([25,40,59,80,120]);
    const lep = n*p, zep = r2(lep*(1-rb/100)), bap = r2(zep*(1-sk/100)), bp = r2(bap+bk);
    return { t:'in',
      s: tx(L, `Ihr Betrieb bestellt ${n} Dockingstationen zu je ${eur(p,L)} netto. Der Lieferer gewährt ${rb} % Rabatt und ${sk} % Skonto bei Zahlung innerhalb von 10 Tagen. Für Fracht und Verpackung fallen ${eur(bk,L)} an. Sie zahlen mit Skonto.`,
               `Your company orders ${n} docking stations at ${eur(p,L)} net each. The supplier grants a ${rb} % trade discount and a ${sk} % cash discount for payment within 10 days. Freight and packaging cost ${eur(bk,L)}. You pay with the cash discount.`),
      q: tx(L, 'Berechnen Sie den Bezugspreis (Einstandspreis) der gesamten Lieferung.', 'Calculate the landed cost (Bezugspreis) of the entire delivery.'),
      f: [ {l:tx(L,'Bezugspreis','Landed cost'), v:bp, tol:0.05, u:'€'} ],
      e: tx(L, `Listeneinkaufspreis ${eur(lep,L)} − ${rb} % Rabatt = Zieleinkaufspreis ${eur(zep,L)} − ${sk} % Skonto = Bareinkaufspreis ${eur(bap,L)} + Bezugskosten ${eur(bk,L)} = Bezugspreis ${eur(bp,L)}.`,
               `List price ${eur(lep,L)} − ${rb} % trade discount = ${eur(zep,L)} − ${sk} % cash discount = ${eur(bap,L)} + delivery costs ${eur(bk,L)} = landed cost ${eur(bp,L)}.`),
      n: tx(L, 'Falsch ist, Skonto vom Listenpreis abzuziehen oder Rabatt und Skonto einfach zu addieren – Skonto wird erst vom Zieleinkaufspreis (nach Rabatt) berechnet.', 'It is wrong to deduct the cash discount from the list price or to simply add both percentages – the cash discount is calculated on the price after the trade discount.')
    };
  },
  /* Lineare Abschreibung, monatsgenau */
  afa(L){
    const ak = pick([1800,2400,3600,4800,6000,9000,12000]), nd = pick([3,4,5]), m = rnd(1,12);
    const year = ak/nd, first = r2(year*(13-m)/12), rbw = r2(ak-first);
    const MON = {de:['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'], en:['January','February','March','April','May','June','July','August','September','October','November','December']};
    return { t:'in',
      s: tx(L, `Ihr Betrieb schafft im ${MON.de[m-1]} einen Server für ${eur(ak,L)} netto an. Er wird linear über ${nd} Jahre abgeschrieben, im Anschaffungsjahr monatsgenau (pro rata temporis).`, `In ${MON.en[m-1]} your company buys a server for ${eur(ak,L)} net. It is depreciated on a straight-line basis over ${nd} years, pro rata temporis (by month) in the year of purchase.`),
      q: tx(L, 'Berechnen Sie den Abschreibungsbetrag im Anschaffungsjahr und den Restbuchwert am Ende dieses Jahres.', 'Calculate the depreciation in the year of purchase and the remaining book value at the end of that year.'),
      f: [ {l:tx(L,'AfA im Anschaffungsjahr','Depreciation, year 1'), v:first, tol:0.05, u:'€'}, {l:tx(L,'Restbuchwert','Remaining book value'), v:rbw, tol:0.05, u:'€'} ],
      e: tx(L, `Jahres-AfA: ${eur(ak,L)} ÷ ${nd} = ${eur(year,L)}. Der Anschaffungsmonat zählt mit: ${13-m} Monate → ${eur(year,L)} × ${13-m}/12 = ${eur(first,L)}. Restbuchwert: ${eur(ak,L)} − ${eur(first,L)} = ${eur(rbw,L)}.`, `Annual depreciation: ${eur(ak,L)} ÷ ${nd} = ${eur(year,L)}. The month of purchase counts: ${13-m} months → ${eur(year,L)} × ${13-m}/12 = ${eur(first,L)}. Book value: ${eur(ak,L)} − ${eur(first,L)} = ${eur(rbw,L)}.`),
      n: tx(L, 'Häufiger Fehler: den Anschaffungsmonat nicht mitzuzählen (12 − Monat statt 13 − Monat) oder im ersten Jahr die volle Jahres-AfA anzusetzen.', 'Common mistake: not counting the month of purchase (12 − month instead of 13 − month) or charging the full annual amount in the first year.')
    };
  },
  /* RAID-Nettokapazität */
  raid(L){
    const lv = pick(['0','1','5','6','10','5hs']);
    const size = pick([1,2,4,8,12,16]);
    let n, net, hs = false, rule;
    if (lv==='0'){ n=rnd(2,6); net=n*size; rule=tx(L,'RAID 0 nutzt alle Platten ohne Redundanz: n × Größe','RAID 0 uses all disks without redundancy: n × size'); }
    else if (lv==='1'){ n=2; net=size; rule=tx(L,'RAID 1 spiegelt: nutzbar ist eine Platte','RAID 1 mirrors: one disk is usable'); }
    else if (lv==='5'){ n=rnd(3,8); net=(n-1)*size; rule=tx(L,'RAID 5: eine Platte Parität → (n − 1) × Größe','RAID 5: one disk of parity → (n − 1) × size'); }
    else if (lv==='5hs'){ n=rnd(4,8); hs=true; net=(n-2)*size; rule=tx(L,'Der Hot-Spare zählt nicht zum Verbund; RAID 5 über n − 1 Platten → (n − 2) × Größe','The hot spare is not part of the array; RAID 5 over n − 1 disks → (n − 2) × size'); }
    else if (lv==='6'){ n=rnd(4,8); net=(n-2)*size; rule=tx(L,'RAID 6: zwei Platten Parität → (n − 2) × Größe','RAID 6: two disks of parity → (n − 2) × size'); }
    else { n=pick([4,6,8]); net=n/2*size; rule=tx(L,'RAID 10: Spiegelpaare, gestript → n ÷ 2 × Größe','RAID 10: striped mirror pairs → n ÷ 2 × size'); }
    const lvl = lv==='5hs' ? '5' : lv;
    return { t:'in',
      s: tx(L, `Ein NAS für die Buchhaltung wird mit ${n} Festplatten zu je ${size} TB bestückt und als RAID ${lvl} konfiguriert${hs?', davon eine Platte als Hot-Spare':''}.`, `A NAS for the accounting department is fitted with ${n} disks of ${size} TB each and configured as RAID ${lvl}${hs?', one of which is a hot spare':''}.`),
      q: tx(L, 'Wie groß ist die Nettokapazität in TB?', 'What is the net capacity in TB?'),
      f: [ {l:tx(L,'Nettokapazität','Net capacity'), v:net, tol:0, u:'TB'} ],
      e: `${rule} = ${net} TB.`,
      n: tx(L, 'Naheliegend, aber falsch: bei RAID 5/6 die Paritätsplatten oder den Hot-Spare als nutzbar mitzuzählen.', 'Tempting but wrong: counting the parity disks or the hot spare as usable in RAID 5/6.')
    };
  },
  /* Verfügbarkeit */
  avail(L){
    if (Math.random() < 0.5){
      const d = pick([2,4,6,8.76,12,18,24,36,48]), a = (8760-d)/8760*100, v = Math.round(a*1000)/1000;
      return { t:'in',
        s: tx(L, `Der Webshop eines Kunden war im vergangenen Jahr (365 Tage, 24/7-Betrieb) insgesamt ${fmt(d,2,L).replace(/,00$/,'')} Stunden nicht erreichbar.`, `A customer's web shop was unavailable for a total of ${fmt(d,2,L).replace(/\.00$/,'')} hours last year (365 days, 24/7 operation).`),
        q: tx(L, 'Welche Verfügbarkeit in Prozent wurde erreicht? Runden Sie auf drei Nachkommastellen.', 'What availability in percent was achieved? Round to three decimal places.'),
        f: [ {l:tx(L,'Verfügbarkeit','Availability'), v, tol:0.0011, u:'%'} ],
        e: tx(L, `365 × 24 = 8.760 h Soll-Betriebszeit. (8.760 − ${fmt(d,2,L)}) ÷ 8.760 × 100 = ${fmt(v,3,L)} %.`, `365 × 24 = 8,760 h scheduled time. (8,760 − ${fmt(d,2,L)}) ÷ 8,760 × 100 = ${fmt(v,3,L)} %.`),
        n: tx(L, 'Nicht die Ausfallzeit durch die Betriebszeit teilen und dieses Ergebnis angeben – das ist die Nichtverfügbarkeit.', 'Do not state downtime ÷ operating time – that is the unavailability.')
      };
    }
    const a = pick([99,99.5,99.8,99.9,99.95,99.99]), v = Math.round(43200*(1-a/100)*10)/10;
    return { t:'in',
      s: tx(L, `Im SLA mit einem Hosting-Anbieter ist eine Verfügbarkeit von ${fmt(a,2,L).replace(/,?0+$/,'')} % pro Monat vereinbart (Berechnungsbasis 30 Tage, 24/7).`, `The SLA with a hosting provider guarantees ${fmt(a,2,L).replace(/\.?0+$/,'')} % availability per month (based on 30 days, 24/7).`),
      q: tx(L, 'Wie viele Minuten Ausfall pro Monat sind maximal zulässig? Runden Sie auf eine Nachkommastelle.', 'How many minutes of downtime per month are permitted at most? Round to one decimal place.'),
      f: [ {l:tx(L,'Max. Ausfallzeit','Max. downtime'), v, tol:0.11, u:'min'} ],
      e: tx(L, `30 × 24 × 60 = 43.200 min. Zulässig: ${fmt(100-a,2,L)} % davon = ${fmt(v,1,L)} min.`, `30 × 24 × 60 = 43,200 min. Permitted: ${fmt(100-a,2,L)} % of that = ${fmt(v,1,L)} min.`),
      n: tx(L, 'Häufig wird mit 99,9 statt 0,1 % multipliziert – gesucht ist der Anteil der Nichtverfügbarkeit.', 'A common slip is multiplying by 99.9 instead of 0.1 % – you need the share of unavailability.')
    };
  },
  /* USV-Dimensionierung */
  usv(L){
    const dev = shuffle([[tx(L,'Server A','Server A'),pick([450,550,650])],[tx(L,'Server B','Server B'),pick([350,450,500])],['Core-Switch',pick([150,200,250])],[tx(L,'Firewall','Firewall'),pick([60,80,120])],['NAS',pick([90,120,180])]]).slice(0, rnd(3,4));
    const sum = dev.reduce((a,d)=>a+d[1],0), cos = pick([0.7,0.8,0.9]), res = pick([20,25,30]);
    const va = Math.round(sum/cos*(1+res/100));
    return { t:'in',
      s: tx(L, `Für den Serverschrank soll eine USV beschafft werden. Angeschlossen werden: ${dev.map(d=>`${d[0]} (${d[1]} W)`).join(', ')}. Der Leistungsfaktor beträgt cos φ = ${fmt(cos,1,L)}, zusätzlich sollen ${res} % Reserve eingeplant werden.`, `A UPS is to be procured for the server rack. Connected devices: ${dev.map(d=>`${d[0]} (${d[1]} W)`).join(', ')}. The power factor is cos φ = ${fmt(cos,1,L)}; plan an additional ${res} % reserve.`),
      q: tx(L, 'Welche Scheinleistung in VA muss die USV mindestens haben? Runden Sie auf ganze VA.', 'What apparent power in VA must the UPS provide at least? Round to whole VA.'),
      f: [ {l:tx(L,'Scheinleistung','Apparent power'), v:va, tol:1, u:'VA'} ],
      e: tx(L, `Wirkleistung ${sum} W ÷ ${fmt(cos,1,L)} = ${fmt(sum/cos,1,L)} VA; + ${res} % Reserve = ${fmt(va,0,L)} VA.`, `Real power ${sum} W ÷ ${fmt(cos,1,L)} = ${fmt(sum/cos,1,L)} VA; + ${res} % reserve = ${fmt(va,0,L)} VA.`),
      n: tx(L, 'Falsch ist, die Wattsumme direkt als VA zu nehmen oder mit cos φ zu multiplizieren – die Scheinleistung ist immer größer als die Wirkleistung.', 'It is wrong to take the watt sum as VA or to multiply by cos φ – apparent power is always larger than real power.')
    };
  },
  /* Break-even Kauf vs. Cloud */
  breakeven(L){
    const buy = pick([6000,8000,9600,12000,15000,18000]), op = pick([80,120,150,200]), cl = pick([450,520,600,750,900]);
    const mths = buy/(cl-op), ans = Math.floor(mths)+1;
    return { t:'in',
      s: tx(L, `Ein Kunde vergleicht: Eigener Server für ${eur(buy,L)} Anschaffung plus ${eur(op,L)} Betriebskosten pro Monat (Strom, Wartung) oder eine vergleichbare Cloud-VM für ${eur(cl,L)} pro Monat.`, `A customer compares: an on-premises server costing ${eur(buy,L)} plus ${eur(op,L)} running costs per month (power, maintenance), or a comparable cloud VM for ${eur(cl,L)} per month.`),
      q: tx(L, 'Ab dem wievielten Monat ist der eigene Server insgesamt günstiger?', 'From which month on is the own server cheaper in total?'),
      f: [ {l:tx(L,'Ab Monat','From month'), v:ans, tol:0} ],
      e: tx(L, `Monatliche Ersparnis: ${eur(cl,L)} − ${eur(op,L)} = ${eur(cl-op,L)}. ${eur(buy,L)} ÷ ${eur(cl-op,L)} = ${fmt(mths,2,L)} Monate bis zum Gleichstand → ab Monat ${ans} günstiger.`, `Monthly saving: ${eur(cl,L)} − ${eur(op,L)} = ${eur(cl-op,L)}. ${eur(buy,L)} ÷ ${eur(cl-op,L)} = ${fmt(mths,2,L)} months to break even → cheaper from month ${ans}.`),
      n: tx(L, 'Naheliegend, aber falsch: die Betriebskosten des eigenen Servers zu vergessen und nur Kaufpreis ÷ Cloudpreis zu rechnen.', 'Tempting but wrong: forgetting the running costs of the own server and just dividing purchase price by cloud price.')
    };
  },
  /* Netzplan: kritischer Pfad & Puffer */
  netzplan(L){
    let A=rnd(2,4), B=rnd(3,8), C=rnd(2,8), D=rnd(2,5), E=rnd(1,3); while (B===C) C=rnd(2,8);
    const tot = A+Math.max(B,C)+D+E, sh = B<C?'B':'C', buf = Math.abs(B-C);
    const names = {de:['Ist-Analyse','Server beschaffen','Rechtekonzept erstellen','Installation & Konfiguration','Test & Abnahme'], en:['As-is analysis','Procure server','Create permission concept','Installation & configuration','Test & acceptance']}[L];
    return { t:'in',
      s: tx(L, 'Für die Einführung eines neuen Fileservers liegt folgende Vorgangsliste vor (Dauer in Arbeitstagen).', 'The following activity list exists for introducing a new file server (duration in working days).'),
      tb: {h: tx(L,['Vorgang','Beschreibung','Dauer','Vorgänger'],['Activity','Description','Duration','Predecessor']), r:[['A',names[0],A,'–'],['B',names[1],B,'A'],['C',names[2],C,'A'],['D',names[3],D,'B, C'],['E',names[4],E,'D']]},
      q: tx(L, `Ermitteln Sie die Projektdauer und den Gesamtpuffer von Vorgang ${sh}.`, `Determine the project duration and the total float of activity ${sh}.`),
      f: [ {l:tx(L,'Projektdauer','Project duration'), v:tot, tol:0, u:tx(L,'Tage','days')}, {l:tx(L,`Gesamtpuffer ${sh}`,`Total float ${sh}`), v:buf, tol:0, u:tx(L,'Tage','days')} ],
      e: tx(L, `B und C laufen parallel nach A. Kritischer Pfad: A → ${sh==='B'?'C':'B'} → D → E = ${A} + ${Math.max(B,C)} + ${D} + ${E} = ${tot} Tage. ${sh} kann um ${Math.max(B,C)} − ${Math.min(B,C)} = ${buf} Tage verschoben werden, ohne das Projektende zu gefährden.`, `B and C run in parallel after A. Critical path: A → ${sh==='B'?'C':'B'} → D → E = ${A} + ${Math.max(B,C)} + ${D} + ${E} = ${tot} days. ${sh} can slip by ${Math.max(B,C)} − ${Math.min(B,C)} = ${buf} days without delaying the project end.`),
      n: tx(L, 'Naheliegend, aber falsch: alle Dauern zu addieren – parallele Vorgänge zählen nur mit dem längsten Zweig.', 'Tempting but wrong: adding up all durations – parallel activities only count with their longest branch.')
    };
  },
  /* Nutzwertanalyse */
  nutzwert(L){
    const g = pick([[50,30,20],[40,35,25],[45,30,25],[60,25,15],[40,40,20]]);
    const crit = shuffle(tx(L,['Anschaffungspreis','Leistung','Support/Service','Energieverbrauch'],['Purchase price','Performance','Support/service','Power consumption'])).slice(0,3);
    const a = [rnd(4,10),rnd(4,10),rnd(4,10)], b = [rnd(4,10),rnd(4,10),rnd(4,10)];
    const na = r2(g.reduce((s,w,i)=>s+w*a[i],0)/100), nb = r2(g.reduce((s,w,i)=>s+w*b[i],0)/100);
    return { t:'in',
      s: tx(L, 'Für die Auswahl eines Firewall-Systems haben Sie zwei Angebote mit einer Nutzwertanalyse bewertet (Punkte 1–10, 10 = sehr gut).', 'To select a firewall system, you rated two offers in a weighted scoring model (points 1–10, 10 = very good).'),
      tb: {h: tx(L,['Kriterium','Gewichtung','Angebot A','Angebot B'],['Criterion','Weight','Offer A','Offer B']), r: crit.map((c,i)=>[c, g[i]+' %', a[i], b[i]])},
      q: tx(L, 'Berechnen Sie die gewichteten Nutzwerte beider Angebote (zwei Nachkommastellen).', 'Calculate the weighted scores of both offers (two decimal places).'),
      f: [ {l:tx(L,'Nutzwert A','Score A'), v:na, tol:0.011}, {l:tx(L,'Nutzwert B','Score B'), v:nb, tol:0.011} ],
      e: tx(L, `A: ${g.map((w,i)=>`${fmt(w/100,2,L)} × ${a[i]}`).join(' + ')} = ${fmt(na,2,L)}. B: ${g.map((w,i)=>`${fmt(w/100,2,L)} × ${b[i]}`).join(' + ')} = ${fmt(nb,2,L)}. ${na===nb?'Gleichstand – weitere Kriterien nötig.':(na>nb?'Angebot A':'Angebot B')+' hat den höheren Nutzwert.'}`, `A: ${g.map((w,i)=>`${fmt(w/100,2,L)} × ${a[i]}`).join(' + ')} = ${fmt(na,2,L)}. B: ${g.map((w,i)=>`${fmt(w/100,2,L)} × ${b[i]}`).join(' + ')} = ${fmt(nb,2,L)}. ${na===nb?'A tie – further criteria needed.':(na>nb?'Offer A':'Offer B')+' has the higher score.'}`),
      n: tx(L, 'Typischer Fehler: die Punkte ungewichtet zu addieren – dann zählt ein unwichtiges Kriterium so viel wie das wichtigste.', 'Typical mistake: adding the points without weighting – then a minor criterion counts as much as the most important one.')
    };
  },
  /* Pseudocode-Schleife */
  loopSum(L){
    const n = rnd(8,20), k = pick([2,3,4,5]), neg = Math.random()<0.3;
    let s = 0; for (let i=1;i<=n;i++){ if (neg ? i%k!==0 : i%k===0) s+=i; }
    const code = tx(L,
`summe ← 0
FÜR i VON 1 BIS ${n}
    WENN i MOD ${k} ${neg?'≠':'='} 0 DANN
        summe ← summe + i
    ENDE WENN
ENDE FÜR
AUSGABE summe`,
`sum ← 0
FOR i FROM 1 TO ${n}
    IF i MOD ${k} ${neg?'≠':'='} 0 THEN
        sum ← sum + i
    END IF
END FOR
OUTPUT sum`);
    return { t:'in', code,
      s: tx(L, 'Ein Kollege hat für ein Auswertungsskript folgenden Pseudocode entworfen.', 'A colleague drafted the following pseudocode for an evaluation script.'),
      q: tx(L, 'Welcher Wert wird ausgegeben?', 'Which value is output?'),
      f: [ {l:tx(L,'Ausgabe','Output'), v:s, tol:0} ],
      e: tx(L, `Summiert werden alle i von 1 bis ${n}, ${neg?'die nicht':'die'} durch ${k} teilbar sind: ${[...Array(n)].map((_,i)=>i+1).filter(i=>neg? i%k!==0 : i%k===0).join(' + ')} = ${s}.`, `All i from 1 to ${n} that are ${neg?'not ':''}divisible by ${k} are added: ${[...Array(n)].map((_,i)=>i+1).filter(i=>neg? i%k!==0 : i%k===0).join(' + ')} = ${s}.`),
      n: tx(L, 'Häufiger Fehler: die Grenze BIS als exklusiv zu lesen – im Pseudocode ist der Endwert eingeschlossen.', 'Common mistake: reading the upper bound TO as exclusive – in pseudocode the end value is included.')
    };
  }
};
</script>

     e:'Thunderbolt 4 tunnels PCIe and DisplayPort over USB-C and suits docks; NVMe is a protocol for SSDs over PCIe, SATA III is limited to 6 Gbit/s.',
     n:'NVMe is often confused with SATA because both come as M.2 – but M.2 is only the form factor.'}},

/* Stromkosten bzw. Einsparung eines PC-Bestands pro Jahr */
GEN.hwPowerCost = function(L){
  const price = pick([0.28,0.30,0.32,0.35,0.38]), h = pick([8,9,10]), d = pick([220,225,230,250]);
  const pr = eur(price,L) + '/kWh';
  if (Math.random() < 0.5){
    const n = pick([10,12,15,20,25,30,40]), w = pick([35,45,55,65,85,110]);
    const wh = n*w*h*d, kwh = Math.round(wh/1000), cost = r2(kwh*price);
    return { t:'in',
      s: tx(L, `Die Geschäftsführung eines Ingenieurbüros möchte die jährlichen Stromkosten der ${n} Büro-PCs kennen. Ein PC nimmt im Betrieb durchschnittlich ${w} W auf. Die PCs laufen ${h} Stunden pro Tag an ${d} Arbeitstagen im Jahr und sind sonst vollständig vom Netz getrennt. Der Strompreis beträgt ${pr}.`,
               `The management of an engineering office wants to know the annual electricity costs of its ${n} office PCs. One PC draws ${w} W on average during operation. The PCs run ${h} hours a day on ${d} working days a year and are otherwise fully disconnected from the mains. The electricity price is ${pr}.`),
      q: tx(L, 'Berechnen Sie den jährlichen Energiebedarf aller PCs (auf ganze kWh gerundet) und die jährlichen Stromkosten (mit dem gerundeten Energiebedarf, auf Cent genau).',
               'Calculate the annual energy demand of all PCs (rounded to whole kWh) and the annual electricity costs (using the rounded energy demand, to the cent).'),
      f: [ {l:tx(L,'Energiebedarf pro Jahr','Annual energy demand'), v:kwh, tol:0.5, u:'kWh'}, {l:tx(L,'Stromkosten pro Jahr','Annual electricity costs'), v:cost, tol:r2(price/2)+0.01, u:'€'} ],
      e: tx(L, `${n} × ${w} W × ${h} h × ${d} Tage = ${fmt(wh,0,L)} Wh ÷ 1.000 = ${fmt(wh/1000,2,L)} kWh ≈ ${fmt(kwh,0,L)} kWh. ${fmt(kwh,0,L)} kWh × ${pr} = ${eur(cost,L)}.`,
               `${n} × ${w} W × ${h} h × ${d} days = ${fmt(wh,0,L)} Wh ÷ 1,000 = ${fmt(wh/1000,2,L)} kWh ≈ ${fmt(kwh,0,L)} kWh. ${fmt(kwh,0,L)} kWh × ${pr} = ${eur(cost,L)}.`),
      n: tx(L, 'Typischer Fehler: die Wattstunden nicht durch 1.000 zu teilen – der Strompreis bezieht sich auf kWh, die Kosten wären sonst 1.000-mal zu hoch.',
               'Typical mistake: not dividing the watt-hours by 1,000 – the price refers to kWh, otherwise the costs are 1,000 times too high.')
    };
  }
  const n = pick([12,20,25,30,40,50]), w1 = pick([65,80,95,120]), w2 = pick([12,15,18,25]), diff = w1 - w2;
  const wh = n*diff*h*d, kwh = Math.round(wh/1000), cost = r2(kwh*price);
  return { t:'in',
    s: tx(L, `Ein Callcenter ersetzt ${n} ältere Tower-PCs (durchschnittlich ${w1} W im Betrieb) durch Mini-PCs mit gleicher Nutzung (durchschnittlich ${w2} W). Die Geräte laufen ${h} Stunden pro Tag an ${d} Arbeitstagen, außerhalb der Arbeitszeit sind sie vom Netz getrennt. Der Strompreis beträgt ${pr}.`,
             `A call centre replaces ${n} older tower PCs (${w1} W on average during operation) with mini PCs used the same way (${w2} W on average). The devices run ${h} hours a day on ${d} working days; outside working hours they are disconnected from the mains. The electricity price is ${pr}.`),
    q: tx(L, 'Wie viel Energie (auf ganze kWh gerundet) und wie viel Geld (mit der gerundeten Energiemenge, auf Cent genau) spart der Austausch pro Jahr?',
             'How much energy (rounded to whole kWh) and how much money (using the rounded energy, to the cent) does the replacement save per year?'),
    f: [ {l:tx(L,'Energieeinsparung pro Jahr','Annual energy saving'), v:kwh, tol:0.5, u:'kWh'}, {l:tx(L,'Kosteneinsparung pro Jahr','Annual cost saving'), v:cost, tol:r2(price/2)+0.01, u:'€'} ],
    e: tx(L, `Leistungsdifferenz je Gerät: ${w1} W − ${w2} W = ${diff} W. ${n} × ${diff} W × ${h} h × ${d} Tage = ${fmt(wh,0,L)} Wh = ${fmt(wh/1000,2,L)} kWh ≈ ${fmt(kwh,0,L)} kWh. ${fmt(kwh,0,L)} kWh × ${pr} = ${eur(cost,L)}.`,
             `Power difference per device: ${w1} W − ${w2} W = ${diff} W. ${n} × ${diff} W × ${h} h × ${d} days = ${fmt(wh,0,L)} Wh = ${fmt(wh/1000,2,L)} kWh ≈ ${fmt(kwh,0,L)} kWh. ${fmt(kwh,0,L)} kWh × ${pr} = ${eur(cost,L)}.`),
    n: tx(L, 'Naheliegend, aber falsch: nur den Verbrauch der neuen Mini-PCs zu berechnen – gefragt ist die Einsparung, also die Differenz der Leistungsaufnahmen.',
             'Tempting but wrong: calculating only the consumption of the new mini PCs – the question asks for the saving, i.e. the difference in power draw.')
  };
};

/* Seitenkosten eines Laserdruckers */
GEN.hwPrintCost = function(L){
  const tp = pick([79.9,89.9,109,129.9,149]), ty = pick([3000,4000,6000,8000,10000]);
  const dp = pick([49.9,69,89.9,119]), dy = pick([12000,20000,30000,40000]);
  const pp = pick([3.99,4.49,4.99,5.99]), m = pick([1500,2500,4000,6000,8000]);
  const cT = tp/ty*100, cD = dp/dy*100, cP = pp/500*100;
  const ct = r2(cT + cD + cP), month = r2(ct*m/100);
  return { t:'in',
    s: tx(L, `Die Personalabteilung druckt monatlich etwa ${fmt(m,0,L)} Seiten auf einem Schwarz-Weiß-Laserdrucker. Verbrauchsmaterial: Tonerkartusche ${eur(tp,L)} für ${fmt(ty,0,L)} Seiten (Reichweite nach ISO/IEC 19752), Trommeleinheit ${eur(dp,L)} für ${fmt(dy,0,L)} Seiten, Papier ${eur(pp,L)} je Paket mit 500 Blatt. Gedruckt wird einseitig.`,
             `The HR department prints about ${fmt(m,0,L)} pages per month on a monochrome laser printer. Consumables: toner cartridge ${eur(tp,L)} for ${fmt(ty,0,L)} pages (yield according to ISO/IEC 19752), drum unit ${eur(dp,L)} for ${fmt(dy,0,L)} pages, paper ${eur(pp,L)} per pack of 500 sheets. Printing is single-sided.`),
    q: tx(L, 'Berechnen Sie die Materialkosten pro Seite in Cent (auf zwei Nachkommastellen) und die monatlichen Materialkosten in Euro (mit dem gerundeten Seitenpreis, auf Cent genau).',
             'Calculate the material cost per page in euro cents (to two decimal places) and the monthly material cost in euros (using the rounded cost per page, to the cent).'),
    f: [ {l:tx(L,'Kosten pro Seite','Cost per page'), v:ct, tol:0.011, u:'ct'}, {l:tx(L,'Kosten pro Monat','Cost per month'), v:month, tol:r2(m*0.005/100)+0.02, u:'€'} ],
    e: tx(L, `Toner: ${eur(tp,L)} ÷ ${fmt(ty,0,L)} = ${fmt(cT,3,L)} ct. Trommel: ${eur(dp,L)} ÷ ${fmt(dy,0,L)} = ${fmt(cD,3,L)} ct. Papier: ${eur(pp,L)} ÷ 500 = ${fmt(cP,3,L)} ct. Summe ≈ ${fmt(ct,2,L)} ct pro Seite. Monat: ${fmt(ct,2,L)} ct × ${fmt(m,0,L)} = ${eur(month,L)}.`,
             `Toner: ${eur(tp,L)} ÷ ${fmt(ty,0,L)} = ${fmt(cT,3,L)} ct. Drum: ${eur(dp,L)} ÷ ${fmt(dy,0,L)} = ${fmt(cD,3,L)} ct. Paper: ${eur(pp,L)} ÷ 500 = ${fmt(cP,3,L)} ct. Total ≈ ${fmt(ct,2,L)} ct per page. Month: ${fmt(ct,2,L)} ct × ${fmt(m,0,L)} = ${eur(month,L)}.`),
    n: tx(L, 'Häufiger Fehler: nur den Toner zu berücksichtigen – Trommel und Papier gehören ebenfalls zu den Seitenkosten und machen oft ein Drittel oder mehr aus.',
             'Common mistake: considering only the toner – the drum and the paper are also part of the cost per page and often account for a third or more.')
  };
};

Q.push(
{id:'hw-06', a:'hw', t:'sc', c:0,
 de:{s:'Ein Kunde bestellt 20 Büro-PCs mit Prozessorgrafik (iGPU), an denen jeweils zwei Monitore betrieben werden. Der Lieferant bietet zum gleichen Preis 1 × 16 GB DDR5-5600 oder 2 × 8 GB DDR5-5600 an. Das Mainboard hat zwei Speichersteckplätze, je einen pro Speicherkanal.',
     q:'Mit welcher Begründung empfehlen Sie die Bestückung mit 2 × 8 GB?',
     o:['Beide Speicherkanäle werden genutzt, dadurch verdoppelt sich die Speicherbandbreite – davon profitiert besonders die integrierte Grafik, die den Arbeitsspeicher mitnutzt','Im Dual-Channel-Betrieb verdoppelt sich die Taktfrequenz der Module von DDR5-5600 auf DDR5-11200','Die Daten werden auf beide Module gespiegelt, sodass der PC bei Ausfall eines Moduls ohne Unterbrechung weiterläuft','Zwei Module bieten mehr nutzbare Kapazität, weil ein einzelnes 16-GB-Modul einen Teil seines Speichers für ECC reserviert'],
     e:'Mit einem Modul pro Kanal arbeitet der Speichercontroller parallel auf zwei Kanälen und die Bandbreite verdoppelt sich. Eine iGPU hat keinen eigenen Grafikspeicher und ist daher stark bandbreitenabhängig. Nachteil: Für eine spätere Erweiterung müssen beide Module getauscht werden.',
     n:'Dual Channel verändert nicht den Takt der Module – DDR5-5600 bleibt DDR5-5600. Die höhere Leistung entsteht allein durch die parallele Nutzung zweier Kanäle.'},
 en:{s:'A customer orders 20 office PCs with integrated graphics (iGPU), each driving two monitors. For the same price, the supplier offers 1 × 16 GB DDR5-5600 or 2 × 8 GB DDR5-5600. The mainboard has two memory slots, one per memory channel.',
     q:'With which reasoning do you recommend fitting 2 × 8 GB?',
     o:['Both memory channels are used, doubling the memory bandwidth – this particularly benefits the integrated graphics, which shares the main memory','In dual-channel mode the module clock doubles from DDR5-5600 to DDR5-11200','The data is mirrored to both modules, so the PC keeps running without interruption if one module fails','Two modules offer more usable capacity because a single 16 GB module reserves part of its memory for ECC'],
     e:'With one module per channel the memory controller works on two channels in parallel and the bandwidth doubles. An iGPU has no dedicated video memory and therefore depends heavily on bandwidth. Drawback: a later upgrade requires replacing both modules.',
     n:'Dual channel does not change the module clock – DDR5-5600 stays DDR5-5600. The higher performance comes solely from using two channels in parallel.'}},
{id:'hw-07', a:'hw', gen:'hwPowerCost'},
{id:'hw-08', a:'hw', t:'mc', c:[0,1,2],
 de:{s:'Die Geschäftsführung fragt, warum bei der Beschaffung neuer Notebooks ein TPM 2.0 zwingend im Anforderungskatalog steht. Sie erläutern die Aufgaben dieses Sicherheitschips.',
     q:'Welche Aufgaben übernimmt das TPM 2.0? (Mehrere Antworten)',
     o:['Den BitLocker-Schlüssel geschützt speichern und nur bei unverändertem Startvorgang freigeben','Kryptografische Schlüssel erzeugen und manipulationssicher speichern, z. B. für Windows Hello for Business','Messwerte des Startvorgangs in Plattformregistern (PCR) protokollieren (Measured Boot)','Die Signaturen von Bootloadern prüfen und unsignierte Bootloader am Start hindern','Den gesamten Netzwerkverkehr des Notebooks transparent verschlüsseln'],
     e:'Das TPM ist ein Kryptoprozessor: Es erzeugt und schützt Schlüssel, misst den Startvorgang in PCRs und gibt z. B. den BitLocker-Schlüssel nur frei, wenn die Messwerte unverändert sind.',
     n:'Die Signaturprüfung von Bootloadern ist Aufgabe von Secure Boot in der UEFI-Firmware. Das TPM misst nur und blockiert selbst keinen Start.'},
 en:{s:'Management asks why a TPM 2.0 is a mandatory item in the requirements for procuring new notebooks. You explain the tasks of this security chip.',
     q:'Which tasks does the TPM 2.0 perform? (Multiple answers)',
     o:['Store the BitLocker key securely and release it only if the boot process is unchanged','Generate cryptographic keys and store them tamper-resistantly, e.g. for Windows Hello for Business','Record measurements of the boot process in platform configuration registers (PCR) (measured boot)','Check the signatures of bootloaders and prevent unsigned bootloaders from starting','Transparently encrypt all network traffic of the notebook'],
     e:'The TPM is a crypto processor: it generates and protects keys, measures the boot process into PCRs and releases e.g. the BitLocker key only if the measurements are unchanged.',
     n:'Checking bootloader signatures is the job of Secure Boot in the UEFI firmware. The TPM only measures and does not block a boot itself.'}},
{id:'hw-09', a:'hw', t:'match',
 de:{s:'Im Ersatzteillager Ihres Systemhauses liegen verschiedene Speichermodule. Sie sollen für anstehende Aufträge das passende Modul auswählen.',
     q:'Ordnen Sie jedem Speichertyp den passenden Einsatz zu.',
     p:[['DDR5-UDIMM','Aufrüstung eines aktuellen Desktop-PCs (nicht steckkompatibel zu DDR4)'],['DDR5-SO-DIMM','Wechselbarer Arbeitsspeicher in Notebooks und Mini-PCs'],['DDR5-RDIMM mit ECC','Server: Registerbaustein, Erkennung und Korrektur von Bitfehlern über das gesamte Modul'],['LPDDR5X','Fest auf das Mainboard gelötet, besonders stromsparend, nicht nachrüstbar'],['GDDR7','Grafikspeicher auf einer dedizierten Grafikkarte']],
     e:'Desktop-PCs nutzen UDIMMs, Notebooks SO-DIMMs, Server Registered-DIMMs mit ECC. LPDDR ist für mobile Geräte optimiert und verlötet – das muss man bei der Bedarfsanalyse wissen, weil später keine Aufrüstung möglich ist.',
     n:'Häufige Fehlannahme: DDR5-UDIMMs hätten wegen ihres „On-Die-ECC“ bereits vollwertiges ECC. On-Die-ECC korrigiert nur Fehler innerhalb des Chips, nicht auf dem Weg zum Speichercontroller – für Server braucht man echte ECC-Module.'},
 en:{s:'Your IT service company keeps various memory modules in the spare parts store. You are to pick the right module for upcoming orders.',
     q:'Match each memory type to the appropriate use.',
     p:[['DDR5 UDIMM','Upgrading a current desktop PC (not slot-compatible with DDR4)'],['DDR5 SO-DIMM','Replaceable memory in notebooks and mini PCs'],['DDR5 RDIMM with ECC','Server: register chip, detection and correction of bit errors across the whole module'],['LPDDR5X','Soldered onto the mainboard, particularly power-saving, not upgradable'],['GDDR7','Video memory on a dedicated graphics card']],
     e:'Desktop PCs use UDIMMs, notebooks SO-DIMMs, servers registered DIMMs with ECC. LPDDR is optimised for mobile devices and soldered – you need to know this during the needs analysis because no later upgrade is possible.',
     n:'Common misconception: DDR5 UDIMMs already have full ECC because of their "on-die ECC". On-die ECC only corrects errors inside the chip, not on the way to the memory controller – servers need real ECC modules.'}},
{id:'hw-10', a:'hw', t:'sc', c:0,
 de:{s:'Ein Callcenter mit 60 Plätzen im Schichtbetrieb erneuert seine Arbeitsplätze. Alle Anwendungen laufen künftig zentral auf einer Terminalserver-Farm (Remote Desktop Services) im eigenen Rechenzentrum. Gewünscht sind geringer Wartungsaufwand, niedriger Stromverbrauch und keine lokal gespeicherten Kundendaten.',
     q:'Welche Endgeräte empfehlen Sie?',
     o:['Thin Clients mit zentral verwaltetem, schlankem Betriebssystem','Leistungsstarke Desktop-PCs mit lokal installierter Callcenter-Software','Business-Notebooks mit Dockingstation','Workstations mit dedizierter Grafikkarte für flüssige Remote-Sitzungen'],
     e:'Thin Clients stellen nur die Remote-Sitzung dar, die Verarbeitung und Datenhaltung erfolgt zentral. Sie sind lüfterlos, sparsam, schnell austauschbar und zentral verwaltbar. Voraussetzung sind ein ausfallsicherer Terminalserver und ein stabiles Netzwerk.',
     n:'Notebooks wirken flexibel, sind für feste Schichtplätze aber teurer, speichern Daten lokal und müssen einzeln gepatcht werden – ihr Mobilitätsvorteil wird hier gar nicht benötigt.'},
 en:{s:'A call centre with 60 seats in shift operation is renewing its workstations. In future, all applications will run centrally on a terminal server farm (Remote Desktop Services) in its own data centre. The goals are low maintenance effort, low power consumption and no customer data stored locally.',
     q:'Which end devices do you recommend?',
     o:['Thin clients with a centrally managed, lightweight operating system','Powerful desktop PCs with locally installed call centre software','Business notebooks with docking stations','Workstations with a dedicated graphics card for smooth remote sessions'],
     e:'Thin clients only display the remote session; processing and data storage take place centrally. They are fanless, economical, quick to replace and centrally manageable. Prerequisites are a highly available terminal server and a stable network.',
     n:'Notebooks seem flexible, but for fixed shift seats they are more expensive, store data locally and must be patched individually – their mobility advantage is not needed here.'}},
{id:'hw-11', a:'hw', t:'order',
 de:{s:'Nach einer RAM-Aufrüstung laufen bei einem PC die Lüfter an, der Bildschirm bleibt aber schwarz. Um einer Auszubildenden zu zeigen, an welcher Stelle der PC hängen bleibt, gehen Sie mit ihr den Startvorgang bis zur Übergabe an das Betriebssystem durch.',
     q:'Bringen Sie die Phasen des Startvorgangs eines UEFI-PCs in die richtige Reihenfolge.',
     o:['Netzteil stellt stabile Spannungen bereit und meldet „Power Good“ an das Mainboard','CPU startet am Reset-Vektor und führt die UEFI-Firmware aus dem Flash-Baustein aus','Arbeitsspeicher wird erkannt und initialisiert (Memory Training)','POST: Grafik, Controller und PCIe-Geräte werden geprüft und initialisiert','Firmware wertet die Bootreihenfolge (Booteinträge im NVRAM) aus','Bootloader wird von der EFI-Systempartition geladen (bei Secure Boot nach Signaturprüfung) und übernimmt den Start'],
     e:'Ohne „Power Good“ startet die CPU nicht; ohne initialisierten RAM kann die Firmware keine weiteren Geräte einrichten. Dass die Lüfter laufen, aber kein Bild erscheint, deutet daher auf einen Abbruch bei der Speicherinitialisierung hin – Debug-LEDs oder Piepcodes bestätigen das.',
     n:'Viele erwarten die Grafikinitialisierung vor dem RAM, weil man „zuerst etwas sieht“. Die Grafikausgabe setzt aber funktionierenden Arbeitsspeicher voraus.'},
 en:{s:'After a RAM upgrade, a PC spins up its fans but the screen stays black. To show a trainee where the PC gets stuck, you walk her through the start-up process until control passes to the operating system.',
     q:'Put the phases of the start-up of a UEFI PC in the correct order.',
     o:['The power supply provides stable voltages and signals "Power Good" to the mainboard','The CPU starts at the reset vector and executes the UEFI firmware from the flash chip','Main memory is detected and initialised (memory training)','POST: graphics, controllers and PCIe devices are tested and initialised','The firmware evaluates the boot order (boot entries in NVRAM)','The bootloader is loaded from the EFI system partition (after a signature check with Secure Boot) and takes over the boot'],
     e:'Without "Power Good" the CPU does not start; without initialised RAM the firmware cannot set up any further devices. Fans running but no picture therefore suggests an abort during memory initialisation – debug LEDs or beep codes confirm this.',
     n:'Many expect graphics initialisation before RAM because you "see something first". But video output requires working main memory.'}},
{id:'hw-12', a:'hw', gen:'hwPrintCost'},
{id:'hw-13', a:'hw', t:'mc', c:[0,1,2],
 de:{s:'Eine Werbeagentur bestellt vier Monitore für die Bildbearbeitung von Druckprodukten. Die Kundin betont: „Was ich am Bildschirm sehe, muss später im Druck genauso aussehen.“',
     q:'Welche Merkmale nehmen Sie in die Anforderungsliste auf? (Mehrere Antworten)',
     o:['IPS-Panel mit hoher Blickwinkelstabilität','Großer Farbraum (z. B. ca. 99 % Adobe RGB) und Hardware-Kalibrierung','Hohe Auflösung, z. B. 3840 × 2160 Pixel bei 27 Zoll, für feine Details','TN-Panel wegen der kürzesten Reaktionszeit','Bildwiederholrate von mindestens 240 Hz','VA-Panel mit starker Krümmung (1000R) für mehr Übersicht'],
     e:'Für farbverbindliches Arbeiten zählen Farbraumabdeckung, Kalibrierbarkeit und ein Panel, dessen Farben sich beim Blickwinkel nicht verschieben (IPS). Eine hohe Pixeldichte erleichtert die Detailarbeit.',
     n:'Kurze Reaktionszeiten und hohe Bildwiederholraten sind Gaming-Merkmale. TN-Panels verfälschen Farben schon bei leicht geändertem Blickwinkel und sind für Bildbearbeitung ungeeignet.'},
 en:{s:'An advertising agency orders four monitors for editing images for print products. The customer stresses: "What I see on screen must look exactly the same in print later."',
     q:'Which characteristics do you include in the list of requirements? (Multiple answers)',
     o:['IPS panel with high viewing-angle stability','Wide colour gamut (e.g. approx. 99 % Adobe RGB) and hardware calibration','High resolution, e.g. 3840 × 2160 pixels at 27 inches, for fine detail','TN panel because of the shortest response time','Refresh rate of at least 240 Hz','VA panel with strong curvature (1000R) for a better overview'],
     e:'For colour-accurate work, gamut coverage, calibration capability and a panel whose colours do not shift with the viewing angle (IPS) matter. A high pixel density makes detailed work easier.',
     n:'Short response times and high refresh rates are gaming features. TN panels distort colours even at slightly changed viewing angles and are unsuitable for image editing.'}},
{id:'hw-14', a:'hw', t:'sc', c:0,
 de:{s:'Ein Kunde ruft verärgert an: Die neue SSD mit „2 TB“ laut Datenblatt wird im Windows-Explorer nur mit 1,81 TB angezeigt. Er vermutet ein gefälschtes Produkt und will reklamieren.',
     q:'Wie erklären Sie dem Kunden die Abweichung?',
     o:['Der Hersteller rechnet dezimal (1 TB = 10¹² Byte), Windows binär (1 TiB = 2⁴⁰ Byte) und zeigt TiB mit der Einheit „TB“ an: 2 · 10¹² Byte ≈ 1,82 TiB','Das Dateisystem NTFS belegt nach der Formatierung etwa 10 % der Kapazität für seine Verwaltungsstrukturen','Der SSD-Controller zieht die Reserve für Over-Provisioning von der angegebenen Kapazität ab','Die SSD ist wahrscheinlich defekt oder gefälscht und sollte umgetauscht werden'],
     e:'2.000.000.000.000 Byte ÷ 1.099.511.627.776 Byte/TiB ≈ 1,819 TiB. Es fehlt kein Speicher – die Zahl ist nur in einer anderen Einheit angegeben, die Windows fälschlich „TB“ nennt.',
     n:'Die NTFS-Verwaltungsstrukturen sind im Verhältnis winzig und erscheinen als belegter Platz, nicht als geringere Gesamtgröße. Die Reserve für Over-Provisioning ist in der Herstellerangabe bereits nicht enthalten.'},
 en:{s:'An annoyed customer calls: the new SSD with "2 TB" according to the data sheet is shown in Windows Explorer with only 1.81 TB. He suspects a counterfeit product and wants to file a complaint.',
     q:'How do you explain the difference to the customer?',
     o:['The manufacturer calculates in decimal (1 TB = 10¹² bytes), Windows in binary (1 TiB = 2⁴⁰ bytes) and displays TiB with the unit "TB": 2 · 10¹² bytes ≈ 1.82 TiB','After formatting, the NTFS file system occupies about 10 % of the capacity for its management structures','The SSD controller deducts the over-provisioning reserve from the stated capacity','The SSD is probably defective or counterfeit and should be exchanged'],
     e:'2,000,000,000,000 bytes ÷ 1,099,511,627,776 bytes/TiB ≈ 1.819 TiB. No storage is missing – the figure is merely given in a different unit, which Windows wrongly labels "TB".',
     n:'The NTFS management structures are tiny in comparison and appear as used space, not as a smaller total size. The over-provisioning reserve is already excluded from the manufacturer\'s figure.'}},
{id:'hw-15', a:'hw', t:'match',
 de:{s:'Ein Logistikunternehmen erneuert die Drucker in mehreren Abteilungen. Sie erstellen eine Empfehlung je Einsatzzweck.',
     q:'Ordnen Sie jedem Einsatzzweck die geeignete Drucktechnik zu.',
     p:[['Personalabteilung: viele Textseiten täglich, niedrige Seitenkosten','Schwarz-Weiß-Laserdrucker'],['Lager: Lieferscheine mit mehreren Durchschlägen in einem Druckgang','Nadeldrucker (Matrixdrucker)'],['Versand: Paketetiketten, die nur wenige Wochen halten müssen, ohne Farbband und Toner','Thermodirektdrucker'],['Inventarisierung: wisch- und kratzfeste Etiketten für Geräte, lange haltbar','Thermotransferdrucker'],['Marketing: Fotos in hoher Farbqualität auf Spezialpapier','Tintenstrahl-Fotodrucker']],
     e:'Nur Anschlagdrucker wie der Nadeldrucker drücken durch mehrere Lagen. Thermodirektdruck braucht kein Verbrauchsmaterial außer Spezialpapier, verblasst aber bei Wärme und Licht; Thermotransfer überträgt Farbe von einem Farbband und ist dauerhaft.',
     n:'Thermodirekt- und Thermotransferdruck werden oft verwechselt. Für langlebige Inventaretiketten ist Thermodirekt ungeeignet, da das wärmeempfindliche Papier mit der Zeit vergilbt und verblasst.'},
 en:{s:'A logistics company is replacing the printers in several departments. You prepare a recommendation for each purpose.',
     q:'Match each purpose to the suitable printing technology.',
     p:[['HR: many text pages daily, low cost per page','Monochrome laser printer'],['Warehouse: delivery notes with several carbon copies in one pass','Dot-matrix printer'],['Shipping: parcel labels that only need to last a few weeks, without ribbon or toner','Direct thermal printer'],['Asset tagging: wipe- and scratch-resistant device labels, long-lasting','Thermal transfer printer'],['Marketing: high-quality colour photos on special paper','Inkjet photo printer']],
     e:'Only impact printers such as dot-matrix printers print through several layers. Direct thermal printing needs no consumables other than special paper but fades with heat and light; thermal transfer applies ink from a ribbon and is durable.',
     n:'Direct thermal and thermal transfer are often confused. Direct thermal is unsuitable for long-lasting asset labels because the heat-sensitive paper yellows and fades over time.'}},
{id:'hw-16', a:'hw', t:'in', f:[{v:'10101100'},{v:'AC'},{v:63, tol:0}],
 de:{s:'An einer Industriesteuerung in der Produktion wird die Geräteadresse über acht DIP-Schalter binär eingestellt (Schalter 8 = höchstwertiges Bit). Die Konfigurationssoftware zeigt Adressen hexadezimal an. Laut Adressplan soll die Steuerung die Adresse 172 (dezimal) erhalten. Eine zweite Steuerung meldet sich in der Software mit der Adresse 3F (hexadezimal).',
     q:'Geben Sie die Adresse 172 als 8-stellige Binärzahl und als Hexadezimalzahl (ohne Präfix 0x) an. Welcher Dezimaladresse entspricht 3F?',
     l:['172 binär (8 Bit)','172 hexadezimal','3F dezimal'],
     e:'172 = 128 + 32 + 8 + 4 → 1010 1100. Jede Vierergruppe (Nibble) ergibt eine Hex-Ziffer: 1010 = A, 1100 = C → AC. 3F = 3 × 16 + 15 = 63.',
     n:'Häufiger Fehler: bei der Umrechnung nach Hex die Dezimalziffern einzeln umzuwandeln (z. B. „172“ → „1 7 2“). Richtig ist, die Binärzahl in Vierergruppen zu teilen oder fortlaufend durch 16 zu dividieren.'},
 en:{s:'On an industrial controller in production, the device address is set in binary via eight DIP switches (switch 8 = most significant bit). The configuration software displays addresses in hexadecimal. According to the address plan, the controller is to receive address 172 (decimal). A second controller appears in the software with address 3F (hexadecimal).',
     q:'State address 172 as an 8-digit binary number and as a hexadecimal number (without the prefix 0x). Which decimal address corresponds to 3F?',
     l:['172 binary (8 bits)','172 hexadecimal','3F decimal'],
     e:'172 = 128 + 32 + 8 + 4 → 1010 1100. Each group of four bits (nibble) gives one hex digit: 1010 = A, 1100 = C → AC. 3F = 3 × 16 + 15 = 63.',
     n:'Common mistake: converting the decimal digits to hex one by one (e.g. "172" → "1 7 2"). The correct way is to split the binary number into groups of four or to divide repeatedly by 16.'}},
{id:'hw-17', a:'hw', t:'sc', c:0,
 de:{s:'Sie rüsten einen fünf Jahre alten Büro-PC mit einer M.2-2280-NVMe-SSD auf und setzen sie in den einzigen M.2-Steckplatz. Weder das UEFI-Setup noch das Windows-Setup zeigt die SSD an. Im Mainboard-Handbuch steht zum Steckplatz: „M.2 Socket 3, M-Key, Typ 2242/2260/2280, nur SATA-Modus“.',
     q:'Was ist die Ursache?',
     o:['Der Steckplatz ist nur mit SATA angebunden – eine NVMe-SSD benötigt PCIe-Lanes am M.2-Steckplatz','Die SSD muss zuerst unter Windows mit GPT initialisiert werden, bevor UEFI und Setup sie erkennen','Die SSD ist mit 80 mm zu lang für den Steckplatz','Der SATA-Controller muss im UEFI von AHCI auf IDE umgestellt werden'],
     e:'M.2 beschreibt nur Formfaktor und Stecker. Ob ein Steckplatz SATA, PCIe/NVMe oder beides unterstützt, legt das Mainboard fest. Hier passt nur eine M.2-SATA-SSD – alternativ eine NVMe-SSD auf einer PCIe-Adapterkarte, sofern das UEFI davon booten kann.',
     n:'Eine nicht initialisierte SSD wird im UEFI trotzdem als Gerät gelistet und erscheint im Windows-Setup als „nicht zugewiesener Speicher“. Wird sie nirgends angezeigt, fehlt die elektrische Anbindung.'},
 en:{s:'You upgrade a five-year-old office PC with an M.2 2280 NVMe SSD and insert it into the only M.2 slot. Neither UEFI setup nor Windows setup shows the SSD. The mainboard manual says about the slot: "M.2 Socket 3, M key, type 2242/2260/2280, SATA mode only".',
     q:'What is the cause?',
     o:['The slot is wired to SATA only – an NVMe SSD needs PCIe lanes on the M.2 slot','The SSD must first be initialised with GPT in Windows before UEFI and setup recognise it','At 80 mm the SSD is too long for the slot','The SATA controller must be switched from AHCI to IDE in the UEFI'],
     e:'M.2 only describes the form factor and connector. Whether a slot supports SATA, PCIe/NVMe or both is determined by the mainboard. Only an M.2 SATA SSD fits here – alternatively an NVMe SSD on a PCIe adapter card, provided the UEFI can boot from it.',
     n:'An uninitialised SSD is still listed as a device in the UEFI and appears in Windows setup as "unallocated space". If it is not shown anywhere, the electrical connection is missing.'}},
{id:'hw-18', a:'hw', t:'mc', c:[0,1,2],
 de:{s:'Für eine Büro-Workstation haben Sie mit einem Messgerät eine maximale Leistungsaufnahme des Gesamtsystems von 190 W unter Volllast gemessen. Ein Kollege schlägt „zur Sicherheit“ ein 1.200-W-Netzteil vor.',
     q:'Welche Aussagen zur Auswahl des Netzteils sind zutreffend? (Mehrere Antworten)',
     o:['Die Nennleistung gibt an, wie viel Leistung das Netzteil dauerhaft abgeben kann – der PC entnimmt nur so viel, wie er gerade benötigt','Der Wirkungsgrad ist typischerweise im mittleren Lastbereich (um 50 %) am höchsten und sinkt bei sehr geringer Auslastung deutlich','Ein Netzteil mit etwa 400 bis 450 W bietet Reserve für Lastspitzen und Aufrüstungen und arbeitet dabei in einem effizienten Lastbereich','Ein 1.200-W-Netzteil entnimmt dem Stromnetz ständig 1.200 W und verursacht dadurch hohe Stromkosten','Die 80-PLUS-Stufe (z. B. Gold) gibt die maximale Ausgangsleistung des Netzteils an'],
