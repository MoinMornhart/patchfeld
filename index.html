     n:'People often assume the server sends first – but the client knows no server and has to find one by broadcast.'}},
{id:'dienste-02', a:'dienste', t:'match',
 de:{s:'Sie konfigurieren die Regeln einer Firewall und benötigen die Standardports der Dienste.',
     q:'Ordnen Sie jedem Dienst seinen Standardport zu.',
     p:[['SSH','22/TCP'],['DNS','53/UDP und TCP'],['DHCP-Server','67/UDP'],['HTTPS','443/TCP'],['LDAP','389/TCP'],['RDP','3389/TCP']],
     e:'Diese Ports gehören zum Prüfungsstandard. DNS nutzt UDP für normale Abfragen und TCP für Zonentransfers und große Antworten.',
     n:'DHCP wird gern mit 68 verwechselt – 68/UDP ist der Client-Port, der Server lauscht auf 67.'},
 en:{s:'You configure firewall rules and need the standard ports of the services.',
     q:'Match each service to its standard port.',
     p:[['SSH','22/TCP'],['DNS','53/UDP and TCP'],['DHCP server','67/UDP'],['HTTPS','443/TCP'],['LDAP','389/TCP'],['RDP','3389/TCP']],
     e:'These ports are exam standard. DNS uses UDP for normal queries and TCP for zone transfers and large responses.',
     n:'DHCP is often confused with 68 – 68/UDP is the client port, the server listens on 67.'}},
{id:'dienste-03', a:'dienste', gen:'subnetSplit'},
{id:'dienste-04', a:'dienste', t:'sc', c:0,
 de:{s:'Ein Handwerksbetrieb hat 40 Clients im Netz 192.168.50.0/24 und vom Provider genau eine öffentliche IPv4-Adresse erhalten. Alle Clients sollen gleichzeitig ins Internet.',
     q:'Welche Technik muss der Router einsetzen?',
     o:['PAT (NAT-Overload): viele private Adressen werden über Portnummern auf eine öffentliche Adresse abgebildet','Statisches 1:1-NAT für jeden Client','VLAN-Tagging nach IEEE 802.1Q','Proxy-ARP am WAN-Interface'],
     e:'PAT unterscheidet die Verbindungen über die Quellports, sodass beliebig viele Clients eine öffentliche Adresse teilen können.',
     n:'Statisches NAT bildet eine private auf genau eine öffentliche Adresse ab – dafür bräuchte man 40 öffentliche Adressen.'},
 en:{s:'A trade business has 40 clients in the network 192.168.50.0/24 and received exactly one public IPv4 address from the provider. All clients should access the internet at the same time.',
     q:'Which technique must the router use?',
     o:['PAT (NAT overload): many private addresses are mapped to one public address via port numbers','Static 1:1 NAT for each client','VLAN tagging according to IEEE 802.1Q','Proxy ARP on the WAN interface'],
     e:'PAT distinguishes connections by source port, so many clients can share one public address.',
     n:'Static NAT maps one private to exactly one public address – you would need 40 public addresses.'}},
{id:'dienste-05', a:'dienste', t:'sc', c:0,
 de:{s:'Auf einem Switch wurden VLAN 10 (Verwaltung) und VLAN 20 (Produktion) eingerichtet. PCs in VLAN 10 können Server in VLAN 20 nicht erreichen, innerhalb der VLANs funktioniert alles.',
     q:'Was fehlt für die Kommunikation zwischen den VLANs?',
     o:['Ein Router bzw. Layer-3-Switch für Inter-VLAN-Routing','Ein zweiter DHCP-Server in VLAN 20','Ein Trunk-Port zwischen zwei Access-Ports desselben Switches','Das Spanning Tree Protocol'],
     e:'VLANs sind getrennte Broadcast-Domänen und damit getrennte IP-Netze. Zwischen Netzen muss geroutet werden – per Router-on-a-Stick oder Layer-3-Switch mit SVIs.',
     n:'Ein Trunk transportiert mehrere VLANs über eine Leitung, verbindet sie aber nicht logisch miteinander.'},
 en:{s:'VLAN 10 (administration) and VLAN 20 (production) were configured on a switch. PCs in VLAN 10 cannot reach servers in VLAN 20; within each VLAN everything works.',
     q:'What is missing for communication between the VLANs?',
     o:['A router or layer-3 switch for inter-VLAN routing','A second DHCP server in VLAN 20','A trunk port between two access ports of the same switch','The Spanning Tree Protocol'],
     e:'VLANs are separate broadcast domains and thus separate IP networks. Traffic between networks must be routed – via router-on-a-stick or a layer-3 switch with SVIs.',
     n:'A trunk carries several VLANs over one link but does not connect them logically.'}}
);

/* ===== BEREICH:ad – Active Directory & Rechte (2. Lehrjahr) ===== */
Q.push(
{id:'ad-01', a:'ad', t:'sc', c:0,
 de:{s:'Auf dem Fileserver ist der Ordner „Projekte“ freigegeben. Freigabeberechtigung: Jeder – Lesen. NTFS-Berechtigung: Gruppe G_Projekt – Ändern. Frau Kaya ist Mitglied von G_Projekt und greift über das Netzwerk zu.',
     q:'Welche effektive Berechtigung hat Frau Kaya?',
     o:['Lesen','Ändern','Vollzugriff','Kein Zugriff'],
     e:'Beim Zugriff über das Netzwerk werden Freigabe- und NTFS-Berechtigung verglichen, und die restriktivere gilt. Deshalb setzt man Freigaben meist großzügig und steuert über NTFS.',
     n:'„Ändern“ ist ihre NTFS-Berechtigung und gilt bei lokaler Anmeldung am Server – über die Freigabe wird sie auf Lesen begrenzt.'},
 en:{s:'On the file server the folder "Projects" is shared. Share permission: Everyone – Read. NTFS permission: group G_Project – Modify. Ms Kaya is a member of G_Project and accesses it over the network.',
     q:'What is Ms Kaya\'s effective permission?',
     o:['Read','Modify','Full control','No access'],
     e:'For network access, share and NTFS permissions are compared and the more restrictive one applies. That is why shares are usually set generously and control is done via NTFS.',
     n:'"Modify" is her NTFS permission and applies when logged on locally at the server – through the share it is limited to Read.'}},
{id:'ad-02', a:'ad', t:'order',
 de:{s:'Sie richten nach dem AGDLP-Prinzip den Zugriff der Vertriebsmitarbeiter auf einen Ordner ein.',
     q:'Bringen Sie die Elemente in die Reihenfolge, in der sie verschachtelt werden.',
     o:['Benutzerkonto (Account)','Globale Gruppe, z. B. G_Vertrieb','Domänenlokale Gruppe, z. B. DL_Angebote_Ändern','Berechtigung (Permission) auf die Ressource'],
     e:'Benutzer kommen in globale Gruppen (nach Rolle), globale in domänenlokale Gruppen (nach Ressource und Recht), und nur die domänenlokale Gruppe erhält die Berechtigung.',
     n:'Häufig werden Benutzer direkt auf den Ordner berechtigt – das funktioniert, wird aber bei vielen Ordnern unübersichtlich und fehleranfällig.'},
 en:{s:'Following the AGDLP principle, you set up access for the sales staff to a folder.',
     q:'Put the elements in the order in which they are nested.',
     o:['User account (Account)','Global group, e.g. G_Sales','Domain local group, e.g. DL_Offers_Modify','Permission on the resource'],
     e:'Users go into global groups (by role), global groups into domain local groups (by resource and right), and only the domain local group receives the permission.',
     n:'Users are often granted rights directly on the folder – it works, but becomes confusing and error-prone with many folders.'}},
{id:'ad-03', a:'ad', t:'sc', c:0,
 de:{s:'Eine lokale Richtlinie setzt das Hintergrundbild „grün“, eine GPO auf Domänenebene „blau“ und eine GPO auf der OU „Vertrieb“ „rot“. Keine GPO ist erzwungen oder blockiert.',
     q:'Welches Hintergrundbild sieht ein Benutzer der OU „Vertrieb“?',
     o:['Rot','Blau','Grün','Das zuerst angewendete'],
     e:'Verarbeitungsreihenfolge LSDOU: Lokal, Site, Domäne, OU. Die zuletzt angewendete Einstellung gewinnt – das ist die GPO der OU.',
     n:'Die Domänen-GPO wirkt „höherrangig“, wird aber von der später verarbeiteten OU-GPO überschrieben, solange sie nicht erzwungen ist.'},
 en:{s:'A local policy sets the wallpaper to "green", a domain-level GPO to "blue" and a GPO on the OU "Sales" to "red". No GPO is enforced or blocked.',
     q:'Which wallpaper does a user in the OU "Sales" see?',
     o:['Red','Blue','Green','The one applied first'],
     e:'Processing order LSDOU: local, site, domain, OU. The setting applied last wins – that is the OU\'s GPO.',
     n:'The domain GPO seems "higher ranking", but it is overwritten by the OU GPO processed later unless it is enforced.'}},
{id:'ad-04', a:'ad', t:'mc', c:[0,1,2],
 de:{s:'Die Geschäftsleitung fragt, warum für die neue Domäne mindestens zwei Domänencontroller eingeplant sind.',
     q:'Welche Aufgaben übernimmt ein Domänencontroller? (Mehrere Antworten)',
     o:['Authentifizierung der Benutzer per Kerberos','Speicherung und Replikation der AD-Datenbank','Bereitstellung der Gruppenrichtlinien über SYSVOL','Routing zwischen den VLANs der Domäne'],
     e:'Der DC authentifiziert, hält das Verzeichnis und verteilt GPOs. Fällt der einzige DC aus, kann sich niemand mehr anmelden – daher Redundanz.',
     n:'Routing ist Aufgabe von Routern oder Layer-3-Switches, nicht des Domänencontrollers.'},
 en:{s:'Management asks why at least two domain controllers are planned for the new domain.',
     q:'Which tasks does a domain controller perform? (Multiple answers)',
     o:['Authenticating users via Kerberos','Storing and replicating the AD database','Providing group policies via SYSVOL','Routing between the domain\'s VLANs'],
     e:'The DC authenticates, holds the directory and distributes GPOs. If the only DC fails, nobody can log on – hence redundancy.',
     n:'Routing is the job of routers or layer-3 switches, not the domain controller.'}},
{id:'ad-05', a:'ad', t:'open',
 de:{s:'Der Leiter der Konstruktion verlangt: „Geben Sie meinen Leuten einfach Vollzugriff auf alle Laufwerke, dann ruft keiner mehr bei Ihnen an.“',
     q:'Wie argumentieren Sie fachlich und welche Lösung schlagen Sie vor?',
     m:'Ablehnung mit Begründung:\n• Prinzip der minimalen Rechte (Least Privilege, Need-to-know).\n• Vollzugriff erlaubt auch Rechteänderungen und Löschen – Ransomware oder Fehlbedienung verschlüsselt/löscht dann alle Laufwerke.\n• Vertrauliche Daten anderer Abteilungen (z. B. Personal) wären offen – Datenschutzverstoß.\nLösung: Rollenkonzept mit Gruppen (AGDLP), Recht „Ändern“ auf die benötigten Projektordner, dokumentierter Antragsprozess für weitere Freigaben.',
     k:['Least Privilege / Need-to-know','Risiko Löschen, Ransomware','Datenschutz / vertrauliche Daten','Gruppenbasiertes Rollenkonzept','„Ändern“ statt Vollzugriff','Freigabeprozess dokumentieren']},
 en:{s:'The head of engineering demands: "Just give my people full control on all drives, then nobody will call you any more."',
     q:'How do you argue professionally and what solution do you propose?',
     m:'Decline with reasons:\n• Principle of least privilege (need-to-know).\n• Full control also allows changing permissions and deleting – ransomware or a mistake would then encrypt/delete all drives.\n• Confidential data of other departments (e.g. HR) would be exposed – a data protection breach.\nSolution: role concept with groups (AGDLP), "Modify" on the required project folders, documented request process for further access.',
     k:['Least privilege / need-to-know','Risk of deletion, ransomware','Data protection / confidential data','Group-based role concept','"Modify" instead of full control','Documented request process']}}
);
</script>

<script>
/* ===== BEREICH:linux – Linux-Administration (2. Lehrjahr) ===== */
Q.push(
{id:'linux-01', a:'linux', t:'sc', c:0,
 de:{s:'Das Skript /opt/backup.sh soll vom Besitzer gelesen, geändert und ausgeführt werden können, von der Gruppe „backup“ nur gelesen und ausgeführt, von allen anderen gar nicht.',
     q:'Mit welchem Befehl setzen Sie die Rechte?',
     o:['chmod 750 /opt/backup.sh','chmod 755 /opt/backup.sh','chmod 740 /opt/backup.sh','chmod 570 /opt/backup.sh'],
     e:'Besitzer rwx = 4+2+1 = 7, Gruppe r-x = 4+1 = 5, andere --- = 0 → 750.',
     n:'755 ist der Standardwert für Skripte, gibt aber auch allen anderen Lese- und Ausführungsrechte.'},
 en:{s:'The script /opt/backup.sh should be readable, writable and executable by the owner, only readable and executable by the group "backup", and not accessible to anyone else.',
     q:'Which command sets the permissions?',
     o:['chmod 750 /opt/backup.sh','chmod 755 /opt/backup.sh','chmod 740 /opt/backup.sh','chmod 570 /opt/backup.sh'],
     e:'Owner rwx = 4+2+1 = 7, group r-x = 4+1 = 5, others --- = 0 → 750.',
     n:'755 is the usual default for scripts but also gives everybody else read and execute rights.'}},
{id:'linux-02', a:'linux', gen:'permOctal'},
{id:'linux-03', a:'linux', t:'match',
 de:{s:'Sie arbeiten einen neuen Kollegen in die Administration eines Ubuntu-Servers ein.',
     q:'Ordnen Sie jedem Befehl seine Aufgabe zu.',
     p:[['systemctl','Dienste starten, stoppen und für den Systemstart aktivieren'],['apt','Pakete installieren und aktualisieren (Debian/Ubuntu)'],['journalctl','Protokolle des systemd-Journals anzeigen'],['chown','Besitzer und Gruppe einer Datei ändern'],['ip a','Netzwerkschnittstellen und IP-Adressen anzeigen'],['grep','Text nach einem Muster durchsuchen']],
     e:'Diese Befehle gehören zum Alltagswerkzeug: systemctl steuert Units, journalctl liest die zugehörigen Logs, apt verwaltet Pakete.',
     n:'chown wird oft mit chmod verwechselt – chmod ändert die Rechte, chown den Besitzer.'},
 en:{s:'You are introducing a new colleague to administering an Ubuntu server.',
     q:'Match each command to its task.',
     p:[['systemctl','Start, stop and enable services at boot'],['apt','Install and update packages (Debian/Ubuntu)'],['journalctl','Show logs of the systemd journal'],['chown','Change owner and group of a file'],['ip a','Show network interfaces and IP addresses'],['grep','Search text for a pattern']],
     e:'These commands are everyday tools: systemctl controls units, journalctl reads their logs, apt manages packages.',
     n:'chown is often confused with chmod – chmod changes permissions, chown the owner.'}},
{id:'linux-04', a:'linux', t:'sc', c:0,
 de:{s:'Nach der Installation von nginx läuft der Webserver. Nach einem Neustart des Servers ist er jedoch nicht mehr erreichbar.',
     q:'Mit welchem Befehl stellen Sie sicher, dass nginx beim Booten automatisch startet?',
     o:['sudo systemctl enable nginx','sudo systemctl start nginx','sudo systemctl reload nginx','sudo apt install --reinstall nginx'],
     e:'enable legt die Verknüpfung im Ziel (z. B. multi-user.target) an, sodass der Dienst bei jedem Start geladen wird. Mit enable --now wird er zusätzlich sofort gestartet.',
     n:'start startet den Dienst nur für die laufende Sitzung – nach dem nächsten Neustart ist er wieder aus.'},
 en:{s:'After installing nginx the web server runs. After a server reboot, however, it is no longer reachable.',
     q:'Which command ensures that nginx starts automatically at boot?',
     o:['sudo systemctl enable nginx','sudo systemctl start nginx','sudo systemctl reload nginx','sudo apt install --reinstall nginx'],
     e:'enable creates the link in the target (e.g. multi-user.target) so the service is loaded at every boot. enable --now also starts it immediately.',
     n:'start only starts the service for the current session – after the next reboot it is off again.'}},
{id:'linux-05', a:'linux', t:'order',
 de:{s:'Die Anmeldung am Linux-Server soll von Passwort auf SSH-Schlüssel umgestellt werden, ohne sich dabei auszusperren.',
     q:'Bringen Sie die Schritte in die richtige Reihenfolge.',
     o:['Schlüsselpaar auf dem Admin-PC mit ssh-keygen erzeugen','Öffentlichen Schlüssel mit ssh-copy-id auf den Server übertragen','Anmeldung mit dem Schlüssel in einer zweiten Sitzung testen','In /etc/ssh/sshd_config „PasswordAuthentication no“ setzen','SSH-Dienst neu laden und erneut testen'],
     e:'Erst wenn die Schlüsselanmeldung nachweislich funktioniert, wird die Passwortanmeldung abgeschaltet. Die bestehende Sitzung bleibt als Rückweg offen.',
     n:'Wer die Passwortanmeldung zuerst deaktiviert, sperrt sich aus, falls der Schlüssel nicht korrekt hinterlegt wurde.'},
 en:{s:'Logon to the Linux server is to be switched from password to SSH keys without locking yourself out.',
     q:'Put the steps in the correct order.',
     o:['Create a key pair on the admin PC with ssh-keygen','Copy the public key to the server with ssh-copy-id','Test logon with the key in a second session','Set "PasswordAuthentication no" in /etc/ssh/sshd_config','Reload the SSH service and test again'],
     e:'Password logon is only disabled once key logon demonstrably works. The existing session stays open as a way back.',
     n:'Disabling password logon first locks you out if the key was not installed correctly.'}}
);

/* ===== BEREICH:speicher – Speicher & Virtualisierung (2. Lehrjahr) ===== */
Q.push(
{id:'speicher-01', a:'speicher', gen:'raid'},
{id:'speicher-02', a:'speicher', t:'match',
 de:{s:'Ein Kunde möchte wissen, welches RAID-Level für welchen Zweck geeignet ist.',
     q:'Ordnen Sie jedem RAID-Level die zutreffende Eigenschaft zu.',
     p:[['RAID 0','Striping ohne Redundanz, maximale Geschwindigkeit'],['RAID 1','Spiegelung, 50 % Nettokapazität'],['RAID 5','Verteilte Parität, eine Platte darf ausfallen'],['RAID 6','Doppelte Parität, zwei Platten dürfen ausfallen'],['RAID 10','Gestripte Spiegel, mindestens vier Platten']],
     e:'RAID 5 und 6 sind kapazitätseffizient, RAID 10 bietet hohe Schreibleistung und schnelle Rebuilds, RAID 0 bietet keinerlei Ausfallschutz.',
     n:'RAID 0 wird wegen der Null oft für „kein RAID“ gehalten – es verteilt Daten, erhöht aber das Ausfallrisiko.'},
 en:{s:'A customer wants to know which RAID level suits which purpose.',
     q:'Match each RAID level to the right property.',
     p:[['RAID 0','Striping without redundancy, maximum speed'],['RAID 1','Mirroring, 50 % net capacity'],['RAID 5','Distributed parity, one disk may fail'],['RAID 6','Double parity, two disks may fail'],['RAID 10','Striped mirrors, at least four disks']],
     e:'RAID 5 and 6 are capacity-efficient, RAID 10 offers high write performance and fast rebuilds, RAID 0 offers no fault tolerance at all.',
     n:'Because of the zero, RAID 0 is often taken for "no RAID" – it distributes data but increases the risk of failure.'}},
{id:'speicher-03', a:'speicher', t:'sc', c:0,
 de:{s:'Für einen Cluster aus drei Hyper-V-Hosts wird ein gemeinsamer Speicher benötigt, auf dem die VM-Festplatten blockbasiert liegen, damit VMs per Live-Migration zwischen den Hosts wandern können.',
     q:'Welche Speicherlösung passt?',
     o:['SAN, angebunden per iSCSI oder Fibre Channel','NAS mit einer SMB-Freigabe für Benutzerdaten','DAS per USB an einem der Hosts','Ein Cloud-Synchronisationsordner'],
     e:'Ein SAN stellt Speicher als Block-Device (LUN) bereit, das alle Hosts gemeinsam nutzen können – Grundlage für Cluster und Live-Migration.',
     n:'Ein NAS stellt Speicher dateibasiert (SMB/NFS) bereit. Das ist für Freigaben ideal, erfüllt aber nicht die Anforderung „blockbasiert“.'},
 en:{s:'A cluster of three Hyper-V hosts needs shared storage on which the VM disks reside block-based, so that VMs can be live-migrated between hosts.',
     q:'Which storage solution fits?',
     o:['SAN, connected via iSCSI or Fibre Channel','NAS with an SMB share for user data','DAS via USB on one of the hosts','A cloud sync folder'],
     e:'A SAN provides storage as a block device (LUN) that all hosts can share – the basis for clustering and live migration.',
     n:'A NAS provides file-based storage (SMB/NFS). Ideal for shares, but it does not meet the "block-based" requirement.'}},
{id:'speicher-04', a:'speicher', t:'sc', c:0,
 de:{s:'Ein Kollege schlägt vor: „Ein separates Backup brauchen wir nicht mehr, wir erstellen ja jede Nacht Snapshots aller VMs.“',
     q:'Wie bewerten Sie diesen Vorschlag?',
     o:['Nicht ausreichend – Snapshots liegen auf demselben Speicher und hängen von der Basisdisk ab; ein Backup muss unabhängig davon existieren','Ausreichend, weil Snapshots den kompletten VM-Zustand enthalten','Ausreichend, sofern die Snapshots mindestens 30 Tage aufbewahrt werden','Nicht ausreichend, weil Snapshots nur Konfigurationsdateien sichern'],
     e:'Fällt das Storage aus oder wird es verschlüsselt, sind VM und Snapshots gleichzeitig verloren. Lange Snapshot-Ketten verschlechtern zudem die Performance.',
     n:'Richtig ist, dass Snapshots den kompletten Zustand abbilden – das macht sie aber nicht unabhängig vom Originalspeicher.'},
 en:{s:'A colleague suggests: "We no longer need a separate backup – we take snapshots of all VMs every night."',
     q:'How do you assess this suggestion?',
     o:['Not sufficient – snapshots reside on the same storage and depend on the base disk; a backup must exist independently','Sufficient, because snapshots contain the complete VM state','Sufficient, provided the snapshots are kept for at least 30 days','Not sufficient, because snapshots only save configuration files'],
     e:'If the storage fails or is encrypted, VM and snapshots are lost at the same time. Long snapshot chains also degrade performance.',
     n:'It is true that snapshots capture the full state – but that does not make them independent of the original storage.'}},
{id:'speicher-05', a:'speicher', t:'mc', c:[0,1],
 de:{s:'Für die Server-Virtualisierung eines Mittelständlers vergleichen Sie Hypervisor-Typen.',
     q:'Welche Aussagen zu Typ-1-Hypervisoren treffen zu? (Mehrere Antworten)',
     o:['Sie laufen direkt auf der Hardware (Bare Metal)','Beispiele sind VMware ESXi, Microsoft Hyper-V und Proxmox VE','Sie benötigen ein vollwertiges Desktop-Betriebssystem als Unterbau','Oracle VirtualBox ist ein typischer Typ-1-Hypervisor'],
     e:'Typ 1 hat direkten Hardwarezugriff, ist dadurch performant und für Server geeignet. Typ 2 läuft als Anwendung auf einem Host-Betriebssystem.',
     n:'VirtualBox ist ein verbreiteter Hypervisor, aber ein Typ-2-Hypervisor – er läuft als Programm unter Windows, macOS oder Linux.'},
 en:{s:'For a medium-sized company\'s server virtualisation you compare hypervisor types.',
     q:'Which statements about type-1 hypervisors are correct? (Multiple answers)',
     o:['They run directly on the hardware (bare metal)','Examples are VMware ESXi, Microsoft Hyper-V and Proxmox VE','They require a full desktop operating system underneath','Oracle VirtualBox is a typical type-1 hypervisor'],
     e:'Type 1 has direct hardware access, is therefore performant and suited to servers. Type 2 runs as an application on a host operating system.',
     n:'VirtualBox is a widespread hypervisor, but type 2 – it runs as a program on Windows, macOS or Linux.'}}
);
</script>

<script>
/* ===== BEREICH:sec – IT-Sicherheit (2. Lehrjahr) ===== */
Q.push(
{id:'sec-01', a:'sec', t:'match',
 de:{s:'Im Rahmen einer Schutzbedarfsanalyse ordnen Sie Vorfälle den verletzten Schutzzielen zu.',
     q:'Welches Schutzziel ist jeweils in erster Linie verletzt?',
     p:[['Ein Praktikant kann Gehaltslisten einsehen','Vertraulichkeit'],['Ein Angreifer ändert unbemerkt Kontonummern in Rechnungen','Integrität'],['Der Webshop ist wegen eines DDoS-Angriffs nicht erreichbar','Verfügbarkeit'],['Eine E-Mail gibt sich fälschlich als Nachricht der Geschäftsführung aus','Authentizität']],
     e:'Vertraulichkeit schützt vor unbefugtem Lesen, Integrität vor unbemerkter Veränderung, Verfügbarkeit sichert die Nutzbarkeit, Authentizität die Echtheit von Absender und Daten.',
     n:'Die gefälschte Chef-Mail wird oft der Integrität zugeordnet – verändert wird aber nichts, es wird eine falsche Herkunft vorgetäuscht.'},
 en:{s:'As part of a protection needs analysis you map incidents to the violated security goals.',
     q:'Which security goal is primarily violated in each case?',
     p:[['An intern can view salary lists','Confidentiality'],['An attacker silently changes account numbers in invoices','Integrity'],['The web shop is unreachable due to a DDoS attack','Availability'],['An e-mail falsely claims to come from the managing director','Authenticity']],
     e:'Confidentiality protects against unauthorised reading, integrity against unnoticed modification, availability ensures usability, authenticity the genuineness of sender and data.',
     n:'The fake CEO e-mail is often mapped to integrity – but nothing is altered; a false origin is faked.'}},
{id:'sec-02', a:'sec', t:'order',
 de:{s:'Montagmorgen: Auf mehreren Clients erscheint eine Lösegeldforderung, Dateien auf dem Fileserver haben die Endung „.locked“.',
     q:'Bringen Sie die Reaktion in eine sinnvolle Reihenfolge.',
     o:['Betroffene Systeme vom Netz trennen, aber nicht ausschalten','IT-Sicherheitsverantwortliche bzw. Notfallteam alarmieren','Ausmaß ermitteln und Spuren (Logs, Speicherabbilder) sichern','Systeme neu aufsetzen und Daten aus einem sauberen Backup wiederherstellen','Ursache analysieren, Lücke schließen und Lessons Learned dokumentieren'],
     e:'Isolieren stoppt die Ausbreitung, eingeschaltete Systeme behalten Spuren im Arbeitsspeicher. Wiederhergestellt wird erst, wenn Ausmaß und Einfallstor bekannt sind. Parallel sind Meldepflichten (z. B. 72 h DSGVO) zu prüfen.',
     n:'Sofort aus dem Backup wiederherzustellen wirkt schnell, doch ohne Analyse ist der Angreifer oft noch im Netz und verschlüsselt erneut.'},
 en:{s:'Monday morning: several clients show a ransom demand, files on the file server have the extension ".locked".',
     q:'Put the response in a sensible order.',
     o:['Disconnect affected systems from the network but do not switch them off','Alert the IT security officer or incident response team','Determine the scope and secure evidence (logs, memory images)','Rebuild systems and restore data from a clean backup','Analyse the root cause, close the gap and document lessons learned'],
     e:'Isolation stops the spread; running systems keep traces in memory. Restoration only happens once scope and entry point are known. In parallel, reporting obligations (e.g. 72 h GDPR) must be checked.',
     n:'Restoring from backup immediately seems fast, but without analysis the attacker is often still in the network and encrypts again.'}},
{id:'sec-03', a:'sec', t:'sc', c:0,
 de:{s:'Ein Unternehmen möchte seinen Webserver aus dem Internet erreichbar machen, ohne das interne Netz zu gefährden.',
     q:'Wo platzieren Sie den Webserver?',
     o:['In einer DMZ zwischen äußerer und innerer Firewall bzw. an einem eigenen Firewall-Interface','Im internen LAN mit einer Portweiterleitung für 443/TCP','Im WLAN-Gastnetz','Direkt am Internetanschluss ohne Firewall, damit er schnell ist'],
     e:'In der DMZ sind öffentlich erreichbare Dienste vom LAN getrennt. Wird der Webserver kompromittiert, blockiert die innere Firewall den Weg ins interne Netz.',
     n:'Die Portweiterleitung ins LAN funktioniert technisch, doch ein gehackter Webserver stünde dann mitten im internen Netz.'},
 en:{s:'A company wants to make its web server reachable from the internet without endangering the internal network.',
     q:'Where do you place the web server?',
     o:['In a DMZ between outer and inner firewall or on a dedicated firewall interface','In the internal LAN with a port forward for 443/TCP','In the guest Wi-Fi network','Directly on the internet connection without a firewall, so that it is fast'],
     e:'In the DMZ publicly reachable services are separated from the LAN. If the web server is compromised, the inner firewall blocks the way into the internal network.',
     n:'Port forwarding into the LAN works technically, but a hacked web server would then sit in the middle of the internal network.'}},
{id:'sec-04', a:'sec', t:'sc', c:0,
 de:{s:'Ein Mitarbeiter soll einem Kunden einen vertraulichen Vertrag per E-Mail senden. Ein gemeinsamer geheimer Schlüssel wurde vorher nicht vereinbart.',
     q:'Wie wird die Nachricht korrekt verschlüsselt?',
     o:['Mit dem öffentlichen Schlüssel des Empfängers (z. B. S/MIME oder OpenPGP)','Mit dem eigenen privaten Schlüssel des Absenders','Symmetrisch mit AES, das Passwort steht in derselben E-Mail','Durch Bilden eines SHA-256-Hashwerts'],
     e:'Was mit dem öffentlichen Schlüssel des Empfängers verschlüsselt wurde, kann nur dessen privater Schlüssel entschlüsseln. So entfällt der vorherige Schlüsselaustausch.',
     n:'Mit dem eigenen privaten Schlüssel wird signiert, nicht verschlüsselt – jeder mit dem öffentlichen Schlüssel des Absenders könnte die Nachricht lesen.'},
 en:{s:'An employee is to send a confidential contract to a customer by e-mail. No shared secret key was agreed beforehand.',
     q:'How is the message encrypted correctly?',
     o:['With the recipient\'s public key (e.g. S/MIME or OpenPGP)','With the sender\'s own private key','Symmetrically with AES, the password is in the same e-mail','By calculating a SHA-256 hash'],
     e:'What is encrypted with the recipient\'s public key can only be decrypted with their private key. No prior key exchange is needed.',
     n:'The own private key is used for signing, not encryption – anyone with the sender\'s public key could read the message.'}},
{id:'sec-05', a:'sec', t:'mc', c:[0,1,2],
 de:{s:'Sie überarbeiten das Backup-Konzept einer Arztpraxis nach der 3-2-1-Regel.',
     q:'Welche Aussagen beschreiben die Regel richtig? (Mehrere Antworten)',
     o:['Es gibt mindestens drei Kopien der Daten','Die Kopien liegen auf mindestens zwei unterschiedlichen Medientypen','Mindestens eine Kopie wird außer Haus bzw. offline aufbewahrt','Es werden drei Backups pro Tag erstellt','Zwei Administratoren prüfen jedes Backup'],
     e:'Drei Kopien (Original plus zwei Backups), zwei Medientypen, eine Kopie außer Haus – so übersteht man Hardwaredefekt, Brand und Ransomware. Heute oft ergänzt: eine Kopie unveränderlich (immutable).',
     n:'„Drei Backups pro Tag“ beschreibt die Häufigkeit, nicht die Anzahl unabhängiger Kopien – darum geht es bei der Regel nicht.'},
 en:{s:'You revise the backup concept of a medical practice according to the 3-2-1 rule.',
     q:'Which statements describe the rule correctly? (Multiple answers)',
     o:['There are at least three copies of the data','The copies are on at least two different media types','At least one copy is kept off-site or offline','Three backups are created per day','Two administrators check every backup'],
     e:'Three copies (original plus two backups), two media types, one copy off-site – survives hardware failure, fire and ransomware. Today often extended: one copy immutable.',
     n:'"Three backups per day" describes frequency, not the number of independent copies – that is not what the rule is about.'}}
);

/* ===== BEREICH:ds – Datenschutz (2. Lehrjahr) ===== */
Q.push(
{id:'ds-01', a:'ds', t:'mc', c:[0,1,2],
 de:{s:'Die Marketingabteilung möchte zu jedem Webshop-Kunden künftig Geburtsdatum, Familienstand und Einkommen erfassen – „man weiß ja nie, wofür man es braucht“.',
     q:'Gegen welche Grundsätze nach Art. 5 DSGVO verstößt das Vorhaben? (Mehrere Antworten)',
     o:['Zweckbindung','Datenminimierung','Speicherbegrenzung','Vorratsdatenspeicherung','Gewinnmaximierung'],
     e:'Daten dürfen nur für festgelegte Zwecke erhoben werden (Zweckbindung), nur so viele wie nötig (Datenminimierung) und nur so lange wie nötig (Speicherbegrenzung).',
     n:'„Vorratsdatenspeicherung“ klingt nach einem DSGVO-Begriff, ist aber kein Grundsatz – sie ist genau das, was die Grundsätze verhindern sollen.'},
 en:{s:'The marketing department wants to record date of birth, marital status and income for every web shop customer – "you never know what it might be good for".',
     q:'Which principles of Art. 5 GDPR does the plan violate? (Multiple answers)',
     o:['Purpose limitation','Data minimisation','Storage limitation','Data retention','Profit maximisation'],
     e:'Data may only be collected for specified purposes (purpose limitation), only as much as necessary (minimisation) and only as long as necessary (storage limitation).',
     n:'"Data retention" sounds like a GDPR term but is not a principle – it is exactly what the principles are meant to prevent.'}},
{id:'ds-02', a:'ds', t:'sc', c:0,
 de:{s:'Einem Außendienstmitarbeiter wird im Zug ein unverschlüsseltes Notebook mit Namen, Adressen und Bankverbindungen von 800 Kunden gestohlen.',
     q:'Was gilt für die Meldung an die Datenschutz-Aufsichtsbehörde?',
     o:['Unverzüglich, möglichst binnen 72 Stunden nach Bekanntwerden (Art. 33 DSGVO)','Innerhalb von 14 Tagen nach Abschluss der internen Prüfung','Nur, wenn der Täter die Daten nachweislich missbraucht','Keine Meldung nötig, es handelt sich um einen Diebstahl, nicht um einen Hackerangriff'],
     e:'Eine Datenpanne mit Risiko für die Betroffenen ist binnen 72 Stunden zu melden. Weil unverschlüsselte Bankdaten betroffen sind, müssen wegen des hohen Risikos zusätzlich die Kunden benachrichtigt werden (Art. 34).',
     n:'Viele denken, nur Hackerangriffe seien meldepflichtig – maßgeblich ist aber jede Verletzung des Schutzes personenbezogener Daten, auch Verlust oder Diebstahl.'},
 en:{s:'An unencrypted notebook containing names, addresses and bank details of 800 customers is stolen from a field sales employee on a train.',
     q:'What applies to notifying the data protection supervisory authority?',
     o:['Without undue delay, where feasible within 72 hours of becoming aware (Art. 33 GDPR)','Within 14 days after the internal review is completed','Only if the thief demonstrably misuses the data','No notification needed – it was a theft, not a hacker attack'],
     e:'A data breach posing a risk to data subjects must be reported within 72 hours. As unencrypted bank details are involved, the high risk also requires informing the customers (Art. 34).',
     n:'Many think only hacker attacks are reportable – but any breach of personal data security counts, including loss or theft.'}},
{id:'ds-03', a:'ds', t:'match',
 de:{s:'Beim Kundenservice gehen verschiedene Anfragen zu personenbezogenen Daten ein.',
     q:'Ordnen Sie jeder Anfrage das Betroffenenrecht zu.',
     p:[['„Welche Daten haben Sie über mich gespeichert?“','Auskunft (Art. 15)'],['„Meine Adresse ist falsch hinterlegt.“','Berichtigung (Art. 16)'],['„Löschen Sie mein Kundenkonto vollständig.“','Löschung (Art. 17)'],['„Geben Sie mir meine Daten in einem gängigen Format für einen anderen Anbieter.“','Datenübertragbarkeit (Art. 20)'],['„Ich möchte keine Werbung mehr per Post.“','Widerspruch (Art. 21)']],
     e:'Anfragen müssen grundsätzlich innerhalb eines Monats beantwortet werden. Vor einer Auskunft ist die Identität des Anfragenden zu prüfen.',
     n:'Der Werbewiderspruch wird oft als Löschung behandelt – der Kunde will aber nur eine bestimmte Verarbeitung stoppen, sein Konto soll bestehen bleiben.'},
 en:{s:'Customer service receives various requests concerning personal data.',
     q:'Match each request to the data subject right.',
     p:[['"What data have you stored about me?"','Access (Art. 15)'],['"My address is recorded incorrectly."','Rectification (Art. 16)'],['"Delete my customer account completely."','Erasure (Art. 17)'],['"Give me my data in a common format for another provider."','Data portability (Art. 20)'],['"I no longer want advertising by post."','Objection (Art. 21)']],
     e:'Requests generally have to be answered within one month. Before providing access, the requester\'s identity must be verified.',
     n:'The objection to advertising is often handled as erasure – but the customer only wants to stop one specific processing, the account should remain.'}},
{id:'ds-04', a:'ds', t:'sc', c:0,
 de:{s:'Ihr Betrieb lässt die nächtlichen Backups der Personaldatenbank künftig bei einem externen Rechenzentrumsbetreiber speichern.',
     q:'Welche vertragliche Grundlage ist zwingend erforderlich?',
     o:['Ein Vertrag zur Auftragsverarbeitung (AVV) nach Art. 28 DSGVO','Eine einfache Geheimhaltungsvereinbarung (NDA)','Die schriftliche Einwilligung jedes Mitarbeiters','Keine, weil der Dienstleister die Daten nur speichert'],
     e:'Der Dienstleister verarbeitet personenbezogene Daten weisungsgebunden im Auftrag. Der AVV regelt u. a. Weisungsrecht, technisch-organisatorische Maßnahmen, Unterauftragnehmer und Löschung.',
     n:'Ein NDA regelt nur die Vertraulichkeit, nicht die Pflichten nach Art. 28 – etwa Weisungsbindung, Kontrollrechte und TOM.'},
 en:{s:'In future your company will store the nightly backups of the HR database with an external data centre operator.',
     q:'Which contractual basis is mandatory?',
     o:['A data processing agreement (DPA) under Art. 28 GDPR','A simple non-disclosure agreement (NDA)','Written consent of every employee','None, because the provider only stores the data'],
     e:'The provider processes personal data on your behalf and under your instructions. The DPA covers instructions, technical and organisational measures, sub-processors and deletion.',
     n:'An NDA only covers confidentiality, not the Art. 28 duties – such as instructions, audit rights and TOMs.'}},
{id:'ds-05', a:'ds', t:'open',
 de:{s:'Im Serverraum eines Pflegedienstes stehen Server mit Patienten- und Personaldaten.',
     q:'Nennen Sie vier technisch-organisatorische Maßnahmen (TOM, Art. 32 DSGVO) für diesen Serverraum und ordnen Sie jede einem Schutzziel zu.',
     m:'Beispiele:\n• Zutrittskontrolle mit Chipkarte und Protokollierung → Vertraulichkeit\n• Festplattenverschlüsselung der Server → Vertraulichkeit\n• USV und Klimatisierung → Verfügbarkeit\n• Regelmäßige, getestete Backups außer Haus → Verfügbarkeit\n• Protokollierung von Änderungen, Prüfsummen → Integrität\n• Rollen- und Berechtigungskonzept, Vier-Augen-Prinzip → Vertraulichkeit/Integrität',
     k:['Mindestens vier sinnvolle Maßnahmen','Technische UND organisatorische Maßnahme dabei','Korrekte Zuordnung zu Schutzzielen','Bezug zum Serverraum']},
 en:{s:'The server room of a home care service houses servers with patient and HR data.',
     q:'Name four technical and organisational measures (TOMs, Art. 32 GDPR) for this server room and assign each to a security goal.',
     m:'Examples:\n• Access control with smart card and logging → confidentiality\n• Disk encryption on the servers → confidentiality\n• UPS and air conditioning → availability\n• Regular, tested off-site backups → availability\n• Change logging, checksums → integrity\n• Role and permission concept, four-eyes principle → confidentiality/integrity',
     k:['At least four sensible measures','Includes technical AND organisational measures','Correct mapping to security goals','Relevant to the server room']}}
);

/* ===== BEREICH:sql – Skripting & SQL (2. Lehrjahr) ===== */
Q.push(
{id:'sql-01', a:'sql', t:'sc', c:0,
 de:{s:'Die Inventardatenbank enthält die Tabelle geraete(id, typ, standort, kaufdatum). Gesucht sind alle Notebooks am Standort Köln, das neueste zuerst.',
     q:'Welche Abfrage liefert das gewünschte Ergebnis?',
     o:["SELECT * FROM geraete WHERE typ = 'Notebook' AND standort = 'Köln' ORDER BY kaufdatum DESC;","SELECT * FROM geraete WHERE typ = 'Notebook' OR standort = 'Köln' ORDER BY kaufdatum DESC;","SELECT * FROM geraete WHERE typ = 'Notebook' AND standort = 'Köln' ORDER BY kaufdatum ASC;","SELECT * FROM geraete GROUP BY standort HAVING typ = 'Notebook';"],
     e:'Beide Bedingungen müssen gleichzeitig gelten (AND), und DESC sortiert absteigend – das jüngste Kaufdatum steht oben.',
     n:'Mit OR kämen alle Notebooks aller Standorte plus alle Geräte in Köln – deutlich zu viele Datensätze.'},
 en:{s:'The inventory database contains the table geraete(id, typ, standort, kaufdatum) – devices(id, type, location, purchase date). You need all notebooks at the Cologne site (standort = \'Köln\'), newest first.',
     q:'Which query returns the desired result?',
     o:["SELECT * FROM geraete WHERE typ = 'Notebook' AND standort = 'Köln' ORDER BY kaufdatum DESC;","SELECT * FROM geraete WHERE typ = 'Notebook' OR standort = 'Köln' ORDER BY kaufdatum DESC;","SELECT * FROM geraete WHERE typ = 'Notebook' AND standort = 'Köln' ORDER BY kaufdatum ASC;","SELECT * FROM geraete GROUP BY standort HAVING typ = 'Notebook';"],
     e:'Both conditions must hold at the same time (AND), and DESC sorts descending – the most recent purchase date comes first.',
     n:'With OR you would get all notebooks at every site plus every device in Cologne – far too many rows.'}},
{id:'sql-02', a:'sql', t:'sc', c:0,
 de:{s:'Für die Lizenzplanung wird die Anzahl der Geräte je Standort benötigt – aber nur für Standorte mit mehr als 10 Geräten.',
     q:'Welche Abfrage ist korrekt?',
     o:['SELECT standort, COUNT(*) FROM geraete GROUP BY standort HAVING COUNT(*) > 10;','SELECT standort, COUNT(*) FROM geraete WHERE COUNT(*) > 10 GROUP BY standort;','SELECT standort, COUNT(*) FROM geraete GROUP BY COUNT(*) > 10;','SELECT standort FROM geraete HAVING standort > 10;'],
     e:'WHERE filtert einzelne Zeilen vor dem Gruppieren, HAVING filtert die gebildeten Gruppen – Aggregatfunktionen wie COUNT gehören deshalb in HAVING.',
     n:'WHERE COUNT(*) > 10 wirkt logisch, ist aber ein Syntaxfehler: Zum Zeitpunkt von WHERE existieren die Gruppen noch nicht.'},
 en:{s:'For licence planning you need the number of devices per site – but only for sites with more than 10 devices.',
     q:'Which query is correct?',
     o:['SELECT standort, COUNT(*) FROM geraete GROUP BY standort HAVING COUNT(*) > 10;','SELECT standort, COUNT(*) FROM geraete WHERE COUNT(*) > 10 GROUP BY standort;','SELECT standort, COUNT(*) FROM geraete GROUP BY COUNT(*) > 10;','SELECT standort FROM geraete HAVING standort > 10;'],
     e:'WHERE filters single rows before grouping, HAVING filters the groups formed – aggregate functions like COUNT therefore belong in HAVING.',
     n:'WHERE COUNT(*) > 10 seems logical but is a syntax error: the groups do not exist yet when WHERE is evaluated.'}},
{id:'sql-03', a:'sql', gen:'loopSum'},
{id:'sql-04', a:'sql', t:'sc', c:0,
 de:{s:'Der Fileserver läuft voll. Sie möchten per PowerShell alle Dateien unter D:\\Daten finden, die größer als 500 MB sind.',
     q:'Welcher Befehl erfüllt die Aufgabe?',
     o:['Get-ChildItem D:\\Daten -Recurse -File | Where-Object { $_.Length -gt 500MB }','Get-ChildItem D:\\Daten | Where-Object { $_.Length -lt 500MB }','Get-Content D:\\Daten -Recurse | Measure-Object -Sum','Get-ChildItem D:\\Daten -Recurse | Sort-Object Name'],
     e:'-Recurse durchsucht auch Unterordner, Where-Object filtert per Vergleichsoperator -gt (greater than). PowerShell versteht Größenangaben wie 500MB direkt.',
     n:'Ohne -Recurse würden nur Dateien direkt in D:\\Daten geprüft, und -lt bedeutet „kleiner als“.'},
 en:{s:'The file server is running out of space. Using PowerShell, you want to find all files under D:\\Daten larger than 500 MB.',
     q:'Which command does the job?',
     o:['Get-ChildItem D:\\Daten -Recurse -File | Where-Object { $_.Length -gt 500MB }','Get-ChildItem D:\\Daten | Where-Object { $_.Length -lt 500MB }','Get-Content D:\\Daten -Recurse | Measure-Object -Sum','Get-ChildItem D:\\Daten -Recurse | Sort-Object Name'],
     e:'-Recurse also searches subfolders, Where-Object filters using the comparison operator -gt (greater than). PowerShell understands size literals like 500MB directly.',
     n:'Without -Recurse only files directly in D:\\Daten would be checked, and -lt means "less than".'}},
{id:'sql-05', a:'sql', t:'sc', c:0,
 de:{s:'Tabellen: mitarbeiter(id, name, abt_id) und abteilung(id, bezeichnung). Für eine Telefonliste sollen alle Mitarbeiter mit ihrer Abteilung erscheinen – auch neue Mitarbeiter, denen noch keine Abteilung zugeordnet ist.',
     q:'Welche Verknüpfung wählen Sie?',
     o:['SELECT m.name, a.bezeichnung FROM mitarbeiter m LEFT JOIN abteilung a ON m.abt_id = a.id;','SELECT m.name, a.bezeichnung FROM mitarbeiter m INNER JOIN abteilung a ON m.abt_id = a.id;','SELECT m.name, a.bezeichnung FROM mitarbeiter m CROSS JOIN abteilung a;','SELECT m.name, a.bezeichnung FROM mitarbeiter m RIGHT JOIN abteilung a ON m.abt_id = a.id;'],
     e:'Der LEFT JOIN liefert alle Datensätze der linken Tabelle (mitarbeiter); fehlt die Abteilung, steht dort NULL.',
     n:'Der INNER JOIN ist der Standard-Join, liefert aber nur Mitarbeiter mit passender Abteilung – die neuen fehlen in der Liste.'},
 en:{s:'Tables: mitarbeiter(id, name, abt_id) – employees – and abteilung(id, bezeichnung) – departments. A phone list should show all employees with their department – including new employees not yet assigned to one.',
     q:'Which join do you choose?',
     o:['SELECT m.name, a.bezeichnung FROM mitarbeiter m LEFT JOIN abteilung a ON m.abt_id = a.id;','SELECT m.name, a.bezeichnung FROM mitarbeiter m INNER JOIN abteilung a ON m.abt_id = a.id;','SELECT m.name, a.bezeichnung FROM mitarbeiter m CROSS JOIN abteilung a;','SELECT m.name, a.bezeichnung FROM mitarbeiter m RIGHT JOIN abteilung a ON m.abt_id = a.id;'],
     e:'The LEFT JOIN returns all rows of the left table (employees); where the department is missing, NULL appears.',
     n:'INNER JOIN is the default join but only returns employees with a matching department – the new ones are missing.'}}
);
</script>

<script>
/* ===== BEREICH:itsm – IT-Service-Management (3. Lehrjahr) ===== */
Q.push(
{id:'itsm-01', a:'itsm', t:'order',
 de:{s:'Ein Anwender meldet telefonisch, dass er keine E-Mails mehr versenden kann. Sie bearbeiten die Störung nach ITIL-Incident-Management.',
     q:'Bringen Sie die Prozessschritte in die richtige Reihenfolge.',
     o:['Incident erfassen (Ticket anlegen)','Kategorisieren und priorisieren','Erstdiagnose im 1st Level','Bei Bedarf eskalieren (funktional oder hierarchisch)','Lösung umsetzen und Service wiederherstellen','Mit dem Anwender abschließen und dokumentieren'],
     e:'Jeder Incident wird zuerst erfasst, dann nach Auswirkung und Dringlichkeit priorisiert. Nur was der 1st Level nicht lösen kann, wird eskaliert. Der Abschluss erfolgt nach Bestätigung durch den Anwender.',
     n:'Häufig wird vor dem Erfassen schon gelöst – dann fehlen Nachweise für SLA-Messung, Häufungen und das Problem-Management.'},
 en:{s:'A user reports by phone that he can no longer send e-mails. You handle the incident according to ITIL incident management.',
     q:'Put the process steps in the correct order.',
     o:['Log the incident (create a ticket)','Categorise and prioritise','Initial diagnosis at 1st level','Escalate if needed (functional or hierarchical)','Implement the solution and restore the service','Close with the user and document'],
     e:'Every incident is logged first, then prioritised by impact and urgency. Only what 1st level cannot solve is escalated. Closure follows the user\'s confirmation.',
     n:'Often the fix happens before logging – then there is no evidence for SLA measurement, trend detection and problem management.'}},
{id:'itsm-02', a:'itsm', t:'sc', c:0,
 de:{s:'Seit drei Wochen bricht bei mehreren Außendienstlern regelmäßig die VPN-Verbindung ab. Der Support löst jedes Ticket, indem er den VPN-Client neu startet.',
     q:'Welcher ITIL-Prozess sollte jetzt angestoßen werden?',
     o:['Problem Management','Incident Management','Change Enablement','Service Request Management'],
     e:'Wiederkehrende Incidents deuten auf eine gemeinsame Ursache hin. Das Problem Management analysiert die Ursache (Root Cause) und dokumentiert bis zur Lösung einen Known Error mit Workaround.',
     n:'Incident Management läuft ja bereits – es stellt den Service schnell wieder her, sucht aber nicht nach der Ursache.'},
 en:{s:'For three weeks the VPN connection of several field staff has been dropping regularly. Support resolves each ticket by restarting the VPN client.',
     q:'Which ITIL practice should now be triggered?',
     o:['Problem management','Incident management','Change enablement','Service request management'],
     e:'Recurring incidents point to a common cause. Problem management analyses the root cause and records a known error with a workaround until it is fixed.',
     n:'Incident management is already running – it restores service quickly but does not look for the cause.'}},
{id:'itsm-03', a:'itsm', t:'match',
 de:{s:'Im Ticketsystem Ihres Betriebs sollen die Ticketarten sauber getrennt werden.',
     q:'Ordnen Sie jedem ITIL-Begriff die passende Beschreibung zu.',
     p:[['Incident','Ungeplante Unterbrechung oder Qualitätsminderung eines Services'],['Problem','Ursache eines oder mehrerer Incidents'],['Known Error','Problem mit dokumentierter Ursache und Workaround'],['Change','Hinzufügen, Ändern oder Entfernen von etwas mit Auswirkung auf Services'],['Service Request','Standardanfrage, z. B. neues Passwort oder Softwarebereitstellung']],
     e:'Die Trennung ermöglicht saubere Kennzahlen: Ein Passwort-Reset ist keine Störung und darf die Incident-Statistik nicht verfälschen.',
     n:'Service Requests werden oft als Incidents erfasst – dabei ist nichts kaputt, es wird eine vordefinierte Leistung angefordert.'},
 en:{s:'Ticket types in your company\'s ticket system are to be clearly separated.',
     q:'Match each ITIL term to the right description.',
     p:[['Incident','Unplanned interruption or reduction in quality of a service'],['Problem','Cause of one or more incidents'],['Known error','Problem with documented root cause and workaround'],['Change','Addition, modification or removal of anything that could affect services'],['Service request','Standard request, e.g. new password or software provision']],
     e:'The separation allows clean metrics: a password reset is not a failure and must not distort incident statistics.',
     n:'Service requests are often logged as incidents – yet nothing is broken, a predefined service is being requested.'}},
{id:'itsm-04', a:'itsm', t:'sc', c:0,
 de:{s:'Im SLA ist eine Reaktionszeit von 4 Stunden innerhalb der Servicezeit Montag bis Freitag, 8:00–17:00 Uhr vereinbart. Ein Kunde meldet eine Störung am Freitag um 15:30 Uhr.',
     q:'Bis wann muss spätestens reagiert werden?',
     o:['Montag, 10:30 Uhr','Freitag, 19:30 Uhr','Samstag, 9:30 Uhr','Montag, 8:00 Uhr'],
     e:'Am Freitag laufen noch 1,5 Stunden Servicezeit (15:30–17:00). Die restlichen 2,5 Stunden zählen ab Montag 8:00 Uhr → 10:30 Uhr.',
     n:'Freitag 19:30 Uhr rechnet in Kalenderzeit – die Reaktionszeit läuft aber nur innerhalb der vereinbarten Servicezeit.'},
 en:{s:'The SLA specifies a response time of 4 hours within service hours Monday to Friday, 8:00–17:00. A customer reports an incident on Friday at 15:30.',
     q:'By when must the response happen at the latest?',
     o:['Monday, 10:30','Friday, 19:30','Saturday, 9:30','Monday, 8:00'],
     e:'On Friday 1.5 hours of service time remain (15:30–17:00). The remaining 2.5 hours count from Monday 8:00 → 10:30.',
     n:'Friday 19:30 counts calendar time – but the response time only runs within the agreed service hours.'}},
{id:'itsm-05', a:'itsm', t:'sc', c:0,
 de:{s:'Der Fileserver lief am Wochenende unbemerkt voll, am Montag konnte niemand speichern. Sie richten ein Monitoring (z. B. Checkmk, Zabbix) für den Füllstand ein.',
     q:'Welche Konfiguration ist sinnvoll?',
     o:['Warnung ab 80 %, kritisch ab 90 % – mit automatischer Benachrichtigung bzw. Ticket','Alarm erst bei 100 % Belegung, um Fehlalarme zu vermeiden','Jeden Morgen manuell den Füllstand im Explorer prüfen','Nur die CPU-Last überwachen, weil sie den Füllstand widerspiegelt'],
     e:'Gestufte Schwellwerte geben Zeit zu reagieren, bevor der Service ausfällt. Die automatische Ticketerstellung sorgt dafür, dass die Warnung nicht untergeht.',
     n:'Ein Alarm bei 100 % vermeidet zwar Fehlalarme, kommt aber genau dann, wenn der Ausfall bereits eingetreten ist.'},
 en:{s:'The file server silently filled up over the weekend; on Monday nobody could save. You set up monitoring (e.g. Checkmk, Zabbix) for disk usage.',
     q:'Which configuration makes sense?',
     o:['Warning from 80 %, critical from 90 % – with automatic notification or ticket','Alarm only at 100 % usage to avoid false alarms','Check disk usage manually in Explorer every morning','Only monitor CPU load, since it reflects disk usage'],
     e:'Staged thresholds give time to react before the service fails. Automatic ticket creation ensures the warning is not overlooked.',
     n:'An alarm at 100 % avoids false alarms but comes exactly when the outage has already happened.'}}
);

/* ===== BEREICH:integ – Systemintegration & Rollout (3. Lehrjahr) ===== */
Q.push(
{id:'integ-01', a:'integ', t:'order',
 de:{s:'Ihr Betrieb soll bei einem Kunden 120 Arbeitsplätze auf ein neues Betriebssystem umstellen.',
     q:'Bringen Sie die Rollout-Phasen in eine sinnvolle Reihenfolge.',
     o:['Ist-Analyse: Hardware, Software und Anforderungen erfassen','Konzept erstellen und in einer Testumgebung prüfen','Pilotbetrieb mit einer kleinen Anwendergruppe','Rollout in Wellen (z. B. abteilungsweise)','Abnahme mit Protokoll','Dokumentation und Übergabe an den Betrieb'],
     e:'Der Pilot deckt Probleme mit echten Anwendern auf, bevor alle betroffen sind. Der wellenweise Rollout begrenzt das Risiko und bindet den Support planbar.',
     n:'Häufig wird auf den Pilot verzichtet, um Zeit zu sparen – Fehler treffen dann alle 120 Plätze gleichzeitig.'},
 en:{s:'Your company is to migrate 120 workstations at a customer to a new operating system.',
     q:'Put the rollout phases in a sensible order.',
     o:['As-is analysis: record hardware, software and requirements','Create the concept and verify it in a test environment','Pilot with a small group of users','Rollout in waves (e.g. by department)','Acceptance with a protocol','Documentation and handover to operations'],
     e:'The pilot uncovers problems with real users before everyone is affected. The wave-based rollout limits risk and keeps support workload plannable.',
     n:'The pilot is often skipped to save time – errors then hit all 120 workstations at once.'}},
{id:'integ-02', a:'integ', t:'sc', c:0,
 de:{s:'Der Fileserver (4 TB Daten) einer 24/7-Produktion soll auf neue Hardware migriert werden. Die Unterbrechung darf höchstens 15 Minuten betragen.',
     q:'Welche Migrationsstrategie wählen Sie?',
     o:['Daten vorab synchronisieren (z. B. Robocopy /MIR), im Wartungsfenster nur das Delta übertragen und per DNS-Alias umschalten','Am Montag früh den alten Server abschalten und alle Daten neu kopieren','Die Benutzer ihre Dateien selbst auf den neuen Server kopieren lassen','Alte und neue Server dauerhaft parallel mit getrennten Laufwerksbuchstaben betreiben'],
     e:'Die Vorabsynchronisation verlagert die lange Kopierzeit vor das Wartungsfenster. Im Fenster wird nur noch das Delta kopiert, der Alias sorgt dafür, dass Clients unverändert zugreifen.',
     n:'Die Big-Bang-Umstellung ist einfach, doch das Kopieren von 4 TB dauert Stunden – weit mehr als 15 Minuten.'},
 en:{s:'The file server (4 TB of data) of a 24/7 production site is to be migrated to new hardware. The interruption may be at most 15 minutes.',
     q:'Which migration strategy do you choose?',
     o:['Pre-synchronise the data (e.g. Robocopy /MIR), transfer only the delta in the maintenance window and switch over via DNS alias','Switch off the old server on Monday morning and copy all data anew','Let users copy their files to the new server themselves','Run old and new server permanently in parallel with separate drive letters'],
     e:'Pre-synchronisation moves the long copy time before the maintenance window. In the window only the delta is copied, and the alias lets clients access unchanged.',
     n:'A big-bang switchover is simple, but copying 4 TB takes hours – far more than 15 minutes.'}},
{id:'integ-03', a:'integ', t:'mc', c:[0,1,2,3],
 de:{s:'Nach der Inbetriebnahme einer neuen Telefonanlage erstellen Sie das Abnahmeprotokoll.',
     q:'Was gehört in ein Abnahmeprotokoll? (Mehrere Antworten)',
     o:['Datum, Ort und beteiligte Personen','Liste der geprüften Anforderungen mit Ergebnis','Festgestellte Mängel mit Frist zur Beseitigung','Unterschriften von Auftraggeber und Auftragnehmer','Die privaten Telefonnummern aller Monteure'],
     e:'Mit der Abnahme bestätigt der Kunde die vertragsgemäße Leistung. Rechtlich wichtig: Gefahrübergang, Beginn der Gewährleistung und Fälligkeit der Vergütung.',
     n:'Private Kontaktdaten der Monteure haben im Protokoll nichts zu suchen – sie sind für die Abnahme irrelevant und datenschutzrechtlich heikel.'},
 en:{s:'After commissioning a new phone system you prepare the acceptance protocol.',
     q:'What belongs in an acceptance protocol? (Multiple answers)',
     o:['Date, place and people involved','List of checked requirements with results','Defects found with a deadline for rectification','Signatures of client and contractor','The private phone numbers of all technicians'],
     e:'With acceptance the customer confirms that the work complies with the contract. Legally important: transfer of risk, start of the warranty and payment due date.',
     n:'Technicians\' private contact details have no place in the protocol – irrelevant for acceptance and problematic under data protection.'}},
{id:'integ-04', a:'integ', t:'sc', c:0,
 de:{s:'Nach dem Umbau des Netzwerks muss der Betrieb schnell nachvollziehen können, welche Netzwerkdose über welchen Patchfeld-Port an welchem Switchport hängt.',
     q:'Welches Dokument liefert genau diese Information?',
     o:['Patch- bzw. Belegungsliste','Logischer Netzwerkplan (Topologie)','Lastenheft','Betriebshandbuch des Switches'],
     e:'Die Patchliste ordnet jeder Dose den Patchfeld-Port, das Patchkabel und den Switchport (oft auch VLAN) zu – unverzichtbar bei der Fehlersuche vor Ort.',
     n:'Der logische Netzplan zeigt Netze, VLANs und Geräte, aber keine einzelnen Dosen und Ports.'},
 en:{s:'After rebuilding the network, operations must be able to see quickly which network outlet is connected via which patch panel port to which switch port.',
     q:'Which document provides exactly this information?',
     o:['Patch list / port assignment list','Logical network diagram (topology)','Requirements specification (Lastenheft)','Switch operating manual'],
     e:'The patch list maps every outlet to its patch panel port, patch cable and switch port (often also the VLAN) – essential for on-site troubleshooting.',
     n:'The logical network diagram shows networks, VLANs and devices, but not individual outlets and ports.'}},
{id:'integ-05', a:'integ', t:'open',
 de:{s:'Am Wochenende soll der lokale Exchange-Server eines Kunden zu Exchange Online migriert werden. Der Kunde fragt: „Und wenn das schiefgeht?“',
     q:'Beschreiben Sie, wie Sie ein Rollback für diese Umstellung planen.',
     m:'• Go/No-Go-Kriterien und einen spätesten Rollback-Zeitpunkt festlegen.\n• Vollständige Sicherung und ggf. Snapshot vor der Umstellung, Wiederherstellung vorher testen.\n• Alte Umgebung unverändert weiterlaufen lassen, bis die neue abgenommen ist.\n• DNS-TTL (MX, Autodiscover) Tage vorher senken, damit ein Zurückstellen schnell wirkt.\n• Rollback-Schritte als Checkliste dokumentieren, Verantwortliche benennen.\n• Kommunikation an Anwender für beide Fälle vorbereiten.',
     k:['Go/No-Go-Kriterien und Zeitpunkt','Backup vor der Umstellung, getestet','Altsystem parallel erhalten','DNS-TTL vorher senken','Dokumentierte Rollback-Schritte','Kommunikation an Anwender']},
 en:{s:'This weekend a customer\'s on-premises Exchange server is to be migrated to Exchange Online. The customer asks: "And what if it goes wrong?"',
     q:'Describe how you plan a rollback for this migration.',
     m:'• Define go/no-go criteria and a latest rollback point in time.\n• Full backup and, if possible, a snapshot before the switchover; test the restore beforehand.\n• Keep the old environment running unchanged until the new one is accepted.\n• Lower the DNS TTL (MX, Autodiscover) days in advance so that switching back takes effect quickly.\n• Document the rollback steps as a checklist, name responsible people.\n• Prepare communication to users for both outcomes.',
     k:['Go/no-go criteria and deadline','Tested backup before switchover','Keep the old system in parallel','Lower DNS TTL beforehand','Documented rollback steps','User communication']}}
);

/* ===== BEREICH:cloud – Cloud & Hybridbetrieb (3. Lehrjahr) ===== */
Q.push(
{id:'cloud-01', a:'cloud', t:'match',
 de:{s:'Ein Kunde möchte verstehen, wofür er bei den verschiedenen Cloud-Modellen selbst verantwortlich ist.',
     q:'Ordnen Sie jedem Betriebsmodell die passende Beschreibung zu.',
     p:[['IaaS','Kunde verwaltet Betriebssystem, Middleware und Anwendungen auf gemieteten VMs'],['PaaS','Kunde liefert nur Anwendung und Daten, die Laufzeitumgebung betreibt der Anbieter'],['SaaS','Kunde nutzt eine fertige Anwendung, z. B. Microsoft 365'],['On-Premises','Alles liegt in eigener Verantwortung im eigenen Rechenzentrum']],
     e:'Je weiter man von IaaS zu SaaS geht, desto mehr Verantwortung übernimmt der Anbieter (Shared Responsibility Model). Für die Daten bleibt der Kunde immer verantwortlich.',
     n:'PaaS und SaaS werden oft verwechselt: Bei PaaS bringt der Kunde eigenen Code mit, bei SaaS nutzt er nur die fertige Software.'},
 en:{s:'A customer wants to understand what he is responsible for in the different cloud models.',
     q:'Match each operating model to the right description.',
     p:[['IaaS','Customer manages operating system, middleware and applications on rented VMs'],['PaaS','Customer only supplies application and data, the provider runs the runtime'],['SaaS','Customer uses a finished application, e.g. Microsoft 365'],['On-premises','Everything is the company\'s own responsibility in its own data centre']],
     e:'The further you move from IaaS to SaaS, the more responsibility the provider takes (shared responsibility model). The customer always remains responsible for the data.',
     n:'PaaS and SaaS are often confused: with PaaS the customer brings his own code, with SaaS he only uses finished software.'}},
{id:'cloud-02', a:'cloud', t:'sc', c:0,
 de:{s:'Ein Start-up benötigt für drei Monate sehr viel Rechenleistung für Lasttests seiner Software, danach nicht mehr.',
     q:'Welches Bereitstellungs- und Abrechnungsmodell ist am wirtschaftlichsten?',
     o:['IaaS mit nutzungsbasierter Abrechnung (Pay-as-you-go)','Eigene Server kaufen und nach drei Monaten verkaufen','Reservierte Cloud-Instanzen mit drei Jahren Laufzeit','Colocation-Stellplatz für eigene Hardware anmieten'],
     e:'Kurzfristiger, schwankender Bedarf ist der Kernfall der Cloud: Ressourcen werden sekundengenau oder stündlich abgerechnet und danach einfach gelöscht.',
     n:'Reservierte Instanzen sind pro Stunde günstiger, lohnen sich aber nur bei dauerhafter Nutzung – die Laufzeit müsste voll bezahlt werden.'},
 en:{s:'A start-up needs a lot of computing power for three months to load-test its software, and none afterwards.',
     q:'Which provisioning and billing model is the most economical?',
     o:['IaaS with usage-based billing (pay-as-you-go)','Buy own servers and sell them after three months','Reserved cloud instances with a three-year term','Rent a colocation rack space for own hardware'],
     e:'Short-term, fluctuating demand is the core use case of the cloud: resources are billed per second or hour and simply deleted afterwards.',
     n:'Reserved instances are cheaper per hour but only pay off for permanent use – the whole term would have to be paid.'}},
{id:'cloud-03', a:'cloud', gen:'breakeven'},
{id:'cloud-04', a:'cloud', t:'mc', c:[0,1,2],
 de:{s:'Die Geschäftsführung überlegt, die unbefristeten Office-Lizenzen durch ein Abonnement (Subscription) zu ersetzen.',
     q:'Welche Aussagen zum Subscription-Modell treffen zu? (Mehrere Antworten)',
     o:['Es entstehen laufende Kosten (OPEX) statt einer einmaligen Investition (CAPEX)','Das Nutzungsrecht endet mit der Kündigung','Updates auf neue Versionen sind in der Regel enthalten','Die Lizenz kann nach Vertragsende beliebig weiterverkauft werden','Es fällt nur einmalig ein Kaufpreis an'],
     e:'Abonnements verschieben Kosten von Investitionen zu Betriebsausgaben, bleiben aktuell und lassen sich monatlich an die Nutzerzahl anpassen.',
     n:'Weiterverkauf ist nur bei unbefristet erworbenen Lizenzen (Kauflizenzen) möglich – ein Abo überträgt kein dauerhaftes Nutzungsrecht.'},
 en:{s:'Management is considering replacing perpetual Office licences with a subscription.',
     q:'Which statements about the subscription model are correct? (Multiple answers)',
     o:['Running costs (OPEX) arise instead of a one-off investment (CAPEX)','The right of use ends when the subscription is cancelled','Updates to new versions are usually included','The licence can be resold freely after the contract ends','Only a one-off purchase price is charged'],
     e:'Subscriptions shift costs from investment to operating expenses, stay up to date and can be adjusted monthly to the number of users.',
     n:'Resale is only possible with perpetual (purchased) licences – a subscription grants no permanent right of use.'}},
{id:'cloud-05', a:'cloud', t:'sc', c:0,
 de:{s:'Eine Arztpraxis möchte ihre Praxissoftware samt Patientendaten bei einem US-amerikanischen Cloud-Anbieter betreiben.',
     q:'Worauf müssen Sie vor allem achten?',
     o:['Rechtsgrundlage für die Drittlandübermittlung (z. B. Angemessenheitsbeschluss oder Standardvertragsklauseln), AVV, Serverstandort, Verschlüsselung und Schweigepflicht prüfen','Nur auf den monatlichen Preis, da große Anbieter automatisch DSGVO-konform sind','Nur auf die Verfügbarkeit laut SLA','Nichts Besonderes, solange die Praxis selbst in Deutschland sitzt'],
     e:'Gesundheitsdaten sind besondere Kategorien (Art. 9 DSGVO) und unterliegen der ärztlichen Schweigepflicht. Bei US-Anbietern ist die Drittlandübermittlung abzusichern – idealerweise mit EU-Rechenzentrum und kundenseitiger Verschlüsselung.',
     n:'Große Anbieter bieten zwar DSGVO-Werkzeuge, die Verantwortung für die rechtmäßige Verarbeitung bleibt aber bei der Praxis.'},
 en:{s:'A medical practice wants to run its practice software including patient data with a US cloud provider.',
     q:'What do you need to pay particular attention to?',
     o:['Check the legal basis for third-country transfer (e.g. adequacy decision or standard contractual clauses), DPA, server location, encryption and medical confidentiality','Only the monthly price, as large providers are automatically GDPR-compliant','Only the availability stated in the SLA','Nothing special, as long as the practice itself is based in Germany'],
     e:'Health data is a special category (Art. 9 GDPR) and subject to medical confidentiality. With US providers the third-country transfer must be secured – ideally with an EU data centre and customer-side encryption.',
     n:'Large providers do offer GDPR tooling, but the responsibility for lawful processing stays with the practice.'}}
);
</script>

<script>
/* ===== BEREICH:ha – Ausfallsicherheit & Notfall (3. Lehrjahr) ===== */
Q.push(
{id:'ha-01', a:'ha', gen:'avail'},
{id:'ha-02', a:'ha', t:'sc', c:0,
 de:{s:'Der ERP-Server wird täglich um 22:00 Uhr gesichert. Die Geschäftsleitung legt fest: „Wir dürfen höchstens eine Stunde an Buchungsdaten verlieren.“',
     q:'Was folgt aus dieser Vorgabe?',
     o:['Das RPO beträgt 1 Stunde – das Sicherungsintervall muss auf höchstens eine Stunde verkürzt werden (z. B. stündliche Snapshots oder Log-Sicherung)','Das RTO beträgt 1 Stunde – das System muss innerhalb einer Stunde wieder laufen','Die tägliche Sicherung reicht aus, wenn sie auf ein zweites Medium kopiert wird','Eine USV mit mindestens einer Stunde Überbrückungszeit ist anzuschaffen'],
     e:'Das RPO (Recovery Point Objective) beschreibt den maximal tolerierbaren Datenverlust und bestimmt damit das Sicherungsintervall. Mit Sicherung um 22 Uhr könnten bis zu 24 Stunden Daten verloren gehen.',
     n:'Das RTO (Recovery Time Objective) ist die maximale Ausfallzeit bis zur Wiederherstellung – eine andere Größe als der Datenverlust.'},
 en:{s:'The ERP server is backed up daily at 22:00. Management decides: "We may lose at most one hour of booking data."',
     q:'What follows from this requirement?',
     o:['The RPO is 1 hour – the backup interval must be reduced to at most one hour (e.g. hourly snapshots or log backups)','The RTO is 1 hour – the system must be running again within one hour','The daily backup is sufficient if it is copied to a second medium','A UPS with at least one hour of runtime must be purchased'],
     e:'The RPO (recovery point objective) describes the maximum tolerable data loss and thus determines the backup interval. With a backup at 22:00 up to 24 hours of data could be lost.',
     n:'The RTO (recovery time objective) is the maximum downtime until restoration – a different measure from data loss.'}},
{id:'ha-03', a:'ha', gen:'usv'},
{id:'ha-04', a:'ha', t:'match',
 de:{s:'Sie erstellen für einen Kunden eine Entscheidungsvorlage zur Stromversorgung und Redundanz im Serverraum.',
     q:'Ordnen Sie jedem Begriff die zutreffende Beschreibung zu.',
     p:[['USV VFD (Offline/Standby)','Verbraucher hängen direkt am Netz, Umschaltung auf Batterie erst bei Ausfall'],['USV VI (Line-Interactive)','Spannungsschwankungen werden per Transformator ausgeregelt, kurze Umschaltzeit'],['USV VFI (Online/Doppelwandler)','Verbraucher laufen dauerhaft über den Wechselrichter, keine Umschaltzeit'],['N+1-Redundanz','Eine Komponente mehr als für den Betrieb erforderlich'],['Redundante Netzteile','Server bleibt bei Ausfall eines Netzteils oder Stromkreises in Betrieb']],
     e:'Für Server empfiehlt sich VFI, weil Netzstörungen die Verbraucher gar nicht erst erreichen. Redundante Netzteile helfen nur, wenn sie an getrennten Stromkreisen bzw. USVs hängen.',
     n:'Die Offline-USV wird oft für die sicherste gehalten, weil sie „dazwischen“ sitzt – tatsächlich greift sie erst nach einer kurzen Umschaltzeit ein.'},
 en:{s:'You prepare a decision paper for a customer on power supply and redundancy in the server room.',
     q:'Match each term to the right description.',
     p:[['UPS VFD (offline/standby)','Loads run directly on mains, switching to battery only on failure'],['UPS VI (line-interactive)','Voltage fluctuations are regulated by a transformer, short transfer time'],['UPS VFI (online/double conversion)','Loads run permanently via the inverter, no transfer time'],['N+1 redundancy','One more component than required for operation'],['Redundant power supplies','Server keeps running if one PSU or circuit fails']],
     e:'VFI is recommended for servers because mains disturbances never reach the loads. Redundant PSUs only help if they are fed from separate circuits or UPSs.',
     n:'The offline UPS is often thought to be the safest because it sits "in between" – in fact it only steps in after a short transfer time.'}},
{id:'ha-05', a:'ha', t:'order',
 de:{s:'Im Rechenzentrum eines Kunden fällt nach einem Wasserschaden der komplette Serverraum aus. Es existiert ein Notfallhandbuch nach BSI-Standard 200-4.',
     q:'Bringen Sie die Schritte der Notfallbewältigung in die richtige Reihenfolge.',
     o:['Notfall erkennen und über die Meldekette melden','Notfallstab alarmieren und Lage bewerten','Sofortmaßnahmen einleiten und Notbetrieb aufnehmen','Wiederanlauf nach Wiederanlaufplan (priorisiert nach RTO)','Rückführung in den Normalbetrieb','Nachbereitung: Ursachen und Verbesserungen dokumentieren'],
     e:'Erst wenn die Lage bewertet ist, werden Maßnahmen gezielt ausgelöst. Der Wiederanlauf folgt der Priorität der Geschäftsprozesse, die Nachbereitung verbessert das Notfallkonzept.',
     n:'Häufig wird sofort mit der Wiederherstellung begonnen – ohne Lagebild werden dann unwichtige Systeme zuerst hochgefahren.'},
 en:{s:'After water damage, a customer\'s entire server room fails. An emergency manual according to BSI standard 200-4 exists.',
     q:'Put the steps of emergency response in the correct order.',
     o:['Detect the emergency and report it via the reporting chain','Alert the crisis team and assess the situation','Take immediate measures and start emergency operation','Restart according to the recovery plan (prioritised by RTO)','Return to normal operation','Follow-up: document causes and improvements'],
     e:'Measures are only triggered in a targeted way once the situation is assessed. Restart follows the priority of the business processes; follow-up improves the contingency concept.',

/* ===== BEREICH:fg – Präsentation & Fachgespräch (AP 2) ===== */
Q.push(
{id:'fg-01', a:'fg', t:'open',
 de:{s:'Fachgespräch zu Ihrem Projekt „Einführung einer Backup-Lösung“. Prüfer: „Warum haben Sie sich für Lösung A entschieden und nicht für Lösung B?“',
     q:'Wie strukturieren Sie Ihre Antwort?',
     m:'• Anforderungen nennen, die entscheidend waren (z. B. RPO, Budget, vorhandene Infrastruktur).\n• Auf die Nutzwertanalyse bzw. den Kostenvergleich im Projekt verweisen und die ausschlaggebenden Kriterien mit Gewichtung nennen.\n• Konkrete Vorteile von A (z. B. Unveränderlichkeit der Backups, Integration in bestehende Virtualisierung).\n• Nachteile von A ehrlich einräumen und begründen, warum sie akzeptabel sind.\n• Kurz: Was hätte für B gesprochen?',
     k:['Bezug zu den Anforderungen','Nutzwertanalyse / Kosten genannt','Konkrete Kriterien statt „besser“','Nachteile offen benannt','Alternative fair bewertet']},
 en:{s:'Expert interview on your project "Introducing a backup solution". Examiner: "Why did you choose solution A and not solution B?"',
     q:'How do you structure your answer?',
     m:'• Name the requirements that were decisive (e.g. RPO, budget, existing infrastructure).\n• Refer to the weighted scoring model or cost comparison in the project and name the decisive criteria with their weights.\n• Concrete advantages of A (e.g. immutable backups, integration with the existing virtualisation).\n• Honestly admit the disadvantages of A and explain why they are acceptable.\n• Briefly: what would have spoken for B?',
     k:['Link to the requirements','Scoring model / costs mentioned','Concrete criteria instead of "better"','Disadvantages named openly','Alternative assessed fairly']}},
{id:'fg-02', a:'fg', t:'open',
 de:{s:'Prüfer: „Was würden Sie rückblickend an Ihrem Projekt anders machen?“',
     q:'Formulieren Sie eine überzeugende Antwort.',
     m:'• Ein echtes, konkretes Beispiel nennen (z. B. „Ich hätte die Anwender früher in den Test einbezogen“).\n• Die Auswirkung benennen (z. B. zwei Tage Verzug in der Testphase, im Soll-Ist-Vergleich dokumentiert).\n• Die Erkenntnis und was man künftig tut.\n• Nicht: „Nichts, es lief alles perfekt“ – das wirkt unreflektiert.',
     k:['Konkretes Beispiel','Auswirkung benannt (Soll-Ist)','Lernerkenntnis formuliert','Kein „alles perfekt“']},
 en:{s:'Examiner: "Looking back, what would you do differently in your project?"',
     q:'Formulate a convincing answer.',
     m:'• Give a real, concrete example (e.g. "I would have involved users in testing earlier").\n• Name the impact (e.g. two days delay in the test phase, documented in the plan-vs-actual comparison).\n• The lesson and what you will do in future.\n• Not: "Nothing, everything went perfectly" – that seems unreflective.',
     k:['Concrete example','Impact named (plan vs. actual)','Lesson formulated','No "everything was perfect"']}},
{id:'fg-03', a:'fg', t:'open',
 de:{s:'Prüfer: „Wie haben Sie sichergestellt, dass Ihre Lösung funktioniert?“ (Projekt: Einrichtung eines VPN-Zugangs für Außendienstler)',
     q:'Beschreiben Sie Ihr Testvorgehen.',
     m:'• Testfälle aus den Anforderungen abgeleitet (z. B. Verbindung aus Mobilfunknetz, Zugriff auf Fileserver, Sperre nach Deaktivierung des Kontos).\n• Testumgebung bzw. Pilotgruppe mit zwei Außendienstlern.\n• Positiv- und Negativtests (z. B. falsches Zertifikat wird abgelehnt).\n• Ergebnisse im Testprotokoll dokumentiert, Fehler behoben und nachgetestet.\n• Abnahme durch den Auftraggeber.',
     k:['Testfälle aus Anforderungen','Testumgebung / Pilot','Positiv- UND Negativtests','Testprotokoll','Abnahme']},
 en:{s:'Examiner: "How did you make sure your solution works?" (Project: setting up VPN access for field staff)',
     q:'Describe your testing approach.',
     m:'• Test cases derived from the requirements (e.g. connection from mobile network, access to file server, block after the account is disabled).\n• Test environment or pilot group with two field staff.\n• Positive and negative tests (e.g. a wrong certificate is rejected).\n• Results documented in a test protocol, defects fixed and retested.\n• Acceptance by the client.',
     k:['Test cases from requirements','Test environment / pilot','Positive AND negative tests','Test protocol','Acceptance']}},
{id:'fg-04', a:'fg', t:'sc', c:0,
 de:{s:'Für die Projektpräsentation stehen 15 Minuten zur Verfügung. Ihr Entwurf umfasst 26 Folien mit vielen Konfigurationsauszügen.',
     q:'Was ist der beste Umgang damit?',
     o:['Auf etwa 10–12 Kernfolien kürzen, Entscheidungen und Ergebnisse in den Mittelpunkt stellen, Details als Backup-Folien bereithalten','Schneller sprechen, damit alle Folien gezeigt werden können','Alle Folien zeigen und die Prüfer mitlesen lassen','Auf Folien verzichten und nur frei sprechen'],
     e:'Der Prüfungsausschuss bewertet Struktur, Verständlichkeit und Zeitmanagement. Backup-Folien helfen, im Fachgespräch bei Detailfragen gezielt zu antworten.',
     n:'Schneller sprechen wirkt wie eine Lösung, überfordert aber die Zuhörer – und eine Zeitüberschreitung wird abgebrochen und negativ bewertet.'},
 en:{s:'You have 15 minutes for the project presentation. Your draft has 26 slides with many configuration excerpts.',
     q:'What is the best way to deal with this?',
     o:['Cut to about 10–12 core slides, focus on decisions and results, keep details as backup slides','Speak faster so that all slides can be shown','Show all slides and let the examiners read along','Do without slides and only speak freely'],
     e:'The examination board assesses structure, clarity and time management. Backup slides help to answer detailed questions precisely in the interview.',
     n:'Speaking faster seems like a solution but overwhelms the audience – and overrunning the time is cut off and marked down.'}},
{id:'fg-05', a:'fg', t:'mc', c:[0,1,2],
 de:{s:'Sie überarbeiten Ihre Projektdokumentation für die IHK (max. 15 Seiten ohne Anlagen).',

     e:'Der Hauptteil zeigt das eigene Vorgehen und die Entscheidungen. Umfangreiche Konfigurationen, Screenshots und Protokolle gehören in den Anhang – im Text genügen aussagekräftige Auszüge.',
     n:'Konfigurationsdateien belegen zwar die Arbeit, blähen den Hauptteil aber auf und sprengen die Seitenbegrenzung – sie gehören in die Anlagen.'},

     o:['Plan-vs-actual comparison of the schedule with reasons for deviations','Economic analysis or cost breakdown','Justified choice of solution (e.g. weighted scoring model)','Complete configuration files of all devices','Personal assessment of colleagues'],

);
