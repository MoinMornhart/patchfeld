Q.push(
{id:'bs-01', a:'bs', t:'sc', c:0,
 de:{s:'Für die neue Buchhaltung sollen 20 identische Windows-11-Clients mit denselben Programmen bereitgestellt und in die Domäne aufgenommen werden.',
     q:'Welches Vorgehen ist am effizientesten und technisch sauber?',
     o:['Referenz-PC einrichten, mit Sysprep generalisieren, Abbild per Deployment-Lösung verteilen','Jeden PC einzeln per USB-Stick installieren und einrichten','Die Festplatte eines fertigen PCs ohne Vorbereitung 1:1 auf alle anderen klonen','Einen PC installieren und dessen Benutzerprofil auf die anderen kopieren'],
     e:'Sysprep entfernt rechnerspezifische Merkmale (SID, Computername, Treiberbindung). Das generalisierte Abbild lässt sich schnell und einheitlich verteilen.',
     n:'Ein 1:1-Klon ohne Sysprep ist schnell, erzeugt aber doppelte Rechner-SIDs und Namen – das führt in der Domäne und bei Management-Tools zu Problemen.'},
 en:{s:'For the new accounting department, 20 identical Windows 11 clients with the same programs are to be deployed and joined to the domain.',
     q:'Which approach is the most efficient and technically clean?',
     o:['Set up a reference PC, generalise it with Sysprep, distribute the image with a deployment solution','Install and configure each PC individually from a USB stick','Clone the disk of a finished PC 1:1 to all others without preparation','Install one PC and copy its user profile to the others'],
     e:'Sysprep removes machine-specific properties (SID, computer name, driver binding). The generalised image can be deployed quickly and consistently.',
     n:'A 1:1 clone without Sysprep is fast but creates duplicate machine SIDs and names – causing trouble in the domain and with management tools.'}},
{id:'bs-02', a:'bs', t:'match',
 de:{s:'Ein Kunde fragt, welches Dateisystem er für verschiedene Datenträger verwenden soll.',
     q:'Ordnen Sie das Dateisystem dem passenden Einsatz zu.',
     p:[['NTFS','Windows-Systemlaufwerk mit Zugriffsrechten (ACL) und Journaling'],['FAT32','Maximal 4 GiB pro Datei, sehr hohe Kompatibilität'],['exFAT','USB-Stick für große Videodateien zwischen Windows und macOS'],['ext4','Standard-Dateisystem vieler Linux-Server']],
     e:'NTFS bietet ACLs, Journaling und Verschlüsselung (EFS). exFAT hebt die 4-GiB-Grenze von FAT32 auf und ist plattformübergreifend lesbar.',
     n:'FAT32 wirkt für USB-Sticks naheliegend, scheitert aber an Dateien über 4 GiB.'},
 en:{s:'A customer asks which file system to use for different drives.',
     q:'Match the file system to the right use.',
     p:[['NTFS','Windows system drive with access rights (ACL) and journaling'],['FAT32','Max. 4 GiB per file, very high compatibility'],['exFAT','USB stick for large video files between Windows and macOS'],['ext4','Default file system of many Linux servers']],
     e:'NTFS offers ACLs, journaling and encryption (EFS). exFAT removes the 4 GiB limit of FAT32 and is readable across platforms.',
     n:'FAT32 seems obvious for USB sticks but fails with files larger than 4 GiB.'}},
{id:'bs-03', a:'bs', t:'sc', c:0,
 de:{s:'In einen Windows-Server wird eine neue 8-TB-Festplatte eingebaut. Sie soll als ein einziges Datenvolume genutzt werden.',
     q:'Welches Partitionsschema wählen Sie?',
     o:['GPT','MBR','MBR mit erweiterter Partition','FAT32'],
     e:'GPT unterstützt sehr große Datenträger und bis zu 128 Partitionen unter Windows. Es ist mit UEFI der aktuelle Standard.',
     n:'MBR ist verbreitet, kann aber nur 2 TiB adressieren – der Rest der Platte bliebe ungenutzt.'},
 en:{s:'A new 8 TB disk is installed in a Windows server. It is to be used as a single data volume.',
     q:'Which partition scheme do you choose?',
     o:['GPT','MBR','MBR with an extended partition','FAT32'],
     e:'GPT supports very large disks and up to 128 partitions on Windows. It is the current standard with UEFI.',
     n:'MBR is common but can only address 2 TiB – the rest of the disk would remain unused.'}},
{id:'bs-04', a:'bs', t:'mc', c:[0,1,2],
 de:{s:'Nach einem nächtlichen Windows-Update startet ein Arbeitsplatzrechner mit einem Bluescreen neu – immer wieder.',
     q:'Welche Schritte sind als Erstes sinnvoll? (Mehrere Antworten)',
     o:['Windows-Wiederherstellungsumgebung (WinRE) starten','Das zuletzt installierte Update deinstallieren','Im abgesicherten Modus starten und Treiber prüfen','Festplatte sofort formatieren und Windows neu installieren','Secure Boot deaktivieren und das BIOS zurücksetzen'],
     e:'Man arbeitet vom geringsten Eingriff zum größten: WinRE bietet Update-Deinstallation und abgesicherten Modus, ohne Daten zu gefährden.',
     n:'Die Neuinstallation löst das Problem zwar sicher, ist aber unverhältnismäßig und riskiert Datenverlust – sie ist der letzte Schritt.'},
 en:{s:'After an overnight Windows update, a workstation keeps restarting with a blue screen.',
     q:'Which steps make sense first? (Multiple answers)',
     o:['Start the Windows Recovery Environment (WinRE)','Uninstall the most recently installed update','Boot into safe mode and check drivers','Format the disk immediately and reinstall Windows','Disable Secure Boot and reset the BIOS'],
     e:'Work from the least to the most invasive step: WinRE offers update removal and safe mode without endangering data.',
     n:'A reinstall will surely fix it, but it is disproportionate and risks data loss – it is the last step.'}},
{id:'bs-05', a:'bs', t:'open',
 de:{s:'Ein kleines Steuerbüro mit drei PCs fragt, ob Windows 11 Home reicht oder ob Pro nötig ist.',
     q:'Begründen Sie Ihre Empfehlung gegenüber dem Kunden.',
     m:'Empfehlung: Windows 11 Pro.\n• Steuerbüro verarbeitet sensible Mandantendaten → BitLocker-Laufwerksverschlüsselung (nur Pro).\n• Domänenbeitritt bzw. Entra-ID-Verwaltung und Gruppenrichtlinien für einheitliche Einstellungen.\n• Remotedesktop als Host für Fernwartung.\n• Mehrkosten pro Lizenz sind im Verhältnis zum Schutzbedarf gering.',
     k:['BitLocker / Verschlüsselung','Domäne bzw. zentrale Verwaltung','Gruppenrichtlinien','Remotedesktop-Host','Kosten gegen Schutzbedarf abgewogen']},
 en:{s:'A small tax consultancy with three PCs asks whether Windows 11 Home is enough or whether Pro is needed.',
     q:'Justify your recommendation to the customer.',
     m:'Recommendation: Windows 11 Pro.\n• The office processes sensitive client data → BitLocker drive encryption (Pro only).\n• Domain join or Entra ID management and group policies for consistent settings.\n• Remote Desktop host for remote maintenance.\n• The extra licence cost is small compared to the protection needs.',
     k:['BitLocker / encryption','Domain or central management','Group policies','Remote Desktop host','Cost weighed against protection needs']}}
);
/* ----- BEREICH:bs – Erweiterung ----- */
/* Partitionierung: Kapazität in GiB und Größe der Systempartition */
GEN.bsPartition = function(L){
  const gb = pick([256,500,512,1000,1024,2000]), esp = pick([100,260,300]), msr = 16, re = pick([750,1024]);
  const dG = gb >= 1000 && Math.random() < 0.6 ? pick([200,300,400]) : 0;
  const tot = gb*1e9/2**30, small = (esp+msr+re)/1024, c = r2(tot - small - dG), totR = r2(tot);
  const dTxt = dG ? tx(L, ` sowie eine Datenpartition D: mit genau ${dG} GiB`, ` and a data partition D: of exactly ${dG} GiB`) : '';
  const dCalc = dG ? ` − ${dG} GiB` : '';
  return { t:'in',
    s: tx(L, `Sie installieren Windows 11 auf einem neuen Rechner mit einer NVMe-SSD, die laut Datenblatt ${fmt(gb,0,L)} GB groß ist (1 GB = 10⁹ Byte). Die Partitionierung per Skript legt eine EFI-Systempartition mit ${esp} MiB, eine MSR-Partition mit ${msr} MiB${dG?',':' und'} eine Wiederherstellungspartition (WinRE) mit ${fmt(re,0,L)} MiB${dTxt} an. Der restliche Platz wird vollständig Laufwerk C: zugewiesen. GPT-Verwaltungsdaten und Ausrichtung vernachlässigen Sie.`,
             `You install Windows 11 on a new computer with an NVMe SSD that is ${fmt(gb,0,L)} GB according to the data sheet (1 GB = 10⁹ bytes). The partitioning script creates an EFI system partition of ${esp} MiB, an MSR partition of ${msr} MiB${dG?',':' and'} a recovery partition (WinRE) of ${fmt(re,0,L)} MiB${dTxt}. All remaining space is assigned to drive C:. Ignore GPT metadata and alignment.`),
    q: tx(L, 'Wie groß ist der Datenträger in GiB und wie groß wird Laufwerk C: in GiB? Runden Sie jeweils auf zwei Nachkommastellen.',
             'What is the size of the disk in GiB and how large will drive C: be in GiB? Round each to two decimal places.'),
    f: [ {l:tx(L,'Datenträger gesamt','Total disk'), v:totR, tol:0.011, u:'GiB'}, {l:tx(L,'Laufwerk C:','Drive C:'), v:c, tol:0.02, u:'GiB'} ],
    e: tx(L, `${fmt(gb,0,L)} × 10⁹ Byte ÷ 2³⁰ (1.073.741.824) = ${fmt(tot,2,L)} GiB. Kleine Partitionen: (${esp} + ${msr} + ${fmt(re,0,L)}) MiB ÷ 1.024 = ${fmt(small,4,L)} GiB. C: = ${fmt(tot,2,L)} GiB − ${fmt(small,4,L)} GiB${dCalc} = ${fmt(c,2,L)} GiB.`,
             `${fmt(gb,0,L)} × 10⁹ bytes ÷ 2³⁰ (1,073,741,824) = ${fmt(tot,2,L)} GiB. Small partitions: (${esp} + ${msr} + ${fmt(re,0,L)}) MiB ÷ 1,024 = ${fmt(small,4,L)} GiB. C: = ${fmt(tot,2,L)} GiB − ${fmt(small,4,L)} GiB${dCalc} = ${fmt(c,2,L)} GiB.`),
    n: tx(L, 'Typischer Fehler: die Herstellerangabe in GB direkt als GiB zu übernehmen – der Datenträger ist in GiB rund 7 % kleiner, als die Zahl auf dem Datenblatt vermuten lässt.',
             'Typical mistake: taking the manufacturer\'s figure in GB directly as GiB – in GiB the disk is about 7 % smaller than the data sheet figure suggests.')
  };
};

Q.push(
{id:'bs-06', a:'bs', t:'sc', c:0,
 de:{s:'Die Büro-PCs eines Kunden (Baujahr 2020, Intel Core i5 der 10. Generation, UEFI-Modus, GPT) sollen von Windows 10 auf Windows 11 aktualisiert werden. Die App „PC-Integritätsprüfung“ meldet: „TPM 2.0 muss auf diesem PC unterstützt und aktiviert sein.“ Im Geräte-Manager ist kein TPM sichtbar.',
     q:'Wie gehen Sie vor?',
     o:['Im UEFI-Setup das Firmware-TPM (Intel PTT bzw. AMD fTPM) aktivieren und die Prüfung wiederholen','Für jeden PC ein diskretes TPM-Modul bestellen und auf den TPM-Header des Mainboards stecken','Die TPM-Prüfung per Registry-Eintrag umgehen und das Upgrade durchführen','Die PCs als nicht Windows-11-fähig einstufen und ersetzen'],
     e:'Aktuelle Intel- und AMD-Prozessoren enthalten ein Firmware-TPM 2.0, das ab Werk häufig deaktiviert ist. Nach der Aktivierung im UEFI erfüllen die PCs die Anforderung ohne zusätzliche Hardware.',
     n:'Die Registry-Umgehung ist naheliegend, führt aber zu einer von Microsoft nicht unterstützten Konfiguration ohne Anspruch auf Updates – und ist hier unnötig, weil das TPM nur deaktiviert ist.'},
 en:{s:'A customer\'s office PCs (built in 2020, 10th-generation Intel Core i5, UEFI mode, GPT) are to be upgraded from Windows 10 to Windows 11. The "PC Health Check" app reports: "TPM 2.0 must be supported and enabled on this PC." No TPM is visible in Device Manager.',
     q:'How do you proceed?',
     o:['Enable the firmware TPM (Intel PTT or AMD fTPM) in UEFI setup and repeat the check','Order a discrete TPM module for each PC and plug it into the mainboard\'s TPM header','Bypass the TPM check with a registry entry and carry out the upgrade','Classify the PCs as not Windows 11 capable and replace them'],
     e:'Current Intel and AMD processors contain a firmware TPM 2.0 that is often disabled at the factory. Once enabled in the UEFI, the PCs meet the requirement without additional hardware.',
     n:'The registry bypass is tempting but results in a configuration Microsoft does not support, with no entitlement to updates – and it is unnecessary here because the TPM is merely disabled.'}},
{id:'bs-07', a:'bs', t:'mc', c:[0,1,2],
 de:{s:'Vor dem geplanten Umstieg auf Windows 11 prüfen Sie einen älteren Arbeitsplatzrechner der Buchhaltung. Die Inventarisierung liefert folgende Daten:',
     tb:{h:['Komponente','Ausstattung'], r:[['Prozessor','Intel Core i5-7500 (7. Generation), 4 Kerne, 3,4 GHz'],['Arbeitsspeicher','8 GB DDR4'],['Datenträger','256-GB-SATA-SSD, MBR-partitioniert'],['Firmware','UEFI im Legacy-/CSM-Modus, Secure Boot aus'],['TPM','Version 1.2'],['Grafik','DirectX 12, WDDM 2.x']]},
     q:'Welche Punkte verhindern ein offiziell unterstütztes Upgrade in diesem Zustand? (Mehrere Antworten)',
     o:['Der Prozessor steht nicht auf der Liste der unterstützten CPUs','Das TPM erfüllt nur Version 1.2 statt 2.0','Das System startet im Legacy-Modus von einem MBR-Datenträger statt per UEFI mit Secure Boot','Der Arbeitsspeicher ist mit 8 GB zu klein','Die SSD ist mit 256 GB zu klein'],
     e:'Windows 11 verlangt u. a. eine unterstützte CPU (bei Intel ab 8. Generation), TPM 2.0 sowie UEFI mit Secure-Boot-Fähigkeit. Legacy/MBR lässt sich mit MBR2GPT und Umstellung auf UEFI beheben – die CPU nicht, daher ist der PC ein Austauschkandidat.',
     n:'8 GB RAM und 256 GB Speicher liegen deutlich über den Mindestanforderungen von 4 GB RAM und 64 GB Speicher – sie mögen knapp wirken, verhindern das Upgrade aber nicht.'},
 en:{s:'Before the planned move to Windows 11 you check an older workstation in the accounting department. The inventory tool returns the following data:',
     tb:{h:['Component','Configuration'], r:[['Processor','Intel Core i5-7500 (7th generation), 4 cores, 3.4 GHz'],['Memory','8 GB DDR4'],['Drive','256 GB SATA SSD, MBR-partitioned'],['Firmware','UEFI in legacy/CSM mode, Secure Boot off'],['TPM','Version 1.2'],['Graphics','DirectX 12, WDDM 2.x']]},
     q:'Which points prevent an officially supported upgrade in this state? (Multiple answers)',
     o:['The processor is not on the list of supported CPUs','The TPM only meets version 1.2 instead of 2.0','The system boots in legacy mode from an MBR disk instead of via UEFI with Secure Boot','The memory is too small at 8 GB','The SSD is too small at 256 GB'],
     e:'Among other things, Windows 11 requires a supported CPU (Intel from the 8th generation), TPM 2.0 and UEFI with Secure Boot capability. Legacy/MBR can be fixed with MBR2GPT and a switch to UEFI – the CPU cannot, so the PC is a candidate for replacement.',
     n:'8 GB RAM and 256 GB storage are well above the minimum requirements of 4 GB RAM and 64 GB storage – they may seem tight, but they do not prevent the upgrade.'}},
{id:'bs-08', a:'bs', t:'sc', c:0,
 de:{s:'In einem Steuerbüro arbeiten alle Mitarbeitenden mit lokalen Administratorkonten, „damit sie Druckertreiber selbst installieren können“. Nach einem Schadsoftwarevorfall sollen Sie die Kontenstruktur überarbeiten.',
     q:'Welche Lösung setzen Sie um?',
     o:['Mitarbeitende arbeiten mit Standardbenutzerkonten; administrative Aufgaben erledigt die IT mit separaten Administratorkonten, deren Anmeldedaten die Benutzerkontensteuerung (UAC) abfragt','Die Konten bleiben Administratoren, die Benutzerkontensteuerung wird auf „Immer benachrichtigen“ gestellt','Die Benutzerkontensteuerung wird deaktiviert, damit keine Rückfragen stören, und zusätzlich ein zweiter Virenscanner installiert','Alle Mitarbeitenden erhalten ein gemeinsames Administratorkonto mit einem langen, komplexen Passwort'],
     e:'Nach dem Prinzip der minimalen Rechte laufen Programme – auch Schadsoftware – nur mit Standardrechten und können keine systemweiten Änderungen vornehmen. Für Admin-Aufgaben fragt die UAC die Anmeldedaten eines separaten Kontos ab; lokale Admin-Kennwörter lassen sich z. B. mit Windows LAPS verwalten.',
     n:'Mit Administratorkonto ist die UAC nur eine Bestätigungsabfrage, die Anwender gewohnheitsmäßig mit „Ja“ wegklicken – sie ersetzt keine Rechtetrennung.'},
 en:{s:'In a tax consultancy all staff work with local administrator accounts "so that they can install printer drivers themselves". After a malware incident you are to redesign the account structure.',
     q:'Which solution do you implement?',
     o:['Staff work with standard user accounts; IT carries out administrative tasks with separate administrator accounts whose credentials User Account Control (UAC) prompts for','The accounts remain administrators and User Account Control is set to "Always notify"','User Account Control is disabled so that no prompts get in the way, and a second virus scanner is installed','All staff get a shared administrator account with a long, complex password'],
     e:'Following the principle of least privilege, programs – including malware – only run with standard rights and cannot make system-wide changes. For admin tasks, UAC prompts for the credentials of a separate account; local admin passwords can be managed with Windows LAPS, for example.',
     n:'With an administrator account, UAC is merely a confirmation prompt that users habitually click away with "Yes" – it does not replace a separation of privileges.'}},
{id:'bs-09', a:'bs', t:'match',
 de:{s:'Ein mittelständischer Kunde mit 25 PCs hat Windows-Lizenzen aus verschiedenen Quellen und fragt nach den Unterschieden der Lizenzarten.',
     q:'Ordnen Sie jeder Lizenzart die passende Beschreibung zu.',
     p:[['OEM-Lizenz','Mit einem neuen PC ausgeliefert, laut Lizenzbedingungen an dieses Gerät gebunden; Support über den Gerätehersteller'],['Retail-Lizenz (Box/ESD)','Einzeln gekauft; darf auf einen anderen PC übertragen werden, wenn sie vom alten entfernt wird'],['Volumenlizenz','Rahmenvertrag für Organisationen, Aktivierung zentral über einen KMS-Server oder per MAK'],['Abonnement (z. B. Windows Enterprise E3)','Pro Benutzer lizenziert, laufende Gebühr, Nutzungsrecht endet mit der Kündigung']],
     e:'Die Lizenzart bestimmt Übertragbarkeit, Aktivierung und Kosten. Volumenlizenzen und Abonnements vereinfachen die zentrale Verwaltung; Windows-Volumenlizenzen für Clients sind in der Regel Upgrade-Lizenzen und setzen eine qualifizierende Grundlizenz (z. B. OEM Pro) voraus.',
     n:'Häufiger Irrtum: Eine OEM-Lizenz könne beim PC-Austausch einfach auf das neue Gerät übertragen werden. Nach den Microsoft-Lizenzbedingungen bleibt sie an das Gerät der Erstinstallation gebunden.'},
 en:{s:'A medium-sized customer with 25 PCs has Windows licences from various sources and asks about the differences between the licence types.',
     q:'Match each licence type to the correct description.',
     p:[['OEM licence','Supplied with a new PC, bound to that device according to the licence terms; support via the device manufacturer'],['Retail licence (box/ESD)','Purchased individually; may be transferred to another PC if it is removed from the old one'],['Volume licence','Framework agreement for organisations, activation centrally via a KMS server or via MAK'],['Subscription (e.g. Windows Enterprise E3)','Licensed per user, recurring fee, usage right ends on cancellation']],
     e:'The licence type determines transferability, activation and costs. Volume licences and subscriptions simplify central management; Windows client volume licences are usually upgrade licences and require a qualifying base licence (e.g. OEM Pro).',
     n:'Common misconception: an OEM licence can simply be moved to the new device when a PC is replaced. Under Microsoft\'s licence terms it remains bound to the device on which it was first installed.'}},
{id:'bs-10', a:'bs', t:'sc', c:0,
 de:{s:'Nach jedem Patchday wird der Windows-Server eines Konstruktionsbüros nachts automatisch neu gestartet. Am Morgen können die Mitarbeitenden die CAD-Software nicht starten, bis ein Administrator den Dienst „CAD License Server“ in der Diensteverwaltung von Hand startet. Der Dienst hat den Starttyp „Manuell“.',
     q:'Wie beheben Sie das Problem dauerhaft?',
     o:['Den Starttyp des Dienstes auf „Automatisch“ setzen und in den Wiederherstellungsoptionen einen Neustart bei Fehlern konfigurieren','Eine Verknüpfung zur Programmdatei des Lizenzservers in den Autostart-Ordner des Administratorkontos legen','Den Dienst nach jedem Neustart im Task-Manager über „Dienste“ starten','Den Server nach Patchdays nicht mehr automatisch neu starten lassen'],
     e:'Dienste mit dem Starttyp „Automatisch“ startet der Dienststeuerungs-Manager beim Hochfahren ohne Benutzeranmeldung. Die Wiederherstellungsoptionen starten den Dienst nach einem Absturz selbstständig neu.',
     n:'Der Autostart-Ordner wirkt naheliegend, wird aber erst bei der interaktiven Anmeldung des jeweiligen Benutzers ausgeführt – nach einem nächtlichen Neustart meldet sich niemand an.'},
 en:{s:'After every patch day, the Windows server of a design office is restarted automatically at night. In the morning, staff cannot start the CAD software until an administrator manually starts the "CAD License Server" service in the Services console. The service has the startup type "Manual".',
     q:'How do you fix the problem permanently?',
     o:['Set the startup type of the service to "Automatic" and configure a restart on failure in the recovery options','Place a shortcut to the licence server executable in the startup folder of the administrator account','Start the service after every restart via the "Services" tab in Task Manager','Stop the server from restarting automatically after patch days'],
     e:'Services with the startup type "Automatic" are started by the Service Control Manager at boot without any user logging on. The recovery options restart the service automatically after a crash.',
     n:'The startup folder seems obvious, but it only runs when that particular user logs on interactively – after a restart at night, nobody logs on.'}},
{id:'bs-11', a:'bs', t:'mc', c:[0,1,2],
 de:{s:'Ein Kunde möchte einen Linux-Server für interne Webanwendungen aufsetzen. Anforderungen: mindestens fünf Jahre Sicherheitsupdates, stabile Paketversionen ohne häufige Versionssprünge, kein Upgrade auf ein neues Release in kurzen Abständen.',
     q:'Welche Distributionen bzw. Versionen erfüllen diese Anforderungen? (Mehrere Antworten)',
     o:['Debian (Stable-Zweig, einschließlich Debian LTS)','Ubuntu Server LTS','Rocky Linux oder AlmaLinux (RHEL-kompatibel)','Arch Linux (Rolling Release)','Fedora Server','Eine Ubuntu-Zwischenversion (Interim Release, z. B. 25.10)'],
     e:'Debian Stable (inkl. LTS-Phase) und Ubuntu LTS bieten rund fünf Jahre Sicherheitsupdates, die RHEL-kompatiblen Distributionen bis zu zehn Jahre. Innerhalb eines Releases werden Pakete nur mit Sicherheits- und Fehlerkorrekturen versorgt.',
     n:'Fedora ist verbreitet und modern, wird aber nur etwa 13 Monate unterstützt – für einen langfristig betriebenen Server wären ständige Release-Upgrades nötig. Ähnliches gilt für Ubuntu-Zwischenversionen mit nur 9 Monaten Support.'},
 en:{s:'A customer wants to set up a Linux server for internal web applications. Requirements: at least five years of security updates, stable package versions without frequent version jumps, no upgrade to a new release at short intervals.',
     q:'Which distributions or versions meet these requirements? (Multiple answers)',
     o:['Debian (stable branch, including Debian LTS)','Ubuntu Server LTS','Rocky Linux or AlmaLinux (RHEL-compatible)','Arch Linux (rolling release)','Fedora Server','An Ubuntu interim release (e.g. 25.10)'],
     e:'Debian stable (including the LTS phase) and Ubuntu LTS offer about five years of security updates, the RHEL-compatible distributions up to ten years. Within a release, packages only receive security and bug fixes.',
     n:'Fedora is popular and modern but is only supported for about 13 months – a long-running server would need constant release upgrades. The same applies to Ubuntu interim releases with only 9 months of support.'}},
{id:'bs-12', a:'bs', t:'sc', c:0,
 de:{s:'Am gemeinsam genutzten Empfangs-PC haben Sie, angemeldet mit Ihrem Administratorkonto, unter HKEY_CURRENT_USER\\Software\\Contoso\\Telefonie den Wert „ServerAddress“ eingetragen. Bei Ihnen verbindet sich die Telefonsoftware nun korrekt. Meldet sich danach die Empfangskraft an, fehlt die Einstellung.',
     q:'Was ist die Ursache?',
     o:['HKEY_CURRENT_USER verweist auf den Registrierungszweig des gerade angemeldeten Benutzers (NTUSER.DAT) – benutzerübergreifende Einstellungen gehören nach HKEY_LOCAL_MACHINE oder werden per Gruppenrichtlinie verteilt','Änderungen an der Registry werden für andere Benutzer erst nach einem Neustart des PCs übernommen','Die Empfangskraft hat als Standardbenutzerin keine Leseberechtigung für die Registry','HKEY_CURRENT_USER wird bei jeder Abmeldung aus HKEY_CLASSES_ROOT auf Standardwerte zurückgesetzt'],
     e:'Jedes Benutzerprofil hat seine eigene NTUSER.DAT, die bei der Anmeldung als HKEY_CURRENT_USER eingebunden wird. Sie haben den Wert also nur in Ihrem eigenen Profil gesetzt. Vor Änderungen den Schlüssel exportieren, bei mehreren PCs besser per GPO verteilen.',
     n:'Ein Neustart hilft nicht: Der Wert steht physisch in Ihrer eigenen NTUSER.DAT und wird im Profil der Empfangskraft nie auftauchen.'},
 en:{s:'On the shared reception PC, logged on with your administrator account, you entered the value "ServerAddress" under HKEY_CURRENT_USER\\Software\\Contoso\\Telefonie. The telephony software now connects correctly for you. When the receptionist logs on afterwards, the setting is missing.',
     q:'What is the cause?',
     o:['HKEY_CURRENT_USER points to the registry branch of the user currently logged on (NTUSER.DAT) – settings for all users belong in HKEY_LOCAL_MACHINE or are distributed via group policy','Registry changes only take effect for other users after the PC is restarted','As a standard user, the receptionist has no read permission for the registry','HKEY_CURRENT_USER is reset to default values from HKEY_CLASSES_ROOT at every logoff'],
     e:'Each user profile has its own NTUSER.DAT, which is loaded as HKEY_CURRENT_USER at logon. You therefore set the value only in your own profile. Export the key before making changes; for several PCs, distribute the setting via GPO instead.',
     n:'A restart does not help: the value is physically stored in your own NTUSER.DAT and will never appear in the receptionist\'s profile.'}},
{id:'bs-13', a:'bs', t:'match',
 de:{s:'Im Support gehen an einem Tag mehrere Windows-11-Störungen ein. Sie wählen jeweils die passende Wiederherstellungsoption mit dem geringsten nötigen Eingriff.',
     q:'Ordnen Sie jeder Störung die passende Wiederherstellungsoption zu.',
     p:[['Seit der Installation eines Scannertreibers gestern stürzt Windows sporadisch ab; ein Wiederherstellungspunkt von vorgestern existiert','Systemwiederherstellung'],['Nach einem Stromausfall meldet der PC beim Start, dass die Startkonfigurationsdaten (BCD) fehlen','Starthilfe (Starthilfe-Reparatur)'],['Ein neuer Grafiktreiber verursacht beim normalen Start sofort einen Bluescreen und soll deinstalliert werden','Abgesicherter Modus'],['Windows ist durch viele Testinstallationen zerfahren; eine Neuinstallation ist gewünscht, die Benutzerdateien sollen erhalten bleiben','„Diesen PC zurücksetzen“ mit „Eigene Dateien behalten“'],['Die defekte SSD wurde getauscht; ein vollständiges Image-Backup vom Vortag liegt vor','Wiederherstellung aus einem Systemabbild']],
     e:'Die Systemwiederherstellung setzt Systemdateien, Treiber und Registry zurück, lässt persönliche Dateien aber unberührt. Die Starthilfe repariert Startprobleme automatisch, der abgesicherte Modus lädt nur Basistreiber. Zurücksetzen installiert Windows neu, ein Systemabbild stellt den ganzen Datenträger wieder her.',
     n:'Häufiger Irrtum: Die Systemwiederherstellung sei ein Backup der Benutzerdateien. Sie sichert nur Systemzustände – nach einem SSD-Tausch ist sie wertlos, weil die Wiederherstellungspunkte auf der alten SSD lagen.'},
 en:{s:'Several Windows 11 faults are reported to the support desk on one day. In each case you choose the appropriate recovery option with the least intervention necessary.',
     q:'Match each fault to the appropriate recovery option.',
     p:[['Since a scanner driver was installed yesterday, Windows crashes sporadically; a restore point from the day before yesterday exists','System Restore'],['After a power failure, the PC reports at startup that the boot configuration data (BCD) is missing','Startup Repair'],['A new graphics driver causes a blue screen immediately during a normal start and is to be uninstalled','Safe mode'],['Windows is cluttered by many test installations; a reinstall is wanted, but user files are to be kept','"Reset this PC" with "Keep my files"'],['The defective SSD has been replaced; a complete image backup from the previous day is available','System image recovery']],
     e:'System Restore resets system files, drivers and registry but leaves personal files untouched. Startup Repair fixes boot problems automatically, safe mode loads only basic drivers. Reset reinstalls Windows, a system image restores the entire disk.',
     n:'Common misconception: System Restore is a backup of user files. It only saves system states – after an SSD replacement it is useless because the restore points were on the old SSD.'}},
{id:'bs-14', a:'bs', gen:'bsPartition'},
{id:'bs-15', a:'bs', t:'mc', c:[0,1,2],
 de:{s:'Ihr Systemhaus betreut die Windows- und Linux-Server mehrerer Kunden aus der Ferne. Ein neuer Kollege schlägt vor, am Router jedes Kunden Port 3389 auf den jeweiligen Server weiterzuleiten, „dann geht es am schnellsten“.',
     q:'Welche Verfahren zur Fernadministration sind sicher? (Mehrere Antworten)',
     o:['RDP nur über ein VPN oder ein Remotedesktopgateway mit Mehr-Faktor-Authentifizierung erreichbar machen','Linux-Server per SSH mit Schlüsselauthentifizierung verwalten und die Passwortanmeldung deaktivieren','Windows-Server per PowerShell Remoting (WinRM) bzw. Windows Admin Center über HTTPS aus einem abgeschotteten Verwaltungsnetz administrieren','Port 3389 direkt auf die Server weiterleiten und dafür ein besonders langes Passwort setzen','Linux-Server per Telnet administrieren, weil das weniger Overhead verursacht als SSH'],
     e:'Administrationszugänge gehören nicht direkt ins Internet. VPN bzw. RD-Gateway mit MFA, schlüsselbasiertes SSH und verschlüsseltes Remoting aus einem Verwaltungsnetz reduzieren die Angriffsfläche und schützen die Anmeldedaten.',
     n:'Ein langes Passwort wirkt ausreichend, doch direkt erreichbare RDP-Dienste werden permanent gescannt und über Brute-Force-Angriffe sowie Sicherheitslücken im Protokoll angegriffen – ein häufiger Einstiegspunkt für Ransomware.'},
 en:{s:'Your IT service company manages the Windows and Linux servers of several customers remotely. A new colleague suggests forwarding port 3389 on each customer\'s router to the respective server, "because that is quickest".',
     q:'Which remote administration methods are secure? (Multiple answers)',
     o:['Make RDP reachable only via a VPN or a Remote Desktop Gateway with multi-factor authentication','Manage Linux servers via SSH with key authentication and disable password logon','Administer Windows servers via PowerShell Remoting (WinRM) or Windows Admin Center over HTTPS from an isolated management network','Forward port 3389 directly to the servers and set a particularly long password for it','Administer Linux servers via Telnet because it causes less overhead than SSH'],
     e:'Administrative access does not belong directly on the internet. VPN or RD Gateway with MFA, key-based SSH and encrypted remoting from a management network reduce the attack surface and protect the credentials.',
     n:'A long password seems sufficient, but directly reachable RDP services are constantly scanned and attacked via brute force and protocol vulnerabilities – a common entry point for ransomware.'}},
{id:'bs-16', a:'bs', t:'order',
 de:{s:'Ein Windows-11-PC bleibt beim Start mit einer Fehlermeldung hängen. Um die Meldung einer Phase zuordnen zu können, erklären Sie einer Auszubildenden die Startkette ab dem Moment, in dem die UEFI-Firmware die Kontrolle abgibt.',
     q:'Bringen Sie die Phasen des Windows-Starts in die richtige Reihenfolge.',
     o:['UEFI-Firmware lädt gemäß NVRAM-Booteintrag den Windows Boot Manager (bootmgfw.efi) von der EFI-Systempartition','Windows Boot Manager liest den BCD-Speicher (Boot Configuration Data) und wählt den Starteintrag','Windows-Startladeprogramm (winload.efi) lädt Kernel (ntoskrnl.exe), HAL und startrelevante Treiber','Der Kernel initialisiert sich und startet den Sitzungs-Manager (smss.exe)','Der Sitzungs-Manager startet u. a. wininit.exe (Dienste, LSASS) und winlogon.exe','Winlogon zeigt den Anmeldebildschirm; nach der Anmeldung wird die Shell (explorer.exe) geladen'],
     e:'Jede Phase lädt die nächste. Meldet der PC fehlende Startkonfigurationsdaten, liegt das Problem beim Boot Manager bzw. BCD (Reparatur z. B. mit bcdboot); ein „INACCESSIBLE_BOOT_DEVICE“ deutet dagegen auf einen fehlenden Speichercontrollertreiber in der winload/Kernel-Phase.',
     n:'Häufig wird angenommen, der Kernel lese selbst die BCD. Die BCD wertet aber bereits der Boot Manager aus – erst danach lädt winload.efi den Kernel.'},
 en:{s:'A Windows 11 PC hangs at startup with an error message. To assign the message to a phase, you explain the boot chain to a trainee from the moment the UEFI firmware hands over control.',
     q:'Put the phases of the Windows startup in the correct order.',
     o:['The UEFI firmware loads the Windows Boot Manager (bootmgfw.efi) from the EFI system partition according to the NVRAM boot entry','The Windows Boot Manager reads the BCD store (Boot Configuration Data) and selects the boot entry','The Windows boot loader (winload.efi) loads the kernel (ntoskrnl.exe), the HAL and boot-critical drivers','The kernel initialises and starts the Session Manager (smss.exe)','The Session Manager starts wininit.exe (services, LSASS) and winlogon.exe, among others','Winlogon displays the logon screen; after logon the shell (explorer.exe) is loaded'],
     e:'Each phase loads the next. If the PC reports missing boot configuration data, the problem lies with the Boot Manager or BCD (repair e.g. with bcdboot); an "INACCESSIBLE_BOOT_DEVICE", on the other hand, points to a missing storage controller driver in the winload/kernel phase.',
     n:'It is often assumed that the kernel reads the BCD itself. But the Boot Manager already evaluates the BCD – only then does winload.efi load the kernel.'}},
{id:'bs-17', a:'bs', t:'order',
 de:{s:'Bei einem Mittelständler mit 150 Windows-Clients installiert bisher jeder PC Updates unkontrolliert. Nachdem ein fehlerhaftes Update die Warenwirtschaft lahmgelegt hat, führen Sie ein geregeltes Update-Management mit Update-Ringen ein.',
     q:'Bringen Sie die Schritte des Update-Prozesses in die richtige Reihenfolge.',
     o:['Bestand erfassen: eingesetzte Systeme, Betriebssystemversionen und Anwendungen','Neu veröffentlichte Updates sichten und nach Kritikalität bewerten (z. B. zum Patchday am zweiten Dienstag im Monat)','Updates in einer Pilotgruppe installieren und die Kernanwendungen testen','Updates freigeben und gestaffelt in Update-Ringen auf die übrigen Clients verteilen','Installationsstatus überwachen und fehlgeschlagene Installationen nacharbeiten','Ergebnisse dokumentieren und den Prozess für den nächsten Zyklus anpassen'],
     e:'Ohne Bestandsaufnahme weiß man nicht, welche Updates relevant sind. Die Pilotgruppe erkennt Unverträglichkeiten, bevor alle Arbeitsplätze betroffen sind; Monitoring und Dokumentation schließen den Kreislauf.',
     n:'Naheliegend, aber riskant: Updates aus Sicherheitsgründen sofort an alle Clients zu verteilen. Ungetestete Updates können – wie hier geschehen – Fachanwendungen lahmlegen. Für kritische, aktiv ausgenutzte Lücken wird die Testphase verkürzt, aber nicht übersprungen.'},
 en:{s:'At a medium-sized company with 150 Windows clients, every PC has so far installed updates in an uncontrolled way. After a faulty update crippled the merchandise management system, you introduce structured update management with update rings.',
     q:'Put the steps of the update process in the correct order.',
     o:['Record the inventory: systems, operating system versions and applications in use','Review newly released updates and assess their criticality (e.g. on Patch Tuesday, the second Tuesday of the month)','Install the updates in a pilot group and test the core applications','Approve the updates and roll them out in stages via update rings to the remaining clients','Monitor the installation status and follow up on failed installations','Document the results and adjust the process for the next cycle'],
     e:'Without an inventory you do not know which updates are relevant. The pilot group detects incompatibilities before all workstations are affected; monitoring and documentation close the cycle.',
     n:'Tempting but risky: distributing updates to all clients immediately for security reasons. Untested updates can – as happened here – cripple business applications. For critical, actively exploited vulnerabilities the test phase is shortened, but not skipped.'}},
{id:'bs-18', a:'bs', t:'sc', c:0,
 de:{s:'Sie haben Windows 11 Pro von einem USB-Stick auf einem neuen Notebook installiert, das keinen LAN-Anschluss hat. Nach der Installation gibt es keine WLAN-Verbindung. Im Geräte-Manager erscheint unter „Andere Geräte“ ein „Netzwerkcontroller“ mit gelbem Warnsymbol.',
     q:'Wie gehen Sie am sinnvollsten vor?',
     o:['An einem anderen PC den WLAN-Treiber für genau dieses Modell von der Support-Seite des Notebookherstellers laden und per USB-Stick installieren','Windows Update ausführen, damit Windows den fehlenden Treiber automatisch nachlädt','Den Netzwerkcontroller im Geräte-Manager deinstallieren und das Notebook neu starten','Ein Treiber-Update-Tool eines Drittanbieters von einem Download-Portal installieren'],
     e:'Das gelbe Symbol zeigt, dass für das Gerät kein Treiber installiert ist. Der passende, signierte Treiber kommt vom Hersteller des Notebooks bzw. des WLAN-Chips. Alternativ kann man per USB-LAN-Adapter oder USB-Tethering vorübergehend eine Verbindung herstellen und dann Windows Update nutzen.',
     n:'Windows Update wäre grundsätzlich eine gute Treiberquelle – ohne jede Netzwerkverbindung kann es aber nichts herunterladen.'},
 en:{s:'You installed Windows 11 Pro from a USB stick on a new notebook that has no LAN port. After the installation there is no Wi-Fi connection. In Device Manager a "Network controller" with a yellow warning icon appears under "Other devices".',
     q:'What is the most sensible way to proceed?',
     o:['On another PC, download the Wi-Fi driver for exactly this model from the notebook manufacturer\'s support page and install it via USB stick','Run Windows Update so that Windows automatically downloads the missing driver','Uninstall the network controller in Device Manager and restart the notebook','Install a third-party driver update tool from a download portal'],
     e:'The yellow icon shows that no driver is installed for the device. The appropriate, signed driver comes from the manufacturer of the notebook or of the Wi-Fi chip. Alternatively, a temporary connection can be established via a USB LAN adapter or USB tethering and Windows Update used afterwards.',
     n:'Windows Update would generally be a good driver source – but without any network connection it cannot download anything.'}},
{id:'bs-19', a:'bs', t:'open',
 de:{s:'Fachgespräch: Ein Softwareentwickler möchte auf seinem Notebook (1-TB-NVMe-SSD) sowohl Windows 11 Pro als auch Ubuntu LTS parallel betreiben (Dual Boot). Für Windows ist BitLocker vorgeschrieben. Prüfer: „Wie planen Sie Partitionierung und Bootvorgang, und worauf achten Sie dabei?“',
     q:'Erläutern Sie Ihr Vorgehen.',
     m:'• UEFI-Modus mit GPT; Secure Boot kann aktiv bleiben, da Ubuntu einen signierten Shim nutzt.\n• Vorab vollständige Datensicherung und BitLocker-Wiederherstellungsschlüssel sichern.\n• Reihenfolge: zuerst Windows, dann Ubuntu – der Linux-Installer erkennt Windows und richtet GRUB mit Auswahlmenü ein; Windows würde umgekehrt den Linux-Bootloader übergehen.\n• Partitionen: gemeinsame EFI-Systempartition (FAT32), MSR, Windows C: (NTFS), WinRE; für Ubuntu Root-Partition (ext4), ggf. separates /home, Swap als Datei. Platz vorher unter Windows per „Volume verkleinern“ freigeben.\n• BitLocker vor Änderungen an Bootloader/Partitionen anhalten, da eine geänderte Startkette sonst die Wiederherstellung auslöst; Ubuntu-Partition mit LUKS verschlüsseln.\n• Windows-Schnellstart deaktivieren, damit die NTFS-Partition nicht im Ruhezustand gesperrt ist; Systemuhr abstimmen (Windows lokale Zeit, Linux UTC).\n• Abschließend beide Systeme starten, Updates und Bootmenü testen, Konfiguration dokumentieren.',
     k:['UEFI, GPT, Secure Boot berücksichtigt','Datensicherung und BitLocker-Wiederherstellungsschlüssel','Windows zuerst, dann Linux mit GRUB','Gemeinsame EFI-Systempartition und konkrete Partitionen','BitLocker anhalten, Linux mit LUKS verschlüsseln','Schnellstart deaktivieren / Uhrzeitproblem','Test und Dokumentation']},
 en:{s:'Expert interview: a software developer wants to run both Windows 11 Pro and Ubuntu LTS on his notebook (1 TB NVMe SSD) (dual boot). BitLocker is mandatory for Windows. Examiner: "How do you plan the partitioning and the boot process, and what do you pay attention to?"',
     q:'Explain your approach.',
     m:'• UEFI mode with GPT; Secure Boot can remain enabled because Ubuntu uses a signed shim.\n• Beforehand, make a complete data backup and save the BitLocker recovery key.\n• Order: Windows first, then Ubuntu – the Linux installer detects Windows and sets up GRUB with a boot menu; the other way round, Windows would ignore the Linux bootloader.\n• Partitions: shared EFI system partition (FAT32), MSR, Windows C: (NTFS), WinRE; for Ubuntu a root partition (ext4), possibly a separate /home, swap as a file. Free up space beforehand in Windows via "Shrink volume".\n• Suspend BitLocker before changing the bootloader/partitions, as a changed boot chain would otherwise trigger recovery; encrypt the Ubuntu partition with LUKS.\n• Disable Windows Fast Startup so that the NTFS partition is not locked in hibernation; align the system clock (Windows local time, Linux UTC).\n• Finally, boot both systems, test updates and the boot menu, document the configuration.',
     k:['UEFI, GPT, Secure Boot considered','Data backup and BitLocker recovery key','Windows first, then Linux with GRUB','Shared EFI system partition and concrete partitions','Suspend BitLocker, encrypt Linux with LUKS','Disable Fast Startup / clock issue','Test and documentation']}},
{id:'bs-20', a:'bs', t:'in', f:[{v:2, tol:0, u:'TiB'},{v:16, tol:0, u:'TiB'},{v:2.19, tol:0.011, u:'TiB'}],

/* ----- BEREICH:ergo – Erweiterung ----- */
/* Pausen nach ArbZG bzw. JArbSchG */
GEN.ergoPause = function(L){
  const youth = Math.random() < 0.35;
  const W = youth ? 15*rnd(16,32) : 15*rnd(20,40);   /* reine Arbeitszeit in min: Jugendliche 4–8 h, Erwachsene 5–10 h */
  const P = pick([30,45,60]), beg = 15*rnd(28,36), end = beg + W + P;
  const hm = m => `${Math.floor(m/60)}:${String(m%60).padStart(2,'0')}`;
  const req = youth ? (W>360?60:W>270?30:0) : (W>540?45:W>360?30:0);
  const who = youth ? tx(L,'eine 17-jährige Auszubildende','a 17-year-old apprentice') : tx(L,'ein Systemadministrator','a system administrator');
  const rule = youth ? tx(L,'§ 11 JArbSchG (Jugendliche): mehr als 4,5 bis 6 h → 30 min, mehr als 6 h → 60 min','Section 11 JArbSchG (young workers): more than 4.5 up to 6 h → 30 min, more than 6 h → 60 min')
                     : tx(L,'§ 4 ArbZG: mehr als 6 bis 9 h → 30 min, mehr als 9 h → 45 min','Section 4 ArbZG: more than 6 up to 9 h → 30 min, more than 9 h → 45 min');
  const reqTxt = req===0 ? tx(L,'0 min (noch keine Pause vorgeschrieben)','0 min (no break required yet)') : `${req} min`;
  const verdict = P >= req ? tx(L,'Die gebuchte Pause reicht aus.','The booked break is sufficient.')
                           : tx(L,`Die gebuchte Pause reicht nicht aus – es fehlen ${req-P} Minuten.`,`The booked break is not sufficient – ${req-P} minutes are missing.`);
  return { t:'in',
    s: tx(L, `Bei der Kontrolle der Zeiterfassung fällt Ihnen folgender Eintrag auf: ${who} kam um ${hm(beg)} Uhr, ging um ${hm(end)} Uhr und hat insgesamt ${P} Minuten Ruhepause gebucht.`,
             `While checking the time records you notice the following entry: ${who} arrived at ${hm(beg)}, left at ${hm(end)} and booked a total of ${P} minutes of rest breaks.`),
    q: tx(L, 'Berechnen Sie die tatsächliche Arbeitszeit in Stunden (zwei Nachkommastellen) und die für diese Arbeitszeit gesetzlich vorgeschriebene Mindestpause in Minuten.',
             'Calculate the actual working time in hours (two decimal places) and the statutory minimum break in minutes for this working time.'),
    f: [ {l:tx(L,'Arbeitszeit','Working time'), v:r2(W/60), tol:0.011, u:'h'}, {l:tx(L,'Mindestpause','Minimum break'), v:req, tol:0, u:'min'} ],
    e: tx(L, `Anwesenheit ${hm(beg)}–${hm(end)} = ${end-beg} min, abzüglich ${P} min Pause = ${W} min = ${fmt(W/60,2,L)} h. Ruhepausen zählen nicht zur Arbeitszeit. ${rule} → ${reqTxt}. ${verdict}`,
             `Presence ${hm(beg)}–${hm(end)} = ${end-beg} min, minus ${P} min break = ${W} min = ${fmt(W/60,2,L)} h. Rest breaks do not count as working time. ${rule} → ${reqTxt}. ${verdict}`),
    n: youth ? tx(L, 'Häufiger Fehler: bei Jugendlichen die Grenzen des ArbZG (30 min erst ab mehr als 6 h) anzuwenden – das JArbSchG verlangt schon ab mehr als 4,5 h 30 min und ab mehr als 6 h 60 min.',
                     'Common mistake: applying the ArbZG limits (30 min only above 6 h) to young workers – the JArbSchG already requires 30 min above 4.5 h and 60 min above 6 h.')
             : tx(L, 'Häufiger Fehler: die Anwesenheitszeit (Kommen bis Gehen) als Arbeitszeit zu nehmen – die Grenzen von 6 h und 9 h gelten für die reine Arbeitszeit ohne Pausen.',
                     'Common mistake: taking the presence time (arrival to departure) as working time – the 6 h and 9 h limits apply to the pure working time without breaks.')
  };
};

     q:'Put the five safety rules in the prescribed order.',
     o:['Disconnect completely (isolate all poles from the supply)','Secure against reconnection (e.g. lock-out device, warning sign)','Verify the absence of voltage on all poles','Earth and short-circuit','Cover or fence off adjacent live parts'],
     e:'First isolate and secure against reconnection, then check that there really is no voltage. Only then may earthing and short-circuiting be done; finally, protect against adjacent parts that are still live.',
     n:'"Verify absence of voltage" is often placed before securing – but without securing someone could switch on again between testing and working. Earthing before testing would cause a short circuit if voltage were still present.'}},
{id:'ergo-07', a:'ergo', t:'sc', c:0,
 de:{s:'Die Büroleitung Ihres Betriebs (60 Büroarbeitsplätze mit Notebook-Netzteilen, Monitoren und Mehrfachsteckdosen) fragt Sie nach der Prüfung ortsveränderlicher elektrischer Betriebsmittel gemäß DGUV Vorschrift 3. Ein Kollege behauptet, das müsse jedes Jahr der TÜV machen.',
     q:'Welche Aussage ist richtig?',
     o:['Prüfen darf eine Elektrofachkraft oder eine elektrotechnisch unterwiesene Person mit geeignetem Mess- und Prüfgerät; die Frist legt der Arbeitgeber per Gefährdungsbeurteilung fest – in Büros bei geringer Fehlerquote bis zu 24 Monate','Die Prüfung muss jährlich durch einen TÜV-Sachverständigen erfolgen, sonst erlischt der Versicherungsschutz','Eine Sichtprüfung durch die Benutzer vor jeder Verwendung ersetzt die wiederkehrende Prüfung vollständig','Geräte mit CE-Kennzeichnung sind von der wiederkehrenden Prüfung ausgenommen'],
     e:'Die DGUV Vorschrift 3 verlangt Prüfungen durch eine Elektrofachkraft bzw. unter deren Leitung und Aufsicht. Der Richtwert für ortsveränderliche Geräte liegt bei 6 Monaten, bei einer Fehlerquote unter 2 % darf die Frist in Büros auf höchstens 2 Jahre verlängert werden.',
     n:'Die Sichtprüfung vor Benutzung ist sinnvoll und gefordert, erkennt aber keine Isolationsfehler oder einen unterbrochenen Schutzleiter – dafür sind Messungen mit einem Prüfgerät nötig.'},
 en:{s:'The office manager of your company (60 office workstations with notebook power supplies, monitors and power strips) asks you about testing portable electrical equipment according to DGUV Regulation 3 (DGUV Vorschrift 3). A colleague claims this must be done every year by TÜV.',
     q:'Which statement is correct?',
     o:['A qualified electrician or an electrotechnically instructed person with a suitable measuring and test device may test; the employer sets the interval by risk assessment – in offices with a low failure rate up to 24 months','Testing must be done annually by a TÜV expert, otherwise insurance cover lapses','A visual check by the users before each use completely replaces the recurring test','Devices with CE marking are exempt from recurring tests'],
     e:'DGUV Regulation 3 requires tests by a qualified electrician or under their direction and supervision. The guideline value for portable equipment is 6 months; with a failure rate below 2 % the interval in offices may be extended to at most 2 years.',
     n:'The visual check before use is sensible and required, but it cannot detect insulation faults or a broken protective earth conductor – that requires measurements with a test device.'}},
{id:'ergo-08', a:'ergo', t:'match',
 de:{s:'Der neue Serverraum Ihres Betriebs soll nach ASR A1.3 (Sicherheits- und Gesundheitsschutzkennzeichnung) beschildert werden.',
     q:'Ordnen Sie jedem Schild die richtige Zeichenart mit Form und Farbe zu.',
     p:[['Zutritt für Unbefugte verboten','Verbotszeichen – rund, roter Rand mit Querbalken, weißer Grund'],['Warnung vor elektrischer Spannung','Warnzeichen – dreieckig, gelber Grund, schwarzer Rand'],['Vor Wartung oder Reparatur freischalten','Gebotszeichen – rund, blauer Grund, weißes Symbol'],['Notausgang','Rettungszeichen – rechteckig, grüner Grund, weißes Symbol'],['Feuerlöscher','Brandschutzzeichen – rechteckig, roter Grund, weißes Symbol']],
     e:'Form und Farbe verraten die Bedeutung auch ohne Text: Kreis = Verbot oder Gebot, Dreieck = Warnung, Rechteck = Rettung (grün) oder Brandschutz (rot).',
     n:'Rot wird oft pauschal als „Verbot“ gelesen – das rechteckige rote Schild ist aber ein Brandschutzzeichen und kennzeichnet z. B. den Standort eines Feuerlöschers.'},
 en:{s:'The new server room of your company is to be signposted according to ASR A1.3 (safety and health signs).',
     q:'Match each sign to the correct sign type with shape and colour.',
     p:[['No access for unauthorised persons','Prohibition sign – round, red border with diagonal bar, white background'],['Warning: electrical voltage','Warning sign – triangular, yellow background, black border'],['Disconnect before maintenance or repair','Mandatory sign – round, blue background, white symbol'],['Emergency exit','Escape sign – rectangular, green background, white symbol'],['Fire extinguisher','Fire protection sign – rectangular, red background, white symbol']],
     e:'Shape and colour convey the meaning even without text: circle = prohibition or mandatory action, triangle = warning, rectangle = escape/rescue (green) or fire protection (red).',
     n:'Red is often read as "prohibition" across the board – but the rectangular red sign is a fire protection sign, marking e.g. the location of a fire extinguisher.'}},
{id:'ergo-09', a:'ergo', t:'match',
 de:{s:'Sie werden zur Brandschutzhelferin bzw. zum Brandschutzhelfer ausgebildet und sollen die Brandrisiken am Standort den Brandklassen nach DIN EN 2 zuordnen.',
     q:'Ordnen Sie jedem Brandrisiko die passende Brandklasse zu.',
     p:[['Kartonagen und Verpackungsmaterial im Hardwarelager','Brandklasse A – feste, glutbildende Stoffe'],['Isopropanol-Reinigungsflüssigkeit in der Werkstatt','Brandklasse B – flüssige oder flüssig werdende Stoffe'],['Propangasflasche für die Heizung auf der Baustelle','Brandklasse C – Gase'],['Magnesiumspäne beim Bearbeiten von Gehäuseteilen','Brandklasse D – Metalle'],['Frittierfett in der Kantinenküche','Brandklasse F – Speiseöle und -fette']],
     e:'Die Brandklasse bestimmt das Löschmittel: Auf Feuerlöschern ist angegeben, für welche Klassen sie zugelassen sind. Metallbrände und Fettbrände brauchen Speziallöscher.',
     n:'Eine Brandklasse E gibt es seit 1978 nicht mehr – elektrische Anlagen werden über die Angabe „bis 1000 V“ auf dem Löscher abgedeckt. Fettbrände gehören nicht zu B, sondern zur eigenen Klasse F, weil Wasser dort eine Fettexplosion auslöst.'},
 en:{s:'You are being trained as a fire safety assistant (Brandschutzhelfer) and are to assign the fire risks on site to the fire classes according to DIN EN 2.',
     q:'Match each fire risk to the appropriate fire class.',
     p:[['Cardboard and packaging in the hardware store room','Class A – solid, ember-forming materials'],['Isopropyl alcohol cleaning fluid in the workshop','Class B – liquids or liquefying materials'],['Propane cylinder for heating on the construction site','Class C – gases'],['Magnesium chips from machining housing parts','Class D – metals'],['Deep-frying fat in the canteen kitchen','Class F – cooking oils and fats']],
     e:'The fire class determines the extinguishing agent: extinguishers state which classes they are approved for. Metal fires and fat fires need special extinguishers.',
     n:'There has been no class E since 1978 – electrical installations are covered by the "up to 1000 V" marking on the extinguisher. Fat fires do not belong to B but to their own class F, because water causes a fat explosion.'}},
{id:'ergo-10', a:'ergo', t:'sc', c:0,
 de:{s:'Sie sollen in ein 42-HE-Rack beim Kunden einen USV-Batterieeinschub mit 32 kg einbauen. Im Rack sind bereits Server im mittleren Bereich montiert, die unteren Höheneinheiten sind frei.',
     q:'Wie gehen Sie vor?',
     o:['Den Einschub im unteren Bereich des Racks einbauen und ihn zu zweit mit geradem Rücken aus den Knien heben','Den Einschub allein einbauen, weil die Lastenhandhabungsverordnung Hilfsmittel erst ab 40 kg vorschreibt','Den Einschub ganz oben einbauen, damit die Batterien vor Wasser am Boden geschützt sind','Den Einschub auf Augenhöhe einbauen, damit die Status-LEDs gut sichtbar sind, und die Kippsicherung erst danach montieren'],
     e:'Schwere Geräte gehören nach unten: Der niedrige Schwerpunkt verhindert das Kippen des Racks, und in Bodennähe muss die Last nicht über Brusthöhe gehoben werden. Zu zweit und rückengerecht zu heben schützt die Wirbelsäule.',
     n:'Die Lastenhandhabungsverordnung nennt keine feste Kilogrammgrenze – der Arbeitgeber muss die Gefährdung beurteilen. Eine 32-kg-Last mit gestreckten Armen ins Rack zu heben ist allein nicht rückengerecht möglich.'},
 en:{s:'You are to install a 32 kg UPS battery module in a 42U rack at a customer site. Servers are already mounted in the middle section of the rack; the lower rack units are free.',
     q:'How do you proceed?',
     o:['Install the module in the lower part of the rack and lift it with two people, back straight, from the knees','Install the module alone, because the Manual Handling Ordinance (LasthandhabV) only requires aids from 40 kg','Install the module at the very top so that the batteries are protected from water on the floor','Install the module at eye level so the status LEDs are easy to see, and fit the anti-tip protection afterwards'],
     e:'Heavy devices belong at the bottom: the low centre of gravity prevents the rack from tipping, and near the floor the load does not have to be lifted above chest height. Lifting in pairs with correct posture protects the spine.',
     n:'The Manual Handling Ordinance does not specify a fixed weight limit – the employer must assess the risk. Lifting a 32 kg load into a rack with outstretched arms cannot be done safely by one person.'}},
{id:'ergo-11', a:'ergo', t:'mc', c:[0,1,2],
 de:{s:'In der Werkstatt Ihres Systemhauses werden defekte Mainboards und RAM-Module getauscht und zur Reparatur an den Hersteller zurückgeschickt. Sie sollen den ESD-Schutz am Arbeitsplatz überprüfen.',
     q:'Welche Maßnahmen sind richtig? (Mehrere Antworten)',
     o:['Das ESD-Armband mit integriertem Schutzwiderstand (ca. 1 MΩ) am Erdungspunkt der ableitfähigen Arbeitsunterlage anschließen','Baugruppen nur an den Kanten anfassen, nicht an Kontakten und Bauteilen','Ausgebaute Baugruppen für den Versand in metallisierte ESD-Schirmbeutel verpacken','Das Armband zur besseren Ableitung ohne Widerstand direkt mit dem Schutzleiter verbinden','Baugruppen für den Versand in normale Luftpolsterfolie wickeln, weil sie gut polstert','Bei trockener Heizungsluft im Winter die ESD-Maßnahmen lockern, weil dann weniger Feuchtigkeit Ladung überträgt'],
     e:'Armband, ableitfähige Unterlage und Schirmbeutel verhindern, dass sich Ladungen über empfindliche Bauteile entladen. Das Anfassen an den Kanten vermeidet direkten Kontakt mit Leiterbahnen und Pins.',
     n:'Ein Armband ohne Widerstand leitet zwar schneller ab, bei Berührung eines spannungsführenden Teils fließt aber ein lebensgefährlicher Strom über den Körper – der Widerstand von etwa 1 MΩ begrenzt ihn. Trockene Luft erhöht die Aufladung sogar.'},
 en:{s:'In your IT service company\'s workshop, faulty mainboards and RAM modules are replaced and returned to the manufacturer for repair. You are to check the ESD protection at the workstation.',
     q:'Which measures are correct? (Multiple answers)',
     o:['Connect the ESD wrist strap with integrated protective resistor (approx. 1 MΩ) to the earthing point of the dissipative work mat','Handle assemblies only by the edges, not by contacts and components','Pack removed assemblies for shipping in metallised ESD shielding bags','Connect the wrist strap directly to the protective earth without a resistor for better discharge','Wrap assemblies in ordinary bubble wrap for shipping because it cushions well','Relax the ESD measures in dry heated air in winter because less moisture transfers charge'],
     e:'Wrist strap, dissipative mat and shielding bag prevent charges from discharging through sensitive components. Holding boards by the edges avoids direct contact with traces and pins.',
     n:'A strap without a resistor does discharge faster, but if a live part is touched a life-threatening current flows through the body – the resistor of about 1 MΩ limits it. Dry air actually increases charging.'}},
{id:'ergo-12', a:'ergo', gen:'ergoPause'},
{id:'ergo-13', a:'ergo', t:'mc', c:[0,1,2],
 de:{s:'Ihr Betrieb tauscht 40 alte Büro-PCs und Notebooks aus. Die Altgeräte enthalten HDDs und SSDs mit Kunden- und Personaldaten. Sie sollen die Entsorgung organisieren.',
     q:'Welche Vorgehensweisen sind richtig? (Mehrere Antworten)',
     o:['Datenträger mit einem geeigneten Verfahren löschen (bei SSDs z. B. Secure Erase/Sanitize) oder nach DIN 66399 vernichten lassen und die Löschung protokollieren','Die Altgeräte über den Hersteller-Rücknahmeweg oder einen zertifizierten Entsorgungsfachbetrieb nach ElektroG entsorgen und den Nachweis aufbewahren','Entnehmbare Akkus vor der Abgabe zerstörungsfrei ausbauen und getrennt entsorgen','Die Datenträger per Schnellformatierung löschen, da die Daten danach im Explorer nicht mehr sichtbar sind','Mäuse, Tastaturen und Headsets über den Restmüll entsorgen, weil das ElektroG nur für Geräte über 25 cm Kantenlänge gilt'],
     e:'Als Endnutzer ist der Betrieb nach ElektroG selbst für das Löschen personenbezogener Daten verantwortlich, nach DSGVO muss die Löschung nachweisbar sein. Elektroaltgeräte gehören nie in den Restmüll, Batterien und Akkus werden vorher getrennt.',
     n:'Die 25-cm-Grenze betrifft nur die Rücknahmepflicht des Handels (kleine Geräte ohne Neukauf abgeben) – für alle Elektrogeräte gilt das Verbot der Restmüllentsorgung (durchgestrichene Mülltonne). Schnellformatieren löscht nur die Verwaltungsstrukturen, die Daten bleiben wiederherstellbar.'},
 en:{s:'Your company is replacing 40 old office PCs and notebooks. The old devices contain HDDs and SSDs with customer and personnel data. You are to organise the disposal.',
     q:'Which procedures are correct? (Multiple answers)',
     o:['Erase the drives with a suitable method (for SSDs e.g. Secure Erase/Sanitize) or have them destroyed according to DIN 66399, and document the erasure','Dispose of the old devices via the manufacturer\'s take-back scheme or a certified waste management company under the Electrical and Electronic Equipment Act (ElektroG) and keep the proof','Remove removable batteries non-destructively before handover and dispose of them separately','Erase the drives by quick format, as the data is then no longer visible in Explorer','Dispose of mice, keyboards and headsets with residual waste, because the ElektroG only applies to devices over 25 cm edge length'],
     e:'As end user, the company itself is responsible under the ElektroG for deleting personal data; under the GDPR the erasure must be verifiable. Waste electrical equipment never goes into residual waste; batteries are separated beforehand.',
     n:'The 25 cm limit only concerns the retailers\' take-back obligation (small devices returned without a new purchase) – the ban on residual-waste disposal (crossed-out wheelie bin) applies to all electrical devices. A quick format only deletes the file system structures; the data remains recoverable.'}},
{id:'ergo-14', a:'ergo', t:'sc', c:0,
 de:{s:'Ein Mitarbeiter der Buchhaltung ruft bei der Hotline an und sagt mit gereizter Stimme: „Das ist jetzt schon das dritte Mal diese Woche, dass der Drucker streikt.“ Ihre Ausbilderin erklärt Ihnen dazu das Vier-Seiten-Modell nach Schulz von Thun.',
     q:'Welche Deutung entspricht der Appellseite dieser Nachricht?',
     o:['„Kümmern Sie sich endlich dauerhaft um den Drucker!“','„Der Drucker ist in dieser Woche dreimal ausgefallen.“','„Ich bin genervt und fühle mich mit dem Problem allein gelassen.“','„Ihr in der IT bekommt das einfach nicht in den Griff.“'],
     e:'Der Appell ist das, wozu der Sender den Empfänger veranlassen will – hier eine nachhaltige Lösung. Wer den Appell erkennt, kann gezielt reagieren, z. B. mit einer Ursachenanalyse statt eines weiteren Neustarts.',
     n:'„Ich bin genervt“ ist die Selbstoffenbarung: Der Sender gibt etwas über sich preis. „Ihr bekommt das nicht in den Griff“ ist die Beziehungsseite, die reine Anzahl der Ausfälle der Sachinhalt.'},
 en:{s:'An accounting employee calls the hotline and says in an irritated voice: "This is already the third time this week that the printer has stopped working." Your trainer uses this to explain Schulz von Thun\'s four-sides model to you.',
     q:'Which interpretation corresponds to the appeal side of this message?',
     o:['"Finally take care of the printer for good!"','"The printer has failed three times this week."','"I am annoyed and feel left alone with the problem."','"You in IT just can\'t get this under control."'],
     e:'The appeal is what the sender wants the receiver to do – here, a lasting solution. Recognising the appeal allows a targeted reaction, e.g. a root cause analysis instead of yet another restart.',
     n:'"I am annoyed" is the self-revelation side: the sender reveals something about himself. "You can\'t get this under control" is the relationship side, the mere number of failures is the factual content.'}},
{id:'ergo-15', a:'ergo', t:'order',
 de:{s:'Eine Kundin beschwert sich telefonisch: Der Techniker Ihres Systemhauses hat gestern ihren neuen Arbeitsplatz eingerichtet, heute funktioniert der Scan-to-Mail-Versand nicht und sie hat einen wichtigen Termin verpasst.',
     q:'Bringen Sie die Schritte des Reklamationsgesprächs in eine sinnvolle Reihenfolge.',
     o:['Die Kundin ausreden lassen und aktiv zuhören','Verständnis zeigen und die Unannehmlichkeiten bedauern, ohne vorschnell Schuld einzugestehen','Den Sachverhalt mit gezielten Fragen klären und zusammenfassen','Eine Lösung oder Alternativen anbieten und mit der Kundin vereinbaren','Die Vereinbarung umsetzen bzw. veranlassen und im Ticket dokumentieren','Nachfassen und prüfen, ob die Kundin zufrieden ist'],
     e:'Erst die Emotion, dann die Sache: Wer sich gehört fühlt, ist für eine sachliche Klärung offen. Eine Lösung ist erst nach der Klärung des Sachverhalts belastbar, das Nachfassen sichert die Kundenbindung.',
     n:'Häufig wird sofort eine Lösung angeboten – ohne geklärten Sachverhalt passt sie oft nicht, und die Kundin fühlt sich nicht ernst genommen.'},
 en:{s:'A customer complains by phone: yesterday a technician from your IT service company set up her new workstation; today scan-to-mail does not work and she missed an important appointment.',
     q:'Put the steps of the complaint conversation in a sensible order.',
     o:['Let the customer finish speaking and listen actively','Show understanding and express regret for the inconvenience without prematurely admitting fault','Clarify the facts with targeted questions and summarise them','Offer a solution or alternatives and agree on it with the customer','Implement or initiate the agreed action and document it in the ticket','Follow up and check whether the customer is satisfied'],
     e:'Emotion first, then facts: someone who feels heard is open to an objective clarification. A solution is only reliable once the facts are clear; following up secures customer loyalty.',
     n:'Often a solution is offered immediately – without clarified facts it often does not fit, and the customer does not feel taken seriously.'}},
{id:'ergo-16', a:'ergo', t:'sc', c:0,
 de:{s:'Eine Anwenderin aus dem Vertrieb konnte keine E-Mails mehr empfangen. Sie haben die Ursache behoben und schreiben ihr die Abschlussnachricht zum Ticket.',
     q:'Welche Formulierung ist am besten geeignet?',
     o:['„Ihr Postfach hatte die Speichergrenze von 50 GB erreicht. Wir haben ältere E-Mails in Ihr Online-Archiv verschoben, der Empfang funktioniert wieder. Bitte prüfen Sie kurz, ob neue E-Mails ankommen. Bei Problemen antworten Sie einfach auf diese Nachricht – das Ticket bleibt noch drei Arbeitstage offen.“','„Fixed. Quota exceeded, OST neu erstellt, Auto-Archiv per GPO aktiviert.“','„Das Problem lag wie so oft an Ihrem übervollen Postfach. Bitte löschen Sie künftig regelmäßig alte E-Mails, damit das nicht wieder passiert.“','„Ticket geschlossen.“'],
     e:'Eine gute Abschlussnachricht nennt Ursache und Maßnahme in verständlicher Sprache, bittet um Bestätigung und zeigt den weiteren Weg auf. So kann die Anwenderin die Lösung prüfen und fühlt sich ernst genommen.',
     n:'Die Kurznotiz mit Fachbegriffen ist für die Technikdokumentation brauchbar, für eine Anwenderin aber unverständlich. Der Hinweis „wie so oft“ enthält einen Vorwurf und belastet die Kundenbeziehung.'},
 en:{s:'A user from the sales department could no longer receive e-mails. You have fixed the cause and are writing her the closing message for the ticket.',
     q:'Which wording is most suitable?',
     o:['"Your mailbox had reached its storage limit of 50 GB. We have moved older e-mails to your online archive and receiving works again. Please check briefly whether new e-mails arrive. If there are problems, simply reply to this message – the ticket will remain open for another three working days."','"Fixed. Quota exceeded, OST rebuilt, auto-archive enabled via GPO."','"As so often, the problem was your overfull mailbox. Please delete old e-mails regularly in future so that this does not happen again."','"Ticket closed."'],
     e:'A good closing message states cause and action in understandable language, asks for confirmation and shows the next steps. This lets the user verify the solution and makes her feel taken seriously.',
     n:'The short note full of technical terms is useful for technical documentation but incomprehensible to a user. The remark "as so often" contains a reproach and strains the customer relationship.'}},
{id:'ergo-17', a:'ergo', t:'mc', c:[0,1,2],
 de:{s:'Ein Anwender schildert am Telefon ausführlich und etwas durcheinander, dass sich „das Programm mit den Rechnungen“ seit gestern „komisch“ verhält. Sie wollen aktiv zuhören.',
     q:'Welche Verhaltensweisen gehören zum aktiven Zuhören? (Mehrere Antworten)',
     o:['Das Gehörte in eigenen Worten wiedergeben („Wenn ich Sie richtig verstehe, …“)','Aufmerksamkeit durch kurze Rückmeldungen signalisieren („Ja“, „Verstehe“)','Unklare Punkte gezielt nachfragen und am Ende zusammenfassen','Den Anwender unterbrechen, sobald ein bekanntes Stichwort fällt, und sofort die Standardlösung nennen','Nebenbei andere Tickets bearbeiten, um die Gesprächszeit zu nutzen','Mit eigenen ähnlichen Erlebnissen antworten, um Nähe herzustellen'],
     e:'Paraphrasieren, Rückmelden und Nachfragen zeigen dem Anwender, dass er verstanden wird, und decken Missverständnisse früh auf. Am Telefon ersetzen kurze verbale Signale Blickkontakt und Nicken.',
     n:'Das schnelle Nennen der Standardlösung wirkt effizient, doch „komisch“ kann vieles bedeuten – ohne vollständiges Zuhören wird oft das falsche Problem gelöst.'},
 en:{s:'A user describes on the phone at length and somewhat confusedly that "the invoicing program" has been behaving "strangely" since yesterday. You want to listen actively.',
     q:'Which behaviours are part of active listening? (Multiple answers)',
     o:['Rephrase what you heard in your own words ("If I understand you correctly, …")','Signal attention with short verbal feedback ("Yes", "I see")','Ask targeted questions about unclear points and summarise at the end','Interrupt the user as soon as a familiar keyword comes up and state the standard solution immediately','Work on other tickets on the side to make use of the call time','Respond with your own similar experiences to build rapport'],
     e:'Paraphrasing, feedback and follow-up questions show the user that he is understood and reveal misunderstandings early. On the phone, short verbal signals replace eye contact and nodding.',
     n:'Quickly naming the standard solution seems efficient, but "strangely" can mean many things – without listening fully, the wrong problem is often solved.'}},
{id:'ergo-18', a:'ergo', t:'open',
 de:{s:'An einem Vormittag haben Sie an der Hotline zwei schwierige Gespräche: Ein Anwender stellt sich als „selbst Admin“ vor und verlangt, ohne Ihre Fragen sofort zum 2nd Level durchgestellt zu werden. Eine ältere Mitarbeiterin ist sehr unsicher und entschuldigt sich ständig, weil sie „bestimmt etwas kaputt gemacht“ habe.',
     q:'Beschreiben Sie, wie Sie Ihre Gesprächsführung an diese beiden Kundentypen anpassen.',
     m:'• Besserwisser/Experte: Fachkompetenz anerkennen, sachlich und ruhig bleiben, keinen Machtkampf führen.\n• Fachsprache ist erlaubt; notwendige Prüfschritte kurz begründen („Damit der 2nd Level nicht erneut nachfragen muss …“) und seine Vorarbeit nutzen.\n• Trotzdem strukturiert erfassen: Fehlerbild, Umfang, bereits durchgeführte Schritte.\n• Unsichere Kundin: Geduld zeigen, beruhigen und entlasten („Das kommt häufig vor, dafür sind wir da“).\n• Einfache Sprache ohne Fachjargon, Schritt für Schritt anleiten, nach jedem Schritt rückversichern, ggf. Fernwartung anbieten.\n• Allgemein: Kundentyp früh erkennen, Ton anpassen, das Ziel (vollständige Aufnahme und Lösung) bleibt gleich.',
     k:['Experten: Kompetenz anerkennen, sachlich bleiben, Prüfschritte begründen','Keine Machtkämpfe, trotzdem strukturiert erfassen','Unsichere: Geduld, beruhigen, keine Schuldzuweisung','Einfache Sprache, Schritt-für-Schritt-Anleitung, Rückversicherung','Kommunikation an den Kundentyp anpassen, Ziel bleibt gleich']},
 en:{s:'One morning you have two difficult calls on the hotline: one user introduces himself as "an admin myself" and demands to be put through to 2nd level at once without answering your questions. An older employee is very unsure and keeps apologising because she has "surely broken something".',
     q:'Describe how you adapt your conversation to these two customer types.',
     m:'• Know-it-all/expert: acknowledge his expertise, stay factual and calm, avoid a power struggle.\n• Technical language is fine; briefly justify necessary checks ("So that 2nd level does not have to ask again …") and use his preliminary work.\n• Still record in a structured way: symptoms, scope, steps already taken.\n• Unsure customer: be patient, reassure and relieve her ("That happens often, that\'s what we are here for").\n• Plain language without jargon, guide step by step, check back after each step, offer remote support if needed.\n• In general: recognise the customer type early, adapt the tone – the goal (complete intake and solution) stays the same.',
     k:['Experts: acknowledge competence, stay factual, justify checks','No power struggle, but still structured intake','Unsure customers: patience, reassurance, no blame','Plain language, step-by-step guidance, checking back','Adapt communication to the customer type, goal stays the same']}},
{id:'ergo-19', a:'ergo', t:'sc', c:0,
 de:{s:'Ein Kollege greift im Lager an ein Verlängerungskabel mit beschädigter Isolierung, zuckt zusammen und lässt los. Er ist ansprechbar, klagt über Kribbeln im Arm und will gleich weiterarbeiten.',
     q:'Wie handeln Sie richtig?',
     o:['Das Kabel vom Netz trennen, den Kollegen betreuen und – auch ohne weitere Beschwerden – ärztlich untersuchen lassen (EKG); den Unfall im Verbandbuch dokumentieren','Da er ansprechbar ist, genügt es, das Kabel zu entsorgen; ein Arzt ist nur bei sichtbaren Verbrennungen nötig','Den Kollegen sofort in die stabile Seitenlage bringen und den Notruf 112 wählen','Den Arm mit kaltem Wasser kühlen und ihn danach weiterarbeiten lassen'],
     e:'Nach einem Stromunfall können Herzrhythmusstörungen auch zeitverzögert auftreten, daher ist immer eine ärztliche Untersuchung nötig. Die Stromquelle wird zuerst abgeschaltet, damit niemand weiter gefährdet ist; die Erste-Hilfe-Leistung wird dokumentiert.',
     n:'Dass der Kollege ansprechbar ist und sich gut fühlt, schließt Herzrhythmusstörungen nicht aus – sie bleiben ohne EKG unbemerkt. Die stabile Seitenlage ist nur für Bewusstlose mit normaler Atmung vorgesehen.'},
 en:{s:'A colleague in the store room grabs an extension cable with damaged insulation, flinches and lets go. He is responsive, complains of tingling in his arm and wants to carry on working straight away.',
     q:'How do you act correctly?',
     o:['Disconnect the cable from the mains, look after the colleague and – even without further symptoms – have him examined by a doctor (ECG); record the accident in the first-aid log (Verbandbuch)','Since he is responsive, it is enough to dispose of the cable; a doctor is only needed for visible burns','Put the colleague in the recovery position immediately and call the emergency number 112','Cool the arm with cold water and then let him carry on working'],
     e:'After an electrical accident, cardiac arrhythmias can occur with a delay, so a medical examination is always necessary. The power source is switched off first so that nobody else is endangered; the first aid given is documented.',
     n:'The fact that the colleague is responsive and feels fine does not rule out cardiac arrhythmias – they go unnoticed without an ECG. The recovery position is only intended for unconscious persons with normal breathing.'}},
{id:'ergo-20', a:'ergo', t:'open',
 de:{s:'Ab nächster Woche arbeitet eine neue 17-jährige Auszubildende in Ihrem Team mit, auch im Serverraum und bei Kundeneinsätzen. Ihr Ausbilder bittet Sie, die Unterweisung vorzubereiten.',
     q:'Erläutern Sie, was bei der Unterweisung nach dem Arbeitsschutzgesetz zu beachten ist: Anlass, Häufigkeit, Inhalte, Verantwortung und Dokumentation.',
     m:'• Rechtsgrundlage: § 12 ArbSchG – der Arbeitgeber muss Beschäftigte ausreichend und angemessen unterweisen, während der Arbeitszeit.\n• Anlass: vor Aufnahme der Tätigkeit (Einstellung), bei Veränderungen im Aufgabenbereich, neuen Arbeitsmitteln oder Technologien.\n• Häufigkeit: regelmäßig wiederholen, nach DGUV Vorschrift 1 mindestens jährlich; bei Jugendlichen nach § 29 JArbSchG mindestens halbjährlich.\n• Inhalte: aus der Gefährdungsbeurteilung (§ 5 ArbSchG) abgeleitet – z. B. elektrische Gefährdungen, Heben und Tragen im Rack, Brandschutz und Fluchtwege, Erste Hilfe, ESD, Bildschirmarbeit, Verhalten beim Kunden.\n• Verantwortung: Arbeitgeber bzw. beauftragte Führungskraft, unterstützt durch Fachkraft für Arbeitssicherheit; Beschäftigte haben Mitwirkungspflichten (§§ 15, 16 ArbSchG).\n• Dokumentation: schriftlich mit Datum, Inhalten, Unterweisendem und Unterschrift der Unterwiesenen.',
     k:['§ 12 ArbSchG, während der Arbeitszeit','Vor Tätigkeitsbeginn und bei Änderungen','Mindestens jährlich, Jugendliche halbjährlich','Inhalte aus der Gefährdungsbeurteilung','Verantwortlich ist der Arbeitgeber','Schriftliche Dokumentation mit Unterschrift']},
 en:{s:'From next week a new 17-year-old apprentice will work in your team, including in the server room and on customer assignments. Your trainer asks you to prepare the safety instruction.',
     q:'Explain what must be observed for safety instruction under the Occupational Safety and Health Act (ArbSchG): occasion, frequency, content, responsibility and documentation.',
     m:'• Legal basis: Section 12 ArbSchG – the employer must instruct employees sufficiently and appropriately, during working hours.\n• Occasion: before starting work (recruitment), when tasks change, when new work equipment or technologies are introduced.\n• Frequency: repeat regularly, at least annually according to DGUV Regulation 1; for young workers at least every six months under Section 29 JArbSchG.\n• Content: derived from the risk assessment (Gefährdungsbeurteilung, Section 5 ArbSchG) – e.g. electrical hazards, lifting and carrying at the rack, fire protection and escape routes, first aid, ESD, display screen work, conduct at customer sites.\n• Responsibility: the employer or an appointed manager, supported by the occupational safety specialist (Fachkraft für Arbeitssicherheit); employees have duties to cooperate (Sections 15, 16 ArbSchG).\n• Documentation: in writing with date, content, instructor and signature of the persons instructed.',
     k:['Section 12 ArbSchG, during working hours','Before starting work and when things change','At least annually, young workers every six months','Content derived from the risk assessment','The employer is responsible','Written documentation with signature']}}
);

</script>

<script>
/* ===== BEREICH:dienste – Netzwerkdienste & Routing (2. Lehrjahr) ===== */
Q.push(
{id:'dienste-01', a:'dienste', t:'order',
 de:{s:'Ein neuer Laptop wird im Büro per Kabel angeschlossen und bezieht seine IP-Konfiguration automatisch.',
     q:'Bringen Sie die DHCP-Nachrichten in die richtige Reihenfolge.',
     o:['DHCPDISCOVER – Client sucht per Broadcast einen DHCP-Server','DHCPOFFER – Server bietet eine freie Adresse an','DHCPREQUEST – Client fordert die angebotene Adresse an','DHCPACK – Server bestätigt die Lease samt Optionen'],
     e:'Merkhilfe DORA: Discover, Offer, Request, Acknowledge. Der Request geht ebenfalls als Broadcast, damit andere Server wissen, dass ihr Angebot nicht angenommen wurde.',
     n:'Oft wird angenommen, der Server sende zuerst – der Client kennt aber keinen Server und muss ihn per Broadcast suchen.'},
 en:{s:'A new laptop is connected by cable in the office and obtains its IP configuration automatically.',
     q:'Put the DHCP messages in the correct order.',
     o:['DHCPDISCOVER – client searches for a DHCP server via broadcast','DHCPOFFER – server offers a free address','DHCPREQUEST – client requests the offered address','DHCPACK – server confirms the lease including options'],
     e:'Mnemonic DORA: Discover, Offer, Request, Acknowledge. The request is also broadcast so that other servers know their offer was declined.',
