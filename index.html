/* ----- BEREICH:speicher – Erweiterung ----- */
/* RAID: nutzbare Host-IOPS unter Berücksichtigung des Write-Penalty */
GEN.speicherWriteIops = function(L){
  const lv = pick(['1','10','5','6']);
  const P = {'1':2, '10':2, '5':4, '6':6}[lv];
  const n = lv==='1' ? 2 : lv==='10' ? pick([4,6,8,12]) : lv==='5' ? rnd(4,8) : rnd(5,10);
  const disk = pick([['SAS-HDD mit 10.000 U/min','SAS HDD at 10,000 rpm',140],['SAS-HDD mit 15.000 U/min','SAS HDD at 15,000 rpm',180],['NL-SAS-HDD mit 7.200 U/min','NL-SAS HDD at 7,200 rpm',75]]);
  const iops = disk[2], rd = pick([50,60,70,80]), wr = 100 - rd;
  const raw = n * iops, fac = (rd + wr * P) / 100, host = Math.floor(raw / fac + 1e-9);
  const app = pick([['die Warenwirtschafts-Datenbank','the ERP database'],['den neuen Mailserver','the new mail server'],['das Dokumentenmanagementsystem','the document management system'],['den Datastore der Terminalserver','the terminal server datastore']]);
  const pen = {
    '1': tx(L,'jeder Schreibvorgang geht auf beide Platten eines Spiegels','every write goes to both disks of a mirror'),
    '10': tx(L,'jeder Schreibvorgang geht auf beide Platten eines Spiegels','every write goes to both disks of a mirror'),
    '5': tx(L,'Daten lesen, Parität lesen, Daten schreiben, Parität schreiben','read data, read parity, write data, write parity'),
    '6': tx(L,'Daten und beide Paritäten jeweils lesen und schreiben','read and write the data and both parities')}[lv];
  return { t:'in',
    s: tx(L, `Für ${app[0]} wird ein Plattenverbund aus ${n} × ${disk[0]} (je ca. ${iops} IOPS) als RAID ${lv} geplant. Laut Monitoring des Altsystems besteht die Last zu ${rd} % aus Lese- und zu ${wr} % aus Schreibzugriffen.`,
             `For ${app[1]}, a disk array of ${n} × ${disk[1]} (approx. ${iops} IOPS each) is planned as RAID ${lv}. According to monitoring of the old system, the load consists of ${rd} % reads and ${wr} % writes.`),
    q: tx(L, 'Berechnen Sie die Roh-IOPS aller Platten und die maximal vom Host nutzbaren IOPS unter Berücksichtigung des Write-Penalty. Runden Sie auf ganze IOPS ab.', 'Calculate the raw IOPS of all disks and the maximum IOPS usable by the host, taking the write penalty into account. Round down to whole IOPS.'),
    f: [ {l:tx(L,'Roh-IOPS','Raw IOPS'), v:raw, tol:0, u:'IOPS'}, {l:tx(L,'Nutzbare Host-IOPS','Usable host IOPS'), v:host, tol:1, u:'IOPS'} ],
    e: tx(L, `Roh-IOPS: ${n} × ${iops} = ${fmt(raw,0,L)}. RAID ${lv} hat den Write-Penalty ${P} (${pen}). Ein Host-IO kostet im Mittel ${fmt(rd/100,2,L)} × 1 + ${fmt(wr/100,2,L)} × ${P} = ${fmt(fac,2,L)} Platten-IOs. ${fmt(raw,0,L)} ÷ ${fmt(fac,2,L)} = ${fmt(raw/fac,2,L)} → ${fmt(host,0,L)} IOPS.`,
             `Raw IOPS: ${n} × ${iops} = ${fmt(raw,0,L)}. RAID ${lv} has a write penalty of ${P} (${pen}). One host IO costs on average ${fmt(rd/100,2,L)} × 1 + ${fmt(wr/100,2,L)} × ${P} = ${fmt(fac,2,L)} disk IOs. ${fmt(raw,0,L)} ÷ ${fmt(fac,2,L)} = ${fmt(raw/fac,2,L)} → ${fmt(host,0,L)} IOPS.`),
    n: tx(L, 'Häufiger Fehler: den Write-Penalty auf alle Zugriffe anzuwenden (Roh-IOPS ÷ Penalty) oder ihn ganz zu vergessen – Lesezugriffe kosten auch bei RAID 5/6 nur einen Platten-IO.', 'Common mistake: applying the write penalty to all IOs (raw IOPS ÷ penalty) or forgetting it entirely – reads cost only one disk IO, even with RAID 5/6.')
  };
};

/* Thin Provisioning: Überbuchungsfaktor und tatsächliche Belegung des Pools */
GEN.speicherThin = function(L){
  let g, phys, prov, used;
  do {
    g = [[tx(L,'Fileserver','File server'), rnd(2,4), pick([2000,3000,4000])],
         [tx(L,'Datenbankserver','Database server'), rnd(1,3), pick([1000,1500,2000])],
         [tx(L,'Anwendungsserver','Application server'), rnd(4,10), pick([200,300,500])]]
        .map(x => [x[0], x[1], x[2], Math.round(x[2] * pick([0.25,0.3,0.4,0.5,0.6]))]);
    prov = g.reduce((s,x) => s + x[1]*x[2], 0);
    used = g.reduce((s,x) => s + x[1]*x[3], 0);
    phys = pick([8,10,12,16,20]);
  } while (!(prov > phys*1200 && used < phys*900));
  const cap = phys * 1000, ratio = r2(prov / cap), fill = Math.round(used / cap * 1000) / 10;
  return { t:'in',
    s: tx(L, `Auf einem Storage-System steht ein Pool mit ${phys} TB Nettokapazität bereit (1 TB = 1.000 GB). Alle virtuellen Festplatten wurden per Thin Provisioning angelegt. Die Tabelle zeigt die bereitgestellten und die tatsächlich belegten Größen.`,
             `A storage system provides a pool with ${phys} TB net capacity (1 TB = 1,000 GB). All virtual disks were created with thin provisioning. The table shows the provisioned and the actually used sizes.`),
    tb: {h: tx(L,['Servergruppe','Anzahl VMs','Bereitgestellt je VM (GB)','Belegt je VM (GB)'],['Server group','Number of VMs','Provisioned per VM (GB)','Used per VM (GB)']), r: g.map(x => [x[0], x[1], fmt(x[2],0,L), fmt(x[3],0,L)])},
    q: tx(L, 'Berechnen Sie den Überbuchungsfaktor (bereitgestellt ÷ physisch, zwei Nachkommastellen) und die aktuelle Belegung des Pools in Prozent (eine Nachkommastelle).', 'Calculate the overcommitment ratio (provisioned ÷ physical, two decimal places) and the current pool utilisation in percent (one decimal place).'),
    f: [ {l:tx(L,'Überbuchungsfaktor','Overcommitment ratio'), v:ratio, tol:0.011, u:': 1'}, {l:tx(L,'Belegung des Pools','Pool utilisation'), v:fill, tol:0.11, u:'%'} ],
    e: tx(L, `Bereitgestellt: ${g.map(x => `${x[1]} × ${fmt(x[2],0,L)}`).join(' + ')} = ${fmt(prov,0,L)} GB → ${fmt(prov,0,L)} ÷ ${fmt(cap,0,L)} = ${fmt(ratio,2,L)} : 1. Belegt: ${g.map(x => `${x[1]} × ${fmt(x[3],0,L)}`).join(' + ')} = ${fmt(used,0,L)} GB → ${fmt(used,0,L)} ÷ ${fmt(cap,0,L)} × 100 = ${fmt(fill,1,L)} %. Der Pool ist überbucht – Schwellwert-Alarme sind Pflicht.`,
             `Provisioned: ${g.map(x => `${x[1]} × ${fmt(x[2],0,L)}`).join(' + ')} = ${fmt(prov,0,L)} GB → ${fmt(prov,0,L)} ÷ ${fmt(cap,0,L)} = ${fmt(ratio,2,L)} : 1. Used: ${g.map(x => `${x[1]} × ${fmt(x[3],0,L)}`).join(' + ')} = ${fmt(used,0,L)} GB → ${fmt(used,0,L)} ÷ ${fmt(cap,0,L)} × 100 = ${fmt(fill,1,L)} %. The pool is overcommitted – threshold alerts are mandatory.`),
    n: tx(L, 'Naheliegend, aber falsch: für die Belegung die bereitgestellte statt der belegten Kapazität anzusetzen – Thin Provisioning belegt nur tatsächlich geschriebene Blöcke, sonst ergäbe sich eine Belegung über 100 %.', 'Tempting but wrong: using the provisioned instead of the used capacity for utilisation – thin provisioning only consumes blocks actually written; otherwise you would get more than 100 %.')
  };
};

Q.push(
{id:'speicher-06', a:'speicher', gen:'speicherWriteIops'},
{id:'speicher-07', a:'speicher', t:'sc', c:0,
 de:{s:'Im NAS der Konstruktionsabteilung (RAID 5 aus 8 × 18 TB, kein Hot-Spare) meldet der Controller den Ausfall einer Platte. Der Status steht auf „Degraded“, die Mitarbeiter arbeiten normal weiter. Ihr Teamleiter fragt, wie kritisch die Lage ist.',
     q:'Welche Einschätzung ist fachlich richtig?',
     o:['Sehr kritisch: Bis der Rebuild abgeschlossen ist, besteht keine Redundanz mehr; der Rebuild großer Platten dauert unter Last viele Stunden, und ein weiterer Ausfall oder ein nicht lesbarer Sektor führt zum Datenverlust – sofort tauschen, vorher aktuelles Backup sicherstellen','Unkritisch: RAID 5 verkraftet den Ausfall einer Platte, daher reicht es, die Platte beim nächsten Wartungstermin zu tauschen','Unkritisch: Der Controller verteilt die Daten automatisch auf die restlichen sieben Platten und stellt die Redundanz ohne neue Platte wieder her','Kritisch, aber nur für die Leistung: Datenverlust ist ausgeschlossen, solange der Controller eine Batterie (BBU) besitzt'],
     e:'Im Zustand „Degraded“ werden fehlende Daten bei jedem Zugriff aus der Parität berechnet; eine zweite Störung ist nicht mehr abgedeckt. Beim Rebuild müssen alle übrigen Platten komplett gelesen werden – bei 18-TB-Platten ein langes Risikofenster. Für so große Platten ist RAID 6 oder ein Hot-Spare üblich.',
     n:'Die Aussage „RAID 5 verkraftet eine Platte“ stimmt nur für den ersten Ausfall. Danach ist das Array ohne Schutz, bis der Rebuild fertig ist – Abwarten bis zum Wartungstermin verlängert genau dieses Risiko.'},
 en:{s:'In the design department\'s NAS (RAID 5 of 8 × 18 TB, no hot spare), the controller reports a failed disk. The status shows "Degraded", and staff keep working normally. Your team leader asks how critical the situation is.',
     q:'Which assessment is technically correct?',
     o:['Very critical: until the rebuild is complete there is no redundancy; rebuilding large disks under load takes many hours, and another failure or an unreadable sector leads to data loss – replace immediately after making sure a current backup exists','Not critical: RAID 5 tolerates the failure of one disk, so it is enough to replace the disk at the next maintenance window','Not critical: the controller automatically redistributes the data over the remaining seven disks and restores redundancy without a new disk','Critical, but only for performance: data loss is impossible as long as the controller has a battery (BBU)'],
     e:'In the "Degraded" state, missing data is calculated from parity on every access; a second fault is no longer covered. During the rebuild all remaining disks must be read completely – with 18 TB disks a long window of risk. RAID 6 or a hot spare is usual for disks this large.',
     n:'"RAID 5 tolerates one disk" is only true for the first failure. After that the array is unprotected until the rebuild finishes – waiting for the maintenance window prolongs exactly this risk.'}},
{id:'speicher-08', a:'speicher', t:'mc', c:[0,1,2],
 de:{s:'Ein Kunde bindet zwei neue Virtualisierungshosts per iSCSI an ein vorhandenes Storage-System an. Der Auszubildende soll die Konfiguration vorbereiten und notiert sich einige Aussagen.',
     q:'Welche Aussagen sind korrekt? (Mehrere Antworten)',
     o:['Die Hosts sind die iSCSI-Initiatoren, das Storage-System stellt als Target die LUNs bereit','Eine LUN erscheint auf dem Host als lokales Block-Device, das der Host selbst mit einem Dateisystem formatiert','iSCSI überträgt SCSI-Befehle über TCP/IP (Standardport 3260) und kann über normales Ethernet laufen; ein getrenntes Speichernetz (VLAN oder eigene Switches) ist empfehlenswert','iSCSI stellt wie SMB dateibasierte Freigaben bereit, auf die Benutzer per UNC-Pfad zugreifen','Das Target formatiert die LUN mit NTFS, bevor sie an den Initiator übergeben wird','Für iSCSI sind zwingend Fibre-Channel-HBAs in den Hosts erforderlich'],
     e:'iSCSI ist ein Block-Speicherprotokoll: Das Target liefert Blöcke, das Dateisystem (z. B. NTFS, ReFS, VMFS) legt der Initiator an. Aus Leistungs- und Sicherheitsgründen wird iSCSI-Verkehr vom Clientnetz getrennt, meist mit Multipath (MPIO).',
     n:'Die Verwechslung mit SMB/NFS liegt nahe, weil beides über das LAN läuft. iSCSI liefert aber keine Dateien, sondern rohe Blöcke – deshalb formatiert der Host die LUN.'},
 en:{s:'A customer connects two new virtualisation hosts to an existing storage system via iSCSI. The apprentice is to prepare the configuration and notes down some statements.',
     q:'Which statements are correct? (Multiple answers)',
     o:['The hosts are the iSCSI initiators; the storage system provides the LUNs as the target','A LUN appears on the host as a local block device, which the host formats with a file system itself','iSCSI transports SCSI commands over TCP/IP (default port 3260) and can run over normal Ethernet; a separate storage network (VLAN or dedicated switches) is recommended','Like SMB, iSCSI provides file-based shares that users access via a UNC path','The target formats the LUN with NTFS before handing it to the initiator','iSCSI strictly requires Fibre Channel HBAs in the hosts'],
     e:'iSCSI is a block storage protocol: the target delivers blocks, and the initiator creates the file system (e.g. NTFS, ReFS, VMFS). For performance and security reasons iSCSI traffic is separated from the client network, usually with multipathing (MPIO).',
     n:'Confusing it with SMB/NFS is tempting because both run over the LAN. But iSCSI delivers raw blocks, not files – which is why the host formats the LUN.'}},
{id:'speicher-09', a:'speicher', t:'match',
 de:{s:'Für ein Beratungsgespräch zur Speicherarchitektur bereiten Sie eine Übersicht der Anbindungsarten und Protokolle vor.',
     q:'Ordnen Sie jeder Technik die zutreffende Beschreibung zu.',
     p:[['DAS','Speicher hängt direkt an einem einzelnen Server (z. B. SAS), ohne Netzwerk'],['NFS','Dateibasierter Zugriff, typisch in Linux/Unix-Umgebungen und als Datastore für Hypervisoren'],['SMB','Dateibasierter Zugriff, Standard für Windows-Freigaben (TCP 445)'],['iSCSI','Blockbasierter Zugriff über TCP/IP auf vorhandener Ethernet-Infrastruktur'],['Fibre Channel','Blockbasierter Zugriff über ein eigenes Speichernetz mit HBAs und FC-Switches']],
     e:'NAS-Protokolle (NFS, SMB) liefern Dateien, SAN-Protokolle (iSCSI, FC) liefern Blöcke. FC ist latenzarm und vom LAN unabhängig, aber teurer; iSCSI nutzt Standard-Ethernet.',
     n:'NFS und SMB werden gern vertauscht, weil beide Dateifreigaben bereitstellen – NFS stammt aus der Unix-Welt, SMB aus der Windows-Welt.'},
 en:{s:'For a consultation on storage architecture, you prepare an overview of connection types and protocols.',
     q:'Match each technology to the right description.',
     p:[['DAS','Storage attached directly to a single server (e.g. SAS), without a network'],['NFS','File-based access, typical in Linux/Unix environments and as a hypervisor datastore'],['SMB','File-based access, the standard for Windows shares (TCP 445)'],['iSCSI','Block-based access over TCP/IP on existing Ethernet infrastructure'],['Fibre Channel','Block-based access over a dedicated storage network with HBAs and FC switches']],
     e:'NAS protocols (NFS, SMB) deliver files, SAN protocols (iSCSI, FC) deliver blocks. FC offers low latency and is independent of the LAN but more expensive; iSCSI uses standard Ethernet.',
     n:'NFS and SMB are often swapped because both provide file shares – NFS comes from the Unix world, SMB from the Windows world.'}},
{id:'speicher-10', a:'speicher', t:'sc', c:0,
 de:{s:'Ein Kunde betreibt alle VMs auf einem Datastore mit Thin-Provisioned-Disks. Bereitgestellt sind 18 TB, physisch vorhanden 10 TB, aktuell belegt 9,6 TB. Ein Kollege meint: „Kein Problem, die VMs haben ja noch reichlich freien Platz.“',
     q:'Was passiert, wenn der Datastore physisch vollläuft?',
     o:['Schreibzugriffe schlagen fehl; der Hypervisor hält betroffene VMs an bzw. sie stürzen ab – und zwar alle VMs auf dem Datastore, auch wenn ihre eigenen Disks noch „Platz“ zeigen','Der Hypervisor wandelt die Thin-Disks automatisch in Thick-Disks um und reserviert so den benötigten Platz','Nur die VM, die zuletzt geschrieben hat, wird angehalten; alle anderen laufen normal weiter','Nichts – das Gastbetriebssystem sieht nur seine bereitgestellte Größe und kann daher weiterschreiben'],
     e:'Thin Provisioning belegt physischen Platz erst beim Schreiben. Das Gast-OS sieht freien Platz, der physisch nicht existiert. Bei einem überbuchten Pool sind Monitoring mit Schwellwerten, Reserven und rechtzeitige Erweiterung Pflicht.',
     n:'Richtig ist, dass der Gast nur die bereitgestellte Größe sieht – gerade deshalb schreibt er weiter, bis der gemeinsame physische Speicher erschöpft ist und alle VMs darauf betroffen sind.'},
 en:{s:'A customer runs all VMs on one datastore with thin-provisioned disks. 18 TB are provisioned, 10 TB physically available, 9.6 TB currently used. A colleague says: "No problem, the VMs still have plenty of free space."',
     q:'What happens when the datastore physically runs full?',
     o:['Writes fail; the hypervisor pauses the affected VMs or they crash – and this affects all VMs on the datastore, even if their own disks still show "free space"','The hypervisor automatically converts the thin disks into thick disks, thereby reserving the space required','Only the VM that wrote last is paused; all others continue running normally','Nothing – the guest operating system only sees its provisioned size and can therefore keep writing'],
     e:'Thin provisioning only consumes physical space when data is written. The guest OS sees free space that does not physically exist. With an overcommitted pool, monitoring with thresholds, reserves and timely expansion are mandatory.',
     n:'It is true that the guest only sees its provisioned size – that is exactly why it keeps writing until the shared physical storage is exhausted and all VMs on it are affected.'}},
{id:'speicher-11', a:'speicher', t:'in', f:[{v:2352, tol:0, u:'GB'}, {v:2823, tol:1, u:'GB'}],
 de:{s:'Für einen neuen ESXi-Host planen Sie den Datastore. Alle virtuellen Festplatten werden Thick Provisioned angelegt. ESXi erzeugt beim Einschalten jeder VM eine Auslagerungsdatei (.vswp) in Höhe des konfigurierten Arbeitsspeichers; Speicherreservierungen sind nicht gesetzt. Für Snapshots und Logs sind 20 % Reserve auf den Gesamtbedarf einzuplanen.',
     tb:{h:['VM-Gruppe','Anzahl','RAM je VM','Virtuelle Disk je VM'], r:[['Terminalserver',4,'24 GB','150 GB'],['SQL-Server',2,'64 GB','500 GB'],['Anwendungsserver',6,'8 GB','80 GB']]},
     q:'Berechnen Sie den Speicherbedarf ohne Reserve und die Mindestgröße des Datastores mit Reserve. Runden Sie das Endergebnis auf ganze GB auf.',
     l:['Bedarf ohne Reserve','Datastore mit 20 % Reserve'],
     e:'Je VM zählen Disk + .vswp (= RAM): Terminalserver 4 × (150 + 24) = 696 GB, SQL 2 × (500 + 64) = 1.128 GB, Anwendung 6 × (80 + 8) = 528 GB → 2.352 GB. Mit Reserve: 2.352 × 1,2 = 2.822,4 GB → aufgerundet 2.823 GB.',
     n:'Typischer Fehler: nur die virtuellen Disks zu addieren (2.080 GB) – die Auslagerungsdateien belegen zusätzlich so viel Platz wie der konfigurierte RAM, sonst starten die letzten VMs nicht.'},
 en:{s:'You are planning the datastore for a new ESXi host. All virtual disks are thick provisioned. When each VM is powered on, ESXi creates a swap file (.vswp) equal to the configured memory; no memory reservations are set. Plan a 20 % reserve on the total for snapshots and logs.',
     tb:{h:['VM group','Count','RAM per VM','Virtual disk per VM'], r:[['Terminal server',4,'24 GB','150 GB'],['SQL server',2,'64 GB','500 GB'],['Application server',6,'8 GB','80 GB']]},
     q:'Calculate the storage required without reserve and the minimum datastore size with reserve. Round the final result up to whole GB.',
     l:['Required without reserve','Datastore with 20 % reserve'],
     e:'Per VM, count disk + .vswp (= RAM): terminal servers 4 × (150 + 24) = 696 GB, SQL 2 × (500 + 64) = 1,128 GB, application 6 × (80 + 8) = 528 GB → 2,352 GB. With reserve: 2,352 × 1.2 = 2,822.4 GB → rounded up 2,823 GB.',
     n:'Typical mistake: adding up only the virtual disks (2,080 GB) – the swap files take up additional space equal to the configured RAM, otherwise the last VMs will not start.'}},
{id:'speicher-12', a:'speicher', t:'order',
 de:{s:'Ein Windows-Server-Host soll eine neue LUN von einem iSCSI-Storage erhalten, auf der künftig VM-Dateien liegen. Storage und Host sind bereits im getrennten Speicher-VLAN verkabelt.',
     q:'Bringen Sie die Einrichtungsschritte in die richtige Reihenfolge.',
     o:['Auf dem Storage die LUN mit der geplanten Größe anlegen','Am Storage ein Target erstellen, die LUN zuordnen und den Zugriff auf den IQN des Hosts (optional mit CHAP) beschränken','Am Host im iSCSI-Initiator das Zielportal (IP des Storage) hinzufügen und das Target ermitteln','Mit dem Target verbinden (bei zwei Pfaden mit aktiviertem MPIO)','In der Datenträgerverwaltung den neuen Datenträger online schalten und initialisieren (GPT)','Volume anlegen und mit NTFS oder ReFS formatieren'],
     e:'Erst muss das Target die LUN für genau diesen Initiator freigeben, dann kann der Host sie ermitteln und sich anmelden. Formatiert wird zuletzt auf dem Host, weil iSCSI nur Blöcke liefert.',
     n:'Häufig wird versucht, am Host zu verbinden, bevor die Zugriffsbeschränkung auf den IQN gesetzt ist – das Target ist dann zwar sichtbar, liefert aber keine LUN aus.'},
 en:{s:'A Windows Server host is to receive a new LUN from an iSCSI storage system on which VM files will be stored in future. Storage and host are already cabled in the separate storage VLAN.',
     q:'Put the setup steps in the correct order.',
     o:['Create the LUN with the planned size on the storage','Create a target on the storage, map the LUN and restrict access to the host\'s IQN (optionally with CHAP)','On the host, add the target portal (storage IP) in the iSCSI initiator and discover the target','Connect to the target (with MPIO enabled if there are two paths)','In Disk Management, bring the new disk online and initialise it (GPT)','Create a volume and format it with NTFS or ReFS'],
     e:'The target must first release the LUN to exactly this initiator; then the host can discover it and log in. Formatting is done last on the host because iSCSI only delivers blocks.',
     n:'People often try to connect from the host before access is restricted to its IQN – the target is then visible but presents no LUN.'}},
{id:'speicher-13', a:'speicher', t:'mc', c:[0,1,2],
 de:{s:'Ein Virtualisierungshost mit 256 GB RAM betreibt VMs mit insgesamt 340 GB konfiguriertem Arbeitsspeicher. Anwender klagen über träge Anwendungen. Das Monitoring zeigt aktives Memory Ballooning und Host-Swapping; die CPU-Auslastung liegt bei 35 %.',
     q:'Welche Maßnahmen sind geeignet, das Problem zu beheben? (Mehrere Antworten)',
     o:['Den Host mit zusätzlichem physischem RAM aufrüsten','Einzelne VMs per Live-Migration auf einen weniger ausgelasteten Host verschieben','Überdimensionierte VMs anhand der Monitoringdaten auf ihren tatsächlichen Bedarf verkleinern (Rightsizing)','Den betroffenen VMs mehr Arbeitsspeicher zuweisen, damit sie nicht mehr auslagern','Den Balloon-Treiber in den Gastsystemen deinstallieren','Den VMs zusätzliche vCPUs zuweisen'],
     e:'Ballooning und Host-Swapping zeigen, dass der physische RAM überbucht ist. Abhilfe schafft nur mehr physischer RAM oder weniger Bedarf auf dem Host. Die CPU ist mit 35 % nicht der Engpass.',
     n:'Mehr RAM für die VMs klingt logisch, erhöht aber die Überbuchung weiter. Ohne Balloon-Treiber muss der Host noch stärker auf das deutlich langsamere Host-Swapping ausweichen.'},
 en:{s:'A virtualisation host with 256 GB RAM runs VMs with a total of 340 GB of configured memory. Users complain about sluggish applications. Monitoring shows active memory ballooning and host swapping; CPU utilisation is 35 %.',
     q:'Which measures are suitable to solve the problem? (Multiple answers)',
     o:['Upgrade the host with additional physical RAM','Move individual VMs to a less loaded host via live migration','Shrink oversized VMs to their actual requirement based on monitoring data (rightsizing)','Assign more memory to the affected VMs so that they stop swapping','Uninstall the balloon driver in the guest systems','Assign additional vCPUs to the VMs'],
     e:'Ballooning and host swapping show that physical RAM is overcommitted. Only more physical RAM or less demand on the host helps. At 35 % the CPU is not the bottleneck.',
     n:'More RAM for the VMs sounds logical but increases overcommitment further. Without the balloon driver the host has to fall back even more on the much slower host swapping.'}},
{id:'speicher-14', a:'speicher', t:'mc', c:[0,1,2],
 de:{s:'Die Entwicklungsabteilung möchte eine interne Webanwendung künftig als Docker-Container auf einem Linux-Host betreiben statt in einer eigenen VM. Sie sollen die Unterschiede für die Betriebsdokumentation zusammenfassen.',
     q:'Welche Aussagen sind korrekt? (Mehrere Antworten)',
     o:['Container teilen sich den Kernel des Hostbetriebssystems und starten deshalb in Sekunden','Ein Image ist eine schreibgeschützte, aus Schichten aufgebaute Vorlage, aus der beliebig viele Container gestartet werden','Daten, die ein Neuerstellen des Containers überleben sollen, gehören in ein Volume oder Bind-Mount','Container isolieren stärker als VMs, weil jeder Container einen eigenen Kernel mitbringt','Ein Linux-Container läuft unter Windows ohne jede Virtualisierungsschicht direkt auf dem Windows-Kernel','Wird ein Container gelöscht und aus dem Image neu erstellt, bleiben Änderungen im Container-Dateisystem automatisch erhalten'],
     e:'Container virtualisieren auf Betriebssystemebene: ein Kernel, getrennte Namespaces und cgroups. Das macht sie leichtgewichtig, die Isolation ist aber schwächer als bei einer VM. Die beschreibbare Container-Schicht ist flüchtig, persistente Daten liegen in Volumes.',
     n:'Die stärkere Isolation ist ein Vorteil von VMs, nicht von Containern: Container teilen den Host-Kernel, eine Kernel-Schwachstelle betrifft daher alle Container.'},
 en:{s:'The development department wants to run an internal web application as a Docker container on a Linux host in future instead of in its own VM. You are to summarise the differences for the operations documentation.',
     q:'Which statements are correct? (Multiple answers)',
     o:['Containers share the kernel of the host operating system and therefore start within seconds','An image is a read-only template built from layers, from which any number of containers can be started','Data that should survive re-creating the container belongs in a volume or bind mount','Containers isolate more strongly than VMs because each container brings its own kernel','A Linux container runs on Windows directly on the Windows kernel without any virtualisation layer','If a container is deleted and re-created from the image, changes in the container file system are kept automatically'],
     e:'Containers virtualise at operating-system level: one kernel, separate namespaces and cgroups. That makes them lightweight, but isolation is weaker than with a VM. The writable container layer is ephemeral; persistent data lives in volumes.',
     n:'Stronger isolation is an advantage of VMs, not containers: containers share the host kernel, so a kernel vulnerability affects all containers.'}},
{id:'speicher-15', a:'speicher', gen:'speicherThin'},
{id:'speicher-16', a:'speicher', t:'sc', c:0,
 de:{s:'Auf dem Backup-Speicher eines Systemhauses liegen die Vollsicherungen von 40 VMs, die alle aus derselben Windows-Server-Vorlage erstellt wurden. Der Speicher ist fast voll; das Storage-System bietet mehrere Effizienzfunktionen an.',
     q:'Welche Funktion spart in dieser Situation voraussichtlich den meisten Platz?',
     o:['Deduplizierung, weil identische Datenblöcke der gleichartigen VMs nur einmal gespeichert und sonst nur referenziert werden','Kompression, weil sie doppelte Blöcke über Dateigrenzen hinweg erkennt und zusammenfasst','Thin Provisioning, weil es die vorhandenen Sicherungsdateien nachträglich verkleinert','Storage-Tiering, weil selten gelesene Sicherungen auf langsamere, günstigere Platten verschoben werden'],
     e:'Aus derselben Vorlage erstellte VMs enthalten blockweise weitgehend identische Betriebssystem- und Programmdateien. Deduplizierung speichert jeden Block nur einmal; Kompression wirkt zusätzlich, aber nur innerhalb der einzelnen Daten. Bei verschlüsselten Daten bringen beide Verfahren kaum etwas.',
     n:'Kompression spart ebenfalls Platz, verkleinert aber jeden Block bzw. jede Datei für sich – dass 40 Sicherungen dieselben Blöcke enthalten, erkennt nur die Deduplizierung.'},
 en:{s:'On an IT service provider\'s backup storage, the full backups of 40 VMs are stored, all created from the same Windows Server template. The storage is almost full; the storage system offers several efficiency features.',
     q:'Which feature is likely to save the most space in this situation?',
     o:['Deduplication, because identical data blocks of the similar VMs are stored only once and otherwise just referenced','Compression, because it detects and merges duplicate blocks across file boundaries','Thin provisioning, because it subsequently shrinks the existing backup files','Storage tiering, because rarely read backups are moved to slower, cheaper disks'],
     e:'VMs created from the same template contain largely identical operating system and program files at block level. Deduplication stores each block only once; compression adds to this, but only within the individual data. With encrypted data, both methods achieve little.',
     n:'Compression saves space too, but it shrinks each block or file on its own – only deduplication recognises that 40 backups contain the same blocks.'}},
{id:'speicher-17', a:'speicher', t:'match',
 de:{s:'Für die Betriebsdokumentation einer neuen Virtualisierungsumgebung erstellen Sie ein Glossar der VM-Funktionen, damit die Kollegen im Support sie richtig einsetzen.',
     q:'Ordnen Sie jeder Funktion die zutreffende Beschreibung zu.',
     p:[['Vorlage (Template)','Nicht startbares Master-Image, aus dem neue VMs einheitlich bereitgestellt werden'],['Vollständiger Klon','Unabhängige Kopie einer VM mit eigenen virtuellen Disks'],['Verknüpfter Klon (Linked Clone)','Kopie, die nur Änderungen speichert und dauerhaft von der Disk der Quell-VM abhängt'],['Snapshot','Zustand einer VM zu einem Zeitpunkt; spätere Änderungen landen in einer Delta-Datei'],['Live-Migration','Verschiebt eine laufende VM ohne spürbare Unterbrechung auf einen anderen Host'],['HA-Neustart','Startet die VMs eines ausgefallenen Hosts automatisch auf den übrigen Clusterknoten neu']],
     e:'Live-Migration setzt einen laufenden Quellhost voraus und dient geplanten Wartungen. Bei einem Hostausfall greift HA: Die VMs werden neu gestartet, es entsteht eine kurze Unterbrechung.',
     n:'Live-Migration und HA werden oft gleichgesetzt. Nach einem Hostausfall gibt es aber keinen laufenden Arbeitsspeicher mehr, der migriert werden könnte – die VMs werden neu gestartet.'},
 en:{s:'For the operations documentation of a new virtualisation environment, you create a glossary of VM features so that your support colleagues use them correctly.',
     q:'Match each feature to the right description.',
     p:[['Template','Non-bootable master image from which new VMs are deployed uniformly'],['Full clone','Independent copy of a VM with its own virtual disks'],['Linked clone','Copy that only stores changes and permanently depends on the source VM\'s disk'],['Snapshot','State of a VM at a point in time; later changes go into a delta file'],['Live migration','Moves a running VM to another host without noticeable interruption'],['HA restart','Automatically restarts the VMs of a failed host on the remaining cluster nodes']],
     e:'Live migration requires a running source host and is used for planned maintenance. When a host fails, HA takes over: the VMs are restarted, causing a short interruption.',
     n:'Live migration and HA are often equated. But after a host failure there is no running memory left that could be migrated – the VMs are restarted.'}},
{id:'speicher-18', a:'speicher', t:'sc', c:0,
 de:{s:'Vor einem Update wurde für den Mailserver (VM) ein Snapshot erstellt, der seit drei Wochen nicht gelöscht wurde. Die Delta-Datei ist auf 400 GB angewachsen, der Datastore ist zu 94 % belegt, und die VM reagiert zunehmend langsam.',
     q:'Wie gehen Sie fachlich richtig vor?',
     o:['Freien Platz auf dem Datastore prüfen und den Snapshot im Snapshot-Manager des Hypervisors löschen, sodass die Änderungen in die Basisdisk konsolidiert werden – möglichst außerhalb der Hauptlastzeit','Die Delta-Datei im Datastore-Browser löschen, weil sie nur die Differenz enthält und die Basisdisk vollständig ist','Zum Snapshot zurückkehren (Revert), damit die Delta-Datei verworfen wird und wieder Platz frei ist','Einen weiteren Snapshot erstellen, damit die große Delta-Datei eingefroren wird und keine neuen Daten mehr aufnimmt'],
     e:'Beim Löschen eines Snapshots führt der Hypervisor die Delta-Datei mit der Basisdisk zusammen (Konsolidierung); der aktuelle Stand bleibt erhalten. Das erzeugt hohe I/O-Last und kann kurzzeitig zusätzlichen Platz benötigen. Snapshots sollten grundsätzlich nur kurz bestehen.',
     n:'Die Delta-Datei manuell zu löschen wirkt naheliegend, vernichtet aber alle Änderungen der letzten drei Wochen: Der aktuelle Stand steckt gerade in der Delta-Datei, die Basisdisk enthält den alten Zustand.'},
 en:{s:'Before an update, a snapshot was taken of the mail server (VM) and has not been deleted for three weeks. The delta file has grown to 400 GB, the datastore is 94 % full, and the VM is responding increasingly slowly.',
     q:'What is the technically correct procedure?',
     o:['Check the free space on the datastore and delete the snapshot in the hypervisor\'s snapshot manager so that the changes are consolidated into the base disk – ideally outside peak hours','Delete the delta file in the datastore browser, because it only contains the difference and the base disk is complete','Revert to the snapshot so that the delta file is discarded and space is freed','Take another snapshot so that the large delta file is frozen and no longer receives new data'],
     e:'When a snapshot is deleted, the hypervisor merges the delta file into the base disk (consolidation); the current state is preserved. This causes heavy I/O load and may briefly require additional space. Snapshots should only exist for a short time.',
     n:'Deleting the delta file manually seems obvious but destroys all changes of the last three weeks: the current state is in the delta file, while the base disk holds the old state.'}},
{id:'speicher-19', a:'speicher', t:'order',
 de:{s:'Ein Datenbankserver nutzt ein Hardware-RAID 6 aus sieben Platten, eine achte Platte ist als Hot-Spare konfiguriert. Nachts fällt eine Platte aus; am Morgen übernehmen Sie den Vorgang.',
     q:'Bringen Sie die Abläufe in die richtige Reihenfolge.',
     o:['Der Controller erkennt den Plattenfehler, markiert die Platte als ausgefallen und meldet „Degraded“ (z. B. per E-Mail oder SNMP)','Der Controller bindet den Hot-Spare automatisch in den Verbund ein','Rebuild: Die Daten der ausgefallenen Platte werden aus Daten und Parität der übrigen Platten auf den Hot-Spare geschrieben','Nach Abschluss des Rebuilds meldet der Verbund wieder „Optimal“','Die defekte Platte im laufenden Betrieb (Hot-Swap) gegen eine kompatible Platte tauschen','Die neue Platte als Hot-Spare konfigurieren und den Vorfall dokumentieren'],
     e:'Der Hot-Spare verkürzt die Zeit ohne volle Redundanz, weil der Rebuild sofort und ohne Eingreifen startet. Die Ersatzplatte übernimmt danach die Rolle des Hot-Spares.',
     n:'Häufig wird angenommen, zuerst müsse die defekte Platte getauscht werden – genau das erspart der Hot-Spare: Der Rebuild beginnt sofort, auch nachts.'},
 en:{s:'A database server uses a hardware RAID 6 of seven disks, with an eighth disk configured as a hot spare. One disk fails at night; you take over the case in the morning.',
     q:'Put the steps in the correct order.',
     o:['The controller detects the disk error, marks the disk as failed and reports "Degraded" (e.g. by e-mail or SNMP)','The controller automatically adds the hot spare to the array','Rebuild: the data of the failed disk is written to the hot spare from the data and parity of the remaining disks','After the rebuild is complete, the array reports "Optimal" again','Replace the defective disk during operation (hot swap) with a compatible disk','Configure the new disk as a hot spare and document the incident'],
     e:'The hot spare shortens the time without full redundancy because the rebuild starts immediately without intervention. The replacement disk then takes over the role of hot spare.',
     n:'People often assume the defective disk must be replaced first – that is exactly what the hot spare avoids: the rebuild starts immediately, even at night.'}},
{id:'speicher-20', a:'speicher', t:'open',
 de:{s:'Fachgespräch (AP 2): In Ihrem Projekt haben Sie für einen Kunden zwei Virtualisierungshosts mit einem gemeinsamen iSCSI-SAN als Cluster aufgebaut. Der Prüfer fragt: „Was passiert, wenn einer Ihrer Hosts ausfällt – und wo hat Ihre Lösung noch einen Single Point of Failure?“',
     q:'Beantworten Sie die Frage des Prüfers wie im Fachgespräch.',
     m:'• Hostausfall: Die Knoten überwachen sich per Heartbeat; fällt ein Host aus, startet der Cluster (HA) dessen VMs auf dem verbleibenden Host neu – kurze Unterbrechung, keine Live-Migration.\n• Voraussetzung: Beide Hosts sehen dieselben LUNs, und der verbleibende Host hat genug RAM- und CPU-Reserve (N+1-Planung, bei zwei Hosts je höchstens ca. 50 % Last).\n• Ein Quorum bzw. Zeuge (Datei- oder Datenträgerzeuge) verhindert Split-Brain.\n• Geplante Wartung: VMs vorher per Live-Migration verschieben, dann ohne Ausfall patchen.\n• SPOF: das SAN selbst – abgemildert durch zwei Controller, redundante Netzteile, passendes RAID (z. B. RAID 10: geringer Write-Penalty, schneller Rebuild) und zwei getrennte iSCSI-Pfade über zwei Switches mit MPIO.\n• Das Storage-Array als Ganzes bleibt ein Risiko → unabhängiges Backup (3-2-1) bzw. Replikation an einen zweiten Standort.',
     k:['HA-Neustart statt Live-Migration bei Hostausfall','Ressourcenreserve / N+1','Quorum gegen Split-Brain','Redundante SAN-Anbindung (MPIO, zwei Switches)','SAN als SPOF erkannt, Controller-Redundanz','Backup bleibt notwendig']},
 en:{s:'Expert interview (AP 2): In your project you built a cluster of two virtualisation hosts with shared iSCSI SAN storage for a customer. The examiner asks: "What happens if one of your hosts fails – and where does your solution still have a single point of failure?"',
     q:'Answer the examiner\'s question as in the expert interview.',
     m:'• Host failure: the nodes monitor each other via heartbeat; if a host fails, the cluster (HA) restarts its VMs on the remaining host – short interruption, no live migration.\n• Prerequisite: both hosts see the same LUNs, and the remaining host has enough RAM and CPU reserve (N+1 planning, with two hosts at most approx. 50 % load each).\n• A quorum or witness (file share or disk witness) prevents split brain.\n• Planned maintenance: move VMs beforehand via live migration, then patch without downtime.\n• SPOF: the SAN itself – mitigated by two controllers, redundant power supplies, a suitable RAID (e.g. RAID 10: low write penalty, fast rebuild) and two separate iSCSI paths via two switches with MPIO.\n• The storage array as a whole remains a risk → independent backup (3-2-1) or replication to a second site.',
     k:['HA restart instead of live migration on host failure','Resource reserve / N+1','Quorum against split brain','Redundant SAN connection (MPIO, two switches)','SAN identified as SPOF, controller redundancy','Backup still required']}}
);

</script>

<script>
/* ===== BEREICH:sec – IT-Sicherheit (2. Lehrjahr) ===== */
Q.push(
{id:'sec-01', a:'sec', t:'match',
 de:{s:'Im Rahmen einer Schutzbedarfsanalyse ordnen Sie Vorfälle den verletzten Schutzzielen zu.',
     q:'Welches Schutzziel ist jeweils in erster Linie verletzt?',
     p:[['Ein Praktikant kann Gehaltslisten einsehen','Vertraulichkeit'],['Ein Angreifer ändert unbemerkt Kontonummern in Rechnungen','Integrität'],['Der Webshop ist wegen eines DDoS-Angriffs nicht erreichbar','Verfügbarkeit'],['Eine E-Mail gibt sich fälschlich als Nachricht der Geschäftsführung aus','Authentizität']],
     e:'Vertraulichkeit schützt vor unbefugtem Lesen, Integrität vor unbemerkter Veränderung, Verfügbarkeit sichert die Nutzbarkeit, Authentizität die Echtheit von Absender und Daten.',
     n:'Die gefälschte Chef-Mail wird oft der Integrität zugeordnet – verändert wird aber nichts, es wird eine falsche Herkunft vorgetäuscht.'},
 en:{s:'As part of a protection needs analysis you map incidents to the violated security goals.',
     q:'Which security goal is primarily violated in each case?',
     p:[['An intern can view salary lists','Confidentiality'],['An attacker silently changes account numbers in invoices','Integrity'],['The web shop is unreachable due to a DDoS attack','Availability'],['An e-mail falsely claims to come from the managing director','Authenticity']],
     e:'Confidentiality protects against unauthorised reading, integrity against unnoticed modification, availability ensures usability, authenticity the genuineness of sender and data.',
     n:'The fake CEO e-mail is often mapped to integrity – but nothing is altered; a false origin is faked.'}},
{id:'sec-02', a:'sec', t:'order',
 de:{s:'Montagmorgen: Auf mehreren Clients erscheint eine Lösegeldforderung, Dateien auf dem Fileserver haben die Endung „.locked“.',
     q:'Bringen Sie die Reaktion in eine sinnvolle Reihenfolge.',
     o:['Betroffene Systeme vom Netz trennen, aber nicht ausschalten','IT-Sicherheitsverantwortliche bzw. Notfallteam alarmieren','Ausmaß ermitteln und Spuren (Logs, Speicherabbilder) sichern','Systeme neu aufsetzen und Daten aus einem sauberen Backup wiederherstellen','Ursache analysieren, Lücke schließen und Lessons Learned dokumentieren'],
     e:'Isolieren stoppt die Ausbreitung, eingeschaltete Systeme behalten Spuren im Arbeitsspeicher. Wiederhergestellt wird erst, wenn Ausmaß und Einfallstor bekannt sind. Parallel sind Meldepflichten (z. B. 72 h DSGVO) zu prüfen.',
     n:'Sofort aus dem Backup wiederherzustellen wirkt schnell, doch ohne Analyse ist der Angreifer oft noch im Netz und verschlüsselt erneut.'},
 en:{s:'Monday morning: several clients show a ransom demand, files on the file server have the extension ".locked".',
     q:'Put the response in a sensible order.',
     o:['Disconnect affected systems from the network but do not switch them off','Alert the IT security officer or incident response team','Determine the scope and secure evidence (logs, memory images)','Rebuild systems and restore data from a clean backup','Analyse the root cause, close the gap and document lessons learned'],
     e:'Isolation stops the spread; running systems keep traces in memory. Restoration only happens once scope and entry point are known. In parallel, reporting obligations (e.g. 72 h GDPR) must be checked.',
     n:'Restoring from backup immediately seems fast, but without analysis the attacker is often still in the network and encrypts again.'}},
{id:'sec-03', a:'sec', t:'sc', c:0,
 de:{s:'Ein Unternehmen möchte seinen Webserver aus dem Internet erreichbar machen, ohne das interne Netz zu gefährden.',
     q:'Wo platzieren Sie den Webserver?',
     o:['In einer DMZ zwischen äußerer und innerer Firewall bzw. an einem eigenen Firewall-Interface','Im internen LAN mit einer Portweiterleitung für 443/TCP','Im WLAN-Gastnetz','Direkt am Internetanschluss ohne Firewall, damit er schnell ist'],
     e:'In der DMZ sind öffentlich erreichbare Dienste vom LAN getrennt. Wird der Webserver kompromittiert, blockiert die innere Firewall den Weg ins interne Netz.',
     n:'Die Portweiterleitung ins LAN funktioniert technisch, doch ein gehackter Webserver stünde dann mitten im internen Netz.'},
 en:{s:'A company wants to make its web server reachable from the internet without endangering the internal network.',
     q:'Where do you place the web server?',
     o:['In a DMZ between outer and inner firewall or on a dedicated firewall interface','In the internal LAN with a port forward for 443/TCP','In the guest Wi-Fi network','Directly on the internet connection without a firewall, so that it is fast'],
     e:'In the DMZ publicly reachable services are separated from the LAN. If the web server is compromised, the inner firewall blocks the way into the internal network.',
     n:'Port forwarding into the LAN works technically, but a hacked web server would then sit in the middle of the internal network.'}},
{id:'sec-04', a:'sec', t:'sc', c:0,
 de:{s:'Ein Mitarbeiter soll einem Kunden einen vertraulichen Vertrag per E-Mail senden. Ein gemeinsamer geheimer Schlüssel wurde vorher nicht vereinbart.',
     q:'Wie wird die Nachricht korrekt verschlüsselt?',
     o:['Mit dem öffentlichen Schlüssel des Empfängers (z. B. S/MIME oder OpenPGP)','Mit dem eigenen privaten Schlüssel des Absenders','Symmetrisch mit AES, das Passwort steht in derselben E-Mail','Durch Bilden eines SHA-256-Hashwerts'],
     e:'Was mit dem öffentlichen Schlüssel des Empfängers verschlüsselt wurde, kann nur dessen privater Schlüssel entschlüsseln. So entfällt der vorherige Schlüsselaustausch.',
     n:'Mit dem eigenen privaten Schlüssel wird signiert, nicht verschlüsselt – jeder mit dem öffentlichen Schlüssel des Absenders könnte die Nachricht lesen.'},
 en:{s:'An employee is to send a confidential contract to a customer by e-mail. No shared secret key was agreed beforehand.',
     q:'How is the message encrypted correctly?',
     o:['With the recipient\'s public key (e.g. S/MIME or OpenPGP)','With the sender\'s own private key','Symmetrically with AES, the password is in the same e-mail','By calculating a SHA-256 hash'],
     e:'What is encrypted with the recipient\'s public key can only be decrypted with their private key. No prior key exchange is needed.',
     n:'The own private key is used for signing, not encryption – anyone with the sender\'s public key could read the message.'}},
{id:'sec-05', a:'sec', t:'mc', c:[0,1,2],
 de:{s:'Sie überarbeiten das Backup-Konzept einer Arztpraxis nach der 3-2-1-Regel.',
     q:'Welche Aussagen beschreiben die Regel richtig? (Mehrere Antworten)',
     o:['Es gibt mindestens drei Kopien der Daten','Die Kopien liegen auf mindestens zwei unterschiedlichen Medientypen','Mindestens eine Kopie wird außer Haus bzw. offline aufbewahrt','Es werden drei Backups pro Tag erstellt','Zwei Administratoren prüfen jedes Backup'],
     e:'Drei Kopien (Original plus zwei Backups), zwei Medientypen, eine Kopie außer Haus – so übersteht man Hardwaredefekt, Brand und Ransomware. Heute oft ergänzt: eine Kopie unveränderlich (immutable).',
     n:'„Drei Backups pro Tag“ beschreibt die Häufigkeit, nicht die Anzahl unabhängiger Kopien – darum geht es bei der Regel nicht.'},
 en:{s:'You revise the backup concept of a medical practice according to the 3-2-1 rule.',
     q:'Which statements describe the rule correctly? (Multiple answers)',
     o:['There are at least three copies of the data','The copies are on at least two different media types','At least one copy is kept off-site or offline','Three backups are created per day','Two administrators check every backup'],
     e:'Three copies (original plus two backups), two media types, one copy off-site – survives hardware failure, fire and ransomware. Today often extended: one copy immutable.',
     n:'"Three backups per day" describes frequency, not the number of independent copies – that is not what the rule is about.'}}
);

/* ===== BEREICH:ds – Datenschutz (2. Lehrjahr) ===== */
Q.push(
{id:'ds-01', a:'ds', t:'mc', c:[0,1,2],
 de:{s:'Die Marketingabteilung möchte zu jedem Webshop-Kunden künftig Geburtsdatum, Familienstand und Einkommen erfassen – „man weiß ja nie, wofür man es braucht“.',
     q:'Gegen welche Grundsätze nach Art. 5 DSGVO verstößt das Vorhaben? (Mehrere Antworten)',
     o:['Zweckbindung','Datenminimierung','Speicherbegrenzung','Vorratsdatenspeicherung','Gewinnmaximierung'],
     e:'Daten dürfen nur für festgelegte Zwecke erhoben werden (Zweckbindung), nur so viele wie nötig (Datenminimierung) und nur so lange wie nötig (Speicherbegrenzung).',
     n:'„Vorratsdatenspeicherung“ klingt nach einem DSGVO-Begriff, ist aber kein Grundsatz – sie ist genau das, was die Grundsätze verhindern sollen.'},
 en:{s:'The marketing department wants to record date of birth, marital status and income for every web shop customer – "you never know what it might be good for".',
     q:'Which principles of Art. 5 GDPR does the plan violate? (Multiple answers)',
     o:['Purpose limitation','Data minimisation','Storage limitation','Data retention','Profit maximisation'],
     e:'Data may only be collected for specified purposes (purpose limitation), only as much as necessary (minimisation) and only as long as necessary (storage limitation).',
     n:'"Data retention" sounds like a GDPR term but is not a principle – it is exactly what the principles are meant to prevent.'}},
{id:'ds-02', a:'ds', t:'sc', c:0,
 de:{s:'Einem Außendienstmitarbeiter wird im Zug ein unverschlüsseltes Notebook mit Namen, Adressen und Bankverbindungen von 800 Kunden gestohlen.',
     q:'Was gilt für die Meldung an die Datenschutz-Aufsichtsbehörde?',
     o:['Unverzüglich, möglichst binnen 72 Stunden nach Bekanntwerden (Art. 33 DSGVO)','Innerhalb von 14 Tagen nach Abschluss der internen Prüfung','Nur, wenn der Täter die Daten nachweislich missbraucht','Keine Meldung nötig, es handelt sich um einen Diebstahl, nicht um einen Hackerangriff'],
     e:'Eine Datenpanne mit Risiko für die Betroffenen ist binnen 72 Stunden zu melden. Weil unverschlüsselte Bankdaten betroffen sind, müssen wegen des hohen Risikos zusätzlich die Kunden benachrichtigt werden (Art. 34).',
     n:'Viele denken, nur Hackerangriffe seien meldepflichtig – maßgeblich ist aber jede Verletzung des Schutzes personenbezogener Daten, auch Verlust oder Diebstahl.'},
 en:{s:'An unencrypted notebook containing names, addresses and bank details of 800 customers is stolen from a field sales employee on a train.',
     q:'What applies to notifying the data protection supervisory authority?',
     o:['Without undue delay, where feasible within 72 hours of becoming aware (Art. 33 GDPR)','Within 14 days after the internal review is completed','Only if the thief demonstrably misuses the data','No notification needed – it was a theft, not a hacker attack'],
     e:'A data breach posing a risk to data subjects must be reported within 72 hours. As unencrypted bank details are involved, the high risk also requires informing the customers (Art. 34).',
     n:'Many think only hacker attacks are reportable – but any breach of personal data security counts, including loss or theft.'}},
{id:'ds-03', a:'ds', t:'match',
 de:{s:'Beim Kundenservice gehen verschiedene Anfragen zu personenbezogenen Daten ein.',
     q:'Ordnen Sie jeder Anfrage das Betroffenenrecht zu.',
     p:[['„Welche Daten haben Sie über mich gespeichert?“','Auskunft (Art. 15)'],['„Meine Adresse ist falsch hinterlegt.“','Berichtigung (Art. 16)'],['„Löschen Sie mein Kundenkonto vollständig.“','Löschung (Art. 17)'],['„Geben Sie mir meine Daten in einem gängigen Format für einen anderen Anbieter.“','Datenübertragbarkeit (Art. 20)'],['„Ich möchte keine Werbung mehr per Post.“','Widerspruch (Art. 21)']],
     e:'Anfragen müssen grundsätzlich innerhalb eines Monats beantwortet werden. Vor einer Auskunft ist die Identität des Anfragenden zu prüfen.',
     n:'Der Werbewiderspruch wird oft als Löschung behandelt – der Kunde will aber nur eine bestimmte Verarbeitung stoppen, sein Konto soll bestehen bleiben.'},
 en:{s:'Customer service receives various requests concerning personal data.',
     q:'Match each request to the data subject right.',
     p:[['"What data have you stored about me?"','Access (Art. 15)'],['"My address is recorded incorrectly."','Rectification (Art. 16)'],['"Delete my customer account completely."','Erasure (Art. 17)'],['"Give me my data in a common format for another provider."','Data portability (Art. 20)'],['"I no longer want advertising by post."','Objection (Art. 21)']],
     e:'Requests generally have to be answered within one month. Before providing access, the requester\'s identity must be verified.',
     n:'The objection to advertising is often handled as erasure – but the customer only wants to stop one specific processing, the account should remain.'}},
{id:'ds-04', a:'ds', t:'sc', c:0,
 de:{s:'Ihr Betrieb lässt die nächtlichen Backups der Personaldatenbank künftig bei einem externen Rechenzentrumsbetreiber speichern.',
     q:'Welche vertragliche Grundlage ist zwingend erforderlich?',
     o:['Ein Vertrag zur Auftragsverarbeitung (AVV) nach Art. 28 DSGVO','Eine einfache Geheimhaltungsvereinbarung (NDA)','Die schriftliche Einwilligung jedes Mitarbeiters','Keine, weil der Dienstleister die Daten nur speichert'],
     e:'Der Dienstleister verarbeitet personenbezogene Daten weisungsgebunden im Auftrag. Der AVV regelt u. a. Weisungsrecht, technisch-organisatorische Maßnahmen, Unterauftragnehmer und Löschung.',
     n:'Ein NDA regelt nur die Vertraulichkeit, nicht die Pflichten nach Art. 28 – etwa Weisungsbindung, Kontrollrechte und TOM.'},
 en:{s:'In future your company will store the nightly backups of the HR database with an external data centre operator.',
     q:'Which contractual basis is mandatory?',
     o:['A data processing agreement (DPA) under Art. 28 GDPR','A simple non-disclosure agreement (NDA)','Written consent of every employee','None, because the provider only stores the data'],
     e:'The provider processes personal data on your behalf and under your instructions. The DPA covers instructions, technical and organisational measures, sub-processors and deletion.',
     n:'An NDA only covers confidentiality, not the Art. 28 duties – such as instructions, audit rights and TOMs.'}},
{id:'ds-05', a:'ds', t:'open',
 de:{s:'Im Serverraum eines Pflegedienstes stehen Server mit Patienten- und Personaldaten.',
     q:'Nennen Sie vier technisch-organisatorische Maßnahmen (TOM, Art. 32 DSGVO) für diesen Serverraum und ordnen Sie jede einem Schutzziel zu.',
     m:'Beispiele:\n• Zutrittskontrolle mit Chipkarte und Protokollierung → Vertraulichkeit\n• Festplattenverschlüsselung der Server → Vertraulichkeit\n• USV und Klimatisierung → Verfügbarkeit\n• Regelmäßige, getestete Backups außer Haus → Verfügbarkeit\n• Protokollierung von Änderungen, Prüfsummen → Integrität\n• Rollen- und Berechtigungskonzept, Vier-Augen-Prinzip → Vertraulichkeit/Integrität',
     k:['Mindestens vier sinnvolle Maßnahmen','Technische UND organisatorische Maßnahme dabei','Korrekte Zuordnung zu Schutzzielen','Bezug zum Serverraum']},
 en:{s:'The server room of a home care service houses servers with patient and HR data.',
     q:'Name four technical and organisational measures (TOMs, Art. 32 GDPR) for this server room and assign each to a security goal.',
     m:'Examples:\n• Access control with smart card and logging → confidentiality\n• Disk encryption on the servers → confidentiality\n• UPS and air conditioning → availability\n• Regular, tested off-site backups → availability\n• Change logging, checksums → integrity\n• Role and permission concept, four-eyes principle → confidentiality/integrity',
     k:['At least four sensible measures','Includes technical AND organisational measures','Correct mapping to security goals','Relevant to the server room']}}
);

/* ===== BEREICH:sql – Skripting & SQL (2. Lehrjahr) ===== */
Q.push(
{id:'sql-01', a:'sql', t:'sc', c:0,
 de:{s:'Die Inventardatenbank enthält die Tabelle geraete(id, typ, standort, kaufdatum). Gesucht sind alle Notebooks am Standort Köln, das neueste zuerst.',
     q:'Welche Abfrage liefert das gewünschte Ergebnis?',
     o:["SELECT * FROM geraete WHERE typ = 'Notebook' AND standort = 'Köln' ORDER BY kaufdatum DESC;","SELECT * FROM geraete WHERE typ = 'Notebook' OR standort = 'Köln' ORDER BY kaufdatum DESC;","SELECT * FROM geraete WHERE typ = 'Notebook' AND standort = 'Köln' ORDER BY kaufdatum ASC;","SELECT * FROM geraete GROUP BY standort HAVING typ = 'Notebook';"],
     e:'Beide Bedingungen müssen gleichzeitig gelten (AND), und DESC sortiert absteigend – das jüngste Kaufdatum steht oben.',
     n:'Mit OR kämen alle Notebooks aller Standorte plus alle Geräte in Köln – deutlich zu viele Datensätze.'},
 en:{s:'The inventory database contains the table geraete(id, typ, standort, kaufdatum) – devices(id, type, location, purchase date). You need all notebooks at the Cologne site (standort = \'Köln\'), newest first.',
     q:'Which query returns the desired result?',
     o:["SELECT * FROM geraete WHERE typ = 'Notebook' AND standort = 'Köln' ORDER BY kaufdatum DESC;","SELECT * FROM geraete WHERE typ = 'Notebook' OR standort = 'Köln' ORDER BY kaufdatum DESC;","SELECT * FROM geraete WHERE typ = 'Notebook' AND standort = 'Köln' ORDER BY kaufdatum ASC;","SELECT * FROM geraete GROUP BY standort HAVING typ = 'Notebook';"],
     e:'Both conditions must hold at the same time (AND), and DESC sorts descending – the most recent purchase date comes first.',
     n:'With OR you would get all notebooks at every site plus every device in Cologne – far too many rows.'}},
{id:'sql-02', a:'sql', t:'sc', c:0,
 de:{s:'Für die Lizenzplanung wird die Anzahl der Geräte je Standort benötigt – aber nur für Standorte mit mehr als 10 Geräten.',
     q:'Welche Abfrage ist korrekt?',
     o:['SELECT standort, COUNT(*) FROM geraete GROUP BY standort HAVING COUNT(*) > 10;','SELECT standort, COUNT(*) FROM geraete WHERE COUNT(*) > 10 GROUP BY standort;','SELECT standort, COUNT(*) FROM geraete GROUP BY COUNT(*) > 10;','SELECT standort FROM geraete HAVING standort > 10;'],
     e:'WHERE filtert einzelne Zeilen vor dem Gruppieren, HAVING filtert die gebildeten Gruppen – Aggregatfunktionen wie COUNT gehören deshalb in HAVING.',
     n:'WHERE COUNT(*) > 10 wirkt logisch, ist aber ein Syntaxfehler: Zum Zeitpunkt von WHERE existieren die Gruppen noch nicht.'},
 en:{s:'For licence planning you need the number of devices per site – but only for sites with more than 10 devices.',
     q:'Which query is correct?',
     o:['SELECT standort, COUNT(*) FROM geraete GROUP BY standort HAVING COUNT(*) > 10;','SELECT standort, COUNT(*) FROM geraete WHERE COUNT(*) > 10 GROUP BY standort;','SELECT standort, COUNT(*) FROM geraete GROUP BY COUNT(*) > 10;','SELECT standort FROM geraete HAVING standort > 10;'],
     e:'WHERE filters single rows before grouping, HAVING filters the groups formed – aggregate functions like COUNT therefore belong in HAVING.',
     n:'WHERE COUNT(*) > 10 seems logical but is a syntax error: the groups do not exist yet when WHERE is evaluated.'}},
{id:'sql-03', a:'sql', gen:'loopSum'},
{id:'sql-04', a:'sql', t:'sc', c:0,
 de:{s:'Der Fileserver läuft voll. Sie möchten per PowerShell alle Dateien unter D:\\Daten finden, die größer als 500 MB sind.',
     q:'Welcher Befehl erfüllt die Aufgabe?',
     o:['Get-ChildItem D:\\Daten -Recurse -File | Where-Object { $_.Length -gt 500MB }','Get-ChildItem D:\\Daten | Where-Object { $_.Length -lt 500MB }','Get-Content D:\\Daten -Recurse | Measure-Object -Sum','Get-ChildItem D:\\Daten -Recurse | Sort-Object Name'],
     e:'-Recurse durchsucht auch Unterordner, Where-Object filtert per Vergleichsoperator -gt (greater than). PowerShell versteht Größenangaben wie 500MB direkt.',
     n:'Ohne -Recurse würden nur Dateien direkt in D:\\Daten geprüft, und -lt bedeutet „kleiner als“.'},
 en:{s:'The file server is running out of space. Using PowerShell, you want to find all files under D:\\Daten larger than 500 MB.',
     q:'Which command does the job?',
     o:['Get-ChildItem D:\\Daten -Recurse -File | Where-Object { $_.Length -gt 500MB }','Get-ChildItem D:\\Daten | Where-Object { $_.Length -lt 500MB }','Get-Content D:\\Daten -Recurse | Measure-Object -Sum','Get-ChildItem D:\\Daten -Recurse | Sort-Object Name'],
     e:'-Recurse also searches subfolders, Where-Object filters using the comparison operator -gt (greater than). PowerShell understands size literals like 500MB directly.',
     n:'Without -Recurse only files directly in D:\\Daten would be checked, and -lt means "less than".'}},
{id:'sql-05', a:'sql', t:'sc', c:0,
 de:{s:'Tabellen: mitarbeiter(id, name, abt_id) und abteilung(id, bezeichnung). Für eine Telefonliste sollen alle Mitarbeiter mit ihrer Abteilung erscheinen – auch neue Mitarbeiter, denen noch keine Abteilung zugeordnet ist.',
     q:'Welche Verknüpfung wählen Sie?',
     o:['SELECT m.name, a.bezeichnung FROM mitarbeiter m LEFT JOIN abteilung a ON m.abt_id = a.id;','SELECT m.name, a.bezeichnung FROM mitarbeiter m INNER JOIN abteilung a ON m.abt_id = a.id;','SELECT m.name, a.bezeichnung FROM mitarbeiter m CROSS JOIN abteilung a;','SELECT m.name, a.bezeichnung FROM mitarbeiter m RIGHT JOIN abteilung a ON m.abt_id = a.id;'],
     e:'Der LEFT JOIN liefert alle Datensätze der linken Tabelle (mitarbeiter); fehlt die Abteilung, steht dort NULL.',
     n:'Der INNER JOIN ist der Standard-Join, liefert aber nur Mitarbeiter mit passender Abteilung – die neuen fehlen in der Liste.'},
 en:{s:'Tables: mitarbeiter(id, name, abt_id) – employees – and abteilung(id, bezeichnung) – departments. A phone list should show all employees with their department – including new employees not yet assigned to one.',
     q:'Which join do you choose?',
     o:['SELECT m.name, a.bezeichnung FROM mitarbeiter m LEFT JOIN abteilung a ON m.abt_id = a.id;','SELECT m.name, a.bezeichnung FROM mitarbeiter m INNER JOIN abteilung a ON m.abt_id = a.id;','SELECT m.name, a.bezeichnung FROM mitarbeiter m CROSS JOIN abteilung a;','SELECT m.name, a.bezeichnung FROM mitarbeiter m RIGHT JOIN abteilung a ON m.abt_id = a.id;'],
     e:'The LEFT JOIN returns all rows of the left table (employees); where the department is missing, NULL appears.',
     n:'INNER JOIN is the default join but only returns employees with a matching department – the new ones are missing.'}}
);
</script>

<script>
/* ===== BEREICH:itsm – IT-Service-Management (3. Lehrjahr) ===== */
Q.push(
{id:'itsm-01', a:'itsm', t:'order',
 de:{s:'Ein Anwender meldet telefonisch, dass er keine E-Mails mehr versenden kann. Sie bearbeiten die Störung nach ITIL-Incident-Management.',
     q:'Bringen Sie die Prozessschritte in die richtige Reihenfolge.',
     o:['Incident erfassen (Ticket anlegen)','Kategorisieren und priorisieren','Erstdiagnose im 1st Level','Bei Bedarf eskalieren (funktional oder hierarchisch)','Lösung umsetzen und Service wiederherstellen','Mit dem Anwender abschließen und dokumentieren'],
     e:'Jeder Incident wird zuerst erfasst, dann nach Auswirkung und Dringlichkeit priorisiert. Nur was der 1st Level nicht lösen kann, wird eskaliert. Der Abschluss erfolgt nach Bestätigung durch den Anwender.',
     n:'Häufig wird vor dem Erfassen schon gelöst – dann fehlen Nachweise für SLA-Messung, Häufungen und das Problem-Management.'},
 en:{s:'A user reports by phone that he can no longer send e-mails. You handle the incident according to ITIL incident management.',
     q:'Put the process steps in the correct order.',
     o:['Log the incident (create a ticket)','Categorise and prioritise','Initial diagnosis at 1st level','Escalate if needed (functional or hierarchical)','Implement the solution and restore the service','Close with the user and document'],
     e:'Every incident is logged first, then prioritised by impact and urgency. Only what 1st level cannot solve is escalated. Closure follows the user\'s confirmation.',
     n:'Often the fix happens before logging – then there is no evidence for SLA measurement, trend detection and problem management.'}},
{id:'itsm-02', a:'itsm', t:'sc', c:0,
 de:{s:'Seit drei Wochen bricht bei mehreren Außendienstlern regelmäßig die VPN-Verbindung ab. Der Support löst jedes Ticket, indem er den VPN-Client neu startet.',
     q:'Welcher ITIL-Prozess sollte jetzt angestoßen werden?',
     o:['Problem Management','Incident Management','Change Enablement','Service Request Management'],
     e:'Wiederkehrende Incidents deuten auf eine gemeinsame Ursache hin. Das Problem Management analysiert die Ursache (Root Cause) und dokumentiert bis zur Lösung einen Known Error mit Workaround.',
     n:'Incident Management läuft ja bereits – es stellt den Service schnell wieder her, sucht aber nicht nach der Ursache.'},
 en:{s:'For three weeks the VPN connection of several field staff has been dropping regularly. Support resolves each ticket by restarting the VPN client.',
     q:'Which ITIL practice should now be triggered?',
     o:['Problem management','Incident management','Change enablement','Service request management'],
     e:'Recurring incidents point to a common cause. Problem management analyses the root cause and records a known error with a workaround until it is fixed.',
     n:'Incident management is already running – it restores service quickly but does not look for the cause.'}},
